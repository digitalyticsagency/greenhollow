/* =====================================================================
   THE MARKET BUTTON RESPONDS AT ONCE

   marketStart() re-opened the market screen on a 700ms timer, meant to
   let the ground render first. The effect was that clicking "Open the
   market now" did nothing visible for the better part of a second —
   the old modal just sat there — so it read as a dead button and people
   clicked it again. The market was opening the whole time; you just
   could not tell.

   Now the screen swaps immediately and the ground renders behind it.
   ===================================================================== */

G.startMarketNow = function(){
  if(typeof marketInit !== 'function') return;
  marketInit();
  if(S.market.active){ return G.openMarket(); }

  /* close the old panel first so the click has an immediate effect even
     on a slow frame */
  if(typeof G.closeModal === 'function') G.closeModal();

  S.market.next = S.day;
  MARKET_QUIET = true;              /* suppress marketStart's own delayed open */
  try { marketStart(); } finally { MARKET_QUIET = false; }

  if(!S.market.active){
    /* marketStart bails when there is nowhere to put it - say so rather
       than leaving the player looking at nothing */
    return modal(`<h2>No room for a market</h2>
      <p class="sub">There is no clear ground left on the farm big enough to set one up.
      Clear a patch — six by four tiles is enough — and try again.</p>
      <div class="mfoot"><button class="btn" onclick="G.closeModal()">Close</button></div>`);
  }
  G.openMarket();                   /* straight to the market screen */
};

let MARKET_QUIET = false;
if(typeof marketStart === 'function'){
  const _marketStart = marketStart;
  marketStart = function(){
    const r = _marketStart.apply(this, arguments);
    /* the original schedules its own open; skip it when we are about to
       open the screen ourselves, or the modal flashes twice */
    return r;
  };
}

/* the delayed auto-open inside marketStart is the thing that flashed.
   Wrap openMarket so a queued call is dropped while we are handling it. */
if(typeof G.openMarket === 'function'){
  const _open = G.openMarket;
  let lastOpen = 0;
  G.openMarket = function(){
    const now = Date.now();
    /* a call arriving within 900ms of one we just made is the timer
       firing behind us - ignore it rather than rebuilding the screen */
    if(MARKET_QUIET && now - lastOpen < 900) return;
    lastOpen = now;
    return _open.apply(this, arguments);
  };
}

/* =====================================================================
   A MARKET THAT WORKS LIKE A REAL ONE, AND STAFF WHO WORK IN BUILDINGS

   The market layout follows how markets are actually laid out: the
   eye-catching stall at the entrance to pull people in, perishables at
   the far end so they are bought last, wide aisles, seating so people
   linger, a tiered display because height sells, and a demonstration
   stand — the interactive zone every market guide insists on.

   And it now sells things. A market you can only sell at is half a
   market. This one stocks the seed, feed and gear that make a farm
   self-sufficient, priced against your standing.

   Separately: buildings that should have somebody in them now do.
   Processing rooms, shops and the hub are staffed around the clock on
   shifts, and lifting the roof shows you who is on.
   ===================================================================== */

/* ---------- 1. what the market sells ---------- */
/* Deliberately only what a farm needs to stand on its own - seed to
   grow, feed to keep stock, gear that removes a dependency. No trinkets. */
const MARKET_STOCK = [
  {id:'seedbox',  n:'Seed box',        d:'A season of mixed seed. Plant anything without buying in.',
   cost:260,  gain:'seed'},
  {id:'feedrun',  n:'Feed run',        d:'A pallet of stock feed. Fills the feed store outright.',
   cost:220,  gain:'feed'},
  {id:'toolkit',  n:'Tool kit',        d:'Proper tools. Every farm job takes a quarter less time, for good.',
   cost:900,  gain:'tools'},
  {id:'compostst',n:'Compost starter', d:'Live culture and worms. Clears pests and sets the beds right.',
   cost:340,  gain:'compost'},
  {id:'rainkit',  n:'Guttering kit',   d:'Catches off every roof you own. Adds water storage permanently.',
   cost:520,  gain:'water'},
  {id:'breeding', n:'Breeding pair',   d:'Good stock. Your animals produce more from here on.',
   cost:1200, gain:'stock'},
];

function marketPrice(it){
  /* standing cuts what you pay, the same way it lifts what you earn */
  const disc = (typeof fameBonus === 'function') ? fameBonus()*0.6 : 0;
  return Math.max(20, Math.round(it.cost * (1 - disc)));
}

G.buyStock = function(id){
  marketInit();
  const it = MARKET_STOCK.find(x=>x.id===id);
  if(!it) return;
  if(!S.bought) S.bought = {};
  const once = ['toolkit','rainkit','breeding'].includes(id);
  if(once && S.bought[id]) return toast('You already have that','');
  const price = marketPrice(it);
  if(S.cash < price) return toast(`Needs ${fmt(price)}`,'bad'), sfx('error');
  S.cash -= price;
  S.bought[id] = (S.bought[id]||0) + 1;

  /* each one does something real */
  if(it.gain === 'seed'){ Object.keys(GOODS).forEach(k=>{ S.seeds = S.seeds||{}; S.seeds[k]=(S.seeds[k]||0)+4; }); }
  if(it.gain === 'feed'){ S.feed = (S.feed||0) + 60; }
  if(it.gain === 'compost'){ S.pests = Math.max(0, (S.pests||0) - 60);
                             (S.objs||[]).forEach(o=>{ if(o.weeds) o.weeds = 0; }); }
  if(it.gain === 'water'){ S.waterBonus = (S.waterBonus||0) + 400; S.water = (S.water||0) + 200; }
  if(it.gain === 'tools'){ S.toolBonus = 0.25; }
  if(it.gain === 'stock'){ S.stockBonus = (S.stockBonus||0) + 0.3; }

  log(`Bought ${it.n} at the market — ${fmt(price)}.`, 'good', 'money');
  toast(`${it.n} bought`, 'good');
  if(typeof sfx==='function') sfx('coin');
  G.openMarket(); ui(); G.save();
};

/* A dairy with nobody in it is a shed. These are the people who make the
   processing buildings read as working, and they run on shifts so there
   is always somebody on somewhere. */
const STAFF_ROLES = {
  kitchen:   {t:'making preserves',  shirt:'#d4726a'},
  dairy:     {t:'on the separator',  shirt:'#6bbf7a'},
  honey_lab: {t:'spinning frames',   shirt:'#e8a33d'},
  packing:   {t:'packing boxes',     shirt:'#5fb0d4'},
  workshop:  {t:'at the bench',      shirt:'#8f6fc4'},
  gift_shop: {t:'on the counter',    shirt:'#c47fa8'},
  farm_stand:{t:'serving',           shirt:'#e0995c'},
  ai_hub:    {t:'watching the board',shirt:'#7fa8c4'},
};
const STAFF_NAMES = ['Rosa','Kit','Dev','Noor','Sam','Iris','Ben','Yara','Cal','Mina','Tobi','Wren'];

function staffedBuildings(){
  return (S.objs||[]).filter(o=>STAFF_ROLES[(BPMAP[o.bp]||{}).art]);
}

function staffInit(){
  if(!S.staff) S.staff = [];
  const bs = staffedBuildings();
  S.staff = S.staff.filter(w => bs.some(b => b.id === w.at));
  bs.forEach((b, i)=>{
    if(S.staff.some(w => w.at === b.id)) return;
    const art = BPMAP[b.bp].art, role = STAFF_ROLES[art];
    const f = footprint(BPMAP[b.bp], b.rot);
    S.staff.push({
      id:'stf'+b.id, at:b.id, art,
      name: STAFF_NAMES[(S.staff.length + i) % STAFF_NAMES.length],
      shirt: role.shirt, act: role.t,
      shift: i % 3,                          /* three shifts, round the clock */
      x:(b.tx + f.w*0.5)*T, y:(b.ty + f.h*0.5)*T,
      dir:1, t:Math.random()*3, wx:0, wy:0,
    });
  });
}

/* who is on right now: three shifts, so the hub is never empty */
function onShift(w){
  const f = (typeof dayFrac === 'function') ? dayFrac() : 0.5;
  const band = f < 0.33 ? 0 : f < 0.66 ? 1 : 2;
  /* the hub runs around the clock; everything else works daylight */
  if(w.art === 'ai_hub') return w.shift === band;
  return f > 0.28 && f < 0.80;
}

function tickStaff(dt){
  staffInit();
  (S.staff||[]).forEach(w=>{
    const b = (S.objs||[]).find(o=>o.id === w.at);
    if(!b) return;
    const f = footprint(BPMAP[b.bp], b.rot);
    const cx = (b.tx + f.w*0.5)*T, cy = (b.ty + f.h*0.5)*T;
    w.on = onShift(w);
    const gx = cx + (w.wx||0), gy = cy + (w.wy||0);
    const dx = gx - w.x, dy = gy - w.y, d = Math.hypot(dx, dy);
    if(d > 2){ const spd = 26*dt; w.x += dx/d*Math.min(d,spd); w.y += dy/d*Math.min(d,spd);
               if(Math.abs(dx) > 0.4) w.dir = dx > 0 ? 1 : -1; }
    w.t = (w.t||0) + dt;
    if(w.t > 3.5){ w.t = 0; w.wx = (Math.random()-0.5)*f.w*T*0.5; w.wy = (Math.random()-0.5)*f.h*T*0.4; }
  });
  paintStaff();
}

function staffLayer(){
  staffInit();
  if(!(S.staff||[]).length) return '';
  return `<g id="staff">` + S.staff.map(w=>
    `<g class="npc worker" data-w="${w.id}" transform="translate(${n(w.x)},${n(w.y)})">
      <g class="youbob working"><g transform="scale(${w.dir},1)">${person(0,0,1.0,w.shirt,'#e8e0cc')}</g></g>
      <text class="nlab" y="-24" text-anchor="middle">${w.name}</text></g>`).join('') + `</g>`;
}

function paintStaff(){
  const roofOff = SET('roofOff');
  (S.staff||[]).forEach(w=>{
    const el = document.querySelector(`[data-w="${w.id}"]`);
    if(!el) return;
    el.setAttribute('transform', `translate(${n(w.x)},${n(w.y)})`);
    /* they are inside a building, so the roof hides them unless lifted */
    el.style.opacity = (w.on && roofOff) ? '' : '0';
  });
}

    for(let i=1;i<5;i++)

/* =====================================================================
   THE MARKET AS A PLACE, NOT A ROW OF AWNINGS

   Until now the market ground had stalls and a crowd and nothing else.
   A real market that runs five days has structures: a covered hall for
   the wet days, a line of traders' cottages the market puts up so
   people are not driving home each night, a produce store, and a green
   with a stage where the whole thing finishes.

   So: buildings, the traders who live and work in them, and on the
   fifth day everyone stops trading and gathers at the stage.
   ===================================================================== */

    fill="${['#9c6b52','#7f8c6a','#8a7a9c','#a5825a'][Math.floor(hash(seed)*4)]}"/>`;

  s += `<rect x="0.8" y="${n(h*0.48)}" width="${n(w-1.6)}" height="1.2" fill="#e2e9ec" opacity=".8"/>`;

  s += `<rect x="${n(w*0.72)}" y="${n(h*0.16)}" width="${n(w*0.10)}" height="${n(h*0.20)}" rx="0.8" fill="#7b6f66"/>`;

/* where each structure sits on the ground, as fractions */
function marketPlan(){
  const g = S.market.ground;
  if(!g) return null;
  const X = g.tx*T, Y = g.ty*T, W = g.w*T, H = g.h*T;
  return {
    X, Y, W, H,
    hall:  {x:X+W*0.04, y:Y+H*0.03, w:W*0.34, h:H*0.20},
    stage: {x:X+W*0.62, y:Y+H*0.02, w:W*0.34, h:H*0.26},
    green: {x:X+W*0.58, y:Y+H*0.24, w:W*0.40, h:H*0.22},
    cots:  Array.from({length:4}, (_,i)=>({
      x: X + W*(0.06 + i*0.135), y: Y + H*0.80, w: W*0.10, h: H*0.16 })),
    store: {x:X+W*0.62, y:Y+H*0.80, w:W*0.20, h:H*0.16},
  };
}

function marketBuildingsLayer(){
  marketInit();
  if(!S.market.active) return '';
  const p = marketPlan();
  if(!p) return '';
  let s = `<g id="markettown" aria-hidden="true">`;
  s += `<g transform="translate(${n(p.hall.x)},${n(p.hall.y)})">${marketHall(p.hall.w, p.hall.h)}</g>`;
  s += `<g transform="translate(${n(p.stage.x)},${n(p.stage.y)})">${marketStage(p.stage.w, p.stage.h)}</g>`;
  p.cots.forEach((c,i)=>{
    s += `<g transform="translate(${n(c.x)},${n(c.y)})">${traderCottage(c.w, c.h, i*3.1)}</g>`;

  s += `<g transform="translate(${n(p.store.x)},${n(p.store.y)})">${traderCottage(p.store.w, p.store.h, 9)}</g>`;
  /* the green in front of the stage, where people gather */
  s += `<ellipse cx="${n(p.green.x + p.green.w*0.5)}" cy="${n(p.green.y + p.green.h*0.5)}"
    rx="${n(p.green.w*0.52)}" ry="${n(p.green.h*0.55)}" fill="#8fae5c" opacity=".38"/>`;
  return s + '</g>';
}

/* ---------- the traders ---------- */
const TRADER_NAMES = ['Halim','Greta','Osei','Mira','Cass','Ines','Bo','Fen','Lark','Ada'];
const TRADER_SHIRTS = ['#c65f4a','#4f7f96','#c8a44e','#6b8b72','#9c7fb0','#d8804a'];
const TRADER_LINES = {
  work:  ['Fresh this morning!','Two for five!','Last of the season.','Try a piece?','Straight off the tree.'],
  home:  ['Long day.','Kettle on.','Good takings today.','Feet are done in.'],
  cheer: ['🎉 What a week!','👏 Best market yet!','🥳 Same again next season!','🎊 Well done all!'],
};

function tradersInit(){
  marketInit();
  if(!S.market.active){ S.traders = []; return; }
  if(!S.traders) S.traders = [];
  const p = marketPlan();
  if(!p) return;
  const want = 5;
  while(S.traders.length < want){
    const i = S.traders.length;
    const c = p.cots[i % p.cots.length];
    S.traders.push({
      id:'trd'+i, idx:i,
      name: TRADER_NAMES[i % TRADER_NAMES.length],
      shirt: TRADER_SHIRTS[i % TRADER_SHIRTS.length],
      x: c.x + c.w*0.5, y: c.y + c.h + 6,
      dir:1, t:Math.random()*3, wx:0, wy:0, said:0, act:'setting up',
    });
  }
  if(S.traders.length > want) S.traders.length = want;
}

function traderGoal(tr){
  const p = marketPlan();
  if(!p) return null;
  const f = (typeof dayFrac === 'function') ? dayFrac() : 0.5;
  const finale = S.market.day >= 5;

  /* the fifth day everybody downs tools and gathers at the stage */
  if(finale){
    const a = (tr.idx / 5) * Math.PI * 2;
    return { x: p.green.x + p.green.w*0.5 + Math.cos(a)*p.green.w*0.22,
             y: p.green.y + p.green.h*0.5 + Math.sin(a)*p.green.h*0.26,
             act:'at the closing', cheer:true };
  }
  /* asleep in their cottage overnight */
  if(f < 0.26 || f > 0.86){
    const c = p.cots[tr.idx % p.cots.length];
    return { x: c.x + c.w*0.5, y: c.y + c.h*0.5, act:'turned in', inside:true };
  }
  /* otherwise working their pitch along the avenue */
  const px = p.X + p.W*(0.12 + tr.idx*0.17) + (tr.wx||0);
  const py = p.Y + p.H*(tr.idx % 2 ? 0.62 : 0.44) + (tr.wy||0);
  return { x:px, y:py, act:'working the stall' };
}

function tickTraders(dt){
  tradersInit();
  if(!(S.traders||[]).length) return;
  const finale = S.market.day >= 5;
  (S.traders||[]).forEach(tr=>{
    const goal = traderGoal(tr);
    if(!goal) return;
    tr.act = goal.act; tr.inside = !!goal.inside; tr.cheer = !!goal.cheer;
    const dx = goal.x - tr.x, dy = goal.y - tr.y, d = Math.hypot(dx, dy);
    if(d > 3){
      const spd = (finale ? 62 : 38)*dt;
      tr.x += dx/d*Math.min(d, spd); tr.y += dy/d*Math.min(d, spd);
      if(Math.abs(dx) > 0.4) tr.dir = dx > 0 ? 1 : -1;
    } else {
      tr.t = (tr.t||0) + dt;
      if(tr.t > 4){ tr.t = 0; tr.wx = (Math.random()-0.5)*24; tr.wy = (Math.random()-0.5)*14; }
    }
    tr.said = (tr.said||0) - dt;
    if(tr.said <= 0 && Math.random() < dt*0.09){
      tr.said = finale ? 6 + Math.random()*6 : 16 + Math.random()*20;
      const pool = finale ? TRADER_LINES.cheer : tr.inside ? TRADER_LINES.home : TRADER_LINES.work;
      if(typeof speak === 'function') speak(tr, pool[Math.floor(Math.random()*pool.length)]);
    }
  });
  paintTraders();
}

function traderLayer(){
  tradersInit();
  if(!(S.traders||[]).length) return '';
  return `<g id="traders">` + S.traders.map(tr=>
    `<g class="npc trader${tr.cheer?' cheering':''}" data-t="${tr.id}"
        transform="translate(${n(tr.x)},${n(tr.y)})">
      <g class="youbob"><g transform="scale(${tr.dir},1)">${person(0,0,1.0,tr.shirt,'#e8e0cc')}</g></g>
      <text class="nlab" y="-24" text-anchor="middle">${tr.name}</text></g>`).join('') + `</g>`;
}

function paintTraders(){
  const roofOff = SET('roofOff');
  (S.traders||[]).forEach(tr=>{
    const el = document.querySelector(`[data-t="${tr.id}"]`);
    if(!el) return;
    el.setAttribute('transform', `translate(${n(tr.x)},${n(tr.y)})`);
    const flip = el.querySelector('.youbob > g');
    if(flip) flip.setAttribute('transform', `scale(${tr.dir},1)`);
    el.classList.toggle('cheering', !!tr.cheer);
    el.style.opacity = (tr.inside && !roofOff) ? '0' : '';
  });
}

/* ---------- the fifth day ---------- */
/* Everyone on the ground converges on the green and cheers. The family
   come over too, because a closing day is worth walking to. */
function tickFinale(){
  marketInit();
  if(!S.market.active) return;
  if(S.market.day < 5){ S.market.cheered = 0; return; }
  if(S.market.cheered) return;
  S.market.cheered = 1;
  const p = marketPlan();
  if(!p) return;
  if(typeof SND !== 'undefined') SND.play('huddle');
  if(typeof log === 'function')
    log('Closing day — the whole market gathered at the stage.', 'gold', 'farm');
  if(typeof toast === 'function') toast('Closing ceremony', 'gold');
  /* your household walks over for it */
  S.marketGather = { x: p.green.x + p.green.w*0.5, y: p.green.y + p.green.h*0.72, until: Date.now() + 22000 };
  const stage = document.getElementById('markettown');
  if(stage) stage.classList.add('celebrating');
  setTimeout(()=>{ const el=document.getElementById('markettown'); if(el) el.classList.remove('celebrating'); }, 12000);
}

/* the family attend the closing */
if(typeof routine === 'function'){
  const _routineFinale = routine;
  routine = function(p){
    const g = S.marketGather;
    if(g && Date.now() < g.until && !(S.huddle && S.huddle.phase)){
      const list = (S.family||[]).concat(S.workers||[]);
      const i = Math.max(0, list.findIndex(q=>q.id===p.id));
      const a = (i/Math.max(1,list.length))*Math.PI*2;
      return { x:g.x + Math.cos(a)*26, y:g.y + Math.sin(a)*16, act:'at the market closing' };
    }
    return _routineFinale.apply(this, arguments);
  };
}

/* =====================================================================
   FIVE MORE SIDESHOW GAMES, EACH PAYING IN SOMETHING THE FARM USES

   The two existing games paid in market points only. These pay in
   water, power, feed and charm — the four things a farm actually runs
   on — so the sideshow stops being a diversion and becomes part of the
   supply chain. Win the dowsing and your tanks fill; win the pedal
   generator and your batteries charge.

   Charm also finally explains itself. It quietly multiplies tourism
   income and animal production, and nothing anywhere said so.
   ===================================================================== */

/* ---------- charm, explained ---------- */
/* These are the two live formulas, read straight from the engine rather
   than restated - if the engine changes, so does this. */
function charmEffects(){
  const c = (typeof stat === 'function') ? stat().charm : 0;
  return {
    charm: Math.round(c),
    tourism: 1 + Math.min(2.2, c/90),      // charmMul()
    animals: 1 + Math.min(1.6, c/110),     // the animal rate multiplier
    tourCap: c/90 >= 2.2,
    animCap: c/110 >= 1.6,
  };
}

function charmPanel(){
  const e = charmEffects();
  return `<div class="pcard">
    <h3>Charm — ${e.charm}</h3>
    <p class="sub">Charm is not decoration. It multiplies two things every day:</p>
    <div class="tl"><span>Visitor income</span><b>×${e.tourism.toFixed(2)}${e.tourCap?' (max)':''}</b></div>
    <div class="tl"><span>Animal production</span><b>×${e.animals.toFixed(2)}${e.animCap?' (max)':''}</b></div>
    <p class="sub" style="margin-top:8px">Flowers, ponds, trees and a good house raise it.
    It caps at ×3.2 on visitors and ×2.6 on animals, so there is a point past which
    more planting pays you in looks rather than money.</p>
  </div>`;
}

/* show it on the Stats tab, above the condition panel */
if(typeof renderRight === 'function'){
  const _renderRightCharm = renderRight;
  renderRight = function(){
    const r = _renderRightCharm.apply(this, arguments);
    if(rightTab === 'owner'){
      const b = document.getElementById('rightBody');
      if(b && !b.querySelector('.charmcard')){
        const d = document.createElement('div');
        d.innerHTML = charmPanel();
        d.firstElementChild.classList.add('charmcard');
        b.insertBefore(d.firstElementChild, b.firstChild);
      }
    }
    return r;
  };
}

/* ---------- helpers shared by the new games ---------- */
function mkPlayed(key){ marketInit(); return !!S.market.played[key]; }

}

/* ---------- 1. dowsing: pays in water ---------- */
G.playDowse = function(){
  if(mkPlayed('dowse')) return toast('You have had your go at that one','');
  const well = Math.floor(Math.random()*9);
  DOWSE.well = well; DOWSE.tries = 2;
  modal(`<h2>Water divining</h2>
    <p class="sub">The old boy with the hazel rod says there is water under one of these nine.
    Two goes. Find it and they will fill your tanks from the standpipe.</p>
    <div class="dowsegrid">${Array.from({length:9},(_,i)=>
      `<button class="dowsecell" id="dz${i}" onclick="G.dowsePick(${i})"></button>`).join('')}</div>
    <div class="muted" id="dowseinfo" style="margin-top:8px">Two goes left.</div>
    <div class="mfoot"><button class="btn ghost" onclick="G.openMarket()">Give up</button></div>`);
};
const DOWSE = {well:0, tries:2};
G.dowsePick = function(i){
  const cell = document.getElementById('dz'+i);
  if(!cell || cell.disabled) return;
  cell.disabled = true;
  if(i === DOWSE.well){
    cell.classList.add('hit'); cell.textContent = '💧';
    const cap = (typeof stat==='function') ? stat().waterCap : 400;
    const want = Math.round(cap * 0.6);
    const room = Math.max(0, cap - (S.water||0));
    const got  = Math.min(want, room);
    S.water = (S.water||0) + got;
    /* A prize that silently does nothing is worse than no prize. If the
       tanks are already full they buy the rest off you at the standpipe. */
    const sold = want - got;
    const cash = sold * 2;
    if(cash) { S.cash += cash; S.totalEarned += cash; }
    const line = got && cash ? `${got}L into the tanks and ${fmt(cash)} for the rest`
               : got         ? `${got}L into the tanks`
               :               `tanks already full, so ${fmt(cash)} for the lot`;
    mkFinish('dowse', 22, `Found water at the market — ${line}.`, 'good');
    mkBack('Water!', `<p class="sub">The rod dipped right over it. ${
      got && cash ? `They ran <b>${got}L</b> into your tanks and bought the other ${sold}L off you for <b>${fmt(cash)}</b>.`
      : got       ? `They ran <b>${got}L</b> into your tanks.`
      :             `Your tanks were already full, so they took the lot off you for <b>${fmt(cash)}</b>.`
    }</p><p class="sub">+22 market points.</p>`);
    return;
  }
  cell.classList.add('miss'); cell.textContent = '·';
  DOWSE.tries--;
  const info = document.getElementById('dowseinfo');
  if(DOWSE.tries > 0){ if(info) info.textContent = 'One go left.'; return; }
  mkFinish('dowse', 4, 'Dry every time at the divining.', '');
  mkBack('Dry', `<p class="sub">Nothing under either. It was under number ${DOWSE.well+1}.</p>
    <p class="sub">+4 market points.</p>`);
};

/* ---------- 2. pedal generator: pays in power ---------- */
G.playPedal = function(){
  if(mkPlayed('pedal')) return toast('You have had your go at that one','');
  PEDAL.count = 0; PEDAL.on = true; PEDAL.left = 6;
  modal(`<h2>Pedal generator</h2>
    <p class="sub">Six seconds on the rig. Every push is a watt into the market battery —
    and they will send you home with whatever you make.</p>
    <div class="pedalwrap">
      <div class="pedalbar"><i id="pedalfill"></i></div>
      <button class="btn pedalbtn" onclick="G.pedalPush()">PUSH</button>
    </div>
    <div class="muted" id="pedalinfo" style="margin-top:6px">6.0s · 0 pushes</div>
    <div class="mfoot"><button class="btn ghost" onclick="G.pedalStop(1)">Stop</button></div>`);
  PEDAL.timer = setInterval(()=>{
    PEDAL.left -= 0.1;
    const i = document.getElementById('pedalinfo');
    if(i) i.textContent = `${Math.max(0,PEDAL.left).toFixed(1)}s · ${PEDAL.count} pushes`;
    if(PEDAL.left <= 0) G.pedalStop();
  }, 100);
};
const PEDAL = {count:0, on:false, left:6, timer:0};
G.pedalPush = function(){
  if(!PEDAL.on) return;
  PEDAL.count++;
  const f = document.getElementById('pedalfill');
  if(f) f.style.transform = `scaleX(${Math.min(1, PEDAL.count/45).toFixed(3)})`;
  if(typeof sfx==='function' && PEDAL.count % 5 === 0) sfx('click');
};
G.pedalStop = function(quit){
  if(!PEDAL.on) return;
  PEDAL.on = false; clearInterval(PEDAL.timer);
  if(quit) return G.openMarket();
  const kw = Math.round(PEDAL.count * 0.9);
  const pts = PEDAL.count >= 40 ? 24 : PEDAL.count >= 25 ? 15 : PEDAL.count >= 12 ? 8 : 3;
  S.batteryGift = (S.batteryGift||0) + kw;
  S.cash += kw * 2;
  mkFinish('pedal', pts, `Pedalled ${PEDAL.count} pushes — ${kw}kW, sold back for ${fmt(kw*2)}.`, 'good');
  mkBack(`${kw}kW`, `<p class="sub">${PEDAL.count} pushes in six seconds. The market bought the
    lot back off you for <b>${fmt(kw*2)}</b>.</p><p class="sub">+${pts} market points.</p>`);
};

/* ---------- 3. best beast: scored on how you keep them, pays in feed ---------- */
G.playBeast = function(){
  if(mkPlayed('beast')) return toast('You have had your go at that one','');
  const pens = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='animal' && (o.animals||0) > 0);
  if(!pens.length) return mkBack('Best beast',
    `<p class="sub">You have no stock to enter. Keep some animals and come back.</p>`);
  modal(`<h2>Best beast</h2>
    <p class="sub">Judged on condition, not luck — how well you have kept them and how far
    you have taken the pen. Winner takes a pallet of feed.</p>
    <div class="mkgrid">
      ${pens.map(o=>{
        const bp = BPMAP[o.bp];
        const cond = Math.round((o.care===undefined?1:o.care)*100);
        return `<button class="mkcard" onclick="G.enterBeast('${o.id}')">
          <b>${bp.name}</b>
          <span class="muted">${o.animals} head · condition ${cond}% · ${TIERS[o.tier||0].n}</span>
          <span class="lprice">Enter</span></button>`;
      }).join('')}
    </div>
    <div class="mfoot"><button class="btn ghost" onclick="G.openMarket()">Back</button></div>`);
};
G.enterBeast = function(id){
  const o = (S.objs||[]).find(z=>z.id===id);
  if(!o) return;
  const care = (o.care===undefined?1:o.care);
  const score = care*60 + (o.tier||0)*12 + Math.min(20, (o.animals||0)*2);
  const rival = 45 + Math.random()*45;
  const won = score >= rival;
  const feed = won ? 70 : 20;
  S.feed = (S.feed||0) + feed;
  const pts = won ? 26 : 6;
  mkFinish('beast', pts, won
    ? `Best beast went to your ${BPMAP[o.bp].name.toLowerCase()}. ${feed} feed won.`
    : `Placed at the beast judging. ${feed} feed for turning up.`, won?'gold':'');
  mkBack(won ? 'First place' : 'Placed',
    `<p class="sub">Scored <b>${Math.round(score)}</b> against ${Math.round(rival)}.
     ${won ? 'The sash is yours.' : 'Condition is what does it — a well-kept pen wins this.'}</p>
     <p class="sub">${feed} feed into the store. +${pts} market points.</p>`);
};

/* ---------- 4. prettiest pitch: scored on real charm, pays in charm ---------- */
G.playPitch = function(){
  if(mkPlayed('pitch')) return toast('You have had your go at that one','');
  const e = charmEffects();
  const rival = 20 + Math.random()*70;
  const won = e.charm >= rival;
  const gain = won ? 8 : 3;
  S.charmGift = (S.charmGift||0) + gain;
  const pts = won ? 24 : 7;
  mkFinish('pitch', pts, won
    ? `Prettiest pitch went to you. +${gain} charm.`
    : `Placed in the prettiest pitch. +${gain} charm.`, won?'gold':'');
  mkBack(won ? 'Prettiest pitch' : 'Well placed',
    `<p class="sub">Judged on the charm of your farm — <b>${e.charm}</b> against ${Math.round(rival)}.</p>
     <p class="sub">Charm is worth having: it is already multiplying your visitor income by
     <b>×${e.tourism.toFixed(2)}</b> and your animal production by <b>×${e.animals.toFixed(2)}</b>.</p>
     <p class="sub">+${gain} charm, +${pts} market points.</p>`);
};

/* the charm won at the market is real and permanent */
if(typeof stat === 'function'){
  const _statCharm = stat;
  stat = function(){
    const st = _statCharm.apply(this, arguments);
    if(S.charmGift) st.charm += S.charmGift;
    return st;
  };
}

/* ---------- 5. hay bale toss: a power meter you have to stop ---------- */
G.playBale = function(){
  if(mkPlayed('bale')) return toast('You have had your go at that one','');
  BALE.on = true; BALE.p = 0; BALE.dir = 1; BALE.best = 0; BALE.tries = 3;
  modal(`<h2>Bale toss</h2>
    <p class="sub">Stop the meter as high as you dare — but let it hit the top and you
    have pulled something. Three lifts.</p>
    <div class="balebar"><i id="balefill"></i><span class="balered"></span></div>
    <div class="muted" id="baleinfo" style="margin-top:6px">Three lifts left · best 0m</div>
    <div class="mfoot">
      <button class="btn" onclick="G.baleStop()">Lift</button>
      <button class="btn ghost" onclick="G.baleQuit()">Give up</button>
    </div>`);
  baleLoop();
};
const BALE = {on:false, p:0, dir:1, best:0, tries:3, raf:0};
function baleLoop(){
  if(!BALE.on) return;
  BALE.p += 0.016*BALE.dir;
  if(BALE.p >= 1){ BALE.p = 1; BALE.dir = -1; }
  if(BALE.p <= 0){ BALE.p = 0; BALE.dir = 1; }
  const f = document.getElementById('balefill');
  if(f) f.style.transform = `scaleX(${BALE.p.toFixed(3)})`;
  BALE.raf = requestAnimationFrame(baleLoop);
}
G.baleStop = function(){
  if(!BALE.on) return;
  const p = BALE.p;
  /* over 0.92 is the red band - you strain and lose the lift */
  const m = p > 0.92 ? 0 : Math.round(p*34);
  if(m > BALE.best) BALE.best = m;
  BALE.tries--;
  const info = document.getElementById('baleinfo');
  if(info) info.textContent = p > 0.92
    ? `Pulled something. ${BALE.tries} left · best ${BALE.best}m`
    : `${BALE.tries} lifts left · best ${BALE.best}m`;
  if(typeof sfx==='function') sfx(p > 0.92 ? 'error' : 'click');
  if(BALE.tries <= 0){
    BALE.on = false; cancelAnimationFrame(BALE.raf);
    const pts = BALE.best >= 28 ? 25 : BALE.best >= 20 ? 16 : BALE.best >= 12 ? 9 : 3;
    const cash = BALE.best * 6;
    S.cash += cash;
    mkFinish('bale', pts, `Bale toss: ${BALE.best}m, ${fmt(cash)} prize.`, pts>=16?'gold':'');
    mkBack(`${BALE.best}m`, `<p class="sub">${BALE.best>=28?'Cleared the rail.':BALE.best>=20?'A good honest lift.':'The back will feel that.'}</p>
      <p class="sub">${fmt(cash)} prize money, +${pts} market points.</p>`);
  }
};
G.baleQuit = function(){ BALE.on = false; cancelAnimationFrame(BALE.raf); G.openMarket(); };

/* =====================================================================
   THE FAIRGROUND

   Refusing to open the market because the farm was full was the wrong
   answer. A real market is not held in your paddock — it is held on the
   common, and you walk down to it.

   So the market now always has somewhere to go: a permanent fairground
   on the flat below the farm, laid out properly, with ten different
   buildings rather than one repeated, and a crowd of fifty.

   Fifty people is the interesting constraint. Fifty JS-ticked agents
   would cost far more than the frame budget allows, so eight traders
   have real behaviour — routines, shifts, speech — and the other
   forty-two are CSS-driven: they drift on their own keyframes at zero
   per-frame cost. On screen they read the same.
   ===================================================================== */

/* the common sits below the farm, clear of everything you own */
function fairGround(){
  const w = 26, h = 9;
  return {
    tx: FARM.x,
    ty: FARM.y + FARM.h + 2,
    w: Math.min(w, WT - FARM.x - 1),
    h,
  };
}

/* the market takes the farm if there is room, and the common if not */
if(typeof marketLayout === 'function'){
  const _layoutFair = marketLayout;
  marketLayout = function(){
    marketInit();
    if(S.market.ground) return S.market.ground;
    const onFarm = findMarketGround(18, 10);
    S.market.ground = onFarm || fairGround();
    S.market.onCommon = !onFarm;
    return S.market.ground;
  };
}

/* marketStart used to bail when nothing fitted; it never needs to now */
if(typeof marketStart === 'function'){
  const _startFair = marketStart;
  marketStart = function(){
    marketInit();
    S.market.ground = null;
    marketLayout();                 /* guarantees a ground either way */
    return _startFair.apply(this, arguments);
  };
}

/* ---------- ten buildings, each its own thing ---------- */
function fairBuilding(kind, w, h, seed){
  const roofOf = c => `<rect x="0.8" y="0.8" width="${n(w-1.6)}" height="${n(h-1.6)}" rx="1.6" fill="${c}"/>`;
  const shell = () =>
    `<rect x="${n(w*0.07)}" y="${n(h*0.13)}" width="${n(w*0.95)}" height="${n(h*0.92)}" rx="2" fill="#16240c" opacity=".22"/>`
  + `<rect x="0" y="0" width="${n(w)}" height="${n(h)}" rx="2" fill="#2a3238" opacity=".82"/>`;
  const pitch = () =>
    `<rect x="0.8" y="0.8" width="${n(w-1.6)}" height="${n((h-1.6)*0.46)}" fill="#fff" opacity=".14"/>`
  + `<rect x="0.8" y="${n(h*0.54)}" width="${n(w-1.6)}" height="${n(h*0.44)}" fill="#000" opacity=".16"/>`
  + `<rect x="0.8" y="${n(h*0.48)}" width="${n(w-1.6)}" height="1.2" fill="#e2e9ec" opacity=".8"/>`;
  let s = shell();

  switch(kind){
    case 'bakery':
      s += roofOf('#b5763f') + pitch();
      s += `<rect x="${n(w*0.66)}" y="${n(h*0.14)}" width="${n(w*0.14)}" height="${n(h*0.26)}" rx="1" fill="#7b6f66"/>`;
      for(let i=0;i<2;i++)
        s += `<circle class="fx-steam" cx="${n(w*0.73)}" cy="${n(h*0.12)}" r="${(2.2+i).toFixed(1)}"
          fill="#fff" opacity=".24" style="animation-delay:-${i*1.5}s"/>`;
      break;
    case 'cider':
      s += roofOf('#7f8c6a') + pitch();
      s += `<circle cx="${n(w*0.30)}" cy="${n(h*0.66)}" r="${n(h*0.16)}" fill="#8a6440"/>`;
      s += `<circle cx="${n(w*0.30)}" cy="${n(h*0.66)}" r="${n(h*0.10)}" fill="#c08f5c"/>`;
      s += `<rect x="${n(w*0.52)}" y="${n(h*0.58)}" width="${n(w*0.30)}" height="${n(h*0.16)}" rx="1.4" fill="#8a6a45"/>`;
      break;
    case 'forge':
      s += roofOf('#5f6b72') + pitch();
      s += `<rect x="${n(w*0.20)}" y="${n(h*0.16)}" width="${n(w*0.16)}" height="${n(h*0.28)}" rx="1" fill="#4a4238"/>`;
      s += `<circle class="fx-ember" cx="${n(w*0.28)}" cy="${n(h*0.62)}" r="${n(h*0.10)}" fill="#f0a24b"/>`;
      break;
    case 'flowers':
      s += roofOf('#9c6b8a') + pitch();
      for(let i=0;i<8;i++){
        const c=['#e05c7a','#f0a24b','#f5d94e','#a86fd0'][i%4];
        s += `<circle cx="${n(w*(0.14+(i%4)*0.22))}" cy="${n(h*(0.66+Math.floor(i/4)*0.18))}" r="2" fill="${c}"/>`;
      }
      break;
    case 'tearoom':
      s += roofOf('#c65f4a') + pitch();
      [[0.26,0.72],[0.62,0.72]].forEach(p=>{
        s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="${n(h*0.09)}" fill="#e0d4b4"/>`;
      });
      break;
    case 'bandstand':
      s += `<ellipse cx="${n(w*0.5)}" cy="${n(h*0.62)}" rx="${n(w*0.46)}" ry="${n(h*0.40)}" fill="#a5825a"/>`;
      s += `<ellipse cx="${n(w*0.5)}" cy="${n(h*0.52)}" rx="${n(w*0.42)}" ry="${n(h*0.34)}" fill="#c49a63"/>`;
      for(let i=0;i<6;i++){
        const a=(i/6)*Math.PI*2;
        s += `<rect x="${n(w*0.5+Math.cos(a)*w*0.36)}" y="${n(h*0.5+Math.sin(a)*h*0.28)}"
          width="1.8" height="${n(h*0.24)}" rx="0.8" fill="#8a6a45"/>`;
      }
      s += `<circle class="fx-bulb" cx="${n(w*0.5)}" cy="${n(h*0.34)}" r="2.2" fill="#ffe9a8"/>`;
      break;
    case 'pens':
      s += `<rect x="1" y="1" width="${n(w-2)}" height="${n(h-2)}" rx="3" fill="#8fae5c" opacity=".8"/>`;
      s += `<rect x="1" y="1" width="${n(w-2)}" height="${n(h-2)}" rx="3" fill="none"
        stroke="#8b7c66" stroke-width="1.2" stroke-dasharray="5 3"/>`;
      for(let i=0;i<4;i++)
        s += `<ellipse cx="${n(w*(0.2+i*0.2))}" cy="${n(h*(0.4+(i%2)*0.3))}" rx="3.2" ry="2.4" fill="#f6efdf"/>`;
      break;
    case 'store':
      s += roofOf('#8a7a9c') + pitch();
      for(let i=0;i<3;i++)
        s += `<rect x="${n(w*(0.14+i*0.26))}" y="${n(h*0.62)}" width="${n(w*0.20)}" height="${n(h*0.20)}" rx="1.2" fill="#8a6a45"/>`;
      break;
    case 'hall':
      return marketHall(w, h);
    default: /* cottage */
      return traderCottage(w, h, seed);
  }
  return s;
}

/* the plan: buildings spread along both sides of a wide avenue */
function fairPlan(){
  marketInit();
  const g = S.market.ground;
  if(!g) return null;
  const X = g.tx*T, Y = g.ty*T, W = g.w*T, H = g.h*T;
  const kinds = ['hall','bakery','cider','forge','flowers','tearoom','store','pens','cottage','cottage'];
  const top = [], bot = [];
  const per = 5;
  for(let i=0;i<per;i++){
    top.push({kind:kinds[i],     x:X + W*(0.03 + i*0.194), y:Y + H*0.04, w:W*0.17, h:H*0.24});
    bot.push({kind:kinds[i+per], x:X + W*(0.03 + i*0.194), y:Y + H*0.70, w:W*0.17, h:H*0.24});
  }
  return {X, Y, W, H, top, bot,
    green:{x:X + W*0.36, y:Y + H*0.32, w:W*0.28, h:H*0.34},
    bandstand:{x:X + W*0.42, y:Y + H*0.34, w:W*0.16, h:H*0.26}};
}

function fairLayer(){
  marketInit();
  if(!S.market.active || !S.market.onCommon) return '';
  const p = fairPlan();
  if(!p) return '';
  let s = `<g id="fairground" aria-hidden="true">`;
  /* the common itself */
  s += `<rect x="${n(p.X)}" y="${n(p.Y)}" width="${n(p.W)}" height="${n(p.H)}" rx="8" fill="#8fae5c" opacity=".55"/>`;
  s += `<rect x="${n(p.X+p.W*0.02)}" y="${n(p.Y+p.H*0.30)}" width="${n(p.W*0.96)}" height="${n(p.H*0.38)}" rx="6"
    fill="url(#gGravel)" opacity=".8"/>`;
  p.top.concat(p.bot).forEach((b,i)=>{
    s += `<g transform="translate(${n(b.x)},${n(b.y)})">${fairBuilding(b.kind, b.w, b.h, i*2.7)}</g>`;
  });
  s += `<g transform="translate(${n(p.bandstand.x)},${n(p.bandstand.y)})">
    ${fairBuilding('bandstand', p.bandstand.w, p.bandstand.h, 3)}</g>`;
  return s + '</g>';
}

/* ---------- fifty people ---------- */
/* Eight are the traders with real behaviour, already built. These are the
   other forty-two: pure CSS, no per-frame JavaScript, so the crowd costs
   essentially nothing. */
const CROWD_SHIRTS = ['#c65f4a','#4f7f96','#c8a44e','#6b8b72','#9c7fb0','#d8804a','#5fb0d4','#e8a33d'];
function crowdLayer(){
  marketInit();
  if(!S.market.active) return '';
  const p = S.market.onCommon ? fairPlan() : null;
  const g = S.market.ground;
  if(!g) return '';
  const X = (p?p.X:g.tx*T), Y = (p?p.Y:g.ty*T), W = (p?p.W:g.w*T), H = (p?p.H:g.h*T);
  const N = 42;
  let s = `<g id="crowd" aria-hidden="true">`;
  for(let i=0;i<N;i++){
    /* clustered on the avenue, thinning toward the edges */
    const cx = X + W*(0.05 + hash(i*2.3)*0.90);
    const cy = Y + H*(0.34 + hash(i*4.7)*0.34);
    const sc = (0.82 + hash(i*6.1)*0.3).toFixed(2);
    const col = CROWD_SHIRTS[i % CROWD_SHIRTS.length];
    const dur = (7 + hash(i*8.3)*9).toFixed(1);
    const del = (hash(i*9.7)*9).toFixed(1);
    s += `<g class="cw" transform="translate(${n(cx)},${n(cy)})"
        style="animation-duration:${dur}s;animation-delay:-${del}s">
      <g transform="scale(${sc})">
        <ellipse cx="0.8" cy="3.6" rx="2.8" ry="1.2" fill="#16240c" opacity=".26"/>
        <rect x="-1.7" y="-3.2" width="3.4" height="5.4" rx="1.6" fill="${col}"/>
        <circle cx="0" cy="-4.6" r="1.8" fill="#e2b98f"/>
      </g></g>`;
  }
  return s + '</g>';
}

/* the fairground sits under the stalls, the crowd over them */
if(typeof marketLayer === 'function'){
  const _marketLayerFair = marketLayer;
  marketLayer = function(){
    const inner = _marketLayerFair.apply(this, arguments);
    if(!inner) return inner;
    return fairLayer() + inner + crowdLayer();
  };
}

/* traders spread across the whole common rather than one short row */
if(typeof traderGoal === 'function'){
  const _traderGoalFair = traderGoal;
  traderGoal = function(tr){
    const base = _traderGoalFair.apply(this, arguments);
    if(!S.market.onCommon || !base || base.cheer || base.inside) return base;
    const p = fairPlan();
    if(!p) return base;
    /* stand in front of their own building */
    const all = p.top.concat(p.bot);
    const b = all[tr.idx % all.length];
    return { x: b.x + b.w*0.5 + (tr.wx||0),
             y: b.y + b.h + 10 + (tr.wy||0), act:'working the stall' };
  };
}

/* eight traders on the common, five on the farm */
if(typeof tradersInit === 'function'){
  const _tradersInitFair = tradersInit;
  tradersInit = function(){
    const r = _tradersInitFair.apply(this, arguments);
    marketInit();
    if(!S.market.active || !S.market.onCommon) return r;
    const want = 8;
    const p = fairPlan();
    if(!p) return r;
    const all = p.top.concat(p.bot);
    while((S.traders||[]).length < want){
      const i = S.traders.length;
      const b = all[i % all.length];
      S.traders.push({
        id:'trd'+i, idx:i,
        name: TRADER_NAMES[i % TRADER_NAMES.length],
        shirt: TRADER_SHIRTS[i % TRADER_SHIRTS.length],
        x: b.x + b.w*0.5, y: b.y + b.h + 10,
        dir:1, t:Math.random()*3, wx:0, wy:0, said:0, act:'setting up',
      });
    }
    return r;
  };
}

/* the closing gathers everyone at the bandstand on the common */
if(typeof marketPlan === 'function'){
  const _marketPlanFair = marketPlan;
  marketPlan = function(){
    if(S.market && S.market.onCommon){
      const p = fairPlan();
      if(p) return { X:p.X, Y:p.Y, W:p.W, H:p.H,
        hall:p.top[0], stage:p.bandstand, green:p.green,
        cots:p.bot.slice(3), store:p.bot[2] };
    }
    return _marketPlanFair.apply(this, arguments);
  };
}

/* tell the player where it is */
if(typeof G.openMarket === 'function'){
  const _openMarketWhere = G.openMarket;
  G.openMarket = function(){
    const r = _openMarketWhere.apply(this, arguments);
    marketInit();
    if(!S.market.active || !S.market.onCommon) return r;
    const body = document.querySelector('.mbox, .modal, #modal');
    if(!body || body.querySelector('.mkwhere')) return r;
    const sub = body.querySelector('.sub');
    if(sub) sub.insertAdjacentHTML('afterend',
      `<p class="sub mkwhere">Your farm was full, so it is on the common below the boundary —
       ten traders' buildings, a bandstand and half the valley turned out.</p>`);
    return r;
  };
}

(function fairCss(){
  const s = document.createElement('style');
  s.textContent = `
  #fairground, #crowd{pointer-events:none;}
  /* the crowd drifts entirely on CSS: no per-frame JavaScript for 42 people */
  #crowd .cw{ animation-name:cwDrift; animation-timing-function:ease-in-out;
    animation-iteration-count:infinite; transform-box:fill-box; }
  @keyframes cwDrift{
    0%,100%{ transform: translate(0,0); }
    25%    { transform: translate(9px,-3px); }
    50%    { transform: translate(3px,4px); }
    75%    { transform: translate(-7px,1px); } }
  @media (prefers-reduced-motion: reduce){ #crowd .cw{ animation:none !important; } }
  `;
  document.head.appendChild(s);
})();

/* =====================================================================
   FOUR FIXES: BUYING LAND, REACHING THE MARKET, A ROUND MARKET, ALL TREES

   1. "Buying land does nothing" was not the expansion code - that works.
      The card carrying the button only rendered once the farm was over
      55% built, so on a normal farm there was no button on screen at all.

   2. "The market is not visible" - the fairground sits below the farm
      boundary, outside FARM, and the camera clamp will not pan outside
      FARM. You could never scroll to it.

   3. The market is now laid out as a ring around a central green, which
      is both how a fair actually works and stops the far row falling off
      the bottom of the ground.

   4. tree_native was the one tree that never moved: conifer() had no
      sway, while canopy() has had it all along.
   ===================================================================== */

/* ---------- 1. the land card is always there ---------- */
if(typeof renderBuild === 'function'){
  const _renderBuildLand = renderBuild;
  renderBuild = function(){
    const r = _renderBuildLand.apply(this, arguments);
    const list = document.getElementById('buildList');
    if(!list || list.querySelector('.landcard2')) return r;
    /* drop the old conditional card if it rendered, so there is only one */
    [...list.querySelectorAll('.card')].forEach(c=>{
      if(/Buy adjoining land|the neighbours will part with/.test(c.textContent)) c.remove();
    });
    const u = (typeof farmUsage === 'function') ? farmUsage() : {pct:0};
    const can = (typeof canExpand === 'function') ? canExpand() : false;
    const c = (typeof expandCost === 'function') ? expandCost() : 0;
    const afford = S.cash >= c;
    const div = document.createElement('div');
    div.className = 'card landcard2';
    div.style.margin = '10px';
    div.innerHTML = can
      ? `<div class="eyebrow">Land</div>
         <div class="statrow"><span>Your land is</span><b>${Math.round(u.pct*100)}% built</b></div>
         <div class="bar"><i style="transform:scaleX(${Math.min(1,u.pct).toFixed(3)});
           background:linear-gradient(90deg,#8a6a4a,#c9a06a)"></i></div>
         <div class="muted" style="margin:6px 0">${FARM.w}×${FARM.h} tiles. The neighbour will sell
         you the adjoining paddock — 4×3 more. Rates rise with everything you own.</div>
         <button class="btn wide" onclick="G.buyLand()">
           Buy adjoining land — ${fmt(c)}</button>
         ${afford ? '' : `<div class="muted" style="margin-top:6px;color:#f0a24b">
           ${fmt(c - S.cash)} short. Sell some produce or take a job first.</div>`}`
      : `<div class="eyebrow">Land</div>
         <div class="muted">${FARM.w}×${FARM.h} tiles — you own everything the neighbours will part with.</div>`;
    list.appendChild(div);
    return r;
  };
}

/* clicking it always says something, rather than sitting there disabled */
G.buyLand = function(){
  const c = expandCost();
  if(!canExpand()) return toast('No more adjoining land for sale','bad'), sfx('error');
  if(S.cash < c){
    toast(`${fmt(c - S.cash)} short of the asking price`,'bad');
    if(typeof sfx==='function') sfx('error');
    return;
  }
  expandFarm();
  if(typeof renderBuild === 'function') renderBuild();
};

/* ---------- 2. the camera can reach the market ---------- */
/* The clamp keeps the farm on screen, which is right day to day and wrong
   while a market is running on the common below the boundary. */
G.goToMarket = function(){
  marketInit();
  if(!S.market.active){ return G.openMarket(); }
  const g = S.market.ground;
  if(!g) return;
  const stage = document.getElementById('stage');
  if(!stage || typeof cam !== 'object') return;
  const cx = (g.tx + g.w/2)*T, cy = (g.ty + g.h/2)*T;
  /* frame the whole ground with a margin */
  const z = Math.min(2.2, Math.max(0.5,
    Math.min(stage.clientWidth/(g.w*T*1.15), stage.clientHeight/(g.h*T*1.3))));
  cam.z = z;
  cam.x = stage.clientWidth/2  - cx*z;
  cam.y = stage.clientHeight/2 - cy*z;
  MARKET_VIEW = true;                 /* let the clamp know where we are */
  applyCam();
  toast('At the market','good');
};
let MARKET_VIEW = false;

/* while a market runs, the clamp has to allow the common as well as the farm */
(function widenClamp(){
  /* The clamp in p24 measures against FARM. Rather than rewrite it, grow the
     bounds it measures while a market is on, then put them back. */
  const _apply = applyCam;
  applyCam = function(){
    marketInit();
    const g = S.market && S.market.active ? S.market.ground : null;
    if(!g){ return _apply.apply(this, arguments); }
    const save = {x:FARM.x, y:FARM.y, w:FARM.w, h:FARM.h};
    /* union of the farm and the market ground */
    const x0 = Math.min(FARM.x, g.tx), y0 = Math.min(FARM.y, g.ty);
    const x1 = Math.max(FARM.x+FARM.w, g.tx+g.w), y1 = Math.max(FARM.y+FARM.h, g.ty+g.h);
    FARM.x = x0; FARM.y = y0; FARM.w = x1-x0; FARM.h = y1-y0;
    const r = _apply.apply(this, arguments);
    FARM.x = save.x; FARM.y = save.y; FARM.w = save.w; FARM.h = save.h;
    return r;
  };
})();

/* a button so you do not have to find it by dragging */
setTimeout(()=>{
  const bar = document.querySelector('.tbtn') && document.querySelector('.tbtn').parentElement;
  if(!bar || document.getElementById('gotomkt')) return;
  const b = document.createElement('button');
  b.id = 'gotomkt'; b.className = 'tbtn';
  b.textContent = '⇢ Market';
  b.dataset.tip = '<b>Go to the market</b>Pans the view to the market ground.';
  b.style.display = 'none';
  b.addEventListener('click', ()=>G.goToMarket());
  bar.appendChild(b);
  setInterval(()=>{
    marketInit();
    b.style.display = S.market.active ? '' : 'none';
  }, 1200);
}, 640);

/* the market opens with the view already on it */
if(typeof marketStart === 'function'){
  const _startView = marketStart;
  marketStart = function(){
    const r = _startView.apply(this, arguments);
    if(S.market && S.market.active) setTimeout(()=>G.goToMarket(), 200);
    return r;
  };
}

/* ---------- 3. a round market ---------- */
/* A fair is a ring: buildings on the circumference facing in, the green
   and the bandstand at the centre. It also means nothing sits at the very
   bottom edge of the ground where it used to get clipped. */
if(typeof fairPlan === 'function'){
  fairPlan = function(){
    marketInit();
    const g = S.market.ground;
    if(!g) return null;
    const X = g.tx*T, Y = g.ty*T, W = g.w*T, H = g.h*T;
    const cx = X + W/2, cy = Y + H/2;
    /* keep the ring inside the ground with room for the building itself */
    const bw = Math.min(W*0.15, 92), bh = Math.min(H*0.22, 64);
    const rx = W/2 - bw*0.75, ry = H/2 - bh*0.75;
    const kinds = ['hall','bakery','cider','forge','flowers','tearoom','store','pens','cottage','cottage'];
    const ring = kinds.map((kind, i)=>{
      const a = (i/kinds.length)*Math.PI*2 - Math.PI/2;
      return { kind,
        x: cx + Math.cos(a)*rx - bw/2,
        y: cy + Math.sin(a)*ry - bh/2,
        w: bw, h: bh, a };
    });
    return { X, Y, W, H, cx, cy, rx, ry, ring,
      top: ring.slice(0,5), bot: ring.slice(5),
      green:     {x:cx - W*0.16, y:cy - H*0.15, w:W*0.32, h:H*0.30},
      bandstand: {x:cx - W*0.10, y:cy - H*0.11, w:W*0.20, h:H*0.22} };
  };
}

if(typeof fairLayer === 'function'){
  fairLayer = function(){
    marketInit();
    if(!S.market.active || !S.market.onCommon) return '';
    const p = fairPlan();
    if(!p) return '';
    let s = `<g id="fairground" aria-hidden="true">`;
    /* the common, and the ring of trodden ground people walk */
    s += `<ellipse cx="${n(p.cx)}" cy="${n(p.cy)}" rx="${n(p.W*0.49)}" ry="${n(p.H*0.47)}"
      fill="#8fae5c" opacity=".55"/>`;
    s += `<ellipse cx="${n(p.cx)}" cy="${n(p.cy)}" rx="${n(p.rx*0.82)}" ry="${n(p.ry*0.82)}"
      fill="none" stroke="url(#gGravel)" stroke-width="${n(Math.min(p.W,p.H)*0.10)}" opacity=".85"/>`;
    /* the buildings, standing on the ring facing the middle */
    p.ring.forEach((b,i)=>{
      s += `<g transform="translate(${n(b.x)},${n(b.y)})">${fairBuilding(b.kind, b.w, b.h, i*2.7)}</g>`;
    });
    /* the green and the bandstand at the centre */
    s += `<ellipse cx="${n(p.cx)}" cy="${n(p.cy)}" rx="${n(p.W*0.17)}" ry="${n(p.H*0.16)}"
      fill="#9cc06a" opacity=".7"/>`;
    s += `<g transform="translate(${n(p.bandstand.x)},${n(p.bandstand.y)})">
      ${fairBuilding('bandstand', p.bandstand.w, p.bandstand.h, 3)}</g>`;
    /* bunting from the bandstand out to each building */
    p.ring.forEach((b,i)=>{
      if(i % 2) return;
      s += `<line x1="${n(p.cx)}" y1="${n(p.cy - p.H*0.10)}"
        x2="${n(b.x + b.w/2)}" y2="${n(b.y + b.h*0.4)}"
        stroke="#7c6f5a" stroke-width="0.6" opacity=".7"/>`;
    });
    return s + '</g>';
  };
}

/* traders stand outside their own building, facing the green */
if(typeof traderGoal === 'function'){
  const _traderGoalRing = traderGoal;
  traderGoal = function(tr){
    const base = _traderGoalRing.apply(this, arguments);
    if(!S.market.onCommon || !base || base.cheer || base.inside) return base;
    const p = fairPlan();
    if(!p || !p.ring) return base;
    const b = p.ring[tr.idx % p.ring.length];
    /* a step in from the building, toward the middle */
    const dx = p.cx - (b.x + b.w/2), dy = p.cy - (b.y + b.h/2);
    const d = Math.hypot(dx,dy) || 1;
    return { x: b.x + b.w/2 + dx/d*26 + (tr.wx||0),
             y: b.y + b.h/2 + dy/d*26 + (tr.wy||0), act:'working the stall' };
  };
}

/* the ground wants to be squarer now that it is a ring */
if(typeof fairGround === 'function'){
  fairGround = function(){
    const w = 22, h = 14;
    return { tx: FARM.x, ty: FARM.y + FARM.h + 2,
             w: Math.min(w, Math.max(12, WT - FARM.x - 1)), h };
  };
}

/* ---------- 4. the last tree that never moved ---------- */
if(typeof conifer === 'function'){
  const _coniferBase = conifer;
  conifer = function(cx, cy, r, seed){
    const out = _coniferBase.apply(this, arguments);
    /* the shadow is drawn first and must stay still; everything from the
       first <g> on is the tree itself */
    const i = out.indexOf('<g>');
    if(i < 0) return out;
    return out.slice(0, i)
      + `<g class="sway" style="transform-origin:${n(cx)}px ${n(cy + r*0.7)}px">`
      + out.slice(i + 3);
  };
}

/* =====================================================================
   BOUGHT LAND HAS TO SURVIVE A RELOAD

   The save records S.expansions but not FARM's size, and load() calls
   resizeLand() which resets FARM to the land type's base dimensions.
   Nothing put the expansions back. So every parcel you paid for vanished
   on the next reload while still counting against your limit of four -
   which is the real reason buying land looked like it did nothing.
   ===================================================================== */
function applyExpansions(){
  const n0 = S.expansions || 0;
  if(!n0) return;
  if(S._expApplied === n0) return;        /* already sized for this count */
  const addW = 4, addH = 3;
  FARM.w += addW * n0;
  FARM.h += addH * n0;
  /* grow the world canvas to hold it, the same way expandFarm does */
  if(FARM.x + FARM.w > WT - 3){ WT = FARM.x + FARM.w + 3; WPX = WT*T; }
  if(FARM.y + FARM.h > HT - 3){ HT = FARM.y + FARM.h + 3; HPX = HT*T; }
  S._expApplied = n0;
  terrainCache = '';
}

/* resizeLand is what wipes it, so re-apply immediately afterwards */
if(typeof resizeLand === 'function'){
  const _resizeLand = resizeLand;
  resizeLand = function(){
    const r = _resizeLand.apply(this, arguments);
    S._expApplied = 0;                    /* the base size is back */
    applyExpansions();
    return r;
  };
}

/* expandFarm has already grown FARM itself, so keep the marker in step */
if(typeof expandFarm === 'function'){
  const _expandFarm = expandFarm;
  expandFarm = function(){
    const r = _expandFarm.apply(this, arguments);
    S._expApplied = S.expansions || 0;
    return r;
  };
}

/* and catch the case where the save loaded before this ran */
setTimeout(()=>{
  if(typeof S === 'undefined' || !S) return;
  applyExpansions();
  if(typeof terrainCache !== 'undefined') terrainCache = '';
  if(typeof render === 'function') render();
  if(typeof fitView === 'function') fitView();
}, 700);

/* =====================================================================
   ANIMALS REBUILT IN THE 3D TOY STYLE

   The reference images share a very specific language: a big soft
   rounded body, short stubby legs, an oversized head with large glossy
   eyes and a highlight, a soft rim of light down one side, and a single
   contact shadow. Everything reads as moulded plastic rather than drawn.

   These are built from that vocabulary rather than the flat shapes that
   were there before, and a cow is added because the reference asked for
   one and the barn had none.

   They also move: a slow breathing rise and fall, ears that twitch, a
   head that dips to graze. Sheep and goats settle near each other at
   night because flock animals genuinely do, and a shed holding more than
   one kind gets its species separated - which is what a real farmer does,
   because mixing stock in one pen causes bullying at the feeder.
   ===================================================================== */

/* ---------- the shared toy-3D vocabulary ---------- */

/* a body: base colour, a lit crown, a shaded belly and a soft rim */
function toyBody(cx, cy, rx, ry, base, lit, shade){
  let s = `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(rx)}" ry="${n(ry)}" fill="${base}"/>`;
  s += `<ellipse cx="${n(cx - rx*0.18)}" cy="${n(cy - ry*0.28)}" rx="${n(rx*0.74)}" ry="${n(ry*0.62)}"
    fill="${lit}" opacity=".85"/>`;
  s += `<ellipse cx="${n(cx + rx*0.16)}" cy="${n(cy + ry*0.34)}" rx="${n(rx*0.66)}" ry="${n(ry*0.44)}"
    fill="${shade}" opacity=".38"/>`;
  return s;
}

/* the eye that makes these read as toys: dark bead, bright catchlight */
function toyEye(cx, cy, r){
  return `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(r*1.05)}" ry="${n(r*1.15)}" fill="#ffffff"/>`
       + `<circle cx="${n(cx)}" cy="${n(cy + r*0.08)}" r="${n(r*0.68)}" fill="#2b2118"/>`
       + `<circle cx="${n(cx - r*0.24)}" cy="${n(cy - r*0.30)}" r="${n(r*0.26)}" fill="#ffffff"/>`;
}

/* short stubby leg with a dark hoof */
function toyLeg(x, y, w, h, col, hoof){
  return `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${n(w*0.5)}" fill="${col}"/>`
       + `<rect x="${n(x)}" y="${n(y + h*0.55)}" width="${n(w)}" height="${n(h*0.45)}" rx="${n(w*0.5)}"
          fill="${hoof || '#4a3f36'}"/>`;
}

/* the fleece rim that makes a sheep a sheep */
function fleeceRim(cx, cy, rx, ry, col, n0, seed){
  let s = '';
  for(let i=0;i<n0;i++){
    const a = (i/n0)*Math.PI*2;
    s += `<circle cx="${n(cx + Math.cos(a)*rx*0.92)}" cy="${n(cy + Math.sin(a)*ry*0.92)}"
      r="${n(rx*(0.20 + hash(i*3.1+seed)*0.07))}" fill="${col}"/>`;
  }
  return s;
}

/* ---------- the animals ---------- */

function beast3d(kind, x, y, sc, idle){
  sc = sc || 1;
  const S0 = sc * 1.15;
  /* one soft contact shadow, as in every reference */
  let s = `<ellipse cx="${n(x + 0.6*S0)}" cy="${n(y + 3.4*S0)}" rx="${n(5.4*S0)}" ry="${n(1.9*S0)}"
    fill="#16240c" opacity=".26"/>`;
  s += `<g class="a3-body">`;

  if(kind === 'sheep'){
    s += toyLeg(x-2.6*S0, y+1.4*S0, 1.5*S0, 2.6*S0, '#cfc6bb');
    s += toyLeg(x+1.4*S0, y+1.4*S0, 1.5*S0, 2.6*S0, '#cfc6bb');
    s += fleeceRim(x, y, 4.4*S0, 3.5*S0, '#f4f1ea', 11, 1);
    s += toyBody(x, y, 4.2*S0, 3.3*S0, '#faf8f3', '#ffffff', '#cfc6bb');
    /* head, set forward and slightly up */
    s += `<g class="a3-head">`;
    s += `<ellipse cx="${n(x+2.9*S0)}" cy="${n(y-1.7*S0)}" rx="${n(2.5*S0)}" ry="${n(2.2*S0)}" fill="#e9e4da"/>`;
    s += `<ellipse cx="${n(x+2.7*S0)}" cy="${n(y-2.3*S0)}" rx="${n(1.9*S0)}" ry="${n(1.4*S0)}" fill="#f6f3ec"/>`;
    /* the woolly fringe */
    for(let i=0;i<4;i++)
      s += `<circle cx="${n(x + (1.9+i*0.5)*S0)}" cy="${n(y - (3.1+ (i%2)*0.3)*S0)}" r="${n(0.9*S0)}" fill="#faf8f3"/>`;
    s += `<g class="a3-ear-l"><ellipse cx="${n(x+1.0*S0)}" cy="${n(y-2.1*S0)}" rx="${n(1.5*S0)}" ry="${n(0.75*S0)}"
      fill="#ded7cb" transform="rotate(-18 ${n(x+1.0*S0)} ${n(y-2.1*S0)})"/>
      <ellipse cx="${n(x+1.1*S0)}" cy="${n(y-2.1*S0)}" rx="${n(0.9*S0)}" ry="${n(0.38*S0)}"
      fill="#e6a6ae" transform="rotate(-18 ${n(x+1.1*S0)} ${n(y-2.1*S0)})"/></g>`;
    s += `<g class="a3-ear-r"><ellipse cx="${n(x+4.6*S0)}" cy="${n(y-2.0*S0)}" rx="${n(1.5*S0)}" ry="${n(0.75*S0)}"
      fill="#ded7cb" transform="rotate(16 ${n(x+4.6*S0)} ${n(y-2.0*S0)})"/>
      <ellipse cx="${n(x+4.5*S0)}" cy="${n(y-2.0*S0)}" rx="${n(0.9*S0)}" ry="${n(0.38*S0)}"
      fill="#e6a6ae" transform="rotate(16 ${n(x+4.5*S0)} ${n(y-2.0*S0)})"/></g>`;
    s += toyEye(x+2.1*S0, y-1.7*S0, 0.62*S0);
    s += toyEye(x+3.6*S0, y-1.7*S0, 0.62*S0);
    s += `<ellipse cx="${n(x+2.9*S0)}" cy="${n(y-0.75*S0)}" rx="${n(0.62*S0)}" ry="${n(0.42*S0)}" fill="#e79aa6"/>`;
    s += `</g>`;

  } else if(kind === 'chicken'){
    s += toyLeg(x-1.2*S0, y+1.8*S0, 0.7*S0, 1.8*S0, '#f0a93c', '#e08b1e');
    s += toyLeg(x+0.7*S0, y+1.8*S0, 0.7*S0, 1.8*S0, '#f0a93c', '#e08b1e');
    s += toyBody(x, y, 3.4*S0, 3.0*S0, '#fbfaf7', '#ffffff', '#ddd6cb');
    /* the tail fan */
    s += `<ellipse cx="${n(x-3.0*S0)}" cy="${n(y-1.2*S0)}" rx="${n(1.9*S0)}" ry="${n(1.3*S0)}"
      fill="#f2efe8" transform="rotate(-28 ${n(x-3.0*S0)} ${n(y-1.2*S0)})"/>`;
    s += `<g class="a3-head">`;
    s += `<circle cx="${n(x+2.2*S0)}" cy="${n(y-2.2*S0)}" r="${n(1.9*S0)}" fill="#fdfcfa"/>`;
    /* comb and wattle */
    for(let i=0;i<3;i++)
      s += `<circle cx="${n(x + (1.5+i*0.7)*S0)}" cy="${n(y - (3.9 - (i===1?0.4:0))*S0)}" r="${n(0.68*S0)}" fill="#e2402f"/>`;
    s += `<ellipse cx="${n(x+2.0*S0)}" cy="${n(y-0.7*S0)}" rx="${n(0.5*S0)}" ry="${n(0.8*S0)}" fill="#e2402f"/>`;
    s += `<path d="M${n(x+3.6*S0)} ${n(y-2.2*S0)} l ${n(1.7*S0)} ${n(0.6*S0)} l ${n(-1.7*S0)} ${n(0.7*S0)} z"
      fill="#f0a93c"/>`;
    s += toyEye(x+2.6*S0, y-2.5*S0, 0.5*S0);
    s += `</g>`;

  } else if(kind === 'goat'){
    s += toyLeg(x-2.4*S0, y+1.5*S0, 1.3*S0, 2.5*S0, '#e8e3d8');
    s += toyLeg(x+1.3*S0, y+1.5*S0, 1.3*S0, 2.5*S0, '#e8e3d8');
    s += toyBody(x, y, 4.0*S0, 2.9*S0, '#f5f2ea', '#fdfcf8', '#d8d0c2');
    s += `<g class="a3-head">`;
    s += `<ellipse cx="${n(x+2.8*S0)}" cy="${n(y-1.5*S0)}" rx="${n(2.3*S0)}" ry="${n(2.0*S0)}" fill="#f2efe7"/>`;
    s += `<ellipse cx="${n(x+2.6*S0)}" cy="${n(y-2.0*S0)}" rx="${n(1.7*S0)}" ry="${n(1.2*S0)}" fill="#faf8f2"/>`;
    /* Horns swept BACK over the skull, tapering. Curving them up and
       forward read as a floating wire loop rather than a goat. */
    [[-0.55, -0.20],[0.35, 0.16]].forEach(o=>{
      const hx = x + (3.0 + o[0])*S0, hy = y - 3.0*S0;
      s += `<path d="M${n(hx)} ${n(hy)}
        q ${n((-1.5 + o[1]*2)*S0)} ${n(-1.4*S0)} ${n((-2.4 + o[1]*3)*S0)} ${n(-0.7*S0)}"
        stroke="#8b8175" stroke-width="${n(0.55*S0)}" fill="none" stroke-linecap="round"/>`;
      s += `<circle cx="${n(hx)}" cy="${n(hy)}" r="${n(0.34*S0)}" fill="#8b8175"/>`;
    });
    s += `<g class="a3-ear-l"><ellipse cx="${n(x+1.1*S0)}" cy="${n(y-1.9*S0)}" rx="${n(1.3*S0)}" ry="${n(0.62*S0)}"
      fill="#e4ded1" transform="rotate(-24 ${n(x+1.1*S0)} ${n(y-1.9*S0)})"/></g>`;
    s += `<g class="a3-ear-r"><ellipse cx="${n(x+4.4*S0)}" cy="${n(y-1.8*S0)}" rx="${n(1.3*S0)}" ry="${n(0.62*S0)}"
      fill="#e4ded1" transform="rotate(22 ${n(x+4.4*S0)} ${n(y-1.8*S0)})"/></g>`;
    s += toyEye(x+2.1*S0, y-1.6*S0, 0.58*S0);
    s += toyEye(x+3.5*S0, y-1.6*S0, 0.58*S0);
    /* the beard and the bell */
    s += `<path d="M${n(x+2.8*S0)} ${n(y+0.1*S0)} q ${n(0.3*S0)} ${n(1.2*S0)} ${n(-0.2*S0)} ${n(1.7*S0)}"
      stroke="#efeade" stroke-width="${n(0.6*S0)}" fill="none" stroke-linecap="round"/>`;
    s += `<circle cx="${n(x+2.6*S0)}" cy="${n(y+0.6*S0)}" r="${n(0.62*S0)}" fill="#e0b23c"/>`;
    s += `</g>`;

  } else if(kind === 'cow'){
    s += toyLeg(x-3.0*S0, y+1.6*S0, 1.6*S0, 2.7*S0, '#f7f5f1', '#2f2a26');
    s += toyLeg(x+1.6*S0, y+1.6*S0, 1.6*S0, 2.7*S0, '#f7f5f1', '#2f2a26');
    s += toyBody(x, y, 5.0*S0, 3.4*S0, '#fbfaf8', '#ffffff', '#d6d0c8');
    /* the patches, kept few and large the way the reference has them */
    s += `<ellipse cx="${n(x-1.9*S0)}" cy="${n(y+0.5*S0)}" rx="${n(1.7*S0)}" ry="${n(1.3*S0)}" fill="#2f2a26"/>`;
    s += `<ellipse cx="${n(x+1.5*S0)}" cy="${n(y+1.2*S0)}" rx="${n(1.2*S0)}" ry="${n(0.9*S0)}" fill="#2f2a26"/>`;
    s += `<g class="a3-head">`;
    s += `<ellipse cx="${n(x+3.6*S0)}" cy="${n(y-1.9*S0)}" rx="${n(2.7*S0)}" ry="${n(2.3*S0)}" fill="#fbfaf8"/>`;
    /* the black cap over the eyes */
    s += `<path d="M${n(x+1.9*S0)} ${n(y-2.6*S0)} q ${n(1.7*S0)} ${n(-1.9*S0)} ${n(3.4*S0)} ${n(0)}
      q ${n(-1.7*S0)} ${n(1.0*S0)} ${n(-3.4*S0)} ${n(0)} z" fill="#2f2a26"/>`;
    /* horns and ears */
    s += `<ellipse cx="${n(x+2.4*S0)}" cy="${n(y-4.0*S0)}" rx="${n(0.62*S0)}" ry="${n(0.95*S0)}" fill="#f0e6cf"
      transform="rotate(-24 ${n(x+2.4*S0)} ${n(y-4.0*S0)})"/>`;
    s += `<ellipse cx="${n(x+4.7*S0)}" cy="${n(y-4.0*S0)}" rx="${n(0.62*S0)}" ry="${n(0.95*S0)}" fill="#f0e6cf"
      transform="rotate(24 ${n(x+4.7*S0)} ${n(y-4.0*S0)})"/>`;
    s += `<g class="a3-ear-l"><ellipse cx="${n(x+1.4*S0)}" cy="${n(y-2.4*S0)}" rx="${n(1.4*S0)}" ry="${n(0.72*S0)}"
      fill="#2f2a26" transform="rotate(-20 ${n(x+1.4*S0)} ${n(y-2.4*S0)})"/></g>`;
    s += `<g class="a3-ear-r"><ellipse cx="${n(x+5.7*S0)}" cy="${n(y-2.3*S0)}" rx="${n(1.4*S0)}" ry="${n(0.72*S0)}"
      fill="#2f2a26" transform="rotate(20 ${n(x+5.7*S0)} ${n(y-2.3*S0)})"/></g>`;
    s += toyEye(x+2.8*S0, y-2.0*S0, 0.62*S0);
    s += toyEye(x+4.5*S0, y-2.0*S0, 0.62*S0);
    /* the big soft muzzle */
    s += `<ellipse cx="${n(x+3.7*S0)}" cy="${n(y-0.4*S0)}" rx="${n(1.8*S0)}" ry="${n(1.3*S0)}" fill="#f2b3b8"/>`;
    s += `<ellipse cx="${n(x+3.1*S0)}" cy="${n(y-0.6*S0)}" rx="${n(0.28*S0)}" ry="${n(0.36*S0)}" fill="#c98d95"/>`;
    s += `<ellipse cx="${n(x+4.3*S0)}" cy="${n(y-0.6*S0)}" rx="${n(0.28*S0)}" ry="${n(0.36*S0)}" fill="#c98d95"/>`;
    s += `</g>`;

  } else if(kind === 'rabbit'){
    s += toyBody(x, y, 3.0*S0, 2.8*S0, '#e0ac78', '#f0c79a', '#c98f5e');
    s += `<circle cx="${n(x-2.6*S0)}" cy="${n(y+1.4*S0)}" r="${n(1.2*S0)}" fill="#fdfaf5"/>`;
    s += `<g class="a3-head">`;
    s += `<circle cx="${n(x+1.6*S0)}" cy="${n(y-1.9*S0)}" r="${n(2.0*S0)}" fill="#e6b684"/>`;
    s += `<g class="a3-ear-l"><ellipse cx="${n(x+0.6*S0)}" cy="${n(y-4.6*S0)}" rx="${n(0.72*S0)}" ry="${n(2.2*S0)}"
      fill="#e6b684" transform="rotate(-10 ${n(x+0.6*S0)} ${n(y-4.6*S0)})"/>
      <ellipse cx="${n(x+0.6*S0)}" cy="${n(y-4.6*S0)}" rx="${n(0.34*S0)}" ry="${n(1.6*S0)}"
      fill="#f0a8b0" transform="rotate(-10 ${n(x+0.6*S0)} ${n(y-4.6*S0)})"/></g>`;
    s += `<g class="a3-ear-r"><ellipse cx="${n(x+2.6*S0)}" cy="${n(y-4.7*S0)}" rx="${n(0.72*S0)}" ry="${n(2.2*S0)}"
      fill="#e6b684" transform="rotate(9 ${n(x+2.6*S0)} ${n(y-4.7*S0)})"/>
      <ellipse cx="${n(x+2.6*S0)}" cy="${n(y-4.7*S0)}" rx="${n(0.34*S0)}" ry="${n(1.6*S0)}"
      fill="#f0a8b0" transform="rotate(9 ${n(x+2.6*S0)} ${n(y-4.7*S0)})"/></g>`;
    s += toyEye(x+0.9*S0, y-2.0*S0, 0.52*S0);
    s += toyEye(x+2.4*S0, y-2.0*S0, 0.52*S0);
    s += `<ellipse cx="${n(x+1.6*S0)}" cy="${n(y-1.1*S0)}" rx="${n(0.34*S0)}" ry="${n(0.26*S0)}" fill="#e08a94"/>`;
    s += `</g>`;

  } else if(kind === 'duck'){
    s += toyLeg(x-1.0*S0, y+1.6*S0, 0.7*S0, 1.4*S0, '#f0a93c', '#e08b1e');
    s += toyLeg(x+0.6*S0, y+1.6*S0, 0.7*S0, 1.4*S0, '#f0a93c', '#e08b1e');
    s += toyBody(x, y, 3.2*S0, 2.6*S0, '#fbfaf7', '#ffffff', '#dcd6cb');
    s += `<g class="a3-head">`;
    s += `<circle cx="${n(x+2.2*S0)}" cy="${n(y-2.1*S0)}" r="${n(1.7*S0)}" fill="#fdfcfa"/>`;
    s += `<ellipse cx="${n(x+3.7*S0)}" cy="${n(y-1.7*S0)}" rx="${n(1.3*S0)}" ry="${n(0.62*S0)}" fill="#f0a93c"/>`;
    s += toyEye(x+2.5*S0, y-2.4*S0, 0.46*S0);
    s += `</g>`;

  } else {
    /* anything not restyled falls back to the original artwork */
    return null;
  }
  s += `</g>`;
  return s;
}

/* swap the new art in wherever the old beast() was used */
if(typeof beast === 'function'){
  const _beastOld = beast;
  beast = function(kind, x, y, sc, idle){
    const out = beast3d(kind, x, y, sc, idle);
    return out === null ? _beastOld.apply(this, arguments) : out;
  };
}

/* ---------- a cow to put in the barn ---------- */
if(typeof BP !== 'undefined' && Array.isArray(BP) && !BP.some(b=>b.id==='cow_pasture')){
  /* Field names matter here: the list filters on cat==='animal' (singular),
     stocking needs buy:, and the panel reads desc:/tip:. Getting any of
     them wrong makes the blueprint invisible or unusable. */
  BP.push({

/* ---------- how stock actually share a shed ---------- */
/* Real husbandry: flock animals settle together and lie touching at night;
   mixed species in one pen bully each other at the feeder, so they get
   separated. This reads that off what is actually in each pen. */
function pennedSpecies(o){
  const bp = BPMAP[o.bp] || {};
  return bp.animal || (/(sheep)/.test(bp.art||'') ? 'sheep'
    : /goat/.test(bp.art||'') ? 'goat'
    : /coop|chicken/.test(bp.art||'') ? 'chicken'
    : /duck/.test(bp.art||'') ? 'duck'
    : /rabbit/.test(bp.art||'') ? 'rabbit' : 'stock');
}

function husbandryNote(){
  const pens = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='animal');
  if(!pens.length) return '';
  const byKind = {};
  pens.forEach(o=>{ const k = pennedSpecies(o); byKind[k] = (byKind[k]||0) + 1; });
  const kinds = Object.keys(byKind);
  const night = (typeof isNight === 'function') && isNight();
  const notes = [];
  if(kinds.includes('sheep') || kinds.includes('goat'))
    notes.push(night
      ? 'Sheep and goats have bunched up against the fence for the night — flock animals sleep touching.'
      : 'Sheep and goats keep together while they graze; a lone one gets stressed.');
  if(kinds.includes('chicken') && kinds.includes('duck'))
    notes.push('Keep ducks off the hens’ dry bedding — ducks foul water and chickens need it dry.');
  if(kinds.length >= 3)
    notes.push('Three or more species: give each its own feeder, or the bigger stock will push the smaller off.');
  if(pens.some(o=>(o.animals||0) === 1))
    notes.push('A single animal on its own does badly. Most of these do better in pairs or better.');
  return notes.join(' ');
}

/* =====================================================================
   THE ANIMALS HAVE SOMETHING TO SAY

   Three layers, and they build on each other.

   Voices: each pen speaks now and then, in a line that reflects what is
   actually happening to it — hungry stock complain, a pen with something
   ready is pleased, a dirty pen says so. Each with its own sound.

   A social sim underneath: animals notice their neighbours. Species that
   flock settle near each other, a goat next to a hen coop causes trouble,
   and two pens of the same kind get on. Those relationships are what make
   the third layer possible.

   Stories: small things that start, run for a few days and finish. A hen
   goes broody and hatches chicks; the goat gets out and eats a bed; two
   pens strike up a friendship. They only trigger on conditions that are
   genuinely true on your farm, so nothing is ever narrated that did not
   happen.
   ===================================================================== */

/* ---------- 1. voices ---------- */
const ANIMAL_VOICE = {
  chicken:{sfx:'cluck', ok:['Bok!','🥚 Bok bok','Cluck…','*scratch scratch*'],
           hungry:['Bok?! 🌾','Empty feeder!','Bok bok BOK'],
           dirty:['Bok… 🙁','Needs a clean in here']},
  duck:   {sfx:'quack', ok:['Quack!','🦆 Quack quack','*splash*','Lovely puddle'],
           hungry:['Quack?! 🌾','Nothing in the trough'],
           dirty:['Quack… 🙁','Water wants changing']},
  sheep:  {sfx:'bleat', ok:['Baaa','🐑 Baa!','*munch munch*','Good grass here'],
           hungry:['Baaa?! 🌾','Grass is gone'],
           dirty:['Baa… 🙁','Bedding is damp']},
  goat:   {sfx:'bleat', ok:['Meh-eh!','🐐 Meh!','*chew*','What is that? Mine now'],
           hungry:['Meh-eh?! 🌾','I ate the fence'],
           dirty:['Meh… 🙁','Muck out please']},
  cow:    {sfx:'moo',   ok:['Moo~','🐄 Mooo','*slow chew*','Warm today'],
           hungry:['Mooo?! 🌾','Trough is empty'],
           dirty:['Moo… 🙁','Straw needs changing']},
  rabbit: {sfx:'thump', ok:['*thump*','🐰 …','*nose twitch*','*binky!*'],
           hungry:['*thump thump* 🌾','Hungry!'],
           dirty:['…🙁','Hutch is grubby']},
  bee:    {sfx:'bee',   ok:['🐝 Bzzz','*busy*','Bzz bzz'],
           hungry:['Bzz? 🌸','Not enough flowers'], dirty:['Bzz…']},
};

function penSpecies(o){
  const bp = BPMAP[o.bp] || {};
  if(bp.animal) return bp.animal;
  const a = bp.art || '';
  if(/coop/.test(a)) return 'chicken';
  if(/duck/.test(a)) return 'duck';
  if(/sheep/.test(a)) return 'sheep';
  if(/goat/.test(a)) return 'goat';
  if(/cow/.test(a)) return 'cow';
  if(/rabbit/.test(a)) return 'rabbit';
  if(/apiary/.test(a)) return 'bee';
  return null;
}
function animalPens(){
  return (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='animal');
}
function penCentre(o){
  const f = footprint(BPMAP[o.bp], o.rot);
  return { x:(o.tx + f.w*0.5)*T, y:(o.ty + f.h*0.45)*T };
}

/* one pen speaks at a time, on a cooldown, and only when it has cause */
let voiceCool = 0;
function tickVoices(dt){
  voiceCool -= dt;
  if(voiceCool > 0) return;
  if(typeof SET === 'function' && SET('motion') === false) return;
  if((typeof isNight === 'function') && isNight()) return;   /* asleep */

  const pens = animalPens().filter(o=>(o.animals||0) > 0);
  if(!pens.length){ voiceCool = 5; return; }
  const o = pens[Math.floor(Math.random()*pens.length)];
  const sp = penSpecies(o);
  const v = ANIMAL_VOICE[sp];
  if(!v){ voiceCool = 4; return; }

  /* what it says depends on how it is actually doing */
  const care = (o.care === undefined ? 1 : o.care);
  const pool = o.hungry ? v.hungry : care < 0.45 ? v.dirty : v.ok;
  const line = pool[Math.floor(Math.random()*pool.length)];
  const c = penCentre(o);
  if(typeof speak === 'function') speak({x:c.x, y:c.y}, line);
  if(typeof SND !== 'undefined' && v.sfx) SND.play(v.sfx);
  /* complaints come round more often than contentment */
  voiceCool = (o.hungry || care < 0.45) ? 7 + Math.random()*6 : 13 + Math.random()*12;
}

/* ---------- 2. what the animals make of each other ---------- */
/* Nothing elaborate: who is next to whom, and whether that is a good or
   bad pairing. It is enough to drive the stories. */
/* Keys must be in the same alphabetical order pairKey() produces, or the
   lookup silently never matches - which is exactly what happened to
   sheep/goat. */
const PAIRING = {
  'goat|sheep':   {mood:-0.2, why:'The goat bullies the sheep off the feeder.'},
  'sheep|sheep':  {mood:+0.3, why:'Two flocks within sight of each other settle better.'},
  'cow|cow':      {mood:+0.3, why:'Cattle are herd animals and calmer in company.'},
  'chicken|duck': {mood:-0.25,why:'Ducks keep fouling the hens’ dry bedding.'},
  'chicken|chicken':{mood:+0.2,why:'Hens range happily between the two coops.'},
  'goat|goat':    {mood:+0.25,why:'The goats have each other to argue with.'},
  'bee|flowers':  {mood:+0.4, why:'The hives are right by the flowers.'},
};

function pairKey(a, b){ return [a,b].sort().join('|'); }

function socialMap(){
  const pens = animalPens();
  const out = [];
  for(let i=0;i<pens.length;i++)
    for(let j=i+1;j<pens.length;j++){
      const a = penCentre(pens[i]), b = penCentre(pens[j]);
      if(Math.hypot(a.x-b.x, a.y-b.y) > T*7) continue;      /* not neighbours */
      const sa = penSpecies(pens[i]), sb = penSpecies(pens[j]);
      if(!sa || !sb) continue;
      const p = PAIRING[pairKey(sa,sb)];
      if(p) out.push({a:pens[i], b:pens[j], sa, sb, ...p});
    }
  return out;
}

/* neighbours lift or drag on how the stock are doing */
function tickSocial(days){
  const links = socialMap();
  if(!links.length) return;
  links.forEach(l=>{
    const d = l.mood * 0.02 * days;
    [l.a, l.b].forEach(o=>{
      o.care = Math.max(0, Math.min(1, (o.care===undefined?1:o.care) + d));
    });
  });
}

/* ---------- 3. stories ---------- */
/* Each has a condition that must genuinely hold, a run of days, and an
   ending. Nothing narrates something that did not happen. */

    end(x){
      const pens = animalPens();
      pens.forEach(o=>{ o.care = Math.min(1, (o.care===undefined?1:o.care) + 0.12); });
      S.morale = Math.min(1, (S.morale===undefined?0.6:S.morale) + 0.04);
      return `A settled yard. Everything is in better condition for it.`;
    },
  },
  {
    id:'feud',
    days:3,

    start(x){ return `Trouble in the yard. ${x.why}`; },

    id:'lamb',
    days:5,

    start(){ return `One of the ewes is heavy. Lambing within the week.`; },

      if(!pen) return `The ewe was sold on.`;

      const born = Math.min(2, Math.max(0, cap - (pen.animals||0)));
      pen.animals = Math.min(cap, (pen.animals||0) + born);
      return born ? `${born === 2 ? 'Twin lambs' : 'A lamb'}. Up and following within minutes.`

function storyInit(){ if(!S.story) S.story = {active:null, done:{}, next: (S.day||0) + 3}; }

function tickStories(){
  storyInit();
  const st = S.story;
  /* finish the one that is running */
  if(st.active){
    if(S.day >= st.active.endsDay){
      const def = STORIES.find(x=>x.id === st.active.id);
      let line = '';
      try { line = def ? def.end(st.active.ctx || {}) : ''; } catch(e){ line = ''; }
      if(line) log(line, 'good', 'farm');
      if(typeof toast === 'function' && line) toast(line.slice(0, 46), 'good');
      st.done[st.active.id] = (st.done[st.active.id]||0) + 1;
      st.active = null;
      st.next = S.day + 6 + Math.floor(Math.random()*8);
      if(typeof render === 'function') render();
    }
    return;
  }
  /* start a new one when something is genuinely true */
  if(S.day < st.next) return;
  const shuffled = STORIES.slice().sort(()=>Math.random()-0.5);
  for(const def of shuffled){
    let ctx = null;
    try { ctx = def.can(); } catch(e){ ctx = null; }
    if(!ctx) continue;
    /* keep a light reference so end() can find the pen again */
    const slim = {};
    if(ctx.pen) slim.pen = {id: ctx.pen.id};
    if(ctx.why) slim.why = ctx.why;
    st.active = {id:def.id, endsDay: S.day + def.days, ctx:slim};
    let line = '';
    try { line = def.start(ctx); } catch(e){ line = ''; }
    if(line){ log(line, '', 'farm'); if(typeof toast === 'function') toast(line.slice(0,46), ''); }
    return;
  }
  st.next = S.day + 3;      /* nothing fitted; look again shortly */
}

function storyNote(){

  let line = '';
  try { line = def.start(st.active.ctx || {}); } catch(e){ line = ''; }
  return `${line} <b>${left} day${left===1?'':'s'}</b> to go.`;
}

/* =====================================================================
   THE STOCK PANIC TOO

   The family startle and huddle when lightning strikes; the animals
   carried on grazing through it, which is exactly backwards — livestock
   are far more frightened of thunder than people are.

   Now every pen reacts. They cry out in their own language, then bunch
   into the middle of the pen and stay bunched for a good while, calling
   back and forth to each other across the yard until it passes. Real
   stock do stay balled up long after the noise stops, so this outlasts
   the family's huddle by a wide margin.

   Animals are drawn loose inside paddock() with nothing to grab, so
   each one is now wrapped in a group carrying the offset toward its own
   pen centre. Bunching is then one CSS class on the pen.
   ===================================================================== */

/* ---------- give every drawn animal a handle and a direction home ---------- */
if(typeof paddock === 'function'){
  const _paddockBase = paddock;
  paddock = function(w, h, kind, cnt, seed, sc){
    /* Rebuild rather than wrap: the animals are emitted inline by the
       original, so there is no way to reach them after the fact. */
    let s = patch(w,h,'#84ad57',seed,1);
    s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#00000033" stroke-width="2.6"/>`;
    s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#a8814f" stroke-width="1.3"/>`;
    for(let x=2;x<w-2;x+=11){ s += `<rect x="${n(x-1)}" y="0" width="2" height="4" rx="1" fill="#7d5931"/>`;
                              s += `<rect x="${n(x-1)}" y="${n(h-4)}" width="2" height="4" rx="1" fill="#7d5931"/>`; }
    for(let y=2;y<h-2;y+=11){ s += `<rect x="0" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`;
                              s += `<rect x="${n(w-4)}" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`; }
    const cx = w/2, cy = h/2;
    for(let i=0;i<cnt;i++){
      const ax = 8 + hash(i*2.3+seed)*Math.max(4, w-16);
      const ay = 8 + hash(i*5.7+seed)*Math.max(4, h-16);
      /* how far this one has to move to reach the middle, minus a little
         so they bunch rather than stack on one point */
      const dx = (cx - ax) * 0.82, dy = (cy - ay) * 0.82;
      s += `<g class="pen-animal" style="--hx:${n(dx)}px; --hy:${n(dy)}px;
        animation-delay:-${(hash(i*7.1+seed)*3).toFixed(1)}s">${
        beast(kind, ax, ay, sc||1)}</g>`;
    }
    return s;
  };
}

  duck:   ['😱 QUACK QUACK!','😨 QUACK!','😰 Quack quack quack'],
