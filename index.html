/* The art functions are called without a tier argument all over the place,
   so we park it here for the duration of one draw. */
let ART_TIER = 0;
if(typeof drawObj === 'function'){
  const _drawObj = drawObj;
  drawObj = function(o){
    ART_TIER = (typeof tOf==='function') ? tOf(o) : 0;
    const out = _drawObj(o);
    ART_TIER = 0;
    return out;
  };
}
function curTier(o){
  if(o && typeof o.tier === 'number') return o.tier;
  return ART_TIER;
}

/* ---------------------------------------------------------------
   The building primitive, rebuilt per Mark.
   I — a plain gable shed
   II — a longer building with a lean-to wing and a clerestory
   III — a two-block works with a parapet, loading canopy and vents
   IV — a clad plant: glass atrium, full solar skin, gantry and mast
   --------------------------------------------------------------- */
const _buildingBase = building;
building = function(w, h, o){
  o = o || {};
  const tier = (o.tier !== undefined) ? o.tier : ART_TIER;
  if(!tier) return _buildingBase(w, h, o);

  const roof = o.roof || 'url(#gRoof)';
  let s = '';

  /* one shadow for the whole complex */
  s += `<rect x="${n(w*0.05)}" y="${n(h*0.09)}" width="${n(w*0.96)}" height="${n(h*0.94)}" rx="3"
    fill="#16240c" opacity=".34"/>`;

  if(tier === 1){
    /* main range plus a lean-to along the sunny side */
    s += `<g>${_buildingBase(w*0.74, h*0.9, {...o, tier:0, solar:1})}</g>`;
    s += `<g transform="translate(${n(w*0.70)},${n(h*0.28)})">
      ${_buildingBase(w*0.30, h*0.62, {...o, tier:0, roof:'#8d979d', skirt:3})}</g>`;
    /* clerestory ridge lights */
    for(let i=0;i<3;i++)
      s += `<rect x="${n(w*(0.16+i*0.18))}" y="${n(h*0.40)}" width="${n(w*0.11)}" height="${n(h*0.07)}"
        rx="1" fill="url(#gGlass)" stroke="#6e7d85" stroke-width="0.6"/>`;
    /* concrete apron */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.90)}" width="${n(w*0.66)}" height="${n(h*0.08)}" rx="1.5" fill="#b3ab9c"/>`;
  }

  if(tier === 2){
    /* two blocks joined by a glazed link, with a loading canopy */
    s += `<g>${_buildingBase(w*0.52, h*0.62, {...o, tier:0, solar:1, solar2:1})}</g>`;
    s += `<g transform="translate(${n(w*0.46)},${n(h*0.34)})">
      ${_buildingBase(w*0.54, h*0.66, {...o, tier:0, solar:1, solar2:1})}</g>`;
    s += `<rect x="${n(w*0.40)}" y="${n(h*0.44)}" width="${n(w*0.16)}" height="${n(h*0.22)}" rx="1.5"
      fill="url(#gGlass)" stroke="#7e929a" stroke-width="0.9"/>`;
    /* parapet band across the front */
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.62)}" width="${n(w*0.50)}" height="${n(h*0.05)}" rx="1" fill="#c3ccd2"/>`;
    /* loading canopy on steel posts */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.70)}" width="${n(w*0.34)}" height="${n(h*0.14)}" rx="1.5" fill="#8d979d"/>`;
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.70)}" width="${n(w*0.34)}" height="${n(h*0.05)}" rx="1.5" fill="#a9b3b9"/>`;
    [0.09,0.22,0.35].forEach(t=> s += `<rect x="${n(w*t)}" y="${n(h*0.84)}" width="2" height="${n(h*0.12)}" fill="#6e7d85"/>`);
    /* roof plant: vents and a silo */
    for(let i=0;i<4;i++)
      s += `<circle cx="${n(w*(0.60+i*0.09))}" cy="${n(h*0.42)}" r="${n(Math.min(w,h)*0.028)}" fill="#b6bfc4" stroke="#78848b" stroke-width="0.6"/>`;
    s += `<circle cx="${n(w*0.90)}" cy="${n(h*0.20)}" r="${n(Math.min(w,h)*0.09)}" fill="#cdd5d9" stroke="#87949b" stroke-width="1"/>`;
  }

  if(tier >= 3){
    /* a proper plant: podium, glass atrium, full solar skin, gantry */
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.10)}" width="${n(w*0.96)}" height="${n(h*0.84)}" rx="3" fill="#5f6a70"/>`;
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.10)}" width="${n(w*0.96)}" height="${n(h*0.30)}" rx="3" fill="#78848b"/>`;
    /* solar skin over the whole roof */
    s += panels(w*0.05, h*0.14, w*0.90, h*0.34, Math.max(5, Math.round(w/12)), 3);
    /* glazed atrium down the middle */
    s += `<rect x="${n(w*0.30)}" y="${n(h*0.50)}" width="${n(w*0.40)}" height="${n(h*0.36)}" rx="2"
      fill="url(#gGlass)" stroke="#8fa8b0" stroke-width="1"/>`;
    for(let i=1;i<4;i++)
      s += `<line x1="${n(w*(0.30+i*0.10))}" y1="${n(h*0.50)}" x2="${n(w*(0.30+i*0.10))}" y2="${n(h*0.86)}"
        stroke="#8fa8b0" stroke-width="0.8"/>`;
    /* service wings either side */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.52)}" width="${n(w*0.22)}" height="${n(h*0.34)}" rx="2" fill="#6e7a81"/>`;
    s += `<rect x="${n(w*0.73)}" y="${n(h*0.52)}" width="${n(w*0.22)}" height="${n(h*0.34)}" rx="2" fill="#6e7a81"/>`;
    /* gantry running the length of the roof */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.455)}" width="${n(w*0.90)}" height="2.4" rx="1.2" fill="#c3ccd2"/>`;
    for(let i=0;i<5;i++)
      s += `<rect x="${n(w*(0.10+i*0.19))}" y="${n(h*0.42)}" width="2" height="${n(h*0.05)}" fill="#9aa5ab"/>`;
    /* status strip */
    s += `<rect x="${n(w*0.32)}" y="${n(h*0.88)}" width="${n(w*0.36)}" height="${n(h*0.06)}" rx="1.5" fill="#0e1c26"/>`;
    for(let i=0;i<5;i++)
      s += `<rect class="twinkle" style="animation-delay:${(i*0.28).toFixed(2)}s"
        x="${n(w*(0.34+i*0.065))}" y="${n(h*0.895)}" width="${n(w*0.04)}" height="${n(h*0.03)}" fill="#7cc24f"/>`;
    /* stacks */
    [0.12,0.86].forEach(t=>{
      s += `<rect x="${n(w*t)}" y="${n(h*0.02)}" width="${n(w*0.045)}" height="${n(h*0.16)}" rx="1" fill="#aab4ba"/>`;
      s += `<rect x="${n(w*t)}" y="${n(h*0.02)}" width="${n(w*0.045)}" height="${n(h*0.04)}" rx="1" fill="#cdd5d9"/>`;
    });
    /* standing-seam cladding across the podium */
    for(let i=0;i<Math.max(6, Math.round(w/9)); i++){
      const x = w*0.03 + i*(w*0.94/Math.max(6, Math.round(w/9)));
      s += `<line x1="${n(x)}" y1="${n(h*0.50)}" x2="${n(x)}" y2="${n(h*0.92)}" stroke="#fff" stroke-opacity=".07" stroke-width="0.8"/>`;
      s += `<line x1="${n(x+1.2)}" y1="${n(h*0.50)}" x2="${n(x+1.2)}" y2="${n(h*0.92)}" stroke="#000" stroke-opacity=".12" stroke-width="0.8"/>`;
    }
    /* rooftop plant: chillers, ducting and a walkway */
    for(let i=0;i<3;i++)
      s += `<rect x="${n(w*(0.14+i*0.13))}" y="${n(h*0.155)}" width="${n(w*0.09)}" height="${n(h*0.10)}" rx="1.5"
        fill="#9aa5ab" stroke="#6e7d85" stroke-width="0.7"/>`;
    s += `<rect x="${n(w*0.60)}" y="${n(h*0.16)}" width="${n(w*0.28)}" height="${n(h*0.07)}" rx="3" fill="#b6bfc4"/>`;
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.115)}" width="${n(w*0.90)}" height="1.6" fill="#c3ccd2" opacity=".7"/>`;
    /* access ladder and handrail */
    s += `<rect x="${n(w*0.955)}" y="${n(h*0.14)}" width="1.6" height="${n(h*0.34)}" fill="#9aa5ab"/>`;
    for(let i=0;i<5;i++)
      s += `<rect x="${n(w*0.945)}" y="${n(h*(0.17+i*0.06))}" width="3.6" height="1" fill="#9aa5ab"/>`;
    /* lit atrium glow at night */
    s += `<rect x="${n(w*0.30)}" y="${n(h*0.50)}" width="${n(w*0.40)}" height="${n(h*0.36)}" rx="2"
      fill="#ffe9b0" opacity=".16"/>`;
    /* company sign band */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.44)}" width="${n(w*0.90)}" height="${n(h*0.045)}" rx="1" fill="#2c3a42"/>`;
    s += `<rect x="${n(w*0.07)}" y="${n(h*0.452)}" width="${n(w*0.24)}" height="${n(h*0.022)}" rx="1" fill="#7cc24f" opacity=".85"/>`;
  }
  s += grain(0,0,w,h,0.08);
  return s;
};

/* ---------------------------------------------------------------
   The non-building structures grow too
   --------------------------------------------------------------- */
/* rain tanks: two, then four, then a bank with a pump house */
const _artTank = ART.tank;
ART.tank = (w,h,ob)=>{
  const t = curTier(ob);
  if(!t) return _artTank(w,h,ob);
  const cnt = t===1 ? 3 : t===2 ? 4 : 5;
  const rad = Math.min(h*0.44, (w/cnt)/2 - 1);
  let s = '';
  for(let i=0;i<cnt;i++){
    const cx=(w/cnt)*(i+0.5), cy=h*0.48;
    s += `<ellipse cx="${n(cx+2)}" cy="${n(cy+2.5)}" rx="${n(rad)}" ry="${n(rad*0.9)}" fill="#16240c" opacity=".34"/>`;
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad)}" fill="#2f4f2f"/>`;
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad-1.2)}" fill="url(#gTank)"/>`;
    for(let j=0;j<12;j++){ const a=(j/12)*Math.PI*2;
      s += `<line x1="${n(cx)}" y1="${n(cy)}" x2="${n(cx+Math.cos(a)*(rad-2))}" y2="${n(cy+Math.sin(a)*(rad-2))}" stroke="#3e6a3e" stroke-width="0.7" opacity=".7"/>`; }
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad*0.26)}" fill="#5f8a5c"/>`;
    s += `<path d="M${n(cx-rad*0.58)} ${n(cy-rad*0.5)} a ${n(rad*0.8)} ${n(rad*0.8)} 0 0 1 ${n(rad*0.9)} ${n(-rad*0.14)}" stroke="#fff" stroke-width="1.2" fill="none" opacity=".38"/>`;
  }
  /* manifold pipework along the base */
  s += `<rect x="${n(w*0.04)}" y="${n(h*0.88)}" width="${n(w*0.92)}" height="2.6" rx="1.3" fill="#8b949a"/>`;
  for(let i=0;i<cnt;i++)
    s += `<rect x="${n((w/cnt)*(i+0.5)-1)}" y="${n(h*0.78)}" width="2" height="${n(h*0.12)}" fill="#8b949a"/>`;
  if(t>=2){  /* pump house */
    s += `<g transform="translate(${n(w*0.80)},${n(h*0.04)})">${_buildingBase(w*0.18,h*0.3,{roof:'#8d979d',skirt:2})}</g>`;
  }
  if(t>=3){  /* filtration skid and a level readout */
    s += `<rect x="${n(w*0.04)}" y="${n(h*0.04)}" width="${n(w*0.2)}" height="${n(h*0.22)}" rx="2" fill="#5f6a70"/>`;
    s += `<circle class="pulse" cx="${n(w*0.14)}" cy="${n(h*0.15)}" r="2" fill="#6fb6d8"/>`;
  }
  if(ob){
    const lv = clamp(ob.store/(ob.cap||100), 0, 1);
    s += `<rect x="${n(w*0.16)}" y="${n(h-3.4)}" width="${n(w*0.68)}" height="2.6" rx="1.3" fill="#0e1a10" opacity=".8"/>`;
    s += `<rect x="${n(w*0.16)}" y="${n(h-3.4)}" width="${n(w*0.68*lv)}" height="2.6" rx="1.3" fill="#6fb6d8"/>`;
  }
  return s;
};

/* beds: more rows, then cloches, then a full poly-covered block */
const _artBed = ART.bed, _artBedL = ART.bed_large;
function tieredBed(base, rows){
  return (w,h,ob)=>{
    const t = curTier(ob);
    let s = base(w,h,ob);

    /* Mk II - the bed a serious grower actually builds: cedar sleepers
       with visible corner posts, a mulched edge, drip line with emitters
       and a row marker. No enclosure. */
    if(t>=1){
      s += `<rect x="0.6" y="0.6" width="${n(w-1.2)}" height="${n(h-2.2)}" rx="2.4"
        fill="none" stroke="#b08653" stroke-width="2.6"/>`;
      s += `<rect x="0.6" y="0.6" width="${n(w-1.2)}" height="1.3" rx="0.6" fill="#d3a771" opacity=".9"/>`;
      s += `<rect x="0.6" y="${n(h-2.6)}" width="${n(w-1.2)}" height="1.2" fill="#000" opacity=".22"/>`;
      [[1.4,1.4],[w-3.6,1.4],[1.4,h-4.6],[w-3.6,h-4.6]].forEach(p=>{
        s += `<rect x="${n(p[0])}" y="${n(p[1])}" width="2.2" height="3.2" rx="0.7" fill="#8d6a40"/>`;
        s += `<rect x="${n(p[0])}" y="${n(p[1])}" width="2.2" height="1" rx="0.5" fill="#c69a63"/>`;
      });
      /* drip line down the middle with emitters */
      s += `<line x1="4" y1="${n(h*0.52)}" x2="${n(w-4)}" y2="${n(h*0.52)}"
        stroke="#4a6b80" stroke-width="0.9" opacity=".8"/>`;
      for(let i=0;i<Math.max(3,Math.round(w/16));i++){
        const ex = 6 + i*((w-12)/Math.max(1,Math.round(w/16)-1||1));
        s += `<circle cx="${n(ex)}" cy="${n(h*0.52)}" r="0.8" fill="#8fd0e8" opacity=".85"/>`;
      }
      /* a row marker stake at the near end */
      s += `<rect x="3.4" y="${n(h*0.70)}" width="0.9" height="4.4" rx="0.4" fill="#8d6a40"/>`;
      s += `<rect x="2.6" y="${n(h*0.70)}" width="2.6" height="1.8" rx="0.4" fill="#e8e2d2"/>`;
    }

    /* Mk III - vertical growing. A back trellis with twine for climbers,
       straw mulch, and a companion flower at the end. Still open to the
       sky, so the crop stays visible. */
    if(t>=2){
      s += `<rect x="2.6" y="2.2" width="${n(w-5.2)}" height="1.1" rx="0.5" fill="#a98255"/>`;
      /* Twine, not railings. Half as many strands, warmer and fainter, and
         only over the back row where climbers actually go - a full-width
         grid of verticals reads as a cage. */
      const strands = Math.max(3, Math.round(w/26));
      for(let i=0;i<strands;i++){
        const sx = 6 + i*((w-12)/(strands-1||1));
        s += `<line x1="${n(sx)}" y1="3.4" x2="${n(sx)}" y2="${n(h*0.34)}"
          stroke="#c2b48d" stroke-width="0.4" opacity=".55"/>`;
        /* the climber itself, which is the point of the trellis */
        s += `<circle cx="${n(sx)}" cy="${n(h*0.16)}" r="1.9" fill="#5f9a3c" opacity=".92"/>`;
        s += `<circle cx="${n(sx-0.7)}" cy="${n(h*0.16-0.7)}" r="0.9" fill="#84c057" opacity=".85"/>`;
        s += `<circle cx="${n(sx+0.8)}" cy="${n(h*0.27)}" r="1.3" fill="#6ea63f" opacity=".85"/>`;
      }
      /* straw mulch flecks over the soil */
      for(let i=0;i<Math.min(22,Math.round(w*h/90));i++){
        const mx = 4+hash(i*2.7)*(w-8), my = h*0.56+hash(i*4.3)*(h*0.34);
        s += `<line x1="${n(mx)}" y1="${n(my)}" x2="${n(mx+1.8)}" y2="${n(my-0.7)}"
          stroke="#d8c48b" stroke-width="0.6" opacity=".55"/>`;
      }
      s += `<circle cx="${n(w-5)}" cy="${n(h-6)}" r="2" fill="#e6a53c"/>`;
      s += `<circle cx="${n(w-5)}" cy="${n(h-6)}" r="0.9" fill="#8a5f1e"/>`;
    }

    /* Mk IV - a wicking bed under a rolled-back insect mesh. The mesh is
       drawn pulled open across two thirds so you can see what is growing;
       the old version sealed the whole bed behind glass, which read as a
       cage rather than a garden. */
    if(t>=3){
      const hoops = Math.max(2, Math.round(w/44));
      for(let i=0;i<hoops;i++){
        const hx = 7 + i*((w-14)/(hoops-1||1));
        s += `<path d="M${n(hx)} ${n(h-4)} q ${n(-1.5)} ${n(-h*0.55)} ${n(0)} ${n(-h*0.62)}"
          stroke="#c3ccd2" stroke-width="1" fill="none" opacity=".8"/>`;
      }
      /* mesh rolled back to the far end only */
      s += `<rect x="${n(w*0.66)}" y="1.6" width="${n(w*0.31)}" height="${n(h*0.5)}" rx="2.4"
        fill="#e8eef1" opacity=".24"/>`;
      for(let i=1;i<4;i++)
        s += `<line x1="${n(w*0.66+w*0.31*i/4)}" y1="1.6" x2="${n(w*0.66+w*0.31*i/4)}" y2="${n(1.6+h*0.5)}"
          stroke="#cfd9de" stroke-width="0.4" opacity=".5"/>`;
      /* the roll itself, bunched at the join */
      s += `<rect x="${n(w*0.63)}" y="1.4" width="2.6" height="${n(h*0.52)}" rx="1.3" fill="#dfe7ea" opacity=".7"/>`;
      /* wicking reservoir inlet and a level sight tube down the near end */
      s += `<rect x="3" y="${n(h*0.62)}" width="1.6" height="${n(h*0.3)}" rx="0.8" fill="#7fb0c8" opacity=".85"/>`;
      s += `<circle cx="3.8" cy="${n(h*0.62)}" r="1.4" fill="#9db4bb"/>`;
      /* ripe crop reads through the open half */
      for(let i=0;i<4;i++){
        const cx2 = w*0.12 + i*(w*0.46/3);
        s += `<circle cx="${n(cx2)}" cy="${n(h*0.70)}" r="2.1" fill="#d1462f"/>`;
        s += `<circle cx="${n(cx2-0.6)}" cy="${n(h*0.70-0.6)}" r="0.8" fill="#ef7a5c" opacity=".85"/>`;
      }
    }
    return s;
  };
}
ART.bed = tieredBed(_artBed);
ART.bed_large = tieredBed(_artBedL);

/* solar: more rows, then trackers, then a full array with an inverter shed */
const _artSolar = ART.solar_ground;
ART.solar_ground = (w,h,ob)=>{
  const t = curTier(ob);
  if(!t) return _artSolar(w,h,ob);
  let s = patch(w,h,'#5f7a44',12,1);
  const rows = 2 + t;
  for(let i=0;i<rows;i++){
    const y = 3 + i*((h-6)/rows);
    s += `<rect x="4" y="${n(y+3)}" width="${n(w-8)}" height="3" fill="#16240c" opacity=".3"/>`;
    s += panels(3, y, w-6, (h-8)/rows, Math.max(4, Math.round(w/10)), 1);
    if(t>=2)  /* tracker torque tube */
      s += `<rect x="3" y="${n(y+(h-8)/rows/2)}" width="${n(w-6)}" height="1.6" rx="0.8" fill="#9aa5ab"/>`;
  }
  if(t>=3){
    s += `<g transform="translate(${n(w*0.76)},${n(h*0.72)})">${_buildingBase(w*0.22,h*0.26,{roof:'#8d979d',skirt:2})}</g>`;
    s += `<circle class="pulse" cx="${n(w*0.87)}" cy="${n(h*0.78)}" r="2" fill="#7cc24f"/>`;
  }
  return s;
};

/* coop: bigger run, second house, then an aviary with a feed silo */
const _artCoop = ART.coop;
ART.coop = (w,h,ob)=>{
  const t = curTier(ob);
  if(!t) return _artCoop(w,h,ob);
  const cnt = ob ? Math.min(20, ob.animals||0) : 4;
  let s = paddock(w,h,'chicken',cnt,7,0.9);
  s += `<g transform="translate(${n(w*0.04)},${n(h*0.06)})">
    ${_buildingBase(w*0.40, h*0.44, {roof:'url(#gRoofRed)', solar:1})}</g>`;
  if(t>=1)
    s += `<g transform="translate(${n(w*0.48)},${n(h*0.06)})">
      ${_buildingBase(w*0.30, h*0.36, {roof:'url(#gRoofRed)'})}</g>`;
  if(t>=2){   /* covered run */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.54)}" width="${n(w*0.86)}" height="${n(h*0.38)}" rx="3"
      fill="none" stroke="#9db4bb" stroke-width="1.2" stroke-dasharray="3 2" opacity=".8"/>`;
    s += `<rect x="${n(w*0.82)}" y="${n(h*0.10)}" width="${n(w*0.13)}" height="${n(h*0.3)}" rx="2" fill="#b6bfc4"/>`;
    s += `<path d="M${n(w*0.825)} ${n(h*0.10)} l ${n(w*0.06)} ${n(-h*0.07)} l ${n(w*0.06)} ${n(h*0.07)} z" fill="#cdd5d9"/>`;
  }
  if(t>=3){   /* automated feed line and egg belt */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.50)}" width="${n(w*0.86)}" height="2" rx="1" fill="#c3ccd2"/>`;
    s += `<rect x="${n(w*0.30)}" y="${n(h*0.94)}" width="${n(w*0.4)}" height="3" rx="1.5" fill="#0e1c26"/>`;
    s += `<circle class="twinkle" cx="${n(w*0.5)}" cy="${n(h*0.955)}" r="1.2" fill="#f0c14b"/>`;
  }
  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};

/* greenhouse: taller glass, then a gothic arch range, then a research house */
const _artGh = ART.greenhouse;
ART.greenhouse = (w,h,ob)=>{
  const t = curTier(ob);
  let s = _artGh(w,h,ob);
  if(t>=1){
    for(let i=0;i<3;i++)
      s += `<rect x="${n(w*(0.14+i*0.26))}" y="${n(h*0.04)}" width="${n(w*0.18)}" height="${n(h*0.08)}"
        rx="1" fill="#dff0f5" stroke="#8fa8b0" stroke-width="0.7"/>`;   // roof vents
  }
  if(t>=2){
    s += `<rect x="0" y="${n(h*0.46)}" width="${n(w)}" height="${n(h*0.06)}" fill="#c3ccd2" opacity=".85"/>`;
    s += `<g transform="translate(${n(w*0.02)},${n(h*0.74)})">${_buildingBase(w*0.2,h*0.24,{roof:'#8d979d',skirt:2})}</g>`;
  }
  if(t>=3){
    s += `<rect x="1" y="1" width="${n(w-2)}" height="${n(h-3)}" rx="2" fill="#7fd0ff" opacity=".10"/>`;
    for(let i=0;i<4;i++)
      s += `<rect class="twinkle" style="animation-delay:${(i*0.3).toFixed(2)}s"
        x="${n(w*(0.12+i*0.22))}" y="${n(h*0.30)}" width="${n(w*0.16)}" height="1.8" rx="0.9" fill="#ff9ec4" opacity=".8"/>`;  // grow lights
    s += `<rect x="${n(w*0.36)}" y="${n(h-5)}" width="${n(w*0.28)}" height="3.4" rx="1.5" fill="#0e1c26"/>`;
  }
  return s;
};

/* farm stand: stall, then a shop, then a farm shop with parking canopy */
const _artStand = ART.farm_stand;
ART.farm_stand = (w,h,ob)=>{
  const t = curTier(ob);
  if(!t) return _artStand(w,h,ob);
  let s = `<rect x="0" y="1" width="${n(w)}" height="${n(h-1)}" rx="3" fill="#9d9276"/>` +
          `<rect x="0" y="0" width="${n(w)}" height="${n(h-2)}" rx="3" fill="url(#gGravel)"/>`;
  for(let i=0;i<Math.min(40, Math.floor(w*h/90));i++)
    s += `<circle cx="${n(hash(i*1.7)*w)}" cy="${n(hash(i*3.1+5)*h)}" r="${n(0.5+hash(i)*0.9)}" fill="#8d8268" opacity=".5"/>`;
  s += `<g transform="translate(${n(w*0.04)},${n(h*0.04)})">
    ${_buildingBase(w*0.62, h*0.62, {roof:'url(#gRoofRed)', solar:t>=2?1:0})}</g>`;
  s += `<rect x="${n(w*0.08)}" y="${n(h*0.56)}" width="${n(w*0.54)}" height="${n(h*0.1)}" rx="1.5" fill="url(#gGlass)"/>`;
  const goods=['#e2603a','#efb43c','#6fb04a','#c8583f','#f2e07a','#9b6fc4'];
  for(let i=0;i<4+t;i++)
    s += `<circle cx="${n(w*0.10+i*(w*0.52/(4+t)))}" cy="${n(h*0.74)}" r="2.4" fill="${goods[i%6]}"/>`;
  if(t>=1)  /* awning */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.66)}" width="${n(w*0.58)}" height="${n(h*0.05)}" rx="1" fill="#c8583f"/>`;
  if(t>=2){ /* sign and a second counter */
    s += `<rect x="${n(w*0.68)}" y="${n(h*0.12)}" width="${n(w*0.28)}" height="${n(h*0.18)}" rx="2" fill="#f4efe1" stroke="#7d5931" stroke-width="1.4"/>`;
    s += `<line x1="${n(w*0.72)}" y1="${n(h*0.19)}" x2="${n(w*0.92)}" y2="${n(h*0.19)}" stroke="#9c8470" stroke-width="1.4"/>`;
    s += `<line x1="${n(w*0.72)}" y1="${n(h*0.24)}" x2="${n(w*0.88)}" y2="${n(h*0.24)}" stroke="#9c8470" stroke-width="1.4"/>`;
  }

/* =====================================================================

/* ---------- 1. split the scene: a static backdrop, a live foreground ---------- */
let bgToken = '';
function sceneSize(){ return {w:WPX, h:HPX}; }

function ensureBackdrop(){
  const scene = document.getElementById('scene');
  if(!scene) return null;
  const token = `${WPX}x${HPX}:${S.landId}:${S.expansions||0}`;
  let bg = document.getElementById('bg');
  if(bg && bgToken === token) return bg;
  /* the backdrop only changes when the land itself does */
  const bgSvg = `<svg id="bg" width="${WPX}" height="${HPX}" viewBox="0 0 ${WPX} ${HPX}"
      xmlns="http://www.w3.org/2000/svg">${DEFS()}${terrain()}</svg>`;
  const fgSvg = `<svg id="fg" width="${WPX}" height="${HPX}" viewBox="0 0 ${WPX} ${HPX}"
      xmlns="http://www.w3.org/2000/svg">${DEFS()}</svg>`;
  scene.innerHTML = bgSvg + fgSvg;
  bgToken = token;
  return document.getElementById('bg');
}

/* the whole render, rebuilt to touch only the foreground */
render = function(){
  if(!S) return;
  ensureBackdrop();
  const fg = document.getElementById('fg');
  if(!fg) return;

  const order = {access:0, water:1, garden:2, trees:3, animals:4, energy:5, build:6, tourism:7, people:8, markers:9};
  const objs = S.objs.slice().sort((a,b)=>{
    const A=BPMAP[a.bp], B=BPMAP[b.bp];
    const ra = A.cat==='land'&&(A.art==='path'||A.art==='ring'||A.art==='parking') ? 0 : 1;
    const rb = B.cat==='land'&&(B.art==='path'||B.art==='ring'||B.art==='parking') ? 0 : 1;
    if(ra!==rb) return ra-rb;
    return (a.ty+BPMAP[a.bp].h) - (b.ty+BPMAP[b.bp].h);
  });

  let ghostSvg = '';
  if(ghost){
    const f = footprint(ghost.bp, ghost.rot);
    if((typeof SET!=='function') || SET('grid')){
      ghostSvg += `<g class="gridlay">`;
      for(let x=FARM.x;x<=FARM.x+FARM.w;x++)
        ghostSvg += `<line x1="${x*T}" y1="${FARM.y*T}" x2="${x*T}" y2="${(FARM.y+FARM.h)*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
      for(let y=FARM.y;y<=FARM.y+FARM.h;y++)
        ghostSvg += `<line x1="${FARM.x*T}" y1="${y*T}" x2="${(FARM.x+FARM.w)*T}" y2="${y*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
      ghostSvg += `</g>`;
    }
    const bad = overlaps(ghost.tx, ghost.ty, f, ghost.moving) || S.cash < (ghost.moving?0:ghost.bp.cost);
    const fake = {id:-1, bp:ghost.bp.id, tx:ghost.tx, ty:ghost.ty, rot:ghost.rot, tier:0,
      crop:null, stage:0.6, water:.6, animals:2, ready:0, store:(ghost.bp.cap||0)*0.6, cap:ghost.bp.cap};
    ghostSvg += `<g opacity=".72">${drawObj(fake)}</g>`;
    ghostSvg += `<rect x="${ghost.tx*T}" y="${ghost.ty*T}" width="${f.w*T}" height="${f.h*T}" rx="4"
      fill="${bad?'#e2705c':'#7cc24f'}" fill-opacity=".2" stroke="${bad?'#e2705c':'#7cc24f'}" stroke-width="2.5"/>`;
  }

  let selRing = '';
  if(sel){
    const o = S.objs.find(z=>z.id===sel);
    if(o){ const f = footprint(BPMAP[o.bp], o.rot);
      selRing = `<rect x="${o.tx*T-2}" y="${o.ty*T-2}" width="${f.w*T+4}" height="${f.h*T+4}" rx="5"
        fill="none" stroke="#f0c14b" stroke-width="2.5" stroke-dasharray="7 5" class="selring"/>`; }
  }

  fg.innerHTML = DEFS()
    + (typeof roadLayer==='function' ? roadLayer() : '')
    + `<g id="obs">${objs.map(drawObj).join('')}</g>`
    + (typeof herdLayer==='function' ? herdLayer() : '')
    + (typeof peopleLayer==='function' ? peopleLayer() : '')
    + (typeof youLayer==='function' ? youLayer() : '')

  nodeCache.clear();
  renderLabels();
  if(typeof applyWind==='function') applyWind();

  if(cnt) cnt.textContent = S.objs.length + ' pieces';
};

/* ---------- 2. stop querying the DOM for every creature every tick ---------- */
const nodeCache = new Map();
function node(sel2){
  let el = nodeCache.get(sel2);
  if(el && el.isConnected) return el;
  el = document.querySelector(sel2);
  if(el) nodeCache.set(sel2, el);

}

          if(flip && a.dir !== a._d){ flip.setAttribute('transform', `scale(${a.dir},1)`); a._d = a.dir; }

/* ---------- 3. one animation frame drives everything ---------- */
window.__perfLoop = true;
(function unifyTickers(){
  /* the old per-system timers are removed at source; this frame drives them all */
  let last = performance.now(), sunAcc = 0, uiAcc = 0, saveAcc = 0, collectAcc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    const dtms = Math.min(120, now - last);
    last = now;
    if(!S) return;
    const dt = dtms/1000;

    /* the world clock */
    if(S.speed > 0){
      if(S.settings && S.settings.dayLen) DAY_MS = S.settings.dayLen*1000;
      acc += dtms*S.speed;
      if(acc >= DAY_MS){ acc -= DAY_MS; advanceDay(); }
      if(typeof tickLife==='function')   tickLife(dt);
      if(typeof tickPeople==='function') tickPeople(dt);
    }
    if(typeof tickYou==='function')  tickYou(dt);
    if(typeof tickIdle==='function') tickIdle(dt);

    /* the day badge fill */
    const badge = document.getElementById('wbadge');
    if(badge){
      const pct = Math.round(acc/DAY_MS*100);
      badge.style.background = `linear-gradient(90deg, rgba(124,194,79,.28) ${pct}%, rgba(10,16,8,.86) ${pct}%)`;
    }

    sunAcc += dtms; uiAcc += dtms; saveAcc += dtms; collectAcc += dtms;
    if(sunAcc > 500){ sunAcc = 0;
      if(typeof paintSun==='function' && (!S.settings || S.settings.sunarc !== false)) paintSun(); }
    if(uiAcc > 3000){ uiAcc = 0;
      if(S.speed>0){ renderStats(); const b=document.getElementById('wbadge'); if(b) b.innerHTML = hint(); } }
    if(collectAcc > 1500){ collectAcc = 0;
      if(typeof syncWeatherFx==='function') syncWeatherFx();
      if(typeof syncCollectAll==='function') syncCollectAll(); }
    if(saveAcc > 20000){ saveAcc = 0;
      if(typeof SET!=='function' || SET('autoSave')) G.save(); }

    /* edge panning, only while it is switched on */
    if(typeof SET==='function' && SET('edgePan') && edge.on && !ghost){
      let dx=0, dy=0; const m=48, sp=520*dt;
      if(edge.x < m) dx = sp; else if(edge.x > edge.w-m) dx = -sp;
      if(edge.y < m) dy = sp; else if(edge.y > edge.h-m) dy = -sp;
      if(dx||dy){ cam.x += dx; cam.y += dy; applyCam(); }
    }
  }
  requestAnimationFrame(frame);
  if(typeof syncWeatherFx==='function') setTimeout(syncWeatherFx, 300);

  /* pointer position for edge panning, tracked passively */
  const edge = {on:false, x:0, y:0, w:0, h:0};
  const world = document.getElementById('world');
  if(world){
    world.addEventListener('mousemove', e=>{
      const r = world.getBoundingClientRect();
      edge.x = e.clientX-r.left; edge.y = e.clientY-r.top;
      edge.w = r.width; edge.h = r.height; edge.on = true;
    }, {passive:true});
    world.addEventListener('mouseleave', ()=>{ edge.on = false; }, {passive:true});
  }
})();

/* ---------------------------------------------------------------

   --------------------------------------------------------------- */
function idleInit(){ if(S.idleSecs===undefined) S.idleSecs = 0; }
function noteActivity(){ idleInit(); S.idleSecs = 0; if(S.idlePaused){ S.idlePaused=false; S.speed = S._preIdle||1; ui(); } }
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>
  window.addEventListener(ev, ()=>{ if(S) noteActivity(); }, {passive:true}));

function tickIdleRules(dt){
  idleInit();
  if(!SET('idleRules')) return;
  if(S.speed === 0 && !S.idlePaused) return;      // deliberately paused, leave alone
  S.idleSecs += dt;
  const limit = (SET('idleMins')||10) * 60;
  if(!S.idlePaused && S.idleSecs > limit){
    S.idlePaused = true; S._preIdle = S.speed || 1; S.speed = 0;
    /* neglect costs exactly a tenth, rounded up, so it is always felt */
    let lostCrops = 0, lostStock = 0;
    const planted = S.objs.filter(o=>BPMAP[o.bp].kind==='plot' && o.crop);
    for(let i=planted.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [planted[i],planted[j]]=[planted[j],planted[i]]; }
    planted.slice(0, Math.ceil(planted.length*0.10)).forEach(o=>{
      o.crop=null; o.stage=0; o.weeds=0; lostCrops++;
    });
    const herd = S.objs.filter(o=>BPMAP[o.bp].kind==='animal' && o.animals>0);
    let toLose = Math.ceil(herd.reduce((a,o)=>a+o.animals,0) * 0.10);
    while(toLose > 0){
      const pen = herd.filter(o=>o.animals>0);
      if(!pen.length) break;
      const o = pen[Math.floor(Math.random()*pen.length)];
      o.animals--; syncHerd(o); lostStock++; toLose--;
    }
    S.morale = clamp((S.morale||0.6) - 0.1, 0, 1);
    const bits = [];
    if(lostCrops) bits.push(`${lostCrops} bed${lostCrops>1?'s':''} of crops failed`);
    if(lostStock) bits.push(`${lostStock} animal${lostStock>1?'s':''} lost`);
    log(`Left unattended for ${SET('idleMins')} minutes — ${bits.length?bits.join(' and '):'no losses this time'}. Clock paused.`, 'bad');
    toast(bits.length ? `Neglect: ${bits.join(', ')}` : 'Farm paused — you were away', 'bad');
    sfx('error');
    render(); ui();
  }
}

function buildMinimap(){
  const world = document.getElementById('world');
  if(!world || document.getElementById('minimap')) return;
  const d = document.createElement('div');
  d.id = 'minimap';
  d.innerHTML = `<canvas id="mmCanvas" width="150" height="110"></canvas><div id="mmView"></div>`;
  world.appendChild(d);
  const canvas = d.querySelector('canvas');
  const jump = e=>{
    const r = canvas.getBoundingClientRect();
    const fx = (e.clientX - r.left)/r.width, fy = (e.clientY - r.top)/r.height;
    const wx = (FARM.x + fx*FARM.w)*T, wy = (FARM.y + fy*FARM.h)*T;
    const vw = world.clientWidth, vh = world.clientHeight;
    cam.x = vw/2 - wx*cam.z; cam.y = vh/2 - wy*cam.z;
    applyCam(); noteActivity();
  };
  let down=false;
  canvas.addEventListener('pointerdown', e=>{ down=true; jump(e); });
  window.addEventListener('pointermove', e=>{ if(down) jump(e); });
  window.addEventListener('pointerup', ()=> down=false);
}
function paintMinimap(){
  const c = document.getElementById('mmCanvas');
  if(!c || !SET('minimap')) return;
  const g = c.getContext('2d');
  const sx = c.width/(FARM.w*T), sy = c.height/(FARM.h*T);
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle = '#6f9f45'; g.fillRect(0,0,c.width,c.height);
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp], f = footprint(bp, o.rot);
    const col = {plot:'#8a6a4a', perennial:'#4f8a35', animal:'#c9a06a', water:'#4f93b5',
      power:'#26365c', process:'#a98fd6', shop:'#e2603a', tourism:'#dd6f9c', rec:'#efb43c',
      housing:'#c8583f', home:'#c3ccd2', hub:'#6fb6d8'}[bp.kind] || '#9aa88a';
    g.fillStyle = col;
    g.fillRect((o.tx-FARM.x)*T*sx, (o.ty-FARM.y)*T*sy, f.w*T*sx, f.h*T*sy);
  });
  /* where the camera is looking */
  const world = document.getElementById('world');
  const vx = (-cam.x/cam.z - FARM.x*T)*sx, vy = (-cam.y/cam.z - FARM.y*T)*sy;
  const vw = (world.clientWidth/cam.z)*sx, vh = (world.clientHeight/cam.z)*sy;
  g.strokeStyle = '#fff'; g.lineWidth = 1.5;
  g.strokeRect(Math.max(0,vx), Math.max(0,vy), Math.min(vw,c.width), Math.min(vh,c.height));
}

(function navigation(){
  const keys = {};
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=1; e.preventDefault(); }
  });
  window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=0);
  setInterval(()=>{
    if(!S) return;
    const sp = 26;
    let dx=0, dy=0;
    if(keys['arrowleft']) dx += sp;
    if(keys['arrowright']) dx -= sp;
    if(keys['arrowup']) dy += sp;
    if(keys['arrowdown']) dy -= sp;
    if(dx||dy){ cam.x += dx; cam.y += dy; applyCam(); noteActivity(); }
  }, 16);
})();

/* =====================================================================
   LAND RULES — grounded in real published guidance rather than invented
   numbers. Every figure below carries its source, shown in the Rules tab.
   Simplified for a game; not planning or legal advice.
   ===================================================================== */

/* One tile is a tenth of a hectare, so a 21x14 starter block is ~29 ha —
   about the size of a small working farm. */
const HA_PER_TILE = 0.1;
function farmHa(){ return +(FARM.w * FARM.h * HA_PER_TILE).toFixed(1); }
function farmAcres(){ return +(farmHa() * 2.4711).toFixed(1); }

/* ---------------------------------------------------------------
   Dry Sheep Equivalent — the standard Australian unit for comparing
   the feed demand of different stock.
   1 DSE = the feed a 2-year-old ~50 kg Merino wether needs to hold
   weight (7.60 MJ/day).
   Sources: MLA, Wikipedia (see SOURCES below).
   --------------------------------------------------------------- */
const DSE = {
  chicken:0.05,   // poultry are negligible against grazing stock
  duck:0.05,
  rabbit:0.06,
  sheep:1.0,      // the reference animal
  goat:1.0,       // a 50 kg dry goat ~ 1 DSE (MLA goat factsheet)
  hive:0,         // bees do not graze
  pig:2.5,
  horse:8,
  cow:8,          // a yearling steer ~ 8 DSE; a lactating cow up to 25
};
function dseOf(animal){ return DSE[animal] !== undefined ? DSE[animal] : 1; }
function farmDSE(){
  return +S.objs.reduce((a,o)=>{
    const bp = BPMAP[o.bp];
    return a + (bp.animal ? dseOf(bp.animal) * (o.animals||0) : 0);
  }, 0).toFixed(1);
}

/* Carrying capacity in DSE per hectare, by biome.
   Published NSW figures: 1.8–4.7 DSE/ha on natural pasture in the
   Northern Tablelands; 3–6 DSE/ha typical across the Hunter, and about
   8 DSE/ha on beef country under professional pasture management.
   The biome values below sit inside that published range. */
const DSE_PER_HA = {
  valley:6.0, orchard:5.5, river:6.0, lake:5.0, pond:5.0, forest:3.5,
  hill:4.0, coast:4.5, plateau:3.0, moor:2.0, mount:1.8, oasis:1.5,
};
function carryingCapacity(){
  const l = LANDMAP[S.landId];
  const base = (l && DSE_PER_HA[l.biome]) || 4;
  const c = country();
  /* pasture improvement from compost and fodder lifts what the land carries */
  const improved = 1
    + (S.objs.some(o=>o.bp==='compost') ? 0.25 : 0)
    + Math.min(0.4, S.objs.filter(o=>o.bp==='fodder').length * 0.2);
  return Math.round(farmHa() * base * improved * (c.pasture||1));
}
function stockPressure(){
  const cap = carryingCapacity();
  return cap > 0 ? farmDSE()/cap : 0;
}

/* ---------------------------------------------------------------
   Harvestable rights — in NSW's coastal and central inland-draining
   catchments a landholder may capture 10% of the average annual
   rainfall run-off from their land without a water access licence.
   --------------------------------------------------------------- */
const HARVEST_PCT = 0.10;
/* The game's litres are an abstraction — a tank holds 220 of them and
   watering a bed costs 8. So the right is expressed in those same units,
   sized so that three or four tanks is roughly your entitlement. The real
   figure depends on your catchment; the Rules tab links to the calculator
   rather than inventing a number. */
function harvestableRight(){
  const l = LANDMAP[S.landId] || {};
  return Math.round(farmHa() * 25 * (1 + (l.rain||0)) * (country().water||1));
}
function licensedStorage(){
  return S.objs.filter(o=>BPMAP[o.bp].kind==='water')
               .reduce((a,o)=>a + E.wcap(o), 0);
}

/* =====================================================================
   SAVE INTEGRITY — the original save swallowed every error, so a failed
   write (quota, private browsing, a bad value) lost the farm silently.
   It now verifies the write and says so when it cannot.
   ===================================================================== */
(function hardenSave(){
  let lastGoodSave = 0, warned = false;

  G.save = function(loud){
    if(!S) return false;
    let json;
    try { json = JSON.stringify(S); }
    catch(e){
      warnSave('The farm could not be packaged for saving', e.message);
      return false;
    }
    try {
      localStorage.setItem('greenhollow', json);
      /* read it straight back — a write that cannot be re-read is not a save */
      const back = localStorage.getItem('greenhollow');
      if(!back || back.length !== json.length) throw new Error('written data did not read back');
      JSON.parse(back);
      lastGoodSave = Date.now(); warned = false;
      if(loud) toast('Saved','good');
      return true;
    } catch(e){
      /* out of room: drop the log, which is the only expendable part */
      if(String(e.name).includes('Quota') || String(e.message).toLowerCase().includes('quota')){
        try {
          const trimmed = {...S, log: S.log.slice(0,10)};
          localStorage.setItem('greenhollow', JSON.stringify(trimmed));
          lastGoodSave = Date.now();
          if(loud) toast('Saved (log trimmed to fit)','good');
          return true;
        } catch(e2){ /* fall through to the warning */ }
      }
      warnSave('Could not save', e.message);
      return false;
    }
  };

  function warnSave(what, detail){
    console.error('[greenhollow] ' + what + ': ' + detail);
    if(warned) return;
    warned = true;
    const mins = lastGoodSave ? Math.round((Date.now()-lastGoodSave)/60000) : null;
    toast(what + ' — your progress is at risk','bad');
    log(`${what}: ${detail}. ${mins!==null?`Last good save was ${mins} minute${mins===1?'':'s'} ago.`:'Nothing has been saved this session.'} Try Export below.`,'bad');
    sfx('error');
  }

  /* a way out if storage is unavailable: take the save with you */
  G.exportSave = function(){
    try{
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `greenhollow-day${S.day}.json`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast('Save exported','good');
    }catch(e){ toast('Could not export','bad'); }
  };
  G.importSave = function(){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='application/json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const d = JSON.parse(r.result);
          if(!d || d.v !== 5) return toast('That file is from a different version','bad');
          S = d;
          settingsInit(); careerInit(); youInit(); peopleInit();
          if(S.landId && LANDMAP[S.landId]) resizeLand(LANDMAP[S.landId]);
          S.objs.forEach(o=>{ if(o.tier===undefined) o.tier=0; initCare(o);
            if(BPMAP[o.bp].kind==='animal'){ if(!o.herd) o.herd=[]; syncHerd(o); } });
          bgToken=''; applyTheme(); render(); fitView(); ui();
          toast('Farm loaded','good');
        }catch(e){ toast('That file could not be read','bad'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  /* offer them in Settings */
  const _sh = settingsHTML;
  settingsHTML = function(){
    return _sh() + `<div class="card">
      <div class="eyebrow">Your save</div>
      <div class="muted">Kept in this browser. Export a copy before clearing site data,
      or to move the farm to another machine.</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="chip" onclick="G.exportSave()">Export to file</button>
        <button class="chip" onclick="G.importSave()">Import a file</button>
        <button class="chip" onclick="G.save(1)">Save now</button>
      </div></div>`;
  };
})();

function stormLightning(){
  if(S.weather !== 'storm') return;
  if(S.settings && S.settings.particles === false) return;
  lightningStrike();
  /* an unprotected farm can lose an animal — 40% of strikes that find stock */
  if(hasRod()){
    if(Math.random() < 0.3) log('Lightning struck the rod. Everything is fine.','good');
    return;
  }
  const pens = S.objs.filter(o=>BPMAP[o.bp].kind==='animal' && o.animals>0 && BPMAP[o.bp].animal!=='hive');
  if(!pens.length) return;
  if(Math.random() < 0.40){
    const pen = pens[Math.floor(Math.random()*pens.length)];
    pen.animals--; syncHerd(pen);
    S.morale = clamp((S.morale||0.6)-0.06, 0, 1);
    log(`Lightning struck the ${BPMAP[pen.bp].name} — one ${BPMAP[pen.bp].animal} killed. A lightning rod would have stopped it.`,'bad');
    toast(`A ${BPMAP[pen.bp].animal} was killed by lightning`,'bad');
    render(); ui();
  } else {
    log('Lightning came down close to the stock. No losses this time.','bad');
  }
}

/* ---------------------------------------------------------------
   3. THE JITTER — parallax ran on every camera move, writing SVG
      transforms mid-pan. It now rides the animation frame instead.
   --------------------------------------------------------------- */
(function steadyCamera(){
  let pending = false, lastPx = 0, lastPy = 0;
  const realParallax = (typeof parallax==='function') ? parallax : null;
  parallax = function(){
    if(!realParallax || pending) return;
    pending = true;
    requestAnimationFrame(()=>{
      pending = false;
      /* only move the backdrop when the camera has actually moved a bit */
      if(Math.abs(cam.x-lastPx) < 2 && Math.abs(cam.y-lastPy) < 2) return;
      lastPx = cam.x; lastPy = cam.y;
      realParallax();
    });
  };
  /* snap camera values so sub-pixel transforms stop shimmering */
  const _applyCam = applyCam;
  applyCam = function(){
    cam.x = Math.round(cam.x*2)/2;
    cam.y = Math.round(cam.y*2)/2;
    _applyCam();
  };
})();

/* ---------------------------------------------------------------
   6. A PATH BRUSH — hold and drag to lay gravel in any shape
   --------------------------------------------------------------- */
const BRUSH = {on:false, painting:false, laid:0, last:null};
G.pathBrush = function(){
  BRUSH.on = !BRUSH.on;
  if(BRUSH.on) G.cancel();
  document.body.classList.toggle('brushing', BRUSH.on);
  const b = document.getElementById('brushBtn');
  if(b) b.classList.toggle('on', BRUSH.on);
  toast(BRUSH.on ? 'Path brush on — drag to lay gravel' : 'Path brush off', BRUSH.on?'good':'');
  sfx('click');
  ui();
};
let brushRenderQueued = false;
function queueBrushRender(){
  if(brushRenderQueued) return;
  brushRenderQueued = true;
  requestAnimationFrame(()=>{ brushRenderQueued = false; render(); });
}
function layTile(tx, ty){
  const bp = BPMAP.path1;
  if(!bp) return false;
  if(tx<FARM.x || ty<FARM.y || tx>=FARM.x+FARM.w || ty>=FARM.y+FARM.h) return false;
  if(overlaps(tx, ty, {w:1,h:1}, 0)) return false;
  if(S.cash < bp.cost){
    if(BRUSH.painting){ BRUSH.painting = false; toast('Out of cash for gravel','bad'); sfx('error'); }
    return false;
  }
  place('path1', tx, ty, 0);
  BRUSH.laid++;
  return true;
}
/* Walk every tile between the last point and this one, so a fast drag
   leaves an unbroken path instead of dots. */
function paintPathAt(clientX, clientY){
  const t = screenToTile(clientX, clientY);
  const from = BRUSH.last;
  let painted = false;
  if(from && (from.tx !== t.tx || from.ty !== t.ty)){
    const dx = t.tx-from.tx, dy = t.ty-from.ty;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for(let i=1; i<=steps; i++){
      const x = Math.round(from.tx + dx*i/steps);
      const y = Math.round(from.ty + dy*i/steps);
      if(layTile(x, y)) painted = true;
    }
  } else if(!from){

/* ---------------- dispatch ---------------- */
function depot(){
  const h = S.objs.find(o=>o.bp==='ai_hub');
  if(h){ const f=footprint(BPMAP[h.bp],h.rot); return {x:(h.tx+f.w/2)*T, y:(h.ty+f.h/2)*T}; }
  return {x:(FARM.x+FARM.w/2)*T, y:(FARM.y+FARM.h/2)*T};
}
function centreOf(o){
  const f = footprint(BPMAP[o.bp], o.rot);
  return {x:(o.tx+f.w/2)*T, y:(o.ty+f.h/2)*T};
}
function dispatch(kind, targets, opts){
  if(!targets || !targets.length) return;
  if(S.settings && S.settings.aiVisuals === false) return;
  if(FLEET.length >= FLEET_MAX) return;
  const l = fleetLayer(); if(!l) return;
  const d = depot();
  const stops = targets.slice(0, 4).map(centreOf);
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('class','fl');
  g.innerHTML = FLEET_ART[kind]();
  l.appendChild(g);
  FLEET.push({
    kind, el:g, x:d.x, y:d.y, home:d,
    stops, at:0, state:'travel', t:0, dir:1, life:0,
    speed:(opts&&opts.speed) || (kind==='drone'?230:130),
    work:(opts&&opts.work) || 0.7,
    carrying:false,
  });
}

/* ---------------- the loop ---------------- */
function tickFleet(dt){
  if(!FLEET.length) return;
  for(let i=FLEET.length-1; i>=0; i--){
    const a = FLEET[i];
    /* a hard lifetime, so nothing can ever be left circling the farm */
    a.life += dt;
    if(a.life > 25){ retire(a,i); continue; }
    const goal = a.state==='home' ? a.home : a.stops[a.at];
    if(!goal){ retire(a,i); continue; }

    if(a.state==='travel' || a.state==='home'){
      const dx = goal.x-a.x, dy = goal.y-a.y, d = Math.hypot(dx,dy);
      if(d < 4){
        if(a.state==='home'){ retire(a,i); continue; }
        a.state='work'; a.t=0;
        paintAgent(a);
        continue;
      }
      const v = a.speed*dt;
      a.x += dx/d*Math.min(d,v); a.y += dy/d*Math.min(d,v);
      if(Math.abs(dx) > 0.5) a.dir = dx>0 ? 1 : -1;
    } else if(a.state==='work'){
      a.t += dt;
      if(a.t > a.work){
        a.carrying = (a.kind==='drone' || a.kind==='van');
        a.at++;
        a.state = (a.at >= a.stops.length) ? 'home' : 'travel';
        a.t = 0;
      }
    }
    paintAgent(a);
  }
}
function retire(a, i){
  if(a.el){ a.el.classList.add('fl-gone'); const el=a.el; setTimeout(()=>el.remove(), 400); }
  FLEET.splice(i,1);
}
function paintAgent(a){
  if(!a.el) return;
  const lift = a.kind==='drone' ? -18 : 0;
  a.el.setAttribute('transform', `translate(${n(a.x)},${n(a.y+lift)}) scale(${a.dir},1)`);
  a.el.classList.toggle('working', a.state==='work');
  a.el.classList.toggle('carrying', !!a.carrying);
}

/* =====================================================================
   You could pan the camera clean off the world into empty black, which
   reads as the screen vanishing. The camera is now kept so the land is
   always at least partly in view.
   ===================================================================== */
(function clampCamera(){
  const _apply = applyCam;
  applyCam = function(){
    const world = document.getElementById('world');
    if(world && S){
      const vw = world.clientWidth, vh = world.clientHeight;
      const arc = document.getElementById('sunarc');
      const top = (arc && arc.style.display !== 'none') ? arc.getBoundingClientRect().height : 0;
      /* keep at least a third of the property on screen in each axis */
      const px = FARM.x*T*cam.z, py = FARM.y*T*cam.z;
      const pw = FARM.w*T*cam.z, ph = FARM.h*T*cam.z;
      const keepX = Math.min(pw, vw) * 0.34;
      const keepY = Math.min(ph, vh) * 0.34;
      cam.x = clamp(cam.x, keepX - px - pw, vw - px - keepX);
      cam.y = clamp(cam.y, top + keepY - py - ph, vh - py - keepY);
    }
    _apply();
  };
})();

/* =====================================================================
   WEATHER, PROPERLY — the CSS version drew endless parallel lines across
   the whole screen, which reads as scratches. This is a particle system
   on a canvas: discrete drops at three depths, splashes where they land,
   wind-driven angle, gusts, wet ground, drifting snow and heat haze.
   ===================================================================== */

const WX = {
  canvas:null, ctx:null, w:0, h:0, dpr:1,
  drops:[], splashes:[], flakes:[], motes:[], gusts:[],
  kind:'', intensity:0, target:0, angle:0.22, gustT:0, running:false,
};

function wxEnsure(){
  const world = document.getElementById('world');
  if(!world) return false;
  if(!WX.canvas){
    const c = document.createElement('canvas');
    c.id = 'wxcanvas';
    c.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:21;';
    world.appendChild(c);
    WX.canvas = c; WX.ctx = c.getContext('2d');
    /* the old CSS layer is retired */
    const legacy = document.getElementById('wxfx'); if(legacy) legacy.remove();
  }
  /* measure the container, never the canvas itself: reading the canvas's own
     rect after setting its intrinsic size feeds back and inflates it */
  const w = Math.min(4000, Math.max(0, world.clientWidth));
  const h = Math.min(4000, Math.max(0, world.clientHeight));
  if(w < 8 || h < 8) return false;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  if(WX.w !== w || WX.h !== h || WX.dpr !== dpr){
    WX.w = w; WX.h = h; WX.dpr = dpr;
    WX.canvas.width  = Math.round(w*dpr);
    WX.canvas.height = Math.round(h*dpr);
    WX.ctx.setTransform(dpr,0,0,dpr,0,0);
    wxPopulate();
  }
  return true;
}

/* ---------------- particles ---------------- */
function makeDrop(storm){
  /* three depth bands: far drops are short, faint and slow */
  const band = Math.random();
  const depth = band < 0.45 ? 0 : band < 0.8 ? 1 : 2;
  const base = storm ? 1.5 : 1;
  return {
    x: Math.random()*(WX.w+240) - 120,
    y: Math.random()*-WX.h,
    depth,
    len:  (depth===0 ? 5+Math.random()*5 : depth===1 ? 9+Math.random()*8 : 15+Math.random()*13) * base,
    spd:  (depth===0 ? 420 : depth===1 ? 700 : 1050) * base * (0.85+Math.random()*0.3),
    a:    depth===0 ? 0.18+Math.random()*0.12 : depth===1 ? 0.3+Math.random()*0.16 : 0.42+Math.random()*0.22,
    w:    depth===0 ? 0.7 : depth===1 ? 1.0 : 1.5,
  };
}
function makeFlake(){
  return {
    x: Math.random()*(WX.w+120)-60,
    y: Math.random()*-WX.h,
    r: 0.9 + Math.random()*2.2,
    spd: 22 + Math.random()*46,
    drift: (Math.random()-0.5)*22,
    ph: Math.random()*Math.PI*2,
    a: 0.5 + Math.random()*0.5,
  };
}
function makeMote(){
  return {
    x: Math.random()*(WX.w+200)-100,
    y: Math.random()*WX.h,
    r: 14 + Math.random()*48,
    spd: 26 + Math.random()*60,
    a: 0.04 + Math.random()*0.09,
  };
}

function wxPopulate(){
  const storm = WX.kind === 'storm';
  if(WX.kind==='rain' || WX.kind==='storm'){
    const want = Math.min(900, Math.round((storm ? 620 : 330) * (WX.w*WX.h)/(1200*700)));
    while(WX.drops.length < want) WX.drops.push(makeDrop(storm));
    if(WX.drops.length > want) WX.drops.length = want;
  } else WX.drops.length = 0;

  if(WX.kind==='frost'){
    const want = Math.min(200, Math.round(150 * (WX.w*WX.h)/(1200*700)));
    while(WX.flakes.length < want) WX.flakes.push(makeFlake());
    if(WX.flakes.length > want) WX.flakes.length = want;
  } else WX.flakes.length = 0;

  if(WX.kind==='heat'){
    while(WX.motes.length < 26) WX.motes.push(makeMote());
    if(WX.motes.length > 26) WX.motes.length = 26;
  } else WX.motes.length = 0;
}

/* ---------------- the frame ---------------- */
function wxFrame(dt){
  if(!wxEnsure()) return;
  const ctx = WX.ctx;

  /* fade in and out of a weather state rather than snapping */
  WX.intensity += (WX.target - WX.intensity) * Math.min(1, dt*1.4);
  if(WX.intensity < 0.01 && !WX.target){
    if(WX.running){ ctx.clearRect(0,0,WX.w,WX.h); WX.running = false; }
    return;
  }
  WX.running = true;
  ctx.clearRect(0,0,WX.w,WX.h);

  const storm = WX.kind === 'storm';
  /* wind sets the slant; a storm also gusts */
  const wind = (typeof windNow==='function') ? windNow() : 0.5;
  WX.gustT += dt;
  const gust = storm ? Math.sin(WX.gustT*0.7)*0.16 + Math.sin(WX.gustT*2.3)*0.06 : 0;
  const targetAngle = 0.10 + wind*0.16 + gust;
  WX.angle += (targetAngle - WX.angle) * Math.min(1, dt*2);
  const ax = Math.sin(WX.angle), ay = Math.cos(WX.angle);

  if(WX.kind==='rain' || WX.kind==='storm'){
    /* a wet sheen and a slight darkening over the land */
    ctx.fillStyle = storm ? 'rgba(30,44,66,0.20)' : 'rgba(42,62,84,0.10)';
    ctx.globalAlpha = WX.intensity;
    ctx.fillRect(0,0,WX.w,WX.h);
    ctx.globalAlpha = 1;

    ctx.lineCap = 'round';
    for(const d of WX.drops){
      const v = d.spd*dt;
      d.x += ax*v; d.y += ay*v;
      if(d.y > WX.h + 20 || d.x < -140 || d.x > WX.w + 140){
        /* land it: a splash where it hits, then recycle to the top */
        if(d.depth > 0 && d.y > WX.h && WX.splashes.length < 160 && Math.random() < 0.5){
          WX.splashes.push({x:d.x - ax*d.len, y:Math.random()*WX.h, life:0, max:0.20+Math.random()*0.12});
        }
        Object.assign(d, makeDrop(storm));
        d.y = -20 - Math.random()*120;
        continue;
      }
      ctx.globalAlpha = d.a * WX.intensity;
      ctx.strokeStyle = d.depth===2 ? '#dceefb' : d.depth===1 ? '#c9e2f4' : '#b7d6ec';
      ctx.lineWidth = d.w;
      ctx.beginPath();
      ctx.moveTo(d.x, d.y);
      ctx.lineTo(d.x - ax*d.len, d.y - ay*d.len);
      ctx.stroke();
    }

    /* splashes: a small expanding ring where a drop lands */
    for(let i=WX.splashes.length-1; i>=0; i--){
      const s = WX.splashes[i];
      s.life += dt;
      if(s.life > s.max){ WX.splashes.splice(i,1); continue; }
      const t = s.life/s.max;
      const rr = 0.8 + t*3.4;
      ctx.globalAlpha = (1-t)*(1-t) * 0.55 * WX.intensity;
      ctx.strokeStyle = '#eaf6ff';
      ctx.lineWidth = 0.8;
      ctx.beginPath();
      ctx.ellipse(s.x, s.y, rr, rr*0.4, 0, 0, Math.PI*2);
      ctx.stroke();
      /* two micro-droplets kicked up out of the impact */
      if(t < 0.6){
        ctx.globalAlpha = (1-t) * 0.45 * WX.intensity;
        ctx.fillStyle = '#eaf6ff';
        ctx.fillRect(s.x - rr, s.y - rr*1.1, 0.9, 0.9);
        ctx.fillRect(s.x + rr, s.y - rr*0.9, 0.9, 0.9);
      }
    }

    /* a storm throws sheets of rain across the view */
    if(storm){
      if(WX.gusts.length < 3 && Math.random() < dt*1.1)
        WX.gusts.push({x:-WX.w*0.4, y:Math.random()*WX.h*0.5, life:0, spd:WX.w*0.85});
      for(let i=WX.gusts.length-1; i>=0; i--){
        const g = WX.gusts[i];
        g.life += dt; g.x += g.spd*dt;
        if(g.x > WX.w*1.4){ WX.gusts.splice(i,1); continue; }
        const grad = ctx.createLinearGradient(g.x, 0, g.x + WX.w*0.45, 0);
        grad.addColorStop(0,   'rgba(200,226,244,0)');
        grad.addColorStop(0.5, 'rgba(206,230,248,0.16)');
        grad.addColorStop(1,   'rgba(200,226,244,0)');
        ctx.globalAlpha = WX.intensity;
        ctx.fillStyle = grad;
        ctx.fillRect(g.x, 0, WX.w*0.45, WX.h);
      }
    }
  }

  if(WX.kind==='frost'){
    ctx.globalAlpha = WX.intensity*0.14;
    ctx.fillStyle = '#cfe0ea'; ctx.fillRect(0,0,WX.w,WX.h);
    for(const f of WX.flakes){
      f.ph += dt*1.6;
      f.y += f.spd*dt;
      f.x += (Math.sin(f.ph)*f.drift + wind*14)*dt;
      if(f.y > WX.h+8){ Object.assign(f, makeFlake()); f.y = -8; }
      ctx.globalAlpha = f.a * WX.intensity;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
  }

  if(WX.kind==='heat'){
    for(const m of WX.motes){
      m.x += m.spd*dt;
      if(m.x - m.r > WX.w){ Object.assign(m, makeMote()); m.x = -m.r*2; }
      ctx.globalAlpha = m.a * WX.intensity;
      ctx.fillStyle = '#d8c9a0';
      ctx.beginPath();
      ctx.ellipse(m.x, m.y, m.r*2.4, m.r*0.5, 0, 0, Math.PI*2);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;
}

/* ---------------- state ---------------- */
syncWeatherFx = function(){
  if(!wxEnsure()) return;
  const on = (!S.settings || S.settings.particles !== false);
  const land = LANDMAP[S.landId] || {};
  const w = S.weather;
  let kind = '';
  if(on){
    if(w==='storm') kind='storm';
    else if(w==='rain') kind='rain';
    else if(w==='frost') kind='frost';
    else if(w==='heat' || (land.dust && w==='sun')) kind='heat';
  }
  if(kind !== WX.kind){
    WX.kind = kind;
    WX.splashes.length = 0; WX.gusts.length = 0;
    wxPopulate();
  }
  WX.target = kind ? 1 : 0;
};

/* ride the existing animation frame */
(function weatherFrame(){
  let last = performance.now();
  (function step(now){
    requestAnimationFrame(step);
    const dt = Math.min(0.05, (now-last)/1000); last = now;
    if(!S) return;
    if(document.hidden) return;
    wxFrame(dt);
  })(performance.now());
  window.addEventListener('resize', ()=>{ wxEnsure(); wxPopulate(); });
  setTimeout(()=>{ syncWeatherFx(); }, 200);
})();

/* ---------------- lightning, lit properly ---------------- */
lightningStrike = function(){
  const world = document.getElementById('world');
  if(!world) return;
  let flash = document.getElementById('wxflash');
  if(!flash){ flash = document.createElement('div'); flash.id='wxflash'; world.appendChild(flash); }
  let bolt = document.getElementById('wxbolt');
  if(!bolt){ bolt = document.createElement('div'); bolt.id='wxbolt'; world.appendChild(bolt); }

  const W = world.clientWidth, H = world.clientHeight;
  const startX = 80 + Math.random()*(W-160);
  const endY = H*(0.5 + Math.random()*0.3);

  /* a main channel that forks, rather than one zigzag */
  function channel(x, y, toY, spread, step){
    let d = `M${x.toFixed(0)} ${y.toFixed(0)}`;
    const pts = [[x,y]];
    while(y < toY){
      y += step*(0.7+Math.random()*0.6);
      x += (Math.random()-0.5)*spread;
      d += ` L${x.toFixed(0)} ${y.toFixed(0)}`;
      pts.push([x,y]);
    }
    return {d, pts};
  }
  const main = channel(startX, 0, endY, 46, 26);
  let forks = '';
  main.pts.forEach((p,i)=>{
    if(i>2 && i<main.pts.length-1 && Math.random()<0.30){
      const f = channel(p[0], p[1], p[1] + 40 + Math.random()*90, 34, 20);
      forks += `<path d="${f.d}" stroke="#cfe4ff" stroke-width="1.2" fill="none" opacity=".75"/>`;
    }
  });
  bolt.innerHTML = `<svg width="100%" height="100%" style="display:block">
    <path d="${main.d}" stroke="#9fd0ff" stroke-width="7" fill="none" opacity=".35"
      style="filter:blur(4px)"/>
    <path d="${main.d}" stroke="#eaf3ff" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <path d="${main.d}" stroke="#ffffff" stroke-width="1.3" fill="none" stroke-linejoin="round"/>
    ${forks}</svg>`;

  flash.classList.remove('strike'); bolt.classList.remove('strike');
  void flash.offsetWidth;
  flash.classList.add('strike'); bolt.classList.add('strike');
  if(typeof SND!=='undefined'){
    /* thunder arrives after the flash, farther away means longer and softer */
    /* 0 is overhead, 1 is across the valley. The delay and the sound are
       driven by the same number, so a long wait always means a soft roll. */
    const dist = Math.random();
    setTimeout(()=>SND.play('thunder', dist), 90 + dist*1900);
  }
  setTimeout(()=>{ bolt.innerHTML=''; }, 1300);
};

   answering "no" removes the whole career system rather than leaving a

   plenty of people change their mind three hours in.

   Going off-grid is genuinely harder: no salary lands each month, but
