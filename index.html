/* =====================================================================
   YOUR OWN DAY, AND A ROOM TO WORK IN

   The family had a timetable; you did not. S.you only ever held idle,
   walk and work, and all three were driven by clicking something — so
   while the partner went to bed you stood in the paddock all night.

   Now you keep the same hours they do: bed at night beside your
   partner, breakfast in the kitchen, dinner with everyone, indoors in a
   storm. It only takes over when you are idle, so the moment you click
   a job it hands control straight back.

   And since the career is done from home, the house now has a study —
   desk, monitor, chair, the lot — and billable work actually happens
   in it.
   ===================================================================== */

/* ---------- carve a study out of the top-right of the plan ---------- */
ROOMS.living.w = 0.29;                       // was 0.51, ending at 0.97
ROOMS.study    = {x:0.77, y:0.05, w:0.20, h:0.34};

/* the study's furniture, drawn over the base interior */
function studyArt(w, h){
  const r = ROOMS.study;
  const S0 = {x:r.x*w, y:r.y*h, w:r.w*w, h:r.h*h};

  s += `<line x1="${n(w*0.755)}" y1="2" x2="${n(w*0.755)}" y2="${n(h*0.40)}"
    stroke="#f1e8d9" stroke-width="2.6" stroke-linecap="round"/>`;
  /* desk against the outer wall, with its shadow */
  const dx = S0.x + S0.w*0.10, dy = S0.y + S0.h*0.16, dw = S0.w*0.80, dh = S0.h*0.26;
  s += `<rect x="${n(dx+1)}" y="${n(dy+1.4)}" width="${n(dw)}" height="${n(dh)}" rx="1.6" fill="#000" opacity=".16"/>`;
  s += `<rect x="${n(dx)}" y="${n(dy)}" width="${n(dw)}" height="${n(dh)}" rx="1.6" fill="#a9764a"/>`;
  s += `<rect x="${n(dx)}" y="${n(dy)}" width="${n(dw)}" height="${n(dh*0.30)}" rx="1.6" fill="#c08f5c"/>`;
  /* monitor, seen from above: a thin bright slab on a stand */
  s += `<rect x="${n(dx+dw*0.18)}" y="${n(dy+dh*0.14)}" width="${n(dw*0.64)}" height="${n(dh*0.22)}" rx="0.8" fill="#2f3a45"/>`;
  s += `<rect x="${n(dx+dw*0.20)}" y="${n(dy+dh*0.17)}" width="${n(dw*0.60)}" height="${n(dh*0.15)}" rx="0.6"
    fill="#6fb6d8" class="studyScreen"/>`;
  s += `<rect x="${n(dx+dw*0.44)}" y="${n(dy+dh*0.38)}" width="${n(dw*0.12)}" height="${n(dh*0.14)}" fill="#3f4a52"/>`;
  /* keyboard and mug */
  s += `<rect x="${n(dx+dw*0.24)}" y="${n(dy+dh*0.60)}" width="${n(dw*0.52)}" height="${n(dh*0.20)}" rx="1" fill="#cbd3d8"/>`;

  s += `<circle cx="${n(dx+dw*0.90)}" cy="${n(dy+dh*0.70)}" r="${n(dh*0.07)}" fill="#6b4f36"/>`;
  /* chair */
  s += `<ellipse cx="${n(S0.x+S0.w*0.50)}" cy="${n(dy+dh*1.5)}" rx="${n(S0.w*0.17)}" ry="${n(S0.h*0.09)}" fill="#4d5a63"/>`;
  s += `<ellipse cx="${n(S0.x+S0.w*0.50)}" cy="${n(dy+dh*1.44)}" rx="${n(S0.w*0.12)}" ry="${n(S0.h*0.06)}" fill="#63727d"/>`;
  /* shelf of files, and a plant for the corner */

  for(let i=0;i<5;i++)
    s += `<rect x="${n(S0.x+S0.w*(0.10+i*0.088))}" y="${n(S0.y+S0.h*0.775)}" width="${n(S0.w*0.055)}" height="${n(S0.h*0.09)}"

  s += `<circle cx="${n(S0.x+S0.w*0.80)}" cy="${n(S0.y+S0.h*0.84)}" r="${n(S0.h*0.09)}" fill="#7a5a3c"/>`;
  s += `<circle cx="${n(S0.x+S0.w*0.80)}" cy="${n(S0.y+S0.h*0.80)}" r="${n(S0.h*0.10)}" fill="#5f9a3c"/>`;

const _interiorBase = interiorArt;
interiorArt = function(w, h){ return _interiorBase(w, h) + studyArt(w, h); };

/* ---------- your own timetable ---------- */
/* Mirrors the family's hours so the household moves together. Returns a
   target and a label, or null when you should be left alone. */
function youRoutine(){
  const H = (typeof houseRect === 'function') ? houseRect() : null;
  if(!H) return null;
  const f = dayFrac();
  const storm = S.weather === 'storm';
  const at = (room, fx, fy, act, state) => {
    const r = ROOMS[room];
    return { x: H.x + (r.x + r.w*(fx||0.5))*H.w,
             y: H.y + (r.y + r.h*(fy||0.5))*H.h, act, state: state || 'idle' };
  };

  /* asleep, on your side of the bed */
  if(f < 0.24 || f > 0.90) return at('bedMain', 0.68, 0.42, 'asleep', 'sleep');

  if(f < 0.30) return at('kitchen', 0.55, 0.62, 'having breakfast');

  /* billable work happens at the desk, and only if there is work to do */
  if(typeof wfhOn === 'function' && wfhOn() && f > 0.34 && f < 0.52){
    const left = (typeof hoursLeft === 'function') ? hoursLeft() : 0;
    if(left > 1) return at('study', 0.5, 0.55, 'at the desk', 'desk');
  }

  if(f > 0.78 && f < 0.84) return at('living', 0.5, 0.5, 'having dinner');
  if(f > 0.84)             return at('living', 0.35, 0.6, 'sitting by the fire');

  if(storm) return at('living', 0.65, 0.4, 'waiting out the storm');

  return null;      /* the rest of the day is yours */
}

/* Autopilot only drives when you are idle and have queued nothing, so any
   click you make takes the wheel back immediately. */
let youAuto = null;
function tickYouLife(dt){
  youInit();
  const y = S.you;
  if(y.job || y.state === 'walk' || y.state === 'work'){ youAuto = null; return; }

  const goal = youRoutine();
  if(!goal){ if(y.state === 'sleep' || y.state === 'desk') y.state = 'idle'; youAuto = null; return; }

  const d = Math.hypot(goal.x - y.x, goal.y - y.y);
  if(d > 6){
    const spd = 150 * dt;
    y.x += (goal.x - y.x)/d * Math.min(d, spd);
    y.y += (goal.y - y.y)/d * Math.min(d, spd);
    if(Math.abs(goal.x - y.x) > 0.5) y.dir = goal.x > y.x ? 1 : -1;
    y.state = 'auto';
  } else {
    y.state = goal.state;
  }
  /* narrate it once per change, same as the family */
  if(youAuto !== goal.act){
    youAuto = goal.act;
    if(typeof log === 'function'){
      const line = goal.act === 'asleep' ? 'You turned in for the night.'
                 : goal.act === 'at the desk' ? 'You sat down at the desk to work.'
                 : 'You were ' + goal.act + '.';
      log(line, '', 'home');
    }
  }
  if(typeof paintYou === 'function') paintYou();
}

const _tickYouBase = tickYou;
tickYou = function(dt){

  return r;
};

/* asleep and at-the-desk need to look different from standing about */
const _paintYouBase = paintYou;
paintYou = function(){
  const r = _paintYouBase.apply(this, arguments);
  const el = document.getElementById('you');
  if(!el) return r;
  const st = S.you && S.you.state;
  el.classList.toggle('you-sleep', st === 'sleep');
  el.classList.toggle('you-desk',  st === 'desk');
  /* one small z above your head while you sleep */
  let z = el.querySelector('.zzz');
  if(st === 'sleep' && !z){
    z = document.createElementNS('http://www.w3.org/2000/svg','text');
    z.setAttribute('class','zzz'); z.setAttribute('y','-22');
    z.setAttribute('text-anchor','middle'); z.setAttribute('font-size','10');
    z.setAttribute('fill','#cfe0ea'); z.textContent = 'z';
    el.appendChild(z);
  } else if(st !== 'sleep' && z){ z.remove(); }
  return r;
};

/* taking a client job should walk you to the desk, not teleport the money */
if(typeof takeJob === 'function'){

  takeJob = function(id){

/* =====================================================================
   UPGRADES THAT SUIT WHAT THE THING ACTUALLY IS

   Grouping objects into families got the buildings right and everything
   else wrong. A glamping tent, a fire circle, a playground and a car
   park were all "pavilions", so all four sprouted a shade sail and a
   green roof. A hedge got a concrete apron. Trees got bird netting.

   These are the per-object versions. Each asks what a real owner would
   actually add to that thing, in the order they would add it.
   ===================================================================== */

/* ---------- shared bits used by several of these ---------- */

/* festoon lights strung between two points, bulbs hanging off a catenary */
function festoon(x1, y1, x2, y2, bulbs, seed){
  const sag = Math.max(4, Math.hypot(x2-x1, y2-y1)*0.14);
  const mx = (x1+x2)/2, my = (y1+y2)/2 + sag;
  let s = `<path d="M${n(x1)} ${n(y1)} Q${n(mx)} ${n(my)} ${n(x2)} ${n(y2)}"
    stroke="#5c5546" stroke-width="0.7" fill="none" opacity=".9"/>`;
  const N = bulbs || 6;
  for(let i=1;i<N;i++){
    const t = i/N, it = 1-t;
    /* point on the quadratic, then a short drop to the bulb */
    const bx = it*it*x1 + 2*it*t*mx + t*t*x2;
    const by = it*it*y1 + 2*it*t*my + t*t*y2;
    s += `<line x1="${n(bx)}" y1="${n(by)}" x2="${n(bx)}" y2="${n(by+1.6)}" stroke="#5c5546" stroke-width="0.5"/>`;
    s += `<circle class="fx-bulb" cx="${n(bx)}" cy="${n(by+2.4)}" r="1.35" fill="#ffe9a8"
      style="animation-delay:-${((hash(i*3.1+(seed||0))*2.4)).toFixed(2)}s"/>`;
  }
  return s;
}

/* a timber deck with boards running the long way */
function deckBoards(x, y, w, h, seed){
  let s = `<rect x="${n(x+1)}" y="${n(y+1.4)}" width="${n(w)}" height="${n(h)}" rx="2" fill="#16240c" opacity=".2"/>`;
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="2" fill="#b9884f"/>`;
  const rows = Math.max(3, Math.round(h/4));
  for(let i=0;i<rows;i++){
    s += `<rect x="${n(x)}" y="${n(y + h*i/rows)}" width="${n(w)}" height="${n(h/rows)}"
      fill="${i%2 ? '#c0904f' : '#b07f47'}"/>`;
    s += `<line x1="${n(x)}" y1="${n(y + h*i/rows)}" x2="${n(x+w)}" y2="${n(y + h*i/rows)}"
      stroke="#8e6435" stroke-width="0.5" opacity=".7"/>`;
  }
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="2"
    fill="none" stroke="#8e6435" stroke-width="0.7" opacity=".8"/>`;
  return s;
}

/* a hot tub: cedar surround, steaming water, a couple of jets */
function spaTub(cx, cy, r){
  let s = `<ellipse cx="${n(cx+r*0.2)}" cy="${n(cy+r*0.28)}" rx="${n(r*1.05)}" ry="${n(r*0.95)}" fill="#16240c" opacity=".24"/>`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" fill="#8a6440"/>`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.88)}" fill="#a37b4f"/>`;
  /* cedar staves round the rim */
  for(let i=0;i<12;i++){
    const a = (i/12)*Math.PI*2;
    s += `<line x1="${n(cx+Math.cos(a)*r*0.88)}" y1="${n(cy+Math.sin(a)*r*0.88)}"
      x2="${n(cx+Math.cos(a)*r)}" y2="${n(cy+Math.sin(a)*r)}"
      stroke="#7a5836" stroke-width="0.6" opacity=".8"/>`;
  }
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.74)}" fill="#3f8fb0"/>`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.74)}" fill="url(#gWater)" opacity=".85"/>`;
  s += `<ellipse cx="${n(cx-r*0.24)}" cy="${n(cy-r*0.26)}" rx="${n(r*0.3)}" ry="${n(r*0.16)}" fill="#fff" opacity=".34"/>`;
  /* steam curling off it */
  for(let i=0;i<3;i++)
    s += `<circle class="fx-steam" cx="${n(cx - r*0.3 + i*r*0.3)}" cy="${n(cy - r*0.2)}"
      r="${(r*0.24 + i*0.5).toFixed(1)}" fill="#ffffff" opacity=".22"
      style="animation-delay:-${(i*1.3).toFixed(1)}s"/>`;
  return s;
}

    s += `<circle cx="${n(w*0.18)}" cy="${n(h*0.81)}" r="${n(Math.min(w,h)*0.055)}" fill="#4a4238"/>`;

    s += `<rect x="${n(w*0.14)}" y="${n(h*0.62)}" width="${n(w*0.72)}" height="${n(h*0.03)}" rx="1.6" fill="#c49a63"/>`;
    [[0.30,0.84],[0.68,0.84]].forEach(p=>{
      s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="${n(h*0.07)}" fill="#c9b48c"/>`;
      s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="${n(h*0.045)}" fill="#e0d4b4"/>`;
    });
  }
  if(t >= 2){
    /* striped awning over the counter */
    s += `<rect x="${n(w*0.10)}" y="${n(h*0.46)}" width="${n(w*0.80)}" height="${n(h*0.16)}" rx="2" fill="#e8e2d2"/>`;
    for(let i=0;i<6;i++)
      s += `<rect x="${n(w*(0.10+i*0.133))}" y="${n(h*0.46)}" width="${n(w*0.066)}" height="${n(h*0.16)}"
        fill="#c65f4a" opacity=".75"/>`;
    s += `<rect x="${n(w*0.10)}" y="${n(h*0.60)}" width="${n(w*0.80)}" height="${n(h*0.02)}" fill="#000" opacity=".18"/>`;
  }
  if(t >= 3){
    s += festoon(w*0.08, h*0.40, w*0.92, h*0.40, 6, seed);
    s += planter(w*0.06, h*0.94, w*0.36, h*0.05, seed);
    s += planter(w*0.58, h*0.94, w*0.36, h*0.05, seed+2);
  }
  return s;
};

/* ---------- the decorative infrastructure ---------- */
/* A hedge does not get a concrete apron. These just get better at being
   what they already are. */
ARCH_SPECIAL.hedge = function(w, h, t, seed){

ARCH_SPECIAL.fence = function(w, h, t, seed){

ARCH_SPECIAL.gate = function(w, h, t, seed){

  if(t >= 2){

/* ---------- trees grow, they do not get netted ---------- */
['tree_native','tree_shade','tree_olive'].forEach(k=>{
  ARCH_SPECIAL[k] = function(w, h, t, seed){
    let s = '';
    const cx = w*0.5, cy = h*0.5, R = Math.min(w,h)*0.5;
    /* Mk II - mulch ring and a stake, the way a young tree is actually kept */
    if(t >= 1){
      s += `<circle cx="${n(cx)}" cy="${n(cy+R*0.55)}" r="${n(R*0.42)}" fill="#6b5642" opacity=".45"/>`;
      s += `<rect x="${n(cx+R*0.30)}" y="${n(cy+R*0.10)}" width="${n(R*0.05)}" height="${n(R*0.55)}" rx="0.6" fill="#9c7a52"/>`;
    }
    /* Mk III - a ring seat at the base. Kept small and low: from above the
       canopy hides most of it, and a big hoop reads as a ring over the
       crown rather than a bench under it. */
    if(t >= 2){
      s += `<circle cx="${n(cx)}" cy="${n(cy+R*0.74)}" r="${n(R*0.22)}" fill="none"
        stroke="#a98255" stroke-width="${n(R*0.055)}" opacity=".92"/>`;
      s += `<circle cx="${n(cx)}" cy="${n(cy+R*0.74)}" r="${n(R*0.22)}" fill="none"
        stroke="#c49a63" stroke-width="${n(R*0.018)}" opacity=".9"/>`;
    }
    /* Mk IV - lights up through the canopy, and a swing on one bough */
    if(t >= 3){
      for(let i=0;i<7;i++){
        const a = (i/7)*Math.PI*2 + seed;
        s += `<circle class="fx-bulb" cx="${n(cx+Math.cos(a)*R*0.55)}" cy="${n(cy+Math.sin(a)*R*0.45)}"
          r="1.4" fill="#ffe9a8" style="animation-delay:-${(i*0.35).toFixed(2)}s"/>`;
      }
      /* a couple of fallen fruit or leaves at the base, rather than a swing:
         from directly above a swing is one ambiguous line */
      s += `<circle cx="${n(cx-R*0.42)}" cy="${n(cy+R*0.80)}" r="${n(R*0.045)}" fill="#c07a3c" opacity=".8"/>`;
      s += `<circle cx="${n(cx+R*0.36)}" cy="${n(cy+R*0.86)}" r="${n(R*0.04)}" fill="#c07a3c" opacity=".7"/>`;
    }
    return s;
  };
});

/* =====================================================================
   A JOB YOU HAVE TO SIT THROUGH, PANELS THAT GET OUT OF THE WAY,
   A DONATE BUTTON, AND A DOME WORTH UPGRADING

   Accepting a client job used to pay instantly: click, money, carry on
   farming. That is not work. A job now holds you at the desk for its
   full hours, blocks farm jobs while it runs, and only pays when it is
   finished — which is what makes the hours you spend on it a real
   trade against the hours the land needs.
   ===================================================================== */

/* ---------- 1. a job is a commitment ---------- */

/* in-game hours tick with the clock, so game speed and day length apply */
function busyNow(){ return S.career && S.career.busy; }

const _takeJobCommit = takeJob;
takeJob = function(id){
  careerInit();
  if(busyNow()){
    toast('You are already on a job — finish it first','bad');
    if(typeof sfx === 'function') sfx('error');
    return;
  }
  const j = S.career.jobs.find(z=>z.id===id);
  if(!j) return;
  if(S.career.hours < j.hrs){
    toast(`Only ${S.career.hours.toFixed(1)}h left today`,'bad');
    if(typeof sfx === 'function') sfx('error');
    return;
  }
  /* take it off the board and start the clock. Nothing is paid yet. */
  S.career.busy = {id:j.id, kind:j.kind, who:j.who, pay:j.pay, hrs:j.hrs, left:j.hrs};
  S.career.jobs = S.career.jobs.filter(z=>z.id!==id);

  /* sit down at the desk */
  const H = (typeof houseRect === 'function') ? houseRect() : null;
  if(H && S.you && ROOMS.study){
    const r = ROOMS.study;
    S.you.x = H.x + (r.x + r.w*0.5)*H.w;
    S.you.y = H.y + (r.y + r.h*0.55)*H.h;
    S.you.state = 'desk'; S.you.path = []; S.you.job = null;
    if(typeof paintYou === 'function') paintYou();
  }
  log(`Started ${j.kind} for ${j.who} — ${j.hrs}h at the desk.`, '', 'money');
  toast(`On the clock: ${j.kind} (${j.hrs}h)`, 'good');
  if(typeof sfx === 'function') sfx('click');
  paintBusy();                     /* show the bar immediately, not on the next tick */
  ui(); G.save();
};

/* burn the hours down, then pay */
let busyAcc = 0;
function tickBusy(dtms){
  const b = busyNow();
  if(!b) return;
  /* DAY_MS of real time is 24 in-game hours */
  const dayMs = (typeof DAY_MS_OVERRIDE === 'number' && DAY_MS_OVERRIDE) ? DAY_MS_OVERRIDE
              : (typeof DAY_MS === 'number' ? DAY_MS : 45000);
  b.left -= (dtms / dayMs) * 24;

  if(S.you && S.you.state !== 'desk' && !S.you.job){
    S.you.state = 'desk';
  }
  if(b.left <= 0){
    S.career.hours = Math.max(0, S.career.hours - b.hrs);
    S.career.worked += b.hrs;
    S.cash += b.pay; S.totalEarned += b.pay;
    S.career.cxp += Math.round(b.hrs*9);
    while(S.career.cxp >= skillNext() && S.career.skill < prof().ceil){
      S.career.cxp -= skillNext(); S.career.skill++;
      toast(`${prof().name} — skill level ${S.career.skill}`,'gold');
      if(typeof sfx==='function') sfx('level');
    }
    log(`Delivered ${b.kind} for ${b.who} — ${fmt(b.pay)}.`, 'gold', 'money');
    toast(`Paid ${fmt(b.pay)}`, 'gold');
    if(typeof sfx==='function') sfx('coin');
    S.career.busy = null;
    S.you.state = 'idle';
    if(typeof rollJobs==='function') rollJobs();
    ui(); G.save();
  }
  paintBusy();
}

/* a bar so you can see how long is left */
function paintBusy(){
  const b = busyNow();
  let el = document.getElementById('busybar');
  if(!b){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'busybar';
    el.innerHTML = `<div class="bb-in"><b></b><span></span><i></i></div>`;
    document.body.appendChild(el);
  }
  const pct = Math.max(0, Math.min(1, 1 - b.left/b.hrs));
  el.querySelector('b').textContent = `${b.kind} — ${b.who}`;
  el.querySelector('span').textContent = `${b.left.toFixed(1)}h left · ${fmt(b.pay)} on delivery`;
  el.querySelector('i').style.transform = `scaleX(${pct.toFixed(3)})`;
}

/* farm jobs are refused while you are on the clock */
const _goDoBusy = goDo;
goDo = function(obj, kind, fn){
  if(busyNow()){
    toast('You are at the desk until this job is done','bad');
    if(typeof sfx==='function') sfx('error');
    return;
  }
  return _goDoBusy.apply(this, arguments);
};

/* the autopilot must not walk you off mid-job either */
const _youRoutineBusy = (typeof youRoutine === 'function') ? youRoutine : null;
if(_youRoutineBusy){
  youRoutine = function(){
    if(busyNow()){
      const H = houseRect();
      if(H && ROOMS.study){
        const r = ROOMS.study;
        return { x: H.x + (r.x + r.w*0.5)*H.w,
                 y: H.y + (r.y + r.h*0.55)*H.h, act:'at the desk', state:'desk' };
      }
    }
    return _youRoutineBusy.apply(this, arguments);
  };
}

/* drive it from the same ticker the avatar uses */
let busyLast = performance.now();
setInterval(()=>{
  const now = performance.now();
  const dt = now - busyLast; busyLast = now;
  if(S && S.speed !== 0 && !document.hidden) tickBusy(dt * (S.speed || 1));
}, 250);

/* ---------- 2. panels that fold away ---------- */
function togglePanel(side){
  const el = document.getElementById(side);
  if(!el) return;
  const now = !el.classList.contains('folded');
  el.classList.toggle('folded', now);
  const stage = document.getElementById('stage');
  if(stage) stage.classList.toggle('fold-' + side, now);
  settingsInit();
  S.settings['fold_' + side] = now;
  G.save();
  if(typeof sfx === 'function') sfx('click');
  /* the stage changed width, so the camera clamp needs to re-run */
  setTimeout(()=>{ if(typeof applyCam === 'function') applyCam(); }, 260);
}
G.togglePanel = togglePanel;

setTimeout(()=>{
  ['left','right'].forEach(side=>{
    const el = document.getElementById(side);
    if(!el || el.querySelector('.foldbtn')) return;
    const b = document.createElement('button');
    b.className = 'foldbtn foldbtn-' + side;
    b.type = 'button';
    b.title = (side === 'left' ? 'Hide the build panel' : 'Hide the info panel');
    b.setAttribute('aria-label', b.title);
    b.textContent = side === 'left' ? '‹' : '›';
    b.addEventListener('click', e=>{ e.stopPropagation(); togglePanel(side); });
    el.appendChild(b);
    if(SET('fold_' + side)){
      el.classList.add('folded');
      const stage = document.getElementById('stage');
      if(stage) stage.classList.add('fold-' + side);
    }
  });
}, 500);

/* ---------- 3. donate ---------- */

/* ---------- 4. the dome, properly ---------- */
/* A geodesic dome is a retreat, so it earns a sauna, a deck of flowers
   and light — not a lattice and a shade sail. */
ARCH_SPECIAL.dome = function(w, h, t, seed){
  let s = '';
  const cx = w*0.5, cy = h*0.46, R = Math.min(w,h)*0.34;
  if(t >= 1){
    /* the triangulated skin that makes it read as geodesic at all */
    for(let ring=1; ring<=2; ring++){
      const rr = R*(ring===1 ? 0.52 : 0.86);
      s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rr)}" fill="none"
        stroke="#e8eef1" stroke-width="0.7" opacity=".55"/>`;
    }
    for(let i=0;i<8;i++){
      const a=(i/8)*Math.PI*2;
      s += `<line x1="${n(cx+Math.cos(a)*R*0.20)}" y1="${n(cy+Math.sin(a)*R*0.20)}"
        x2="${n(cx+Math.cos(a)*R*0.86)}" y2="${n(cy+Math.sin(a)*R*0.86)}"
        stroke="#e8eef1" stroke-width="0.7" opacity=".55"/>`;
    }
    /* deck wrapping the front of the dome */
    s += deckBoards(w*0.06, h*0.76, w*0.88, h*0.19, seed);
  }
  if(t >= 2){
    /* a barrel sauna alongside, and lights over the deck */
    /* sat down beside the dome rather than across its outline */
    const sx = w*0.03, sy = h*0.57, sw = w*0.23, sh = h*0.17;
    s += `<rect x="${n(sx+1)}" y="${n(sy+1.4)}" width="${n(sw)}" height="${n(sh)}" rx="${n(sh/2)}" fill="#16240c" opacity=".22"/>`;
    s += `<rect x="${n(sx)}" y="${n(sy)}" width="${n(sw)}" height="${n(sh)}" rx="${n(sh/2)}" fill="#a3763f"/>`;
    for(let i=1;i<6;i++)
      s += `<line x1="${n(sx+sw*i/6)}" y1="${n(sy+1)}" x2="${n(sx+sw*i/6)}" y2="${n(sy+sh-1)}"
        stroke="#8a6134" stroke-width="0.6" opacity=".8"/>`;
    s += `<circle cx="${n(sx+sw*0.86)}" cy="${n(sy+sh*0.5)}" r="${n(sh*0.22)}" fill="#5c4a33"/>`;
    /* the flue, with heat coming off it */
    s += `<rect x="${n(sx+sw*0.20)}" y="${n(sy-h*0.06)}" width="${n(w*0.022)}" height="${n(h*0.07)}" rx="1" fill="#8d959a"/>`;
    for(let i=0;i<2;i++)
      s += `<circle class="fx-steam" cx="${n(sx+sw*0.21)}" cy="${n(sy-h*0.07)}" r="${(2.2+i).toFixed(1)}"
        fill="#ffffff" opacity=".2" style="animation-delay:-${(i*1.6).toFixed(1)}s"/>`;
    s += festoon(w*0.06, h*0.74, w*0.94, h*0.74, 7, seed);
  }
  if(t >= 3){
    /* a glazed oculus, a second light run, and flower beds along the deck */
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(R*0.20)}" fill="url(#gGlass)" opacity=".92"
      stroke="#cfd9de" stroke-width="0.8"/>`;
    s += festoon(w*0.10, h*0.06, w*0.90, h*0.12, 6, seed+3);
    /* colourful planting rather than the usual green */
    const cols = ['#e05c7a','#f0a24b','#f5d94e','#a86fd0','#e8607f','#f2b33d'];
    for(let i=0;i<10;i++){
      const fx = w*(0.09 + i*0.086), fy = h*(0.965 + (i%2)*0.014);
      s += `<circle cx="${n(fx)}" cy="${n(fy)}" r="2.1" fill="${cols[i%cols.length]}"/>`;
      s += `<circle cx="${n(fx)}" cy="${n(fy)}" r="0.8" fill="#fdf3c8"/>`;
    }
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.945)}" width="${n(w*0.88)}" height="${n(h*0.045)}" rx="1.4"
      fill="#5f7a3c" opacity=".55"/>`;
  }
  return s;
};

  .foldbtn:hover{background:rgba(255,255,255,.16);}
  .foldbtn-left{right:6px;} .foldbtn-right{left:6px;}
  /* when folded the button itself is hidden with the panel, so a fixed
     handle brings it back */
  .unfold{position:fixed;top:56px;z-index:61;width:22px;height:30px;border-radius:7px;
    background:rgba(20,28,18,.92);border:1px solid #3d4a33;color:#c6d1ba;
    font-size:13px;cursor:pointer;padding:0;}
  .unfold-left{left:0;border-left:none;border-radius:0 7px 7px 0;}
  .unfold-right{right:0;border-right:none;border-radius:7px 0 0 7px;}
  .tbtn.donate{color:#ffc7d4;border-color:#7a4a58;}
  .tbtn.donate:hover{background:rgba(255,120,150,.16);}
  `;
  document.head.appendChild(s);
})();

/* a handle to bring a folded panel back */
setTimeout(()=>{
  ['left','right'].forEach(side=>{
    if(document.querySelector('.unfold-' + side)) return;
    const u = document.createElement('button');
    u.className = 'unfold unfold-' + side;
    u.type = 'button';
    u.textContent = side === 'left' ? '›' : '‹';
    u.title = 'Show the panel';
    u.style.display = 'none';
    u.addEventListener('click', ()=>togglePanel(side));
    document.body.appendChild(u);
  });
  /* keep the handles in step with the panels */
  setInterval(()=>{
    ['left','right'].forEach(side=>{
      const el = document.getElementById(side);
      const u = document.querySelector('.unfold-' + side);
      if(el && u) u.style.display = el.classList.contains('folded') ? 'block' : 'none';
    });
  }, 600);
}, 540);

/* =====================================================================
   THE FARMERS MARKET

   Five days, twice a season. The game lays out a market ground on
   whatever open land it can find, fills it with stalls and bunting,
   and the valley turns up.

   Three things happen there. You can enter produce and animals for
   judging, which is scored off what you have actually grown rather
   than a dice roll. You can play the sideshow games. And you can put
   money into the relief fund for farmers who have had a bad year.

   Doing well earns standing, and standing is worth money: a farm the
   valley rates gets more for everything it sells, for good.
   ===================================================================== */

/* ---------- state ---------- */
function marketInit(){
  if(!S.market) S.market = {next: 12, active:0, day:0, score:0, entered:{}, played:{}, given:0};
  if(S.fame === undefined) S.fame = 0;
}

const FAME_TITLES = [
  {at:0,   n:'Unknown',            d:'Nobody outside the gate has heard of you.'},
  {at:12,  n:'Talked about',       d:'Word is getting around the valley.'},
  {at:28,  n:'Local favourite',    d:'People come out of their way for your stall.'},
  {at:48,  n:'Regional name',      d:'Restaurants ring you before the season starts.'},
  {at:72,  n:'Best in the valley', d:'Your name is what the market is known for.'},
];
function fameTitle(){
  marketInit();
  let t = FAME_TITLES[0];
  FAME_TITLES.forEach(f=>{ if(S.fame >= f.at) t = f; });
  return t;
}
/* standing is worth money on everything you sell, permanently */
function fameBonus(){ marketInit(); return Math.min(0.45, S.fame/200); }

const _sellPriceFame = sellPrice;
sellPrice = function(gid){
  const base = _sellPriceFame(gid);
  return Math.max(1, Math.round(base * (1 + fameBonus())));
};

/* ---------- the ground: find open land and lay a market on it ---------- */
/* Scans the farm for the largest clear rectangle it can find, so the
   market never lands on top of anything you have built. */
function findMarketGround(wantW, wantH){
  const taken = (tx,ty)=>!!obAt(tx,ty);
  for(let h = wantH; h >= 4; h--){
    for(let w = wantW; w >= 6; w--){
      for(let ty = FARM.y; ty <= FARM.y + FARM.h - h; ty++){
        for(let tx = FARM.x; tx <= FARM.x + FARM.w - w; tx++){
          let clear = true;
          for(let y = ty; y < ty+h && clear; y++)
            for(let x = tx; x < tx+w; x++)
              if(taken(x,y)){ clear = false; break; }
          if(clear) return {tx, ty, w, h};
        }
      }
    }
  }
  return null;
}

function marketLayout(){
  marketInit();
  if(S.market.ground) return S.market.ground;
  const g = findMarketGround(14, 8);
  S.market.ground = g;
  return g;
}

/* a market stall: striped awning, trestle, crates of produce */
function stallArt(w, h, seed, col){
  let s = `<rect x="${n(w*0.06)}" y="${n(h*0.60)}" width="${n(w*0.88)}" height="${n(h*0.30)}" rx="1.6" fill="#16240c" opacity=".2"/>`;
  /* trestle table */
  s += `<rect x="${n(w*0.08)}" y="${n(h*0.54)}" width="${n(w*0.84)}" height="${n(h*0.26)}" rx="1.6" fill="#b08653"/>`;
  s += `<rect x="${n(w*0.08)}" y="${n(h*0.54)}" width="${n(w*0.84)}" height="${n(h*0.08)}" rx="1.6" fill="#c9a06a"/>`;
  /* crates of produce on it */
  for(let i=0;i<3;i++){
    const cx = w*(0.20 + i*0.26);
    s += `<rect x="${n(cx-w*0.09)}" y="${n(h*0.60)}" width="${n(w*0.18)}" height="${n(h*0.14)}" rx="1" fill="#8a6a45"/>`;
    for(let k=0;k<3;k++)
      s += `<circle cx="${n(cx - w*0.05 + k*w*0.05)}" cy="${n(h*0.655)}" r="${n(Math.min(w,h)*0.035)}"
        fill="${['#d8402f','#e8862e','#82c94f','#e0344a','#c9a06a'][(i*3+k+Math.round(seed))%5]}"/>`;
  }
  /* striped awning over the top */
  s += `<rect x="${n(w*0.04)}" y="${n(h*0.10)}" width="${n(w*0.92)}" height="${n(h*0.34)}" rx="2" fill="#f2ece0"/>`;
  const bands = 6;
  for(let i=0;i<bands;i+=2)
    s += `<rect x="${n(w*(0.04 + i*0.92/bands))}" y="${n(h*0.10)}" width="${n(w*0.92/bands)}" height="${n(h*0.34)}"
      fill="${col}" opacity=".85"/>`;
  s += `<rect x="${n(w*0.04)}" y="${n(h*0.41)}" width="${n(w*0.92)}" height="${n(h*0.04)}" fill="#000" opacity=".18"/>`;
  /* corner posts */
  [[0.07,0.46],[0.93,0.46]].forEach(p=>
    s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="1.4" fill="#8a6a45"/>`);
  return s;
}

/* the whole ground, drawn as one layer while the market is on */
function marketLayer(){
  marketInit();
  if(!S.market.active) return '';
  const g = marketLayout();
  if(!g) return '';
  const X = g.tx*T, Y = g.ty*T, W = g.w*T, H = g.h*T;
  let s = `<g id="marketground">`;
  /* trodden grass and a gravel avenue down the middle */
  s += `<rect x="${n(X)}" y="${n(Y)}" width="${n(W)}" height="${n(H)}" rx="6" fill="#8a9c5c" opacity=".45"/>`;
  s += `<rect x="${n(X+W*0.06)}" y="${n(Y+H*0.42)}" width="${n(W*0.88)}" height="${n(H*0.18)}" rx="4"
    fill="url(#gGravel)" opacity=".85"/>`;

  /* stalls in two rows facing the avenue */
  const cols = ['#c65f4a','#4f7f96','#c8a44e','#6b8b72','#9c7fb0','#d8804a'];
  const per = Math.max(3, Math.floor(g.w/3));
  for(let i=0;i<per;i++){
    const sx = X + W*0.06 + i*(W*0.88/per);
    const sw = W*0.88/per - 4;
    s += `<g transform="translate(${n(sx)},${n(Y+H*0.06)})">${stallArt(sw, H*0.34, i*2.3, cols[i%cols.length])}</g>`;
    s += `<g transform="translate(${n(sx)},${n(Y+H*0.62)})">${stallArt(sw, H*0.34, i*3.7+1, cols[(i+3)%cols.length])}</g>`;
  }
  /* bunting strung the length of the avenue */
  for(let row=0; row<2; row++){
    const by = Y + (row ? H*0.60 : H*0.40);
    const x1 = X + W*0.05, x2 = X + W*0.95;
    s += `<path d="M${n(x1)} ${n(by)} Q${n((x1+x2)/2)} ${n(by+7)} ${n(x2)} ${n(by)}"
      stroke="#7c6f5a" stroke-width="0.7" fill="none"/>`;
    for(let i=1;i<14;i++){
      const t = i/14, it = 1-t;
      const bx = it*it*x1 + 2*it*t*((x1+x2)/2) + t*t*x2;
      const byy = it*it*by + 2*it*t*(by+7) + t*t*by;
      s += `<path d="M${n(bx-2.2)} ${n(byy)} L${n(bx+2.2)} ${n(byy)} L${n(bx)} ${n(byy+4)} Z"
        fill="${cols[i%cols.length]}" opacity=".92"/>`;
    }
  }
  /* a little crowd milling about */
  for(let i=0;i<14;i++){
    const px = X + W*(0.08 + hash(i*2.7)*0.84);
    const py = Y + H*(0.44 + hash(i*4.1)*0.14);
    s += `<g class="mk-visitor" transform="translate(${n(px)},${n(py)})"
      style="animation-delay:-${(hash(i*5.3)*6).toFixed(1)}s">
      <ellipse cx="0.8" cy="3.4" rx="2.6" ry="1.1" fill="#16240c" opacity=".28"/>
      <rect x="-1.6" y="-3" width="3.2" height="5.2" rx="1.5" fill="${cols[i%cols.length]}"/>
      <circle cx="0" cy="-4.4" r="1.7" fill="#e2b98f"/></g>`;
  }
  /* the entrance arch */
  s += `<rect x="${n(X+W*0.02)}" y="${n(Y+H*0.44)}" width="${n(W*0.035)}" height="${n(H*0.14)}" rx="1.4" fill="#8a6a45"/>`;
  s += `<rect x="${n(X+W*0.945)}" y="${n(Y+H*0.44)}" width="${n(W*0.035)}" height="${n(H*0.14)}" rx="1.4" fill="#8a6a45"/>`;
  return s + '</g>';
}

/* the market ground rides just under the people */
const _peopleLayerMarket = peopleLayer;
peopleLayer = function(){ return marketLayer() + _peopleLayerMarket.apply(this, arguments); };

/* ---------- running the event ---------- */
function marketStart(){
  marketInit();
  S.market.active = 1; S.market.day = 1; S.market.score = 0;
  S.market.entered = {}; S.market.played = {}; S.market.given = 0;
  S.market.ground = null;
  const g = marketLayout();
  if(!g){
    S.market.active = 0;
    S.market.next = S.day + 6;
    log('The market was called off — no clear ground on the farm for it.','bad','alert');
    return;
  }
  log('The farmers market opens on the flat. Five days.','gold','farm');
  toast('Farmers market — five days','gold');
  if(typeof sfx==='function') sfx('level');
  render();
  setTimeout(()=>G.openMarket(), 700);
}

function marketEnd(){
  marketInit();
  const sc = S.market.score;
  const gained = Math.round(sc/10);
  S.fame = Math.min(100, S.fame + gained);
  S.market.active = 0;
  S.market.ground = null;
  S.market.next = S.day + 26 + Math.floor(Math.random()*10);
  const t = fameTitle();
  log(`Market over. ${sc} points, ${gained} standing. You are ${t.n.toLowerCase()}.`, 'gold', 'farm');
  toast(`Market done — ${t.n}`, 'gold');
  if(typeof sfx==='function') sfx('level');
  render(); ui();
}

/* one tick a day */
function marketDayTick(){
  marketInit();
  if(!S.market.active){
    if(S.day >= S.market.next) marketStart();
    return;
  }
  S.market.day++;
  if(S.market.day > 5){ marketEnd(); return; }
  /* takings scale with what you brought and how well known you are */
  const stallTake = Math.round((20 + S.market.score*0.6) * (1 + fameBonus()) * (0.8 + Math.random()*0.5));
  S.cash += stallTake; S.totalEarned += stallTake;
  log(`Market day ${S.market.day}: the stall took ${fmt(stallTake)}.`, 'gold', 'money');
}

/* ---------- judging: scored off the farm you actually have ---------- */
function judgingEntries(){
  const out = [];
  Object.keys(S.store || {}).forEach(gid=>{
    const q = S.store[gid] || 0;
    if(q <= 0 || !GOODS[gid]) return;
    /* quality: what it is worth, how much you brought, how well you grow it */
    const tierAvg = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='plot')
      .reduce((a,o,i,arr)=> a + (o.tier||0)/(arr.length||1), 0);
    const score = Math.round(GOODS[gid].p * Math.min(q,20) * 0.5 * (1 + tierAvg*0.25));
    out.push({gid, n:GOODS[gid].n, q, score, c:GOODS[gid].c});
  });
  return out.sort((a,b)=>b.score-a.score).slice(0, 8);
}

G.enterJudging = function(gid){
  marketInit();
  if(S.market.entered[gid]) return toast('Already entered','bad');
  const e = judgingEntries().find(x=>x.gid===gid);
  if(!e) return;
  S.market.entered[gid] = 1;
  /* rivals are drawn against your own standard so it stays a contest */
  const rival = Math.round(e.score * (0.55 + Math.random()*0.75));
  const won = e.score >= rival;
  const pts = won ? 18 + Math.round(e.score/40) : 5;
  S.market.score += pts;
  log(won ? `${e.n} took first place in judging. +${pts}`
          : `${e.n} was placed second. +${pts}`, won?'gold':'', 'farm');
  toast(won ? `First place — ${e.n}!` : `Second — ${e.n}`, won?'gold':'');
  if(typeof sfx==='function') sfx(won?'level':'click');
  G.openMarket(); ui(); G.save();
};

/* ---------- the sideshow ---------- */
/* Guess the weight: one number, closest wins. Real stakes, no dice. */
G.playWeigh = function(){
  marketInit();
  if(S.market.played.weigh) return toast('You have had your go at that one','bad');
  const real = 40 + Math.floor(Math.random()*160);
  modal(`<h2>Guess the weight</h2>
    <p class="sub">A prize pumpkin sits on the scales under a cloth. Closest guess takes the sash.</p>
    <div class="mkguess">
      <input id="mkg" type="number" min="1" max="400" value="100" class="mkinput"/>
      <span class="muted">kilograms</span>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="G.weighResult(${real})">Guess</button>
      <button class="btn ghost" onclick="G.openMarket()">Back</button>
    </div>`);
};
G.weighResult = function(real){
  const v = parseInt((document.getElementById('mkg')||{}).value, 10) || 0;
  const off = Math.abs(v - real);
  const pts = off <= 5 ? 25 : off <= 15 ? 15 : off <= 35 ? 8 : 2;
  S.market.played.weigh = 1;
  S.market.score += pts;
  log(`Guessed ${v}kg, it was ${real}kg. +${pts} at the market.`, pts>=15?'gold':'', 'farm');
  if(typeof sfx==='function') sfx(pts>=15?'level':'click');
  modal(`<h2>${off <= 5 ? 'Spot on' : off <= 15 ? 'Close' : 'Not quite'}</h2>
    <p class="sub">It weighed <b>${real}kg</b>. You said ${v}kg — ${off}kg out.</p>
    <p class="sub">+${pts} market points.</p>
    <div class="mfoot"><button class="btn" onclick="G.openMarket()">Back to the market</button></div>`);
  ui(); G.save();
};

/* Welly toss: a moving marker you have to stop in the green */
G.playToss = function(){
  marketInit();
  if(S.market.played.toss) return toast('You have had your go at that one','bad');
  modal(`<h2>Welly toss</h2>
    <p class="sub">Stop the marker in the green to throw long. Three throws.</p>
    <div class="tossbar"><div class="tosszone"></div><div class="tossmark" id="tossmark"></div></div>
    <div class="muted" id="tossinfo" style="margin-top:6px">Throws left: 3 · distance 0m</div>
    <div class="mfoot">
      <button class="btn" id="tossbtn" onclick="G.tossStop()">Throw</button>
      <button class="btn ghost" onclick="G.tossQuit()">Give up</button>
    </div>`);
  TOSS.throws = 3; TOSS.dist = 0; TOSS.t = 0; TOSS.on = true;
  tossLoop();
};
const TOSS = {on:false, throws:3, dist:0, t:0, raf:0};
function tossLoop(){
  if(!TOSS.on) return;
  TOSS.t += 0.022;
  const p = (Math.sin(TOSS.t*2.4) + 1) / 2;          // 0..1 sweep
  const el = document.getElementById('tossmark');
  if(el) el.style.left = (p*100).toFixed(1) + '%';
  TOSS.p = p;
  TOSS.raf = requestAnimationFrame(tossLoop);
}
G.tossStop = function(){
  if(!TOSS.on) return;
  const p = TOSS.p || 0;
  /* the green band sits from 0.42 to 0.58 */
  const good = p > 0.42 && p < 0.58;
  const near = p > 0.32 && p < 0.68;
  const m = good ? 28 + Math.round(Math.random()*10) : near ? 14 + Math.round(Math.random()*8) : 4 + Math.round(Math.random()*5);
  TOSS.dist += m;
  TOSS.throws--;
  const info = document.getElementById('tossinfo');
  if(info) info.textContent = `Throws left: ${TOSS.throws} · distance ${TOSS.dist}m`;
  if(typeof sfx==='function') sfx(good?'level':'click');
  if(TOSS.throws <= 0){
    TOSS.on = false; cancelAnimationFrame(TOSS.raf);
    const pts = TOSS.dist >= 75 ? 25 : TOSS.dist >= 50 ? 16 : TOSS.dist >= 30 ? 9 : 3;
    S.market.played.toss = 1;
    S.market.score += pts;
    log(`Welly toss: ${TOSS.dist}m. +${pts} at the market.`, pts>=16?'gold':'', 'farm');
    modal(`<h2>${TOSS.dist}m</h2>
      <p class="sub">${TOSS.dist>=75?'That cleared the fence.':TOSS.dist>=50?'A respectable throw.':'The judges were kind.'}</p>
      <p class="sub">+${pts} market points.</p>
      <div class="mfoot"><button class="btn" onclick="G.openMarket()">Back to the market</button></div>`);
    ui(); G.save();
  }
};
G.tossQuit = function(){ TOSS.on = false; cancelAnimationFrame(TOSS.raf); G.openMarket(); };

/* ---------- the relief fund ---------- */
G.giveRelief = function(amt){
  marketInit();
  amt = Math.max(0, Math.min(S.cash, amt|0));
  if(amt <= 0) return toast('Nothing to give','bad');
  S.cash -= amt;
  S.market.given += amt;
  const pts = Math.min(30, Math.round(amt/40));
  S.market.score += pts;
  S.morale = Math.min(1, (S.morale===undefined?0.6:S.morale) + 0.04);
  log(`Gave ${fmt(amt)} to the relief fund. +${pts} standing at the market.`, 'good', 'money');
  toast(`${fmt(amt)} to the relief fund`, 'good');
  if(typeof sfx==='function') sfx('coin');
  G.openMarket(); ui(); G.save();
};

/* ---------- the market screen ---------- */
G.openMarket = function(){
  marketInit();
  if(!S.market.active){
    return modal(`<h2>No market on</h2>
      <p class="sub">The next farmers market opens on day ${S.market.next}. It runs five days.</p>
      <div class="mfoot"><button class="btn" onclick="G.closeModal()">Close</button></div>`);
  }
  const ents = judgingEntries();
  const t = fameTitle();
  modal(`<h2>Farmers market — day ${S.market.day} of 5</h2>
    <p class="sub">${t.n} · ${t.d} Market points so far: <b>${S.market.score}</b>.</p>

    <h4>Judging</h4>
    <p class="sub">Scored on what you actually grew — quality, quantity and how well you
    keep your beds. Enter anything in the barn.</p>
    <div class="mkgrid">
      ${ents.length ? ents.map(e=>`
        <button class="mkcard" ${S.market.entered[e.gid]?'disabled':''} onclick="G.enterJudging('${e.gid}')">
          <span class="mkdot" style="background:${e.c}"></span>
          <b>${e.n}</b>
          <span class="muted">${e.q} in the barn · strength ${e.score}</span>
          <span class="lprice">${S.market.entered[e.gid]?'Entered':'Enter'}</span>
        </button>`).join('')
      : `<p class="sub">Nothing in the barn to enter. Harvest something first.</p>`}
    </div>

    <h4>Sideshow</h4>
    <div class="mkgrid">
      <button class="mkcard" ${S.market.played.weigh?'disabled':''} onclick="G.playWeigh()">
        <b>Guess the weight</b><span class="muted">One guess at the prize pumpkin.</span>
        <span class="lprice">${S.market.played.weigh?'Played':'Have a go'}</span></button>
      <button class="mkcard" ${S.market.played.toss?'disabled':''} onclick="G.playToss()">
        <b>Welly toss</b><span class="muted">Three throws. Stop the marker in the green.</span>
        <span class="lprice">${S.market.played.toss?'Played':'Have a go'}</span></button>
    </div>

    <h4>Farmers' relief fund</h4>
    <p class="sub">For growers who lost a season to hail or drought. It buys you nothing
    but goodwill — which at a market is worth something. Given so far: ${fmt(S.market.given)}.</p>
    <div class="mkgive">
      <button class="btn ghost" onclick="G.giveRelief(50)">Give $50</button>
      <button class="btn ghost" onclick="G.giveRelief(200)">Give $200</button>
      <button class="btn ghost" onclick="G.giveRelief(1000)">Give $1,000</button>
    </div>

    <div class="mfoot"><button class="btn ghost" onclick="G.closeModal()">Close</button></div>`);
};

/* ---------- wiring ---------- */
/* one market tick per game day */
let marketLastDay = -1;
setInterval(()=>{
  if(typeof S === 'undefined' || !S || S.speed === 0) return;
  marketInit();
  if(S.day !== marketLastDay){
    marketLastDay = S.day;
    marketDayTick();
  }
}, 900);

/* a button in the top bar that lights up while the market is on */
setTimeout(()=>{
  const bar = document.querySelector('.tbtn') && document.querySelector('.tbtn').parentElement;
  if(!bar || document.getElementById('mktbtn')) return;
  const b = document.createElement('button');
  b.id = 'mktbtn'; b.className = 'tbtn';
  b.textContent = 'Market';
  b.dataset.tip = '<b>Farmers market</b>Five days, twice a season. Judging, sideshow games and the relief fund.';
  b.addEventListener('click', ()=>G.openMarket());
  bar.appendChild(b);
  setInterval(()=>{
    marketInit();
    b.classList.toggle('on', !!S.market.active);
    b.textContent = S.market.active ? `Market ${S.market.day}/5` : 'Market';
  }, 1200);
}, 560);

/* let people try it without waiting for day 12 */
G.forceMarket = function(){ marketInit(); S.market.next = S.day; marketDayTick(); };

(function marketCss(){
  const s = document.createElement('style');
  s.textContent = `
  #marketground{ pointer-events:none; }
  .mk-visitor{ animation: mkWander 9s ease-in-out infinite; transform-box:fill-box; }
  @keyframes mkWander{
    0%,100%{ transform: translateX(0); }

/* =====================================================================
   NEGLECT, PESTS, AND THE LAND GOING BACK

   Automation was free: switch the modules on and the farm ran itself
   forever. This gives it a cost.

   The machines do what machines do — water, harvest, sow, feed. What
   they cannot do is weed a bed or deal with an infestation, and those
   are the jobs that decide whether a farm holds. Let the weeds go and
   pests build; let pests build and the crops go backwards, the animals
   sicken, the household's mood drops; leave it long enough and the
   paddocks stop being paddocks.

   It is deliberately slow and recoverable. You get warned at every
   stage, and one afternoon of work pulls it all back. The point is
   that the afternoon has to happen.
   ===================================================================== */

/* weeding and spraying are real jobs, not incidental clicks - give them
   their own hours rather than letting spendHours fall back to a default */
if(typeof TASK_HOURS === 'object' && TASK_HOURS){
  if(TASK_HOURS.weed === undefined) TASK_HOURS.weed = 1.2;
  if(TASK_HOURS.pest === undefined) TASK_HOURS.pest = 1.4;
}

function neglectInit(){
  if(S.pests === undefined)  S.pests = 0;
  if(S.decay === undefined)  S.decay = 0;
  (S.objs||[]).forEach(o=>{ if(o.weeds === undefined) o.weeds = 0; });
}

/* how hard pests come on, from the existing difficulty setting */
function pestRate(){
  const v = (typeof SET === 'function') ? SET('pestRate') : 50;
  return (v === undefined ? 50 : v) / 50;      // 1.0 at the default
}

/* ---------- 1. neglect accrues where machines cannot reach ---------- */
function tickNeglect(days){
  neglectInit();
  const plots = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='plot' && o.crop);
  const pens  = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='animal');

  /* weeds grow in any planted bed. Irrigation and sowing modules do not
     touch them - that is the gap the player has to cover. */
  plots.forEach(o=>{
    o.weeds = Math.min(1, (o.weeds||0) + 0.055*days*pestRate());
  });
  /* pens get dirty; the livestock module slows it but does not stop it */
  const stockAuto = (typeof autoOn === 'function') && autoOn('livestock');
  pens.forEach(o=>{
    o.care = Math.max(0, (o.care===undefined?1:o.care) - (stockAuto ? 0.02 : 0.05)*days);
  });

  /* pests feed on weedy beds and dirty pens */
  const weedy = plots.reduce((a,o)=>a + (o.weeds||0), 0);
  const dirty = pens.reduce((a,o)=>a + (1 - (o.care===undefined?1:o.care)), 0);
  const pressure = (weedy*7 + dirty*5) * pestRate();
  /* predators keep them down: bees, ponds and flowers all help */
  const helpers = (S.objs||[]).filter(o=>/apiary|pond|flowers|hedge|tree_/.test((BPMAP[o.bp]||{}).art||'')).length;
  const suppress = 3 + helpers*1.6;
  S.pests = Math.max(0, S.pests + (pressure - suppress)*days);

  /* ---------- 2. what pests actually do ---------- */
  if(S.pests > 100){
    const bite = Math.min(0.5, (S.pests-100)/400);
    plots.forEach(o=>{ if(o.crop && o.stage > 0 && Math.random() < bite*0.5) o.stage = Math.max(0, o.stage - 1); });
    pens.forEach(o=>{ if(Math.random() < bite*0.28) o.care = Math.max(0, (o.care||1) - 0.2); });
    S.morale = Math.max(0, (S.morale===undefined?0.6:S.morale) - 0.05*days);
    if(!S._pestWarned || S.day - S._pestWarned > 4){
      S._pestWarned = S.day;
      log(`Infestation — ${Math.round(S.pests)} pests. Crops are going backwards and the animals are off.`, 'bad', 'alert');
      toast('Infestation on the farm','bad');
      if(typeof sfx==='function') sfx('error');
    }
  } else if(S.pests > 55 && (!S._pestNote || S.day - S._pestNote > 6)){
    S._pestNote = S.day;
    log(`Pests are building — ${Math.round(S.pests)}. Weed the beds and muck out before it turns.`, 'warn', 'alert');
  }

  /* ---------- 3. the land follows ---------- */
  const avgWeeds = plots.length ? weedy/plots.length : 0;
  const avgDirty = pens.length ? dirty/pens.length : 0;
  const bad = (S.pests > 100 ? 1 : S.pests/100) * 0.5 + avgWeeds*0.3 + avgDirty*0.2;
  if(bad > 0.55) S.decay = Math.min(1, S.decay + (bad-0.55)*0.16*days);
  else           S.decay = Math.max(0, S.decay - (0.55-bad)*0.22*days);

  const stage = decayStage();
  if(stage !== S._decayStage){
    S._decayStage = stage;
    if(stage >= 1){
      const msg = ['','The grass is thinning and the soil is showing through.',
                   'The paddocks are going. Bare ground where the sward was.',
                   'This is turning to wasteland. Very little will grow here now.'][stage];
      log(msg, stage >= 2 ? 'bad' : 'warn', 'alert');
      toast(['','Land is thinning','Paddocks failing','Wasteland'][stage], 'bad');
    } else {
      log('The land has come back — green through the paddocks again.', 'good', 'farm');
    }
    applyDecay();
  }
}
function decayStage(){
  neglectInit();
  return S.decay > 0.75 ? 3 : S.decay > 0.45 ? 2 : S.decay > 0.18 ? 1 : 0;
}

/* ---------- the wasteland, drawn rather than filtered ---------- */
/* A CSS filter over the whole world costs a full offscreen pass every
   frame. This is an overlay instead: dust colour, bare scrapes, dead
   timber and blowing grit, all scaled by how far gone the land is. */
function decayLayer(){
  neglectInit();
  if(S.decay <= 0.05) return '';
  const d = S.decay;
  const X = FARM.x*T, Y = FARM.y*T, W = FARM.w*T, H = FARM.h*T;
  let s = `<g id="decaylayer" aria-hidden="true">`;
  /* the ground losing its colour */
  s += `<rect x="${n(X)}" y="${n(Y)}" width="${n(W)}" height="${n(H)}" rx="6"
    fill="#8a7a52" opacity="${(d*0.42).toFixed(3)}"/>`;
  s += `<rect x="${n(X)}" y="${n(Y)}" width="${n(W)}" height="${n(H)}" rx="6"
    fill="#5c4a30" opacity="${(d*d*0.28).toFixed(3)}"/>`;
  /* bare scrapes where the sward has gone */
  const scrapes = Math.round(d*22);
  for(let i=0;i<scrapes;i++){
    const sx = X + hash(i*2.7)*W, sy = Y + hash(i*4.3)*H;
    const rx = 10 + hash(i*5.1)*26, ry = 6 + hash(i*6.7)*16;
    s += `<ellipse cx="${n(sx)}" cy="${n(sy)}" rx="${n(rx)}" ry="${n(ry)}"
      fill="#9c8558" opacity="${(0.18 + d*0.22).toFixed(2)}"/>`;
    if(d > 0.5)
      s += `<ellipse cx="${n(sx+2)}" cy="${n(sy+1)}" rx="${n(rx*0.55)}" ry="${n(ry*0.5)}"
        fill="#6f5c3a" opacity="${(d*0.3).toFixed(2)}"/>`;
  }
  /* cracked earth once it is properly gone */
  if(d > 0.6){
    for(let i=0;i<Math.round((d-0.6)*40);i++){
      const cx = X + hash(i*3.3)*W, cy = Y + hash(i*7.1)*H;
      const a = hash(i*9.7)*Math.PI;
      const L = 16 + hash(i*2.2)*30;
      s += `<path d="M${n(cx)} ${n(cy)} l ${n(Math.cos(a)*L*0.5)} ${n(Math.sin(a)*L*0.5)}
        l ${n(Math.cos(a+0.5)*L*0.4)} ${n(Math.sin(a+0.5)*L*0.4)}"
        stroke="#4a3a24" stroke-width="0.9" fill="none" opacity="${((d-0.6)*1.4).toFixed(2)}"/>`;
    }
  }
  /* dead standing timber */
  if(d > 0.45){
    for(let i=0;i<Math.round((d-0.45)*14);i++){
      const tx = X + hash(i*11.3)*W, ty = Y + hash(i*13.7)*H;
      s += `<path d="M${n(tx)} ${n(ty)} l 0 ${n(-14-hash(i)*10)}" stroke="#5b4a35" stroke-width="1.6"/>`;
      s += `<path d="M${n(tx)} ${n(ty-10)} l ${n(-6)} ${n(-5)} M${n(tx)} ${n(ty-13)} l ${n(7)} ${n(-4)}"
        stroke="#5b4a35" stroke-width="1.1" fill="none"/>`;
    }
  }
  /* grit blowing across */
  if(d > 0.3){
    for(let i=0;i<Math.round(d*9);i++)
      s += `<ellipse class="dk-dust" cx="${n(X + hash(i*17.1)*W)}" cy="${n(Y + hash(i*19.3)*H)}"
        rx="${n(26+hash(i)*40)}" ry="${n(10+hash(i*3)*16)}" fill="#c4ab7a"
        opacity="${(0.06+d*0.10).toFixed(3)}" style="animation-delay:-${(hash(i*5)*14).toFixed(1)}s"/>`;
  }
  return s + '</g>';
}

/* pests, when there are enough of them to see */
function pestLayer(){
  neglectInit();
  if(S.pests < 100) return '';
  const swarms = Math.min(7, Math.round((S.pests-100)/45) + 2);
  const plots = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='plot' && o.crop);
  if(!plots.length) return '';
  let s = `<g id="pestlayer" aria-hidden="true">`;
  for(let i=0;i<swarms;i++){
    const o = plots[i % plots.length];
    const f = footprint(BPMAP[o.bp], o.rot);
    const cx = (o.tx + f.w*0.5)*T, cy = (o.ty + f.h*0.4)*T;
    s += `<g class="pt-swarm" transform="translate(${n(cx)},${n(cy)})"
      style="animation-delay:-${(i*0.7).toFixed(1)}s">`;
    for(let k=0;k<7;k++){
      const a = (k/7)*Math.PI*2;
      s += `<circle class="pt-bug" cx="${n(Math.cos(a)*7)}" cy="${n(Math.sin(a)*5)}" r="1.1"
        fill="#3a3020" style="animation-delay:-${(k*0.18).toFixed(2)}s"/>`;
    }
    s += `</g>`;
  }
  return s + '</g>';
}

const _peopleLayerNeglect = peopleLayer;
peopleLayer = function(){ return decayLayer() + _peopleLayerNeglect.apply(this, arguments) + pestLayer(); };

function applyDecay(){ if(typeof render === 'function') render(); }

/* ---------- 4. the work that fixes it ---------- */
G.weedAll = function(){
  neglectInit();
  const plots = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='plot' && (o.weeds||0) > 0.05);
  if(!plots.length) return toast('Nothing needs weeding','');
  if(typeof hoursLeft === 'function' && hoursLeft() < 1)
    return toast('No hours left today','bad'), sfx('error');
  plots.forEach(o=>{ o.weeds = 0; });
  S.pests = Math.max(0, S.pests - 18 - plots.length*4);
  if(typeof spendHours === 'function') spendHours('weed');
  log(`Weeded ${plots.length} bed${plots.length>1?'s':''}. Pests down to ${Math.round(S.pests)}.`, 'good', 'farm');
  toast('Beds weeded','good');
  if(typeof sfx==='function') sfx('water');
  render(); ui(); G.save();
};

G.dealWithPests = function(){
  neglectInit();
  if(S.pests < 20) return toast('Pests are under control','');
  if(typeof hoursLeft === 'function' && hoursLeft() < 2)
    return toast('That needs a couple of hours you have not got','bad'), sfx('error');
  const cost = Math.round(30 + S.pests*0.8);
  if(S.cash < cost) return toast(`Needs ${fmt(cost)} for materials`,'bad'), sfx('error');
  S.cash -= cost;
  S.pests = Math.max(0, S.pests * 0.25);
  if(typeof spendHours === 'function'){ spendHours('pest'); spendHours('pest'); }   /* 2.8h all up */
  log(`Treated the farm for pests — ${fmt(cost)}. Down to ${Math.round(S.pests)}.`, 'good', 'farm');
  toast('Pests knocked back','good');
  if(typeof sfx==='function') sfx('build');
  render(); ui(); G.save();
};

/* ---------- 5. surface it ---------- */
function neglectPanel(){
  neglectInit();
  const plots = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='plot' && o.crop);
  const weedy = plots.filter(o=>(o.weeds||0) > 0.4).length;
  const pens  = (S.objs||[]).filter(o=>BPMAP[o.bp] && BPMAP[o.bp].kind==='animal');
  const dirty = pens.filter(o=>(o.care===undefined?1:o.care) < 0.5).length;
  const st = decayStage();
  const pestCol = S.pests > 100 ? '#e0664f' : S.pests > 55 ? '#f0a24b' : '#7cc24f';
  const landTxt = ['Healthy','Thinning','Failing','Wasteland'][st];
  const landCol = ['#7cc24f','#f0d79a','#f0a24b','#e0664f'][st];
  return `<div class="pcard">
    <h3>Condition</h3>
    <p class="sub">Machines water, harvest, sow and feed. They do not weed a bed or
    deal with an infestation — those stay yours.</p>
    <div class="tl"><span>Pests</span><b style="color:${pestCol}">${Math.round(S.pests)}${S.pests>100?' — infested':''}</b></div>
    <div class="tl"><span>Beds needing weeding</span><b>${weedy} of ${plots.length}</b></div>
    <div class="tl"><span>Pens needing mucking out</span><b>${dirty} of ${pens.length}</b></div>
    <div class="tl"><span>The land</span><b style="color:${landCol}">${landTxt}</b></div>
    <div class="bar" style="margin-top:6px"><i style="transform:scaleX(${(1-S.decay).toFixed(3)});
      background:linear-gradient(90deg,${landCol},#9ad06f)"></i></div>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
      <button class="btn ghost" onclick="G.weedAll()">Weed the beds</button>
      <button class="btn ghost" onclick="G.dealWithPests()">Treat for pests</button>
    </div>
  </div>`;
}

const _renderRightNeglect = renderRight;
renderRight = function(){
  const r = _renderRightNeglect.apply(this, arguments);
  if(rightTab === 'owner'){
    const b = document.getElementById('rightBody');

  }
  return r;
};

/* one pass per game day */
let neglectLastDay = -1;
setInterval(()=>{

  neglectInit();
  if(S.day !== neglectLastDay){
    if(neglectLastDay >= 0) tickNeglect(1);

  }
}, 900);

(function neglectCss(){

/* ---------- the unlock code ---------- */
/* This lives in the page source, so anyone who opens devtools can read
   it. It is a convenience for people you hand the link to, not a
   security control. */
const UNLOCK_CODE = '122133';

G.openUnlock = function(){
  modal(`<h2>Enter a code</h2>
    <p class="sub">If you were given a code, it unlocks the full game — no trial limit,
    every option available, and a farm with enough behind it to actually play.</p>
    <div class="mkguess">
      <input id="unlockin" class="mkinput" style="width:150px;letter-spacing:3px;text-align:center"
        placeholder="------" maxlength="12"/>
    </div>
    <div class="mfoot">
      <button class="btn" onclick="G.tryUnlock()">Unlock</button>
      <button class="btn ghost" onclick="G.closeModal()">Close</button>
    </div>`);
  setTimeout(()=>{ const i=document.getElementById('unlockin'); if(i) i.focus(); }, 60);
};

G.tryUnlock = function(){
  const v = ((document.getElementById('unlockin')||{}).value || '').trim();
  if(v !== UNLOCK_CODE){
    toast('That code is not right','bad');
    if(typeof sfx==='function') sfx('error');
    return;
  }
  /* no trial limit */
  if(typeof PLAY !== 'undefined'){ PLAY.unlocked = true; if(typeof savePlay==='function') savePlay(); }
  const g = document.getElementById('gateWrap'); if(g) g.remove();
  if(S) S.speed = S.speed || 1;
  /* a farm worth playing rather than an empty paddock */
  S.cash = Math.max(S.cash, 8000);
  S.level = Math.max(S.level || 1, 4);
  settingsInit();
  S.unlocked = true;
  if(typeof S.fame === 'number') S.fame = Math.max(S.fame, 20);
  log('Full version unlocked. Everything is available.', 'gold', 'farm');
  toast('Unlocked — full game', 'gold');
  if(typeof sfx==='function') sfx('level');
  G.closeModal(); ui(); renderRight(); G.save();
};

/* offer it on the trial gate, and from the top bar */
setTimeout(()=>{

  if(bar && !document.getElementById('codebtn')){
    const b = document.createElement('button');

    b.addEventListener('click', ()=>G.openUnlock());
    bar.appendChild(b);

}, 580);

/* add the code route to the trial lock as well */

/* =====================================================================
   THE CODE ALSO OPENS THE MARKET

   Without this, someone who enters the code still has to wait for day
   12 to see the biggest thing in the game — which defeats the point of
   handing them a code at all. Unlocking now starts a market straight
   away, lets you open one whenever you like, and refreshes the sideshow
   each market day rather than once per market.
   ===================================================================== */

/* open a market on demand */
G.startMarketNow = function(){
  if(typeof marketInit !== 'function') return;
  marketInit();
  if(S.market.active) return G.openMarket();
  S.market.next = S.day;
  marketStart();
};

/* the "no market on" screen gains a way in once unlocked */
if(typeof G.openMarket === 'function'){
  const _openMarket = G.openMarket;
  G.openMarket = function(){
    marketInit();
    if(!S.market.active && S.unlocked){
      return modal(`<h2>Farmers market</h2>
        <p class="sub">The next one comes round on day ${S.market.next}. You have full access,
        so you can also open one now — judging, the sideshow and the relief fund.</p>
        <div class="mfoot">
          <button class="btn" onclick="G.startMarketNow()">Open the market now</button>
          <button class="btn ghost" onclick="G.closeModal()">Wait for it</button>
        </div>`);
    }
    return _openMarket.apply(this, arguments);
  };
}

/* with full access the sideshow refreshes daily instead of once a market */
if(typeof marketDayTick === 'function'){
  const _marketDayTick = marketDayTick;
  marketDayTick = function(){
    const wasDay = S.market ? S.market.day : 0;
    const r = _marketDayTick.apply(this, arguments);
    if(S.unlocked && S.market && S.market.active && S.market.day !== wasDay){
      S.market.played = {};          /* another go at the games each day */
    }
    return r;
  };
}

/* and unlocking starts one immediately */
if(typeof G.tryUnlock === 'function'){
  const _tryUnlockMarket = G.tryUnlock;
  G.tryUnlock = function(){
    const before = (typeof PLAY !== 'undefined') ? PLAY.unlocked : false;
    const r = _tryUnlockMarket.apply(this, arguments);
    const now = (typeof PLAY !== 'undefined') ? PLAY.unlocked : false;
    if(!before && now){
      marketInit();
      S.market.next = S.day;
      if(!S.market.active) marketStart();
      log('Full market access — judging, sideshow and the relief fund, whenever you want them.', 'gold', 'farm');
    }
    return r;
  };
}

/* =====================================================================
   EVERYONE JUMPS, THEN EVERYONE HUDDLES

   A lightning strike used to be scenery: the sky flashed and the family
   carried on drying the dishes. Now the whole household reacts to it —
   they startle, they say so, they gather in one room, and once they are
   all together the fright turns into something warmer.

   Three beats, and the timing matters more than any one of them:
     flash → fright (everyone reacts at once, badly)
            → gather (they converge on the same room)
            → together (relief, and the tune that goes with it)
   ===================================================================== */

const FEAR_LINES = [
  '😨 Eek!', '😱 That was close!', '😰 Right overhead!',
  '😨 Mum!', '😧 Did you hear that?', '😖 I hate that noise',
];
const KID_FEAR = ['😱 Aaah!', '😨 I want Mum', '😰 Was that the barn?', '😢 Too loud!'];
const CALM_LINES = [
  '😊 We are all here', '🤍 Nothing hit', '😌 It is going over',
  '☺️ Alright now', '🫂 Come here', '😄 Told you it was far off',
];

/* who counts as a person we can move and speak for */
function everyone(){
  const out = (S.family || []).concat(S.workers || []);
  return out;
}

function huddleSpot(){
  const H = (typeof houseRect === 'function') ? houseRect() : null;
  if(H && typeof ROOMS !== 'undefined' && ROOMS.living){
    const r = ROOMS.living;
    return { x: H.x + (r.x + r.w*0.5)*H.w, y: H.y + (r.y + r.h*0.62)*H.h };
  }
  if(typeof homeSpot === 'function') return homeSpot();
  return { x:(FARM.x+4)*T, y:(FARM.y+4)*T };
}

/* ---------- the reaction ---------- */
function startleAll(){
  if(S.huddle && S.huddle.phase) return;      /* already jumping */
  const spot = huddleSpot();
  S.huddle = { phase:'fear', t:0, spot, sang:false };

  const folk = everyone();
  folk.forEach((p, i)=>{
    const pool = p.role === 'child' ? KID_FEAR : FEAR_LINES;
    const line = pool[Math.floor(Math.random()*pool.length)];
    /* stagger by a fraction of a second so it reads as a room reacting,
       not a chorus */
    setTimeout(()=>{
      if(typeof speak === 'function') speak(p, line);
      const el = document.querySelector(`[data-p="${p.id}"]`);
      if(el){ el.classList.remove('startled'); void el.offsetWidth; el.classList.add('startled'); }
    }, 40 + i*130);
  });

  /* you jump too */
  if(S.you){
    setTimeout(()=>{
      if(typeof speak === 'function') speak(S.you, FEAR_LINES[Math.floor(Math.random()*FEAR_LINES.length)]);
      const y = document.getElementById('you');
      if(y){ y.classList.remove('startled'); void y.offsetWidth; y.classList.add('startled'); }
    }, 30);
  }

  if(typeof SND !== 'undefined') SND.play('fright');
  if(typeof log === 'function') log('The whole house jumped at that one.', '', 'home');
}

/* ---------- gathering, then relief ---------- */
function tickHuddle(dt){
  const h = S.huddle;
  if(!h || !h.phase) return;
  h.t += dt;

  if(h.phase === 'fear' && h.t > 1.4){ h.phase = 'gather'; h.t = 0; }

  if(h.phase === 'gather'){
    /* are they all in? the player counts too */
    const folk = everyone();
    const near = folk.filter(p => Math.hypot(p.x - h.spot.x, p.y - h.spot.y) < 42).length;
    const youIn = !S.you || Math.hypot(S.you.x - h.spot.x, S.you.y - h.spot.y) < 46;
    if((folk.length === 0 || near >= folk.length) && youIn){ h.phase = 'together'; h.t = 0; }
    /* do not wait forever if someone is stuck out in a paddock */
    else if(h.t > 14){ h.phase = 'together'; h.t = 0; }
  }

  if(h.phase === 'together'){
    if(!h.sang){
      h.sang = true;
      if(typeof SND !== 'undefined') SND.play('huddle');
      const folk = everyone();
      folk.slice(0, 3).forEach((p, i)=>{
        setTimeout(()=>{
          if(typeof speak === 'function')
            speak(p, CALM_LINES[Math.floor(Math.random()*CALM_LINES.length)]);
        }, 300 + i*700);
      });
      if(S.you) setTimeout(()=>{
        if(typeof speak === 'function') speak(S.you, '🫂 Everyone in?');
      }, 200);
      /* being together after a fright is genuinely good for them */
      S.morale = Math.min(1, (S.morale === undefined ? 0.6 : S.morale) + 0.08);
      if(typeof log === 'function')
        log('Everyone huddled in the front room until it passed.', 'good', 'home');
      const w = document.getElementById('world');
      if(w){ w.classList.add('huddle-warm'); setTimeout(()=>w.classList.remove('huddle-warm'), 5200); }
    }
    if(h.t > 6){ S.huddle = null; }
  }
}

/* while the huddle is on, it overrides where people would otherwise be */
if(typeof routine === 'function'){
  const _routineHuddle = routine;
  routine = function(p){
    const h = S.huddle;
    if(h && h.phase){
      const act = h.phase === 'fear' ? 'startled'
                : h.phase === 'gather' ? 'hurrying inside' : 'huddled together';
      /* spread them slightly so three people are not one person */
      const list = everyone();
      const i = Math.max(0, list.findIndex(q => q.id === p.id));
      const a = (i / Math.max(1, list.length)) * Math.PI * 2;
      return { x: h.spot.x + Math.cos(a)*16, y: h.spot.y + Math.sin(a)*12, act };
    }
    return _routineHuddle.apply(this, arguments);
  };
}
if(typeof youRoutine === 'function'){
  const _youRoutineHuddle = youRoutine;
  youRoutine = function(){
    const h = S.huddle;
    if(h && h.phase){
      return { x: h.spot.x, y: h.spot.y + 20,
               act: h.phase === 'together' ? 'huddled together' : 'getting everyone in',
               state: 'idle' };
    }
    return _youRoutineHuddle.apply(this, arguments);
  };
}

/* drive it from the people ticker */
if(typeof tickPeople === 'function'){
  const _tickPeopleHuddle = tickPeople;
  tickPeople = function(dt){
    const r = _tickPeopleHuddle.apply(this, arguments);
    if(S && S.speed !== 0) tickHuddle(dt);
    return r;
  };
}

/* the trigger */
if(typeof lightningStrike === 'function'){
  const _strikeHuddle = lightningStrike;
  lightningStrike = function(){
    const r = _strikeHuddle.apply(this, arguments);
    /* the follow-up stroke should not restart the whole sequence */
    if(!S.huddle || !S.huddle.phase) startleAll();
    return r;
  };
}

/* =====================================================================
   TWO FIXES, FIVE FUN BUTTONS, AND GUESTS WHO ACTUALLY STAY

   Fix one: entering the code only opened a market on the transition
   from locked to unlocked. Since the unlock flag persists, anyone
   entering the code a second time — or on any later visit — got
   nothing at all. That is the "market not opening when code given".

   Fix two: the panel fold button sat at the top-right of the panel,
   directly over its header, covering the title. It is now a slim tab
   on the panel edge, clear of everything.

   Then: five weather buttons that fire the matching animation, and
   paying guests who stay in your tents and domes, wander about, talk,
   and can be watched with the roof off.
   ===================================================================== */

/* ---------- fix 1: the code always opens a market ---------- */
if(typeof G.tryUnlock === 'function'){
  const _tryUnlockAlways = G.tryUnlock;
  G.tryUnlock = function(){
    const v = ((document.getElementById('unlockin')||{}).value || '').trim();
    const correct = (typeof UNLOCK_CODE === 'string') && v === UNLOCK_CODE;
    const r = _tryUnlockAlways.apply(this, arguments);
    /* Do not gate this on the lock transition: the flag persists, so a
       returning player entering the code would otherwise get nothing. */
    if(correct && typeof marketInit === 'function'){
      marketInit();
      if(!S.market.active){
        S.market.next = S.day;
        if(typeof marketStart === 'function') marketStart();
      } else if(typeof G.openMarket === 'function'){
        setTimeout(()=>G.openMarket(), 300);
      }
    }
    return r;
  };
}

/* ---------- guests who stay ---------- */
/* Tourism buildings earn money; now they visibly hold somebody. Guests
   appear when you have somewhere to put them, wander round their tent,
   and say what they are enjoying. */
const GUEST_NAMES = ['Marta','Ellis','Jun','Priya','Tomas','Alina','Owen','Sana','Ravi','Beth'];
const GUEST_SHIRTS = ['#c47fa8','#5fb0d4','#e8a33d','#8f6fc4','#6bbf7a','#d4726a'];

const GUEST_LINES = {
  day:   ['Look at that view.','Best sleep I have had in years.','Is that the sea?',
          'Smells like rain coming.','The birds start early here.'],
  night: ['So many stars.','Cosy in here.','Listen — nothing at all.','Fire is lovely.'],
  storm: ['Glad we are under cover!','Hear that thunder?','Cosier for it, honestly.'],
  spa:   ['This water is perfect.','Ten more minutes.','Worth every cent.'],
};

function guestHomes(){
  return (S.objs||[]).filter(o=>{
    const a = (BPMAP[o.bp]||{}).art || '';
    return a === 'glamping' || a === 'dome';
  });
}

function guestsInit(){
  if(!S.guests) S.guests = [];
  const homes = guestHomes();
  /* one guest per tent or dome, and they leave if you remove it */
  S.guests = S.guests.filter(g => homes.some(h => h.id === g.home));
  homes.forEach((h, i)=>{
    if(S.guests.some(g => g.home === h.id)) return;
    const f = footprint(BPMAP[h.bp], h.rot);
    S.guests.push({
      id: 'gst' + h.id,
      home: h.id,
      name: GUEST_NAMES[(S.guests.length + i) % GUEST_NAMES.length],
      shirt: GUEST_SHIRTS[(S.guests.length + i) % GUEST_SHIRTS.length],
      x: (h.tx + f.w*0.5)*T, y: (h.ty + f.h + 0.4)*T,
      dir: 1, t: Math.random()*4, wx:0, wy:0, said: 0,
    });
  });
}

/* where a guest wants to be right now */
function guestGoal(g){
  const h = (S.objs||[]).find(o=>o.id === g.home);
  if(!h) return null;
  const f = footprint(BPMAP[h.bp], h.rot);
  const cx = (h.tx + f.w*0.5)*T, cy = (h.ty + f.h*0.5)*T;
  const night = (typeof isNight === 'function') && isNight();
  const storm = S.weather === 'storm';
  /* inside at night or in a storm, out on the deck otherwise */
  if(night || storm) return {x:cx, y:cy - f.h*T*0.12, act:'inside', inside:true};
  /* the spa, if this one is upgraded enough to have one */
  if((h.tier||0) >= 2 && Math.random() < 0.004)
    return {x:cx + f.w*T*0.26, y:cy + f.h*T*0.30, act:'in the spa', inside:false};
  return {x:cx + (g.wx||0), y:cy + f.h*T*0.34 + (g.wy||0), act:'on the deck', inside:false};
}

function tickGuests(dt){
  guestsInit();
  const night = (typeof isNight === 'function') && isNight();
  (S.guests||[]).forEach(g=>{
    const goal = guestGoal(g);
    if(!goal) return;
    g.act = goal.act; g.inside = goal.inside;
    const dx = goal.x - g.x, dy = goal.y - g.y, d = Math.hypot(dx, dy);
    if(d > 3){
      const spd = 42*dt;
      g.x += dx/d*Math.min(d, spd); g.y += dy/d*Math.min(d, spd);
      if(Math.abs(dx) > 0.4) g.dir = dx > 0 ? 1 : -1;
    } else {
      g.t = (g.t||0) + dt;
      if(g.t > 4){ g.t = 0; g.wx = (Math.random()-0.5)*30; g.wy = (Math.random()-0.5)*18; }
    }
    /* they talk now and then, about what is actually happening */
    g.said = (g.said||0) - dt;
    if(g.said <= 0 && Math.random() < dt*0.10){
      g.said = 18 + Math.random()*22;
      const pool = S.weather === 'storm' ? GUEST_LINES.storm
                 : g.act === 'in the spa' ? GUEST_LINES.spa
                 : night ? GUEST_LINES.night : GUEST_LINES.day;
      if(typeof speak === 'function') speak(g, pool[Math.floor(Math.random()*pool.length)]);
    }
  });
  paintGuests();
}

function guestLayer(){
  guestsInit();
  if(!(S.guests||[]).length) return '';
  return `<g id="guests">` + S.guests.map(g=>
    `<g class="npc guest" data-g="${g.id}" transform="translate(${n(g.x)},${n(g.y)})">
      <g class="youbob"><g transform="scale(${g.dir},1)">${person(0,0,1.0,g.shirt,null)}</g></g>
      <text class="nlab" y="-24" text-anchor="middle">${g.name}</text></g>`).join('') + `</g>`;
}

function paintGuests(){
  (S.guests||[]).forEach(g=>{
    const el = document.querySelector(`[data-g="${g.id}"]`);
    if(!el) return;
    el.setAttribute('transform', `translate(${n(g.x)},${n(g.y)})`);
    const flip = el.querySelector('.youbob > g');
    if(flip) flip.setAttribute('transform', `scale(${g.dir},1)`);
    /* under a roof you cannot see them, unless the roof is off */
    const hidden = g.inside && !SET('roofOff');
    el.style.opacity = hidden ? '0' : '';
  });
}

/* ---------- roof access for tents and domes ---------- */
/* The house cutaway already exists; this gives the tourism buildings the
   same treatment so lifting the roof shows the guest in bed. */
function tentInteriors(){
  if(!SET('roofOff')) return '';
  let s = '';
  guestHomes().forEach(h=>{
    const bp = BPMAP[h.bp], f = footprint(bp, h.rot);
    const w = f.w*T, hh = f.h*T;
    const X = h.tx*T, Y = h.ty*T;
    const dome = (bp.art === 'dome');
    s += `<g class="tentcut" transform="translate(${n(X)},${n(Y)})">`;
    /* floor */
    s += `<rect x="${n(w*0.10)}" y="${n(hh*0.10)}" width="${n(w*0.80)}" height="${n(hh*0.52)}"
      rx="${dome ? n(Math.min(w,hh)*0.30) : 4}" fill="#c9a878"/>`;
    for(let i=1;i<5;i++)
      s += `<line x1="${n(w*0.10)}" y1="${n(hh*(0.10+i*0.104))}" x2="${n(w*0.90)}" y2="${n(hh*(0.10+i*0.104))}"
        stroke="#ab8a5f" stroke-width="0.5" opacity=".65"/>`;
    /* a made bed */
    s += `<rect x="${n(w*0.18)}" y="${n(hh*0.16)}" width="${n(w*0.34)}" height="${n(hh*0.30)}" rx="2" fill="#8a6a45"/>`;
    s += `<rect x="${n(w*0.19)}" y="${n(hh*0.22)}" width="${n(w*0.32)}" height="${n(hh*0.22)}" rx="1.6" fill="#7f8fa6"/>`;
    s += `<rect x="${n(w*0.19)}" y="${n(hh*0.17)}" width="${n(w*0.32)}" height="${n(hh*0.06)}" rx="1.6" fill="#fbfdff"/>`;
    /* a rug, a lamp and a bag */
    s += `<ellipse cx="${n(w*0.68)}" cy="${n(hh*0.34)}" rx="${n(w*0.14)}" ry="${n(hh*0.11)}" fill="#9c5b52" opacity=".9"/>`;
    s += `<circle class="fx-bulb" cx="${n(w*0.80)}" cy="${n(hh*0.18)}" r="${n(hh*0.035)}" fill="#ffe9a8"/>`;
    s += `<rect x="${n(w*0.62)}" y="${n(hh*0.48)}" width="${n(w*0.11)}" height="${n(hh*0.09)}" rx="1.4" fill="#6b5642"/>`;
    /* outline so it reads as a cutaway */
    s += `<rect x="${n(w*0.10)}" y="${n(hh*0.10)}" width="${n(w*0.80)}" height="${n(hh*0.52)}"
      rx="${dome ? n(Math.min(w,hh)*0.30) : 4}" fill="none" stroke="#f2e9d8" stroke-width="1.4" opacity=".9"/>`;
    s += `</g>`;
  });
  return s;
}

/* guests and their interiors ride with the people layer */
const _peopleLayerGuests = peopleLayer;
peopleLayer = function(){
  return tentInteriors() + _peopleLayerGuests.apply(this, arguments) + guestLayer();
};

const _tickPeopleGuests = tickPeople;
tickPeople = function(dt){
  const r = _tickPeopleGuests.apply(this, arguments);
  if(S && S.speed !== 0) tickGuests(dt);
  return r;
};

(function funCss(){

  #funbar{display:inline-flex;gap:2px;margin-right:6px;}
  .funbtn{font-size:13px;padding:3px 6px;min-width:26px;line-height:1.2;}
  .funbtn.on{background:linear-gradient(180deg,#4d8f3c,#3a6f2c);border-color:#5fae48;}
  #guests .guest{transition:opacity .5s ease;}
  .tentcut{pointer-events:none;}
