        h += `<div class="row" style="color:#f0a898"><span>Season</span><b>wrong — half speed</b></div>`;
    } else h += `<div class="row"><span>Status</span><b>Empty bed</b></div>`;
    h += meter('Soil fertility', o.fert===undefined?1:o.fert, (o.fert||1)<0.4?'#e2705c':'linear-gradient(90deg,#6b5238,#c9a06a)');
    if(o.crop) h += meter('Weeds', o.weeds||0, (o.weeds||0)>0.5?'#e2705c':'#8a9a5a');
    h += row('Yield modifier', Math.round(cropMul(o)*100)+'%');
    if(o.last) h += row('Last crop', CROPS[o.last]?CROPS[o.last].name:'—');
  }
  if(bp.kind==='perennial'){
    h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Ripeness</span><b>${Math.round(o.stage*100)}%</b></div>
      <div class="bar"><i style="transform:scaleX(${(o.stage).toFixed(3)});background:linear-gradient(90deg,#a1503f,#e2603a)"></i></div></div>`;
    h += row('Each pick', `${bp.qty} × ${GOODS[bp.good].n}`);
    h += row('Worth today', fmt(bp.qty*sellPrice(bp.good)));
  }
  if(bp.kind==='animal'){
    h += row(bp.animal+'s', `${o.animals} / ${E.cap(o)}`);
    if(bp.animal!=='hive'){
      h += meter('Herd health', herdHealth(o), herdHealth(o)<0.45?'#e2705c':'linear-gradient(90deg,#4d8f3c,#7cc24f)');
      h += meter('Contentment', herdHappy(o), 'linear-gradient(90deg,#a98fd6,#d0b8f0)');
      h += meter('Pen cleanliness', o.care===undefined?1:o.care, (o.care||1)<0.4?'#e2705c':'linear-gradient(90deg,#8a6a4a,#c9a06a)');
      h += row('Output', Math.round(yieldMul(o)*100)+'% of normal');
      if(o.sick) h += `<div class="row" style="color:#f0a898"><span>Illness</span><b>halving output</b></div>`;
    }
    h += row('Waiting to collect', `${o.ready} ${GOODS[bp.good].n}`);
    h += row('Eats per day', (bp.feed*o.animals).toFixed(1)+' feed');
    if(o.hungry) h += `<div class="row" style="color:#f0a898"><span>Hungry</span><b>not producing</b></div>`;
  }
  if(bp.kind==='process'){
    if(o.recipe>=0){
      const rc = bp.recipes[o.recipe];
      h += row('Making', Object.keys(rc.out).map(k=>rc.out[k]+' '+GOODS[k].n).join(', '));
      h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Batch</span><b>${Math.round(o.prog*100)}%</b></div>
        <div class="bar"><i style="transform:scaleX(${(o.prog).toFixed(3)});background:linear-gradient(90deg,#a98fd6,#d0b8f0)"></i></div></div>`;
    }
    if(o.ready) h += row('Ready', o.ready+' crafted');
  }
  if(bp.kind==='water'){ h += row('Capacity', bp.cap+' L'); if(bp.gain) h += row('Refill', '+'+bp.gain+' L/day'); }
  if(bp.kind==='power'){ h += row('Output now', Math.round(bp.power*WEATHERS[S.weather].power)+' kW'); }
  if(bp.kind==='tourism'){
    h += row('Base', fmt(bp.income)+'/day');
    h += row('You earn', fmt(bp.income*charmMul()*st.tourmul)+'/day');
  }
  if(bp.kind==='shop'){ h += row('Sells', (bp.rate*(1+Math.min(1.6,st.charm/110))).toFixed(1)+' items/day'); }
  if(bp.charm) h += row('Charm', '+'+bp.charm);
  h += `</div>`;

  /* --- actions --- */
  h += `<div class="acts">`;
  if(bp.kind==='plot'){
    if(!o.crop){
      h += `</div><div class="ph" style="margin:4px -11px 8px;padding-left:0">Choose a seed</div><div class="seeds">`;
      Object.keys(CROPS).forEach(k=>{
        const cr = CROPS[k];
        const cost = Math.round(cr.seed*(bp.slots||1)*(1-stat().seedoff));
        const inSeason = cr.seasons.includes(S.season) || bp.shelter;
        const days = (cr.days/((bp.speed||1))).toFixed(1);
        const worth = cr.yield*(bp.slots||1)*sellPrice(k);
        h += `<button class="seed" ${S.cash<cost?'disabled':''} onclick="G.plant(${o.id},'${k}')"
          data-tip="${esc(`<b>${cr.name}</b><div class="tl"><span>Seed cost</span><span class="tk">${fmt(cost)}</span></div><div class="tl"><span>Ready in</span><b>~${days} days</b></div><div class="tl"><span>Harvest worth</span><span class="tk">${fmt(worth)}</span></div><div class="tl"><span>Profit</span><span class="tk">${fmt(worth-cost)}</span></div>${inSeason?'':'<hr><span class="warn">Out of season — grows at half speed outdoors.</span>'}`)}">
          <b>${cr.name} ${inSeason?'':'<span style="color:#e2705c">✱</span>'}</b>
          <small>${fmt(cost)} → ${fmt(worth)} · ${days}d</small></button>`;
      });
      h += `</div><div class="acts" style="margin-top:8px">`;
    } else {
      const ready = o.stage>=1;
      h += `<button class="act primary full" ${ready?'':'disabled'} onclick="G.harvest(${o.id})"
        data-tip="${esc(ready?`<b>Harvest</b>Adds ${CROPS[o.crop].yield*(bp.slots||1)} ${CROPS[o.crop].name} to your barn and gives XP.`:'<b>Not ready</b>Keep it watered and wait.')}">
        ${ready?'Harvest now':'Growing — '+Math.round(o.stage*100)+'%'}</button>`;
      h += `<button class="act" onclick="G.water(${o.id})" ${o.water>0.9||S.water<8?'disabled':''}
        data-tip="${esc('<b>Water this bed</b>Uses 8 L from storage. Dry beds stop growing completely.')}">Water (8L)</button>`;
      if(o.pest) h += `<button class="act" onclick="G.treat(${o.id})" ${S.cash<18?'disabled':''}
        data-tip="${esc('<b>Treat pests</b>$18. Removes the pest and restores full growth speed.')}">Treat pests $18</button>`;
      else h += `<button class="act" onclick="G.clearCrop(${o.id})" data-tip="${esc('<b>Pull the crop</b>Frees the bed immediately. You lose what is growing.')}">Clear bed</button>`;
      if((o.weeds||0) > 0.1) h += `<button class="act" onclick="G.weed(${o.id})"
        data-tip="${esc('<b>Weed the bed</b>Free. Weeds choke growth and cut your harvest.')}">Pull weeds</button>`;
    }
    if(o.crop || !o.crop){
      h += `<button class="act" ${S.cash<30||(o.fert||1)>0.95?'disabled':''} onclick="G.manure(${o.id})"
        data-tip="${esc('<b>Spread compost</b>$30. Restores soil fertility, which sets how big your harvest is.')}">Compost $30</button>`;
    }
  }
  if(bp.kind==='perennial'){
    const ready = o.stage>=1;
    h += `<button class="act primary full" ${ready?'':'disabled'} onclick="G.pick(${o.id},1)"
      data-tip="${esc(ready?`<b>Pick</b>${bp.qty} × ${GOODS[bp.good].n} into the barn.`:'<b>Still ripening</b>It regrows on its own — nothing to do.')}"
      >${ready?'Pick '+GOODS[bp.good].n:'Ripening — '+Math.round(o.stage*100)+'%'}</button>`;
  }
  if(bp.kind==='animal'){
    const cost = bp.buy;
    h += `<button class="act primary" ${o.animals>=bp.cap||S.cash<cost?'disabled':''} onclick="G.buyAnimal(${o.id})"
      data-tip="${esc(`<b>Buy a ${bp.animal}</b><div class="tl"><span>Cost</span><span class="tk">${fmt(cost)}</span></div><div class="tl"><span>Produces</span><b>${bp.per} ${GOODS[bp.good].n} every ${bp.cycle}d</b></div><div class="tl"><span>Pays back in</span><b>~${Math.ceil(cost/(bp.per*GOODS[bp.good].p/bp.cycle))} days</b></div>`)}">
      Buy ${bp.animal} ${fmt(cost)}</button>`;
    h += `<button class="act" ${o.ready<=0?'disabled':''} onclick="G.collect(${o.id})"
      data-tip="${esc('<b>Collect</b>Moves what they have produced into your barn.')}">Collect ${o.ready||''}</button>`;
    if(bp.animal!=='hive'){
      h += `<button class="act" ${(o.care||1)>0.92?'disabled':''} onclick="G.clean(${o.id})"
        data-tip="${esc('<b>Muck out the pen</b>Free. Dirty bedding drives illness, drops contentment and stops breeding.')}">Clean pen</button>`;
      h += `<button class="act" ${o.sick?'':'disabled'} onclick="G.vet(${o.id})"
        data-tip="${esc('<b>Call the vet</b>$45. Clears the illness and restores herd health.')}">Vet $45</button>`;
    }
  }
  if(bp.kind==='process'){
    h += `</div><div class="ph" style="margin:4px -11px 8px;padding-left:0">Recipes</div><div class="acts">`;
    bp.recipes.forEach((rc,i)=>{
      const inTxt = Object.keys(rc.in).map(k=>rc.in[k]+' '+GOODS[k].n).join(' + ');
      const outTxt = Object.keys(rc.out).map(k=>rc.out[k]+' '+GOODS[k].n).join(' + ');
      const inVal = Object.keys(rc.in).reduce((a,k)=>a+rc.in[k]*sellPrice(k),0);
      const outVal = Object.keys(rc.out).reduce((a,k)=>a+rc.out[k]*sellPrice(k),0);
      const have = canCraft(rc);
      h += `<button class="act full${o.recipe===i?' primary':''}" onclick="G.setRecipe(${o.id},${i})"
        data-tip="${esc(`<b>${outTxt}</b><div class="tl"><span>Needs</span><b>${inTxt}</b></div><div class="tl"><span>Takes</span><b>${rc.days} day${rc.days>1?'s':''}</b></div><div class="tl"><span>Input worth</span><span class="tk">${fmt(inVal)}</span></div><div class="tl"><span>Output worth</span><span class="tk">${fmt(outVal)}</span></div><div class="tl"><span>Gain</span><span class="tk">+${fmt(outVal-inVal)}</span></div>${have?'':'<hr><span class="warn">You do not have the ingredients yet.</span>'}`)}"
        style="text-align:left;${have?'':'opacity:.6'}">${inTxt} → <b>${outTxt}</b></button>`;
    });
    h += `<button class="act primary full" ${o.ready<=0?'disabled':''} onclick="G.collect(${o.id})">Collect batch ${o.ready||''}</button>`;
  }

  if(canUpgrade(o)){
    const nt = tOf(o)+1, c = upCost(o);
    h += `<button class="act primary full" ${S.cash<c?'disabled':''} onclick="upgrade(${o.id})"
      data-tip="${esc(`<b>Upgrade to ${TIERS[nt].n}</b>${upgradeBlurb(o)}<hr><div class="tl"><span>Cost</span><span class="tk">${fmt(c)}</span></div><div class="tl"><span>Look</span><b>visibly rebuilt</b></div>`)}">
      ⬆ Upgrade to ${TIERS[nt].n} — ${fmt(c)}</button>`;
  } else if(BPMAP[o.bp].kind!=='home'){
    h += `<div class="row" style="justify-content:center;color:var(--gold)"><b>Fully upgraded — Mk IV</b></div>`;
  }
  h += `<button class="act" onclick="G.rotate(${o.id})" data-tip="${esc('<b>Rotate 90°</b>Turns the building. Shortcut: press <kbd>R</kbd>.')}">↻ Rotate</button>`;
  h += `<button class="act" onclick="G.startMove(${o.id})" data-tip="${esc('<b>Move</b>Pick it up and drop it somewhere else. Free.')}">✥ Move</button>`;
  if(bp.kind!=='home'){
    const refund = Math.round(bp.cost*0.55);
    h += `<button class="act danger full" onclick="G.sellObj(${o.id})"
      data-tip="${esc(`<b>Remove</b>Refunds ${fmt(refund)} — 55% of what you paid.`)}">Remove (+${fmt(refund)})</button>`;
  }
  h += `</div></div>`;
  return h;
}
function row(k,v){ return `<div class="row"><span>${k}</span><b>${v}</b></div>`; }

function marketHTML(){
  const keys = Object.keys(S.store).filter(k=>S.store[k]>0)
    .sort((a,b)=> sellPrice(b)*S.store[b] - sellPrice(a)*S.store[a]);
  const total = keys.reduce((a,k)=>a+S.store[k]*sellPrice(k),0);
  let h = `<div style="padding:9px 10px;display:flex;gap:6px;align-items:center;border-bottom:1px solid var(--line)">
    <div style="flex:1"><div style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.07em">Barn value</div>
    <div style="font-size:17px;font-weight:800;color:var(--gold)">${fmt(total)}</div></div>
    <button class="act primary" style="flex:0 0 auto;padding:8px 14px" ${keys.length?'':'disabled'} onclick="G.sellAll()"
      data-tip="${esc('<b>Sell everything</b>Empties the barn at current prices. Keep stock back if you have orders to fill.')}">Sell all</button></div>`;
  if(!keys.length) h += `<div class="empty">Your barn is empty.<div style="margin-top:6px">Harvest a bed or collect from your animals.</div></div>`;
  keys.forEach(k=>{
    const g = GOODS[k], p = sellPrice(k), tr = S.prices[k];
    const arrow = tr>1.08?'<span class="trend up">▲</span>':tr<0.94?'<span class="trend down">▼</span>':'<span class="trend"></span>';
    h += `<div class="mrow" data-tip="${esc(`<b>${g.n}</b><div class="tl"><span>You have</span><b>${S.store[k]}</b></div><div class="tl"><span>Price today</span><span class="tk">${fmt(p)}</span></div><div class="tl"><span>Market</span><b>${Math.round((tr-1)*100)}% vs normal</b></div><hr><span class="tg">Prices drift daily. Hold stock when it is low, sell into a spike.</span>`)}">
      <svg class="gi" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6" fill="${g.c}"/><circle cx="6" cy="6" r="2" fill="#fff" opacity=".3"/></svg>
      <span class="nm">${g.n}</span>${arrow}<span class="qt">${S.store[k]}</span><span class="pr">${fmt(p)}</span>
      <button class="sellb" onclick="G.sell('${k}')">Sell</button></div>`;
  });
  h += `<div class="ph" style="margin-top:6px">Supplies</div>
    <div class="mrow"><svg class="gi" viewBox="0 0 16 16"><path d="M2 12c3-1 4-4 4-7 2 1 3 3 3 5 1-1 2-3 2-5 2 2 3 5 3 7z" fill="#c9c26a"/></svg>
      <span class="nm">Animal feed</span><span class="qt">${Math.round(S.feed)}</span>
      <button class="sellb" onclick="G.buyFeed(10)" ${S.cash<40?'disabled':''}
        data-tip="${esc('<b>Buy 10 feed — $40</b>A fodder patch grows this for free. Buying is the emergency option.')}">+10 $40</button></div>`;
  return h;
}

function jobsHTML(){
  if(!S.contracts.length) return `<div class="empty">No orders right now.<div style="margin-top:6px">New ones arrive most days.</div></div>`;
  return S.contracts.map(c=>{
    const have = S.store[c.gid]||0;
    const ok = have >= c.qty;
    const pct = Math.min(100, Math.round(have/c.qty*100));
    return `<div class="ctr${ok?' done':''}" data-tip="${esc(`<b>${c.who}</b>Wants ${c.qty} × ${GOODS[c.gid].n} within ${c.left} days.<hr><div class="tl"><span>Pays</span><span class="tk">${fmt(c.pay)}</span></div><div class="tl"><span>Market value</span><b>${fmt(c.qty*sellPrice(c.gid))}</b></div><div class="tl"><span>Bonus over market</span><span class="tk">+${fmt(Math.max(0,c.pay-c.qty*sellPrice(c.gid)))}</span></div>`)}">
      <div class="ch"><span class="cn">${c.who}</span><span class="cr">${fmt(c.pay)}</span></div>
      <div class="cd">${c.qty} × ${GOODS[c.gid].n} · ${c.left} day${c.left>1?'s':''} left</div>
      <div class="cf"><div class="bar"><i style="transform:scaleX(${(pct/100).toFixed(3)});background:${ok?'#7cc24f':'#e8a33d'}"></i></div>
        <span style="font-size:10px;color:var(--ink3)">${have}/${c.qty}</span>
        <button class="sellb" ${ok?'':'disabled'} onclick="G.deliver('${c.id}')">Deliver</button></div></div>`;
  }).join('');
}

/* ---------------- world badge / hints ---------------- */
function hint(){
  const st = stat();
  const empty = S.objs.filter(o=>BPMAP[o.bp].kind==='plot' && !o.crop).length;
  const ready = S.objs.filter(o=>{ const b=BPMAP[o.bp];
    return (b.kind==='plot'||b.kind==='perennial') && o.stage>=1; }).length;
  const coll  = S.objs.filter(o=>o.ready>0).length;
  const dry   = S.objs.filter(o=>BPMAP[o.bp].kind==='plot'&&o.crop&&o.water<0.25).length;
  if(ghost) return `Placing <b>${ghost.bp.name}</b> <kbd>R</kbd> rotate <kbd>Esc</kbd> cancel`;
  if(dry)   return `<span style="color:#f0a898">${dry} bed${dry>1?'s are':' is'} dry</span> — select and water`;
  if(ready) return `<span style="color:#cdeeb0">${ready} ready to harvest</span> — click the glowing markers`;
  if(coll)  return `<span style="color:#cdeeb0">${coll} building${coll>1?'s have':' has'} something to collect</span>`;
  if(empty) return `${empty} empty bed${empty>1?'s':''} — select one and pick a seed`;
  if(st.charm<30) return `Add flowers, trees and paths to raise charm — it multiplies visitor income`;
  return `Day ${S.day} · ${SEASONS[S.season].n} · ${WEATHERS[S.weather].n}`;
}

function ui(){
  renderStats(); renderBuild(); renderRight();
  $('#wbadge').innerHTML = hint();
  $('#buildHint').textContent = ghost ? 'Esc to stop' : '';
  const on = S.speed===0?'spd1':S.speed===1?'spd2':'spd3';
  ['spd1','spd2','spd3'].forEach(i=>$('#'+i).classList.toggle('on', i===on));
  const dn = $('#daynight');
  const w = WEATHERS[S.weather];
  dn.style.background = S.weather==='storm' ? 'linear-gradient(200deg,rgba(28,36,86,.42),rgba(20,30,50,.5))'
    : S.weather==='rain' ? 'linear-gradient(200deg,rgba(60,90,120,.26),rgba(40,60,90,.3))'
    : S.weather==='frost' ? 'linear-gradient(200deg,rgba(180,215,235,.2),rgba(150,190,220,.16))'
    : S.weather==='heat' ? 'linear-gradient(200deg,rgba(255,190,90,.16),rgba(255,150,60,.12))'
    : 'transparent';
}

function meter(label, v, col){
  const p = Math.round(clamp(v,0,1)*100);
  return `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between">
    <span>${label}</span><b>${p}%</b></div>
    <div class="bar"><i style="transform:scaleX(${(clamp(v,0,1)).toFixed(3)});background:${col}"></i></div></div>`;
}
function upgradeBlurb(o){
  const bp = BPMAP[o.bp], k = bp.kind;
  const map = {
    plot:'+1 planting slot and faster growth.',
    perennial:'Bigger pick and a shorter ripening cycle.',
    animal:'+50% pen capacity and more product per animal.',
    process:'Faster batches.',
    shop:'Sells noticeably faster.',
    tourism:'+50% nightly income.',
    water:'+60% storage and more daily refill.',
    power:'+50% generation.',
    feed:'+50% feed grown per day.',
    bonus:'A stronger farm-wide bonus.',
    decor:'More charm.',
    hub:'Unlocks the next tier of AI modules.',
  };
  return map[k] || 'Better in every way.';
}

      <span class="ai">${a.ic}</span>
      <span class="am"><b>${a.n}</b><small>${a.d}</small>
        <small style="color:${unlocked?'var(--gold)':'var(--red)'};margin-top:2px">
          ${unlocked ? `${a.power} kW · ${fmt(a.fee)}/day` : `Locked — needs hub ${TIERS[a.hub].n}`}</small></span>
      <button class="sw ${on?'on':''}" ${unlocked?'':'disabled'} onclick="G.toggleAuto('${a.id}')"
        aria-label="Toggle ${a.n}"></button></div>`;
  });

  const cfg = S.autoCfg || (S.autoCfg = {moist:0.5, reserve:10});
  h += `<div class="ph">Settings</div>
    <div style="padding:9px 11px">
      <div style="display:flex;justify-content:space-between;font-size:11.5px">
        <span data-tip="${esc('<b>Watering threshold</b>The irrigation controller tops up any bed that falls below this moisture level.')}">Water beds below</span>
        <b>${Math.round(cfg.moist*100)}%</b></div>
      <input type="range" min="20" max="90" value="${Math.round(cfg.moist*100)}"
        oninput="G.setCfg('moist', this.value/100)">
      <div style="display:flex;justify-content:space-between;font-size:11.5px;margin-top:9px">
        <span data-tip="${esc('<b>Stock reserve</b>Logistics keeps this many of each good in the barn and only sells the surplus. Raise it if the AI keeps selling what your recipes need.')}">Keep in barn</span>
        <b>${cfg.reserve} each</b></div>

/* ---------------------------------------------------------------
   1. HORIZON — layered depth beyond the property, per biome.
      Not true 3D: receding bands with atmospheric haze and parallax,
      which is what reads as distance on a top-down map.
   --------------------------------------------------------------- */
function horizonLayer(){
  const l = LANDMAP[S.landId];
  if(!l) return '';
  const B = l.biome, W = WPX, H = HPX;
  const band = (y,h,fill,op)=>`<rect x="${-W*0.3}" y="${n(y)}" width="${W*1.6}" height="${n(h)}" fill="${fill}" opacity="${op}"/>`;
  /* silhouette ridge: a jagged skyline at depth d (0 far, 1 near) */
  const ridge = (y, amp, fill, seed, op)=>{
    let d = `M${-W} ${n(y+amp)}`;
    for(let x=-W*0.3; x<=W*1.3; x+=64){
      const k = hash(seed + x*0.013);
      d += ` L${n(x)} ${n(y + amp - k*amp*1.9)}`;
    }
    d += ` L${W*1.3} ${n(y+amp*2)} L${-W*0.3} ${n(y+amp*2)} Z`;
    return `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  };
  let far='', mid='', near='';

  if(B==='mount' || B==='plateau'){
    far  = band(-260, 300, '#8fa4bd', .55) + ridge(-140, 120, '#7d92ad', 3, .8) + ridge(-120, 96, '#fbfdff', 3.4, .5);
    mid  = ridge(-40, 80, '#6b8299', .95, 5) ? ridge(-40, 80, '#6b8299', 5, .95) : '';
    near = ridge(20, 50, '#55705f', 7, 1);
  } else if(B==='lake' || B==='pond'){
    far  = band(-200, 240, '#7fa8c4', .6) + ridge(-90, 70, '#6d8f7a', 11, .75);
    mid  = `<rect x="${-W*0.3}" y="${-40}" width="${W*1.6}" height="150" fill="#4f8fb0" opacity=".85"/>` +
           `<rect x="${-W*0.3}" y="${-40}" width="${W*1.6}" height="150" fill="url(#gWater)" opacity=".5"/>`;
    for(let i=0;i<6;i++) mid += `<ellipse class="ripple" cx="${n(hash(i*2.3)*W*2-W*0.4)}" cy="${n(-30+hash(i*5)*130)}"
      rx="${n(14+hash(i)*26)}" ry="2.2" fill="#dff4fb" opacity=".3" style="animation-delay:${(hash(i)*3).toFixed(1)}s"/>`;
    near = ridge(96, 26, '#5d8442', 13, 1);
  } else if(B==='coast'){
    far  = band(-220, 200, '#9fc6da', .7);
    mid  = `<rect x="${-W*0.3}" y="${-30}" width="${W*1.6}" height="170" fill="#3f83a8"/>` +
           `<rect x="${-W*0.3}" y="${-30}" width="${W*1.6}" height="170" fill="url(#gWater)" opacity=".6"/>`;
    for(let i=0;i<4;i++) mid += `<rect class="surf" x="${-W*0.3}" y="${n(20+i*17)}" width="${W*1.6}" height="3"
      fill="#ffffff" opacity=".38" style="animation-delay:${(i*0.5).toFixed(1)}s"/>`;
    near = band(130, 46, '#e0d4ae', 1) + band(130, 10, '#efe6c8', 1);
  } else if(B==='forest'){
    far = band(-200, 240, '#5c7f5a', .5);
    mid = ''; near = '';
    for(let i=0;i<26;i++){
      const x = -W*0.4 + hash(i*1.7)*W*1.9, y = -30 + hash(i*3.9)*150;
      mid += conifer(x, y, 18+hash(i)*16, i);
    }
    near = ridge(120, 22, '#3d6b34', 17, 1);
  } else if(B==='river'){
    far  = band(-200, 220, '#9dbb92', .55) + ridge(-70, 56, '#6d8f6a', 19, .8);
    mid  = `<path d="M${-W} 40 Q ${W*0.3} -60 ${W*0.8} 30 T ${W*2} 10 L ${W*2} 130 Q ${W*0.9} 150 ${W*0.35} 70 T ${-W} 150 Z"
             fill="#4f8fb0" opacity=".9"/>`;
    near = ridge(120, 24, '#5d8442', 23, 1);
  } else if(B==='hill' || B==='valley'){
    far  = band(-220, 250, '#a8bd8e', .5) + ridge(-100, 90, '#8aa876', 29, .75);
    mid  = ridge(-20, 66, '#7a9a63', 31, .9);
    near = ridge(80, 40, '#5f8a48', 37, 1);
  } else if(B==='moor'){
    far  = band(-200, 230, '#b0ad86', .55) + ridge(-70, 46, '#93916f', 41, .7);
    mid  = ridge(10, 32, '#8a8a63', 43, .9);
    near = band(120, 40, '#7d8259', .9);
  } else if(B==='oasis'){
    far  = band(-220, 250, '#e2cf9e', .7) + ridge(-90, 76, '#d4bd85', 47, .8);
    mid  = ridge(-10, 52, '#c4a86d', 53, .9);
    near = ridge(96, 34, '#b09257', 59, 1);
  } else { /* orchard and anything else */
    far = band(-200, 230, '#9dbb7e', .5);
    mid = '';
    for(let i=0;i<20;i++){
      const x = -W*0.3 + hash(i*2.1)*W*1.7, y = -20 + hash(i*4.3)*140;
      mid += canopy(x,y,16+hash(i)*8,'url(#gCanopy)',i,false);
    }
    near = ridge(120, 22, '#5f8a48', 61, 1);
  }
  /* the same treatment mirrored along the bottom edge, flipped and hazier */
  const bottom = `<g transform="translate(0,${H}) scale(1,-1)" opacity=".72">${far}${mid}</g>`;
  return `<g id="horizon">
    <g class="hz-far"  data-par="0.25">${far}</g>
    <g class="hz-mid"  data-par="0.5">${mid}</g>
    <g class="hz-near" data-par="0.78">${near}</g>
    ${bottom}
    <rect x="${-W*0.3}" y="${-300}" width="${W*1.6}" height="${H+600}" fill="url(#gHaze)" pointer-events="none"/>
  </g>`;
}
/* horizon layers drift slower than the camera, which is what sells depth */
function parallax(){
  const g = document.getElementById('horizon');
  if(!g) return;
  ['hz-far','hz-mid','hz-near'].forEach(c=>{
    const el = g.querySelector('.'+c); if(!el) return;
    const p = parseFloat(el.dataset.par);
    el.setAttribute('transform', `translate(${n(-cam.x*(1-p)/cam.z*0.5)},${n(-cam.y*(1-p)/cam.z*0.35)})`);
  });
}

const FIRST = ['Ama','Rafi','Noor','Ilias','Sana','Tomas','Mira','Josef','Lena','Kaito',

function peopleInit(){

    ];
  }

    if(f.x===undefined){
      f.x = (FARM.x+4+Math.random()*4)*T; f.y = (FARM.y+4+Math.random()*4)*T;
      f.path=[]; f.state='idle'; f.dir=1; f.t=0; f.act='';
    }

  S.workers.forEach(w=>{

function workerBeds(){
  return S.objs.filter(o=>o.bp==='worker_cottage').reduce((a,o)=>a + 2 + tOf(o), 0);

function hireWorker(){
  peopleInit();
  if(S.workers.length >= workerBeds())
    return toast('Nowhere to house them — build a worker cottage','bad'), sfx('error');
  const name = FIRST[Math.floor(Math.random()*FIRST.length)];
  const skill = 1 + Math.floor(Math.random()*3);
  const wage = 900 + skill*280;
  const sign = Math.round(wage*0.5);
  if(S.cash < sign) return toast(`Signing-on fee is ${fmt(sign)}`,'bad'), sfx('error');
  S.cash -= sign;
  S.workers.push({id:'w'+Date.now(), name, skill, wage,
    x:(FARM.x+2)*T, y:(FARM.y+2)*T, path:[], state:'idle', dir:1, t:0, done:0});
  sfx('build');
  toast(`${name} joined the farm`,'good');
  log(`Hired ${name} (skill ${skill}) at ${fmt(wage)}/month.`,'gold');
  render(); ui(); G.save();
}
function fireWorker(id){
  peopleInit();
  const w = S.workers.find(z=>z.id===id); if(!w) return;
  S.workers = S.workers.filter(z=>z.id!==id);
  log(`${w.name} left the farm.`);
  toast(`${w.name} has gone`,''); sfx('remove');
  render(); ui(); G.save();
}
function workerWages(){ peopleInit(); return S.workers.reduce((a,w)=>a+w.wage,0); }

/* farmhands do a daily round of real jobs — cheaper than AI, but they eat wages */
function workersDay(){
  peopleInit();
  if(!S.workers.length) return;
  const housed = Math.min(S.workers.length, workerBeds());
  if(housed < S.workers.length)
    log(`${S.workers.length-housed} farmhand(s) have nowhere to sleep and did not work.`,'bad');
  let watered=0, harvested=0, collected=0, cleaned=0;
  S.workers.slice(0,housed).forEach(w=>{
    let budget = 2 + w.skill;                       // jobs per day
    S.objs.forEach(o=>{
      if(budget<=0) return;
      const bp = BPMAP[o.bp];
      if(bp.kind==='plot' && o.crop && o.water<0.5 && S.water>=8){ S.water-=8; o.water=1; watered++; budget--; }
      else if(bp.kind==='plot' && o.crop && o.stage>=1){
        const cr=CROPS[o.crop];
        const q=Math.max(1,Math.round(cr.yield*E.slots(o)*cropMul(o)*(0.75+w.skill*0.08)));
        give(o.crop,q); o.fert=clamp(o.fert-0.16,0.15,1); o.last=o.crop;
        o.crop=null;o.stage=0;o.weeds=0; harvested+=q; budget--; addXP(1);
      }
      else if(bp.kind==='animal' && o.ready>0){ give(bp.good,o.ready); collected+=o.ready; o.ready=0; budget--; }
      else if(bp.kind==='animal' && (o.care||1)<0.55){ o.care=1; cleaned++; budget--; }
    });
    w.done = (2+w.skill) - budget;
  });
  const bits=[];
  if(watered) bits.push(`watered ${watered}`);
  if(harvested) bits.push(`picked ${harvested}`);
  if(collected) bits.push(`collected ${collected}`);
  if(cleaned) bits.push(`cleaned ${cleaned}`);
  if(bits.length) log(`Farmhands: ${bits.join(', ')}.`,'good');
}

/* ---------------------------------------------------------------
   3. DAILY ROUTINES — the family live to a timetable
   --------------------------------------------------------------- */
function homeSpot(){
  const h = S.objs.find(o=>o.bp==='cabin');
  if(!h) return {x:(FARM.x+4)*T, y:(FARM.y+4)*T};
  const f = footprint(BPMAP[h.bp], h.rot);
  return {x:(h.tx+f.w/2)*T, y:(h.ty+f.h+0.6)*T};
}
function spotNear(bpId, fallback){
  const o = S.objs.find(z=>z.bp===bpId);
  if(!o) return fallback || homeSpot();
  const f = footprint(BPMAP[o.bp], o.rot);
  return {x:(o.tx+f.w/2)*T, y:(o.ty+f.h+0.5)*T};
}
/* returns {x,y,act} for this person at this time of day */
function routine(p){
  const f = dayFrac();
  const home = homeSpot();
  if(f < 0.24 || f > 0.88) return {...home, act:'asleep'};
  if(p.role==='child'){
    if(f < 0.38) return {...home, act:'breakfast'};
    if(f < 0.55) return {...spotNear('cabin'), act:'studying'};
    if(f < 0.74) return {...spotNear('playground', spotNear('flowers')), act:'playing'};
    return {...home, act:'with family'};
  }
  if(p.role==='partner'){
    if(f < 0.34) return {...home, act:'house chores'};
    if(f < 0.52){
      const bed = S.objs.find(o=>BPMAP[o.bp].kind==='plot');
      return bed ? {...spotNear(bed.bp), act:'tending the beds'} : {...home, act:'house chores'};
    }
    if(f < 0.70){
      const pen = S.objs.find(o=>BPMAP[o.bp].kind==='animal');
      return pen ? {...spotNear(pen.bp), act:'feeding the animals'} : {...home, act:'house chores'};
    }
    return {...home, act:'making dinner'};
  }
  /* farmhands drift between whatever they are working on */
  const jobs = S.objs.filter(o=>['plot','animal','perennial'].includes(BPMAP[o.bp].kind));
  if(jobs.length){
    const o = jobs[Math.floor(hash(p.id.length + Math.floor(f*7))*jobs.length)];
    const ft = footprint(BPMAP[o.bp], o.rot);
    return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.5)*T, act:'working'};
  }
  return {...home, act:'idle'};
}

function tickPeople(dt){
  if(!S || S.speed===0) return;
  peopleInit();
  const all = S.family.concat(S.workers.map(w=>({...w, role:'worker', _w:w})));
  S.family.forEach(p=>movePerson(p, dt));
  S.workers.forEach(p=>movePerson(p, dt));
  paintPeople();
}
function movePerson(p, dt){
  const goal = routine(p);
  p.act = goal.act;
  const d0 = Math.hypot(goal.x-p.x, goal.y-p.y);
  if(d0 > T*0.9){
    const spd = 78*dt;
    const dx = goal.x-p.x, dy = goal.y-p.y, d = Math.hypot(dx,dy);
    p.x += dx/d*Math.min(d,spd); p.y += dy/d*Math.min(d,spd);
    if(Math.abs(dx)>0.5) p.dir = dx>0?1:-1;
    p.state = 'walk';
  } else {
    /* potter about on the spot so nobody stands frozen */
    p.t = (p.t||0) + dt;
    if(p.t > 3){ p.t = 0; p.wx = (Math.random()-0.5)*26; p.wy = (Math.random()-0.5)*20; }
    const tx = goal.x + (p.wx||0), ty = goal.y + (p.wy||0);
    const dx = tx-p.x, dy = ty-p.y, d = Math.hypot(dx,dy);
    if(d > 2){ const spd=26*dt; p.x += dx/d*Math.min(d,spd); p.y += dy/d*Math.min(d,spd);
               if(Math.abs(dx)>0.5) p.dir = dx>0?1:-1; p.state='walk'; }
    else p.state = (goal.act==='asleep') ? 'sleep' : 'busy';
  }
}
function peopleLayer(){
  peopleInit();
  const one = (p, sc, shirt, hat) =>
    `<g class="npc" data-p="${p.id}" transform="translate(${n(p.x)},${n(p.y)})">
      <g class="youbob"><g transform="scale(${p.dir},1)">${person(0,0,sc,shirt,hat)}</g></g>
      <text class="nlab" y="-26" text-anchor="middle">${p.name}</text></g>`;
  return `<g id="people">
    ${S.family.map(f=>one(f, f.sc, f.shirt, f.role==='partner'?'#c47fa8':null)).join('')}
    ${S.workers.map(w=>one(w, 1.05, '#4f8a9c', '#e0c07a')).join('')}
  </g>`;
}
function paintPeople(){
  const upd = p=>{
    const el = document.querySelector(`[data-p="${p.id}"]`);
    if(!el) return;
    el.setAttribute('transform', `translate(${n(p.x)},${n(p.y)})`);
    el.style.opacity = p.state==='sleep' ? 0 : 1;
    const bob = el.firstElementChild;
    if(bob){
      bob.setAttribute('class','youbob'+(p.state==='walk'?' walking':p.state==='busy'?' working':''));
      const fl = bob.firstElementChild;
      if(fl) fl.setAttribute('transform',`scale(${p.dir},1)`);
    }
  };
  S.family.forEach(upd); S.workers.forEach(upd);
}

/* ---------------------------------------------------------------
   4. IDLE LIFE — when you have nothing queued, you join in
   --------------------------------------------------------------- */
const CHORES = ['stacking firewood','hanging the washing','fixing a fence','sweeping the yard',
                'mending a gate','carrying water','sorting seed trays'];
function tickIdle(dt){
  if(!S.you || S.you.state!=='idle') { S.idleT = 0; return; }
  if(S.settings && S.settings.familyLife === false) return;
  S.idleT = (S.idleT||0) + dt;
  if(S.idleT < 6) return;
  S.idleT = 0;
  peopleInit();
  /* half the time go and be with someone, otherwise do a chore */
  if(Math.random() < 0.55 && S.family.length){
    const f = S.family[Math.floor(Math.random()*S.family.length)];
    if(f.state==='sleep') return;
    S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                          Math.floor(f.x/T), Math.floor(f.y/T));
    S.you.state = 'walk';
    S.you.job = {kind:'family', fn:()=>{
      const acts = f.role==='child'
        ? [`played with ${f.name}`, `helped ${f.name} with homework`, `read to ${f.name}`]
        : [`had a cup of tea with ${f.name}`, `talked over the week with ${f.name}`, `walked the fence with ${f.name}`];
      const msg = acts[Math.floor(Math.random()*acts.length)];
      S.morale = clamp((S.morale||0.6) + 0.06, 0, 1);
      if(S.career) S.career.burnout = clamp(S.career.burnout - 0.05, 0, 0.6);
      log('You ' + msg + '.', 'good');
      floatNum('♥', innerWidth/2, innerHeight/2, '#ff9ec4');
    }};
  } else {
    const home = homeSpot();
    S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                          Math.floor(home.x/T), Math.floor(home.y/T));
    S.you.state = 'walk';
    const chore = CHORES[Math.floor(Math.random()*CHORES.length)];
    S.you.job = {kind:'chore', fn:()=>{
      S.morale = clamp((S.morale||0.6) + 0.03, 0, 1);
      log('You spent a while ' + chore + '.');
    }};
  }
}

/* The goods are already banked by the time this runs — this is the walk home
   with the crate, so nothing is ever lost if the trip is interrupted. */
function carryTo(goodId, qty){
  if(!S.you || S.you.state !== 'idle') return false;
  if(S.settings && S.settings.carry === false) return false;
  if(!GOODS[goodId]) return false;
  S.you.carry = {g:goodId, q:qty};
  const home = homeSpot();
  S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                        Math.floor(home.x/T), Math.floor(home.y/T));
  S.you.state = 'walk';
  S.you.job = {kind:'store', fn:()=>{
    S.you.carry = null;
    sfx('collect');
    render();
  }};
  return true;
}
function carryArt(){
  if(!S.you || !S.you.carry) return '';
  const g = GOODS[S.you.carry.g];
  const c = g ? g.c : '#8b6640';
  return `<g transform="translate(9,-4)">
    <rect x="-6" y="-5" width="12" height="9" rx="1.5" fill="#8b6640"/>
    <rect x="-6" y="-5" width="12" height="2.6" rx="1" fill="#a8814f"/>

}

function modal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.add('show'); }
function tileCentre(o){
  const f = footprint(BPMAP[o.bp], o.rot);
  const r = $('#world').getBoundingClientRect();
  return {x: r.left + cam.x + (o.tx+f.w/2)*T*cam.z, y: r.top + cam.y + (o.ty+f.h/2)*T*cam.z};
}

/* =====================================================================
   INPUT
   ===================================================================== */
function bindInput(){
  const vp = $('#viewport'), world = $('#world');
  let dragging=null, moved=0, dragObj=null;

  world.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    const t = screenToTile(e.clientX, e.clientY);
    moved = 0;
    if(ghost){ dragging={mode:'ghost'}; return; }
    const hit = e.target.closest && e.target.closest('.ob');
    if(hit){
      const o = S.objs.find(z=>z.id===+hit.dataset.id);
      dragObj = o ? {o, sx:e.clientX, sy:e.clientY, ox:o.tx, oy:o.ty} : null;
      dragging = {mode:'obj'};
    } else {
      dragging = {mode:'pan', sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y};
      vp.classList.add('panning');
    }
  });

  window.addEventListener('mousemove', e=>{
    if(ghost){
      const t = screenToTile(e.clientX, e.clientY);
      const f = footprint(ghost.bp, ghost.rot);
      const tx = clamp(t.tx - Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      const ty = clamp(t.ty - Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      if(tx!==ghost.tx || ty!==ghost.ty){ ghost.tx=tx; ghost.ty=ty; render(); }
    }
    if(!dragging) return;
    moved += Math.abs(e.movementX)+Math.abs(e.movementY);
    if(dragging.mode==='pan'){
      cam.x = dragging.cx + (e.clientX-dragging.sx);
      cam.y = dragging.cy + (e.clientY-dragging.sy);
      applyCam();
    } else if(dragging.mode==='obj' && dragObj && moved>6){
      const t = screenToTile(e.clientX, e.clientY);
      const o = dragObj.o, f = footprint(BPMAP[o.bp], o.rot);
      const tx = clamp(t.tx - Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      const ty = clamp(t.ty - Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      if((tx!==o.tx||ty!==o.ty) && !overlaps(tx,ty,f,o.id)){ o.tx=tx; o.ty=ty; render(); }
    }
  });

  window.addEventListener('mouseup', e=>{
    vp.classList.remove('panning');
    if(ghost && dragging && dragging.mode==='ghost' && moved<8){ G.commit(); }
    else if(dragging && dragging.mode==='obj' && dragObj){
      if(moved<8){ sel = dragObj.o.id; rightTab='insp';
        $$('.ptab').forEach((b,i)=>b.classList.toggle('on', i===0));
        render(); ui(); }
      else { G.save(); ui(); }
    }
    else if(dragging && dragging.mode==='pan' && moved<8){ sel=null; render(); ui(); }
    dragging=null; dragObj=null;
  });

  /* touch: pan + tap */
  let tstart=null;
  world.addEventListener('touchstart', e=>{
    const t0=e.touches[0];
    tstart={x:t0.clientX,y:t0.clientY,cx:cam.x,cy:cam.y,moved:0,tg:e.target};
  }, {passive:true});
  world.addEventListener('touchmove', e=>{
    if(!tstart) return;
    const t0=e.touches[0];
    tstart.moved += Math.abs(t0.clientX-tstart.x)+Math.abs(t0.clientY-tstart.y);
    if(ghost){
      const t = screenToTile(t0.clientX, t0.clientY);
      const f = footprint(ghost.bp, ghost.rot);
      ghost.tx = clamp(t.tx-Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      ghost.ty = clamp(t.ty-Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      render();
    } else {
      cam.x = tstart.cx + (t0.clientX-tstart.x); cam.y = tstart.cy + (t0.clientY-tstart.y);
      applyCam();
    }
  }, {passive:true});
  world.addEventListener('touchend', e=>{
    if(!tstart) return;
    if(tstart.moved < 12){
      if(ghost) G.commit();
      else {
        const hit = tstart.tg.closest && tstart.tg.closest('.ob');
        sel = hit ? +hit.dataset.id : null;
        render(); ui();
      }
    }
    tstart=null;
  });

  world.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = world.getBoundingClientRect();
    zoomAt(e.deltaY>0?-0.12:0.12, e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});

  /* tooltips */
  document.addEventListener('mousemove', e=>{
    const el = e.target.closest && e.target.closest('[data-tip]');
    if(el){ if(el!==tipTarget){ tipTarget=el; showTip(el.dataset.tip, e.clientX, e.clientY); }
      else { const t=tip(); const r=t.getBoundingClientRect();
        let tx=e.clientX+16, ty=e.clientY+16;
        if(tx+r.width>innerWidth-8) tx=e.clientX-r.width-14;
        if(ty+r.height>innerHeight-8) ty=e.clientY-r.height-14;
        t.style.left=Math.max(6,tx)+'px'; t.style.top=Math.max(6,ty)+'px'; }
      return;
    }
    const ob = e.target.closest && e.target.closest('.ob');
    if(ob){
      const o = S.objs.find(z=>z.id===+ob.dataset.id);
      if(o){ if(ob!==tipTarget){ tipTarget=ob; showTip(objTip(o), e.clientX, e.clientY); }
        else showTip(objTip(o), e.clientX, e.clientY);
        return; }
    }
    if(tipTarget) hideTip();
  });
  document.addEventListener('mouseleave', hideTip);

  /* keys */
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if(k==='escape'){ if(ghost) G.cancel(); else { sel=null; render(); ui(); } G.closeModal(); }
    else if(k==='r'){ if(ghost) G.rotGhost(); else if(sel) G.rotate(sel); }
    else if(k==='delete'||k==='backspace'){ if(sel){ e.preventDefault(); G.sellObj(sel); } }
    else if(k===' '){ e.preventDefault(); G.setSpeed(S.speed===0?1:0); }
    else if(k==='1'){ G.setSpeed(1); }
    else if(k==='2'){ G.setSpeed(3); }
    else if(k==='w'){ G.waterAll(); }
    else if(k==='h'){ G.openHelp(); }
    else if(k==='u'){ if(sel) upgrade(sel); }
    else if(k==='m'){ G.toggleSound(); }
    else if(k==='f'){ fitView(); }
  });

  $$('.ptab').forEach(b=> b.addEventListener('click', ()=>G.rt(b.dataset.rt, b)));
  $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') G.closeModal(); });
  window.addEventListener('resize', ()=>{ applyCam(); });
}

/* =====================================================================
   LOOP
   ===================================================================== */
function loop(t){
  if(window.__perfLoop) return;              // superseded by the unified frame
  rafId = requestAnimationFrame(loop);
  if(!lastT) lastT = t;
  const dt = Math.min(250, t-lastT); lastT = t;
  if(S.speed>0){
    if(S.settings && S.settings.dayLen) DAY_MS = S.settings.dayLen*1000;
    acc += dt*S.speed;
    if(acc >= DAY_MS){ acc -= DAY_MS; advanceDay(); }
  }
  const badge = $('#wbadge');
  if(badge && !badge.dataset.h){ }
  /* day progress on the badge border */
  const pct = Math.round(acc/DAY_MS*100);
  badge.style.background = `linear-gradient(90deg, rgba(124,194,79,.28) ${pct}%, rgba(10,16,8,.86) ${pct}%)`;
}

let uiTick = 0;


/* =====================================================================
   BOOT
   ===================================================================== */
(function boot(){
  const st = document.createElement('style'); st.textContent = SVGCSS; document.head.appendChild(st);
  const fresh = !G.load();
  if(fresh) newState();
  bindInput();
  ['pointerdown','keydown','touchstart'].forEach(ev=>
    window.addEventListener(ev, ()=>{
      SND.setMuted(!!S.muted);      // set BEFORE unlocking so a muted farm stays silent
      SND.unlock();
      const b=$('#sndBtn'); if(b){ b.textContent = S.muted?'🔇':'🔊'; b.classList.toggle('on', !S.muted); }
    }, {once:true}));
  render(); fitView(); ui();
  S.log.length ? (function(){ const el=$('#log');
    el.innerHTML = S.log.map(l=>`<div class="lg ${l.c}"><time>D${l.d}</time><span>${l.m}</span></div>`).join(''); })()
    : log('Welcome to Greenhollow.','good');
  if(fresh) setTimeout(()=>{ if(typeof landChooser==='function') modal(landChooser()); else G.openHelp(); }, 400);
  rafId = requestAnimationFrame(loop);
})();

/* ---------------- starting a farm on chosen land ---------------- */
function startFarm(land, home){
  const st = {
    v:5, day:1, season:3, weather:'sun', cash:(S&&S.settings&&S.settings.startCash)||520,
    xp:0, lvl:1, objs:[], nid:1, store:{}, water:60, feed:24, powerBal:0,
    contracts:[], log:[], speed:1, auto:{}, autoCfg:{moist:0.5,reserve:10}, autoLog:[],
    snd:{amb:true,mus:true}, muted:(S&&S.muted)||false, settings:(S&&S.settings)||{},
    seen:{}, totalEarned:0, harvests:0, seedsPlanted:0, prices:{}, tut:0,
    landId: land.id, homeId: home.id,
  };
  Object.keys(GOODS).forEach(k=> st.prices[k]=1);
  S = st;
  settingsInit(); careerInit();
  resizeLand(land);
  terrainCache = '';
  /* the house you picked, then a starter kit */
  const cx = FARM.x + Math.floor(FARM.w/2) - 3, cy = FARM.y + Math.floor(FARM.h/2) - 2;
  place('cabin', cx, cy, 0, true);
  place('bed', FARM.x+2, FARM.y+FARM.h-4, 0, true);
  place('bed', FARM.x+6, FARM.y+FARM.h-4, 0, true);
  place('tank', FARM.x+2, FARM.y+2, 0, true);
  place('tree_native', FARM.x+FARM.w-4, FARM.y+2, 0, true);
  place('tree_shade', FARM.x+1, FARM.y+FARM.h-8, 0, true);
  S.you = null; youInit();
  rollContracts(); rollJobs();
  sel=null; ghost=null;
  render(); fitView(); ui();
  log(`Settled at a ${land.name.toLowerCase()} — ${home.name}.`,'gold');
  toast(`Welcome to your ${land.bn.toLowerCase()} farm`,'gold');
}
function resizeLand(land){
  WT = land.w + 8; HT = land.h + 6;
  WPX = WT*T; HPX = HT*T;
  FARM.x = 3; FARM.y = 3; FARM.w = land.w; FARM.h = land.h;
  terrainCache = '';
}

function SET(k){

  Relaxed : {sell:1.25, seed:0.75, pest:0.5, upkeep:0.7, growth:1.15},
  Standard: {sell:1.00, seed:1.00, pest:1.0, upkeep:1.0, growth:1.00},

    const o = S.objs.find(z=>z.id===id);

    if(o && cr){
      const base = Math.round(cr.seed*E.slots(o)*(1-stat().seedoff));
      const real = Math.round(base * diff().seed * (SET('seedCost')/100));
      const extra = real - base;
      if(extra !== 0){
        if(S.cash < real) return toast('Not enough cash','bad'), sfx('error');
        S.cash -= extra;
      }
    }
    _plant2.call(G, id, ck);
  };
}

G.collectAll = function(){
  let n0=0;
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(o.ready>0){ if(bp.kind==='animal') give(bp.good,o.ready); n0+=o.ready; o.ready=0; }
    if(bp.kind==='perennial' && o.stage>=1){ give(bp.good, E.qty(o)); n0+=E.qty(o); o.stage=0; }
    if(bp.kind==='plot' && o.crop && o.stage>=1){
      const cr=CROPS[o.crop];
      const q=Math.max(1,Math.round(cr.yield*E.slots(o)*cropMul(o)));
      give(o.crop,q); n0+=q; o.fert=clamp(o.fert-0.16,0.15,1); o.last=o.crop;
      o.crop=null;o.stage=0;o.weeds=0;
    }
  });
  if(n0){ addXP(Math.round(n0/2)); sfx('harvest'); toast(`Gathered ${n0} items`,'good'); }
  else { sfx('error'); toast('Nothing ready','' ); }
  render(); ui(); G.save();
};

/* ---------------- SIMULATION KNOBS ---------------- */
if(typeof advanceDay === 'function'){
  const _adv = advanceDay;
  advanceDay = function(){
    /* season length */
    const sl = SET('seasonLen');
    const beforeSeason = S.season;
    _adv();
    if(sl !== 28){
      /* the base engine flips seasons every 28 days; re-derive from the setting */
      S.season = Math.floor((S.day-1)/sl) % 4;
      if(S.season !== beforeSeason && S.day > 1) log(`${SEASONS[S.season].n} begins.`,'gold');
    }
    partnerHelps();
  };
}
/* pest and breeding frequency, and market swing */
if(typeof dailySoil === 'function'){
  const _soil = dailySoil;
  dailySoil = function(o){ _soil(o); };
}
(function knobs(){
  const _random = Math.random;
  /* market volatility: rescale the daily drift the engine just applied */
  const _adv2 = advanceDay;
  advanceDay = function(){
    const before = {...S.prices};
    _adv2();
    const k = SET('priceSwing')/50;
    if(k !== 1) Object.keys(S.prices).forEach(g=>{
      S.prices[g] = clamp(before[g] + (S.prices[g]-before[g])*k, 0.6, 1.7);
    });
    /* contract frequency */
    const cr = SET('contractRate')/60;
    if(cr > 1 && S.contracts.length < 5 && _random() < (cr-1)*0.5) rollContracts(1);
    if(cr < 1 && S.contracts.length > 1 && _random() < (1-cr)*0.25) S.contracts.pop();
  };
})();

/* weather volatility: at 0 the climate is placid, at 100 extremes are common */
if(typeof rollWeather === 'function'){
  const _roll = rollWeather;
  rollWeather = function(){
    _roll();
    const v = SET('weatherVol')/50;                 // 1 = as designed
    const extreme = ['storm','frost','heat'];
    const isExtreme = extreme.includes(S.weather);
    if(isExtreme && v < 1 && Math.random() > v){
      S.weather = ['sun','cloud','rain'][Math.floor(Math.random()*3)];
    } else if(!isExtreme && v > 1 && Math.random() < (v-1)*0.35){
      const tbl = (typeof landWeatherTable==='function') ? landWeatherTable() : [];
      const pool = tbl.filter(w=>extreme.includes(w));
      if(pool.length) S.weather = pool[Math.floor(Math.random()*pool.length)];
    }
  };
}

/* ---------------- YOUR PARTNER PULLS HER WEIGHT ---------------- */
/* A partner on a family farm realistically gives about a third of a working
   day to it — the rest goes to the house and the children. That is roughly
   3 of the 10 daily hours, so she clears about 30% of the outstanding jobs. */
function partnerHelps(){
  if(!SET('familyLife')) return;
  peopleInit();
  const p = S.family.find(f=>f.role==='partner');
  if(!p) return;

  /* everything that needs doing today */
  const chores = [];
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind==='plot' && o.crop && o.water < 0.4) chores.push({o, t:'water'});
    if(bp.kind==='plot' && o.crop && o.stage >= 1)  chores.push({o, t:'harvest'});
    if(bp.kind==='plot' && (o.weeds||0) > 0.5)      chores.push({o, t:'weed'});
    if(bp.kind==='animal' && o.ready > 0)           chores.push({o, t:'collect'});
    if(bp.kind==='animal' && (o.care||1) < 0.5)     chores.push({o, t:'clean'});
    if(bp.kind==='perennial' && o.stage >= 1)       chores.push({o, t:'pick'});
  });
  if(!chores.length){ p.helped = 0; return; }

  /* 30% of the list, capped at what three hours can realistically cover */
  const share = Math.min(4, Math.max(1, Math.round(chores.length * 0.3)));
  let did = 0, picked = 0;
  for(let i=0; i<chores.length && did<share; i++){
    const c = chores[i], o = c.o, bp = BPMAP[o.bp];
    if(c.t==='water' && S.water >= 8){ S.water -= 8; o.water = 1; did++; }
    else if(c.t==='harvest'){
      const cr = CROPS[o.crop];
      const q = Math.max(1, Math.round(cr.yield*E.slots(o)*cropMul(o)));
      give(o.crop, q); picked += q;
      o.fert = clamp(o.fert-0.16, 0.15, 1); o.last = o.crop;
      o.crop = null; o.stage = 0; o.weeds = 0; did++;
    }
    else if(c.t==='pick'){ const q = E.qty(o); give(bp.good, q); picked += q; o.stage = 0; did++; }
    else if(c.t==='collect'){ give(bp.good, o.ready); picked += o.ready; o.ready = 0; did++; }
    else if(c.t==='clean'){ o.care = 1; did++; }
    else if(c.t==='weed'){ o.weeds = 0; did++; }
  }
  p.helped = did;
  if(did){
    S.morale = clamp((S.morale||0.6) + 0.02, 0, 1);
    log(`${p.name} got through ${did} job${did>1?'s':''} around the farm${picked?` and brought in ${picked}`:''}.`, 'good');
  }
}

/* ---------------------------------------------------------------
   BUG 1 — "Fit" framed the whole world canvas instead of your land.
   The canvas is much bigger than the property (it carries the
   horizon), so fitting it left the farm tiny in a sea of margin.
   --------------------------------------------------------------- */
fitView = function(){
  const world = document.getElementById('world');
  if(!world) return;
  const arc = document.getElementById('sunarc');
  const arcH = (arc && arc.style.display !== 'none') ? arc.getBoundingClientRect().height : 0;

  /* The container can report zero height while the grid is still settling
     (or if a layout rule collapses it). Fall back to the window rather than
     dividing by nothing and flinging the camera off-screen. */
  let w = world.clientWidth, h = world.clientHeight;
  if(w < 40){
    const left = document.getElementById('left'), right = document.getElementById('right');
    const sideW = (left ? left.clientWidth : 0) + (right ? right.clientWidth : 0);
    w = Math.max(240, window.innerWidth - sideW);
  }
  if(h < 40 + arcH){
    const top = document.getElementById('top'), tabs = document.getElementById('mobtabs');
    const chrome = (top ? top.offsetHeight : 0) + (tabs ? tabs.offsetHeight : 0);
    h = Math.max(240, window.innerHeight - chrome);
  }
  const availH = Math.max(120, h - arcH);

  const pad = T * 1.2;
  const pw = FARM.w*T + pad*2, ph = FARM.h*T + pad*2;
  cam.z = clamp(Math.min(w/pw, availH/ph), 0.18, 2.6);
  const px = FARM.x*T - pad, py = FARM.y*T - pad;
  cam.x = (w - pw*cam.z)/2 - px*cam.z;
  cam.y = (availH - ph*cam.z)/2 - py*cam.z + arcH;

  /* Post-condition: the property must actually be visible. If anything above
     went wrong, put it somewhere sane rather than leaving a blank screen. */
  const sx = FARM.x*T*cam.z + cam.x, sy = FARM.y*T*cam.z + cam.y;
  const sw = FARM.w*T*cam.z, sh = FARM.h*T*cam.z;
  if(!isFinite(sx) || !isFinite(sy) || sx+sw < 20 || sy+sh < 20 || sx > w-20 || sy > h-20){
    cam.z = clamp(Math.min(w/pw, availH/ph), 0.18, 2.6) || 0.6;
    cam.x = w/2  - (FARM.x + FARM.w/2)*T*cam.z;
    cam.y = arcH + availH/2 - (FARM.y + FARM.h/2)*T*cam.z;
  }
  applyCam();
};
/* run after layout has settled, so a fit during a resize measures real boxes */
G.fit = function(){
  sfx('click');
  fitView();
  requestAnimationFrame(()=> requestAnimationFrame(fitView));
};

/* ---------------------------------------------------------------
   ROADS — people follow the gravel unless the detour is silly
   --------------------------------------------------------------- */
function isRoadTile(x,y){
  return S.objs.some(o=>{
    if(!MERGE_ROAD[o.bp] && o.bp!=='ring' && o.bp!=='parking') return false;
    const f = footprint(BPMAP[o.bp], o.rot);
    return x>=o.tx && x<o.tx+f.w && y>=o.ty && y<o.ty+f.h;
  });
}
/* weighted A*: a road step costs a third of a step across open ground,
   so a route will happily bend a long way to pick up a path */
function findPathWeighted(sx,sy,gx,gy){
  const key=(x,y)=>x+','+y;
  const H=(x,y)=>(Math.abs(x-gx)+Math.abs(y-gy))*0.34;
  const open=[{x:sx,y:sy,g:0,f:0,p:null}], best={[key(sx,sy)]:0};
  let goal=null, guard=0;
  while(open.length && guard++ < 9000){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].f<open[bi].f) bi=i;
    const cur = open.splice(bi,1)[0];
    if(Math.abs(cur.x-gx)<=1 && Math.abs(cur.y-gy)<=1){ goal=cur; break; }
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      const nx=cur.x+d[0], ny=cur.y+d[1];
      if(blockedTile(nx,ny)) return;
      const step = isRoadTile(nx,ny) ? 0.34 : 1;
      const g = cur.g + step, k = key(nx,ny);
      if(best[k]!==undefined && best[k]<=g) return;
      best[k]=g;
      open.push({x:nx,y:ny,g,f:g+H(nx,ny),p:cur});
    });
  }
  if(!goal) return null;
  const path=[]; let c=goal;
  while(c){ path.unshift({x:c.x,y:c.y}); c=c.p; }
  return {path:path.slice(1), cost:goal.g};
}
/* Replace the plain router. If following the road would take more than
   ~75% longer in actual steps, the walker judges it not worth it. */
const _findPathPlain = findPath;
findPath = function(sx,sy,gx,gy){
  if(!S.objs.some(o=>MERGE_ROAD[o.bp]||o.bp==='ring'||o.bp==='parking'))
    return _findPathPlain(sx,sy,gx,gy);
  const roadRoute = findPathWeighted(sx,sy,gx,gy);
  const direct = _findPathPlain(sx,sy,gx,gy);
  if(!roadRoute) return direct;
  if(!direct || !direct.length) return roadRoute.path;
  if(roadRoute.path.length > direct.length * 1.75) return direct;   // detour not worth it
  return roadRoute.path;
};

/* recreation lifts morale each day, and the family use it */
function recreationDay(){
  const recs = S.objs.filter(o=>BPMAP[o.bp].kind==='rec');
  if(!recs.length) return;
  const kid = recs.filter(o=>BPMAP[o.bp].who==='child').length;
  const adult = recs.filter(o=>BPMAP[o.bp].who==='adult').length;
  const lift = Math.min(0.09, (kid*0.02 + adult*0.025));
  S.morale = clamp((S.morale||0.6) + lift, 0, 1);
  if(S.career) S.career.burnout = clamp(S.career.burnout - lift*0.5, 0, 0.6);
}

/* ---------------------------------------------------------------
   The family use the recreation and the craft buildings
   --------------------------------------------------------------- */
const _routine = routine;
routine = function(p){
  const f = dayFrac();
  if(f < 0.24 || f > 0.88) return _routine(p);
  const want = p.role==='child' ? 'child' : 'adult';
  const recs = S.objs.filter(o=>BPMAP[o.bp].kind==='rec' && BPMAP[o.bp].who===want);
  /* children play mid-afternoon; adults unwind in the evening */
  const playtime = p.role==='child' ? (f>0.55 && f<0.78) : (f>0.70 && f<0.86);
  if(playtime && recs.length){
    const o = recs[Math.floor(hash(p.id.length*3 + Math.floor(f*9))*recs.length)];
    const ft = footprint(BPMAP[o.bp], o.rot);
    return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.4)*T, act:BPMAP[o.bp].act};
  }
  /* partner does a turn in whichever craft building is running */
  if(p.role==='partner' && f>0.52 && f<0.70){
    const craft = S.objs.filter(o=>BPMAP[o.bp].kind==='process' && o.recipe>=0);
    if(craft.length){
      const o = craft[0], ft = footprint(BPMAP[o.bp], o.rot);
      return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.4)*T, act:'working in the '+BPMAP[o.bp].name.toLowerCase()};
    }
  }
  return _routine(p);
};

/* ---------------------------------------------------------------
   EXPANSION — when the land fills up, buy the adjoining paddock
   --------------------------------------------------------------- */
function farmUsage(){
  const used = S.objs.reduce((a,o)=>{
    const f = footprint(BPMAP[o.bp], o.rot); return a + f.w*f.h;
  }, 0);
  return {used, total: FARM.w*FARM.h, pct: used/(FARM.w*FARM.h)};
}
function expandCost(){
  const n0 = S.expansions||0;
  return Math.round(2400 * Math.pow(1.85, n0));
}
function canExpand(){
  /* the world canvas grows to suit in expandFarm(), so the only real
     limit is how many parcels the neighbours will sell */
  return (S.expansions||0) < 4;
}
function expandFarm(){
  if(!canExpand()) return toast('No more adjoining land for sale','bad'), sfx('error');
  const c = expandCost();
  if(S.cash < c) return toast(`The neighbour wants ${fmt(c)} for it`,'bad'), sfx('error');
  S.cash -= c;
  S.expansions = (S.expansions||0) + 1;
  /* grow the fenced area; the world canvas grows with it if needed */
  const addW = 4, addH = 3;
  if(FARM.x + FARM.w + addW > WT-3){ WT += addW+2; WPX = WT*T; }
  if(FARM.y + FARM.h + addH > HT-3){ HT += addH+2; HPX = HT*T; }
  FARM.w += addW; FARM.h += addH;
  terrainCache = '';
  sfx('upgrade');
  toast(`Bought the adjoining paddock — ${FARM.w}×${FARM.h} now`,'gold');
  log(`Bought ${addW}×${addH} tiles of adjoining land for ${fmt(c)}. Rates will rise.`,'gold');
  render(); fitView(); ui(); G.save();
}

   --------------------------------------------------------------- */
/* Animating a CSS filter over a group this large forced a full repaint every
   frame. Opacity on flat overlay rects composites on the GPU instead. */
function tintHorizon(){
  const g = document.getElementById('horizon');
  if(!g || typeof skyNow!=='function') return;
  const s = skyNow(), wx = S.weather;

  let tint = g.querySelector('.hz-tint');
  let grey = g.querySelector('.hz-grey');
  if(!tint){
    const mk = cls => {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('class', cls);
      r.setAttribute('x', -WPX*0.3); r.setAttribute('y', -400);
      r.setAttribute('width', WPX*1.6); r.setAttribute('height', HPX+800);
      r.style.pointerEvents='none';
      g.appendChild(r); return r;
    };
    tint = mk('hz-tint'); grey = mk('hz-grey');
    grey.setAttribute('fill', '#6b7a80');
  }
  /* time of day: warm at the edges of the day, deep blue at night */
  tint.setAttribute('fill', s.hz);
  tint.setAttribute('opacity', (0.08 + s.l*0.55).toFixed(3));
  /* weather: a flat grey veil stands in for desaturation */
  const veil = wx==='storm' ? 0.42 : wx==='rain' ? 0.26 : wx==='cloud' ? 0.13 : 0;
  grey.setAttribute('opacity', veil.toFixed(3));
  g.style.filter = '';
}

const FAM_LIMITS = {partner:1, adult:2, child:5};
const FAM_COST   = {partner:380, adult:340, child:240};   // per month, per head
const FAM_NAMES  = {
  partner:['Rina','Sofia','Amara','Noor','Elin','Maya','Tara','Iris'],
  adult  :['Dad','Mum','Uncle Ray','Aunt Bea','Nana','Grandad','Kaya','Milo'],
  child  :['Arjun','Lila','Sam','Zara','Theo','Anya','Rafi','Nina','Ivo','Suri'],
};
const FAM_SHIRT = {
  partner:'#8f6fc4', adult:'#4f8a9c',
  child:['#e8a33d','#5fb0d4','#dd6f9c','#7cc24f','#e2705c'],
};

function famCount(role){ peopleInit(); return S.family.filter(f=>f.role===role).length; }
function canAdd(role){ return famCount(role) < FAM_LIMITS[role]; }
function householdCost(){
  peopleInit();
  return S.family.reduce((a,f)=> a + (FAM_COST[f.role]||0), 0);
}

function addFamily(role){
  peopleInit();
  if(!canAdd(role)){
    const limit = FAM_LIMITS[role];
    return toast(`Room for ${limit} ${role}${limit>1?'s':''} at most`,'bad'), sfx('error');
  }
  const used = S.family.map(f=>f.name);
  const pool = FAM_NAMES[role].filter(n=>!used.includes(n));
  const name = pool.length ? pool[Math.floor(Math.random()*pool.length)]
                           : role.charAt(0).toUpperCase()+role.slice(1)+' '+(famCount(role)+1);
  const kids = famCount('child');
  const f = {
    id:'f'+Date.now()+Math.floor(Math.random()*999),
    role, name,
    shirt: role==='child' ? FAM_SHIRT.child[kids % FAM_SHIRT.child.length] : FAM_SHIRT[role],
    sc: role==='child' ? (0.66 + Math.random()*0.16) : (1.02 + Math.random()*0.1),
    x:(FARM.x+4)*T, y:(FARM.y+4)*T, path:[], state:'idle', dir:1, t:0, act:'', helped:0
  };
  S.family.push(f);
  sfx('collect');
  toast(`${name} joined the household`,'good');
  log(`${name} moved in. Household costs are now ${fmt(householdCost())}/month.`,'gold');
  render(); ui(); G.save();
}

function removeFamily(id){
  peopleInit();
  const f = S.family.find(z=>z.id===id);
  if(!f) return;
  if(SET('confirmSell') && !confirm(`${f.name} moves away from the farm?`)) return;
  S.family = S.family.filter(z=>z.id!==id);
  S.morale = clamp((S.morale||0.6) - 0.08, 0, 1);
  sfx('remove');
  toast(`${f.name} has moved away`,'');
  log(`${f.name} moved away.`);
  render(); ui(); G.save();
}

/* household costs join the monthly ledger */
if(typeof outgoings === 'function'){
  const _out18 = outgoings;
  outgoings = function(){
    const o = _out18();
    if(!o.total && !SET('billsOn')) return o;
    o.household = householdCost();
    o.total += o.household;

/* every adult in the house pitches in; the partner most of all */
if(typeof partnerHelps === 'function'){
  partnerHelps = function(){
    if(!SET('familyLife')) return;
    peopleInit();
    const helpers = S.family.filter(f=>f.role==='partner' || f.role==='adult');
    if(!helpers.length) return;

    const chores = [];
    S.objs.forEach(o=>{
      const bp = BPMAP[o.bp];
      if(bp.kind==='plot' && o.crop && o.water < 0.4) chores.push({o, t:'water'});
      if(bp.kind==='plot' && o.crop && o.stage >= 1)  chores.push({o, t:'harvest'});
      if(bp.kind==='plot' && (o.weeds||0) > 0.5)      chores.push({o, t:'weed'});
      if(bp.kind==='animal' && o.ready > 0)           chores.push({o, t:'collect'});
      if(bp.kind==='animal' && (o.care||1) < 0.5)     chores.push({o, t:'clean'});
      if(bp.kind==='perennial' && o.stage >= 1)       chores.push({o, t:'pick'});
    });
    if(!chores.length){ helpers.forEach(h=>h.helped=0); return; }

    let idx = 0, picked = 0;
    helpers.forEach(p=>{
      /* a partner gives about a third of the list; another adult about half that */
      const rate = p.role==='partner' ? 0.30 : 0.15;
      const cap  = p.role==='partner' ? 4 : 2;
      const share = Math.min(cap, Math.max(1, Math.round(chores.length * rate)));
      let did = 0;
      while(idx < chores.length && did < share){
        const c = chores[idx++], o = c.o, bp = BPMAP[o.bp];
        if(c.t==='water' && S.water >= 8){ S.water -= 8; o.water = 1; did++; }
        else if(c.t==='harvest'){
          const cr = CROPS[o.crop];
          const q = Math.max(1, Math.round(cr.yield*E.slots(o)*cropMul(o)));
          give(o.crop, q); picked += q;
          o.fert = clamp(o.fert-0.16, 0.15, 1); o.last = o.crop;
          o.crop = null; o.stage = 0; o.weeds = 0; did++;
        }
        else if(c.t==='pick'){ const q=E.qty(o); give(bp.good,q); picked+=q; o.stage=0; did++; }
        else if(c.t==='collect'){ give(bp.good,o.ready); picked+=o.ready; o.ready=0; did++; }
        else if(c.t==='clean'){ o.care = 1; did++; }
        else if(c.t==='weed'){ o.weeds = 0; did++; }
      }
      p.helped = did;
    });
    const total = helpers.reduce((a,h)=>a+(h.helped||0),0);
    if(total){
      S.morale = clamp((S.morale||0.6) + 0.02, 0, 1);
      const who = helpers.filter(h=>h.helped).map(h=>h.name).join(' and ');
      log(`${who} got through ${total} job${total>1?'s':''} around the farm${picked?` and brought in ${picked}`:''}.`, 'good');
    }
  };
}

}

/* =====================================================================

   just decorate it. Mk I is a shed; Mk IV is a plant.
