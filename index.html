/* =====================================================================
   ARCHITECTURE ON UPGRADE

   Only seven of the fifty-two upgradeable objects changed shape when you
   paid to improve them; the rest just got better numbers. This file gives
   every one of them a real progression.

   The idea running through it: upgrading does not sprawl, it consolidates.
   Mk I is a rough single volume. Mk II bolts on the lean-to you would
   actually build first. Mk III pulls it into one compact footprint with a
   clerestory and a paved apron. Mk IV is the architectural version —
   standing seam, glazing, solar, planting.

   Living things follow the same arc differently: they grow, thicken and
   gain the infrastructure a serious grower would add.
   ===================================================================== */


/* ---------- level of detail ----------
   The tier layers are cumulative: a Mk IV shed carries its Mk II lean-to
   and Mk III clerestory as well as its own green roof and verandah. That
   is right visually, but on a farm of two hundred maxed objects it is a
   lot of DOM to re-serialise every render. So the fine decoration —
   planting tufts, apron joints, netting wires — drops out once the farm
   is big. Structure always stays: the building never loses its shape,
   only its garnish. */
/* Per-object upgrade art, filled in by a later part. Grouping objects into
   families gets the buildings right but produces nonsense at the edges - a
   hedge does not want a concrete apron, a fire circle does not want a green
   roof. Anything named here takes precedence over its family. */
var ARCH_SPECIAL = {};

let ARCH_LOD = 2;
function archLod(){
  const nObj = (typeof S !== 'undefined' && S && S.objs) ? S.objs.length : 0;
  return nObj > 95 ? 0 : nObj > 55 ? 1 : 2;
}

/* ---------- structural primitives ---------- */

/* a lean-to bolted onto one side, lower than the main roof */
function annex(w, h, o){
  o = o||{};
  const roof = o.roof || '#8a969c';
  let s = `<rect x="${n(w*0.06)}" y="${n(h*0.10)}" width="${n(w)}" height="${n(h)}" rx="2"
    fill="#16240c" opacity=".20"/>`;
  s += `<rect x="0" y="0" width="${n(w)}" height="${n(h)}" rx="1.6" fill="#2a3238" opacity=".8"/>`;
  s += `<rect x="0.8" y="0.8" width="${n(w-1.6)}" height="${n(h-1.6)}" rx="1.2" fill="${roof}"/>`;
  /* single-pitch: light at the high edge, shade at the low */
  s += `<rect x="0.8" y="0.8" width="${n(w-1.6)}" height="${n((h-1.6)*0.42)}" fill="#fff" opacity=".17"/>`;
  s += `<rect x="0.8" y="${n(h*0.6)}" width="${n(w-1.6)}" height="${n(h*0.4-0.8)}" fill="#000" opacity=".20"/>`;
  for(let i=2.4; ARCH_LOD>0 && i<w-1; i+=3.4)
    s += `<line x1="${n(i)}" y1="1" x2="${n(i)}" y2="${n(h-1)}" stroke="#fff" stroke-opacity=".09" stroke-width="0.5"/>`;
  s += `<rect x="0.8" y="${n(h-1.8)}" width="${n(w-1.6)}" height="1.4" fill="#000" opacity=".3"/>`;
  return s;
}

/* clerestory monitor along the ridge — the giveaway of a serious shed */
function monitor(w, h){
  const mw = w*0.52, mx = (w-mw)/2, my = h*0.30, mh = Math.max(3.2, h*0.20);
  let s = `<rect x="${n(mx+1)}" y="${n(my+1.4)}" width="${n(mw)}" height="${n(mh)}" rx="1"
    fill="#000" opacity=".22"/>`;
  s += `<rect x="${n(mx)}" y="${n(my)}" width="${n(mw)}" height="${n(mh)}" rx="1" fill="#6d7981"/>`;
  s += `<rect x="${n(mx+0.7)}" y="${n(my+0.7)}" width="${n(mw-1.4)}" height="${n(mh-1.4)}" rx="0.7"
    fill="url(#gGlass)" opacity=".92"/>`;
  const bays = Math.max(2, Math.round(mw/7));
  for(let i=1;i<bays;i++)
    s += `<line x1="${n(mx+mw*i/bays)}" y1="${n(my+0.7)}" x2="${n(mx+mw*i/bays)}" y2="${n(my+mh-0.7)}"
      stroke="#59646b" stroke-width="0.6"/>`;
  s += `<rect x="${n(mx)}" y="${n(my)}" width="${n(mw)}" height="1" fill="#eef4f7" opacity=".85"/>`;
  return s;
}

/* poured apron: the concrete you stand a ute on */
function apron(x, y, w, h, r){
  if(ARCH_LOD === 0) return '';
  let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${r||2}"
    fill="#9aa0a2" opacity=".55"/>`;
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="${r||2}"
    fill="none" stroke="#7f8688" stroke-width="0.6" opacity=".7"/>`;
  /* control joints */
  const cols = ARCH_LOD===0 ? 1 : Math.max(1, Math.round(w/14));
  for(let i=1;i<cols;i++)
    s += `<line x1="${n(x+w*i/cols)}" y1="${n(y)}" x2="${n(x+w*i/cols)}" y2="${n(y+h)}"
      stroke="#7f8688" stroke-width="0.5" opacity=".55"/>`;
  s += `<line x1="${n(x)}" y1="${n(y+h*0.5)}" x2="${n(x+w)}" y2="${n(y+h*0.5)}"
    stroke="#7f8688" stroke-width="0.5" opacity=".45"/>`;
  return s;
}

/* verandah / covered walk: posts casting little shadows onto decking */
function verandah(x, y, w, h){
  let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="1.4" fill="#a98255"/>`;
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="1.4" fill="#000" opacity=".12"/>`;
  const boards = ARCH_LOD===0 ? 0 : Math.max(3, Math.round(h/2.6));
  for(let i=1;i<boards;i++)
    s += `<line x1="${n(x)}" y1="${n(y+h*i/boards)}" x2="${n(x+w)}" y2="${n(y+h*i/boards)}"
      stroke="#7d5f3c" stroke-width="0.5" opacity=".7"/>`;
  for(let i=0;i<Math.max(2,Math.round(w/10));i++){
    const px = x + 2 + i*(w-4)/Math.max(1,Math.round(w/10)-1);
    s += `<circle cx="${n(px+0.8)}" cy="${n(y+h-1.4)}" r="1.5" fill="#000" opacity=".22"/>`;
    s += `<circle cx="${n(px)}" cy="${n(y+h-2)}" r="1.3" fill="#c9a577"/>`;
  }
  return s;
}

/* planting bed against a wall — softens the Mk IV builds */
function planter(x, y, w, h, seed){
  let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="1.2" fill="#6b5642"/>`;
  s += `<rect x="${n(x+0.6)}" y="${n(y+0.6)}" width="${n(w-1.2)}" height="${n(h-1.2)}" rx="1" fill="#3f5a2a"/>`;
  const cnt = ARCH_LOD===0 ? 0 : Math.max(2, Math.min(ARCH_LOD===1?6:14, Math.round(w/4)));
  for(let i=0;i<cnt;i++){
    const cx = x + 1.6 + (w-3.2)*(i+0.5)/cnt, r = 1.1 + hash(i*3.1+seed)*1.1;
    s += `<circle cx="${n(cx)}" cy="${n(y+h*0.5)}" r="${r.toFixed(1)}" fill="#6ea63f"/>`;
    s += `<circle cx="${n(cx-r*0.3)}" cy="${n(y+h*0.5-r*0.3)}" r="${(r*0.5).toFixed(1)}" fill="#8cc457" opacity=".8"/>`;
  }
  return s;
}

/* a green roof — the Mk IV signature */
function roofGarden(x, y, w, h, seed){
  let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="1.4" fill="#4a6b32"/>`;
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h*0.4)}" rx="1.4" fill="#fff" opacity=".10"/>`;
  const tufts = ARCH_LOD===0 ? 0 : Math.max(3, Math.min(ARCH_LOD===1?10:24, Math.round(w*h/26)));
  for(let i=0;i<tufts;i++){
    const cx = x+1 + hash(i*5.7+seed)*(w-2), cy = y+1 + hash(i*9.3+seed)*(h-2);
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${(0.8+hash(i*2.2)*1).toFixed(1)}"
      fill="${hash(i)>0.75?'#c7d96a':'#6ea63f'}" opacity=".9"/>`;
  }
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="1.4"
    fill="none" stroke="#8c9a72" stroke-width="0.7"/>`;
  return s;
}

/* a rainwater tank tucked beside a building */
function miniTank(cx, cy, r){
  let s = `<ellipse cx="${n(cx+r*0.25)}" cy="${n(cy+r*0.3)}" rx="${n(r)}" ry="${n(r*0.9)}" fill="#16240c" opacity=".22"/>`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}" fill="url(#gTank)"/>`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.72)}" fill="none" stroke="#000" stroke-opacity=".18" stroke-width="0.7"/>`;
  s += `<circle cx="${n(cx-r*0.3)}" cy="${n(cy-r*0.35)}" r="${n(r*0.3)}" fill="#fff" opacity=".28"/>`;
  return s;
}

/* ---------- the families ---------- */
/* Each returns extra SVG to lay over the base art for a given tier.
   They receive the object's own width/height so they scale with footprint. */

const ARCH = {
  /* solid working buildings: sheds, workshops, processing rooms */
  shed(w, h, t, seed, o){
    let s = '';
    if(t >= 1){
      /* the lean-to you build first, plus a hardstand to work on */
      s += apron(w*0.02, h*0.70, w*0.62, h*0.26, 2);
      s += `<g transform="translate(${n(w*0.66)},${n(h*0.16)})">${annex(w*0.30, h*0.40, {roof:'#8a969c'})}</g>`;
      s += miniTank(w*0.90, h*0.72, Math.min(w,h)*0.09);
    }
    if(t >= 2){
      /* pulled into one compact footprint: clerestory over the main volume */
      s += `<g transform="translate(${n(w*0.04)},${n(h*0.02)})">${monitor(w*0.60, h*0.56)}</g>`;
      s += apron(w*0.02, h*0.70, w*0.94, h*0.26, 2);
      s += `<rect x="${n(w*0.06)}" y="${n(h*0.60)}" width="${n(w*0.88)}" height="1.6" rx="0.8"
        fill="#cfd6da" opacity=".8"/>`;
      s += planter(w*0.06, h*0.90, w*0.40, h*0.07, seed);
    }
    if(t >= 3){
      /* architectural: green roof over the annex, glazed end, full solar */
      s += `<g transform="translate(${n(w*0.66)},${n(h*0.14)})">${roofGarden(0, 0, w*0.30, h*0.30, seed)}</g>`;
      s += `<rect x="${n(w*0.08)}" y="${n(h*0.06)}" width="${n(w*0.52)}" height="${n(h*0.10)}" rx="1"
        fill="url(#gGlass)" stroke="#5f6b72" stroke-width="0.6" opacity=".95"/>`;
      s += verandah(w*0.06, h*0.62, w*0.56, h*0.09);
      s += planter(w*0.52, h*0.90, w*0.42, h*0.07, seed+3);
      s += `<circle cx="${n(w*0.90)}" cy="${n(h*0.10)}" r="2" fill="#7cc24f"/>`;
    }
    return s;
  },

  /* light open structures: kiosks, decks, tents, play */
  pavilion(w, h, t, seed){
    let s = '';
    if(t >= 1){
      s += verandah(w*0.08, h*0.72, w*0.84, h*0.13);
      s += `<circle cx="${n(w*0.12)}" cy="${n(h*0.16)}" r="${n(Math.min(w,h)*0.07)}" fill="#6ea63f"/>`;
    }
    if(t >= 2){
      /* a shade sail: taut fabric, not a slab. Kept translucent so the
         thing underneath still reads through it. */
      const sx = w*0.12, sy = h*0.10, sw = w*0.76, sh = h*0.42;
      if(ARCH_LOD > 0){
      s += `<path d="M${n(sx)} ${n(sy+sh*0.14)} Q${n(sx+sw*0.5)} ${n(sy-sh*0.10)} ${n(sx+sw)} ${n(sy+sh*0.14)}
        L${n(sx+sw)} ${n(sy+sh*0.86)} Q${n(sx+sw*0.5)} ${n(sy+sh*1.10)} ${n(sx)} ${n(sy+sh*0.86)} Z"
        fill="#e6dcc2" opacity=".34"/>`;
      s += `<path d="M${n(sx)} ${n(sy+sh*0.14)} Q${n(sx+sw*0.5)} ${n(sy-sh*0.10)} ${n(sx+sw)} ${n(sy+sh*0.14)}
        L${n(sx+sw)} ${n(sy+sh*0.50)} L${n(sx)} ${n(sy+sh*0.50)} Z"
        fill="#fff" opacity=".16"/>`;
      /* seams between fabric panels */
      for(let k=1;k<3;k++)
        s += `<line x1="${n(sx+sw*k/3)}" y1="${n(sy+sh*0.02)}" x2="${n(sx+sw*k/3)}" y2="${n(sy+sh*0.98)}"
          stroke="#c9bda0" stroke-width="0.6" opacity=".55"/>`;
      s += `<path d="M${n(sx)} ${n(sy+sh*0.14)} Q${n(sx+sw*0.5)} ${n(sy-sh*0.10)} ${n(sx+sw)} ${n(sy+sh*0.14)}"
        fill="none" stroke="#cfc3a6" stroke-width="0.8" opacity=".8"/>`;
      }
      [[0.12,0.12],[0.88,0.12],[0.12,0.52],[0.88,0.52]].forEach((p,i)=>{
        s += `<circle cx="${n(w*p[0]+0.8)}" cy="${n(h*p[1]+0.8)}" r="1.6" fill="#000" opacity=".22"/>`;
        s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="1.4" fill="#c9a577"/>`;
      });
      s += planter(w*0.08, h*0.88, w*0.36, h*0.08, seed);
    }
    if(t >= 3){
      s += `<g transform="translate(${n(w*0.10)},${n(h*0.06)})">${roofGarden(0,0,w*0.80,h*0.20,seed)}</g>`;
      s += `<rect x="${n(w*0.14)}" y="${n(h*0.30)}" width="${n(w*0.72)}" height="${n(h*0.16)}" rx="2"
        fill="url(#gGlass)" opacity=".8" stroke="#5f6b72" stroke-width="0.6"/>`;
      s += planter(w*0.50, h*0.88, w*0.42, h*0.08, seed+5);
      s += `<circle class="pulse" cx="${n(w*0.90)}" cy="${n(h*0.88)}" r="2" fill="#f0c14b"/>`;
    }
    return s;
  },

  /* animal enclosures: better shelter, better fencing, better handling */
  paddock(w, h, t, seed){
    let s = '';
    if(t >= 1){
      /* a run-in shelter in the corner */
      s += `<g transform="translate(${n(w*0.04)},${n(h*0.04)})">${annex(w*0.28, h*0.26, {roof:'#9aa6ac'})}</g>`;
      s += `<rect x="${n(w*0.40)}" y="${n(h*0.86)}" width="${n(w*0.22)}" height="${n(h*0.07)}" rx="1.5" fill="#7d6a54"/>`;
    }
    if(t >= 2){
      /* stock fence with proper strainer posts, and a water trough */
      s += `<rect x="${n(w*0.03)}" y="${n(h*0.03)}" width="${n(w*0.94)}" height="${n(h*0.94)}" rx="3"
        fill="none" stroke="#8b7c66" stroke-width="1.1" stroke-dasharray="6 3" opacity=".9"/>`;
      [[0.03,0.03],[0.97,0.03],[0.03,0.97],[0.97,0.97]].forEach(p=>{
        s += `<circle cx="${n(w*p[0]+0.6)}" cy="${n(h*p[1]+0.6)}" r="1.7" fill="#000" opacity=".22"/>`;
        s += `<circle cx="${n(w*p[0])}" cy="${n(h*p[1])}" r="1.5" fill="#7d6a54"/>`;
      });
      s += `<rect x="${n(w*0.62)}" y="${n(h*0.86)}" width="${n(w*0.24)}" height="${n(h*0.07)}" rx="2" fill="#9fb0b8"/>`;
      s += `<rect x="${n(w*0.63)}" y="${n(h*0.87)}" width="${n(w*0.22)}" height="${n(h*0.04)}" rx="1.5" fill="url(#gWater)"/>`;
    }
    if(t >= 3){
      /* covered yard and a handling race */
      s += `<g transform="translate(${n(w*0.04)},${n(h*0.02)})">${roofGarden(0,0,w*0.28,h*0.16,seed)}</g>`;
      if(ARCH_LOD > 0)
        s += `<rect x="${n(w*0.36)}" y="${n(h*0.06)}" width="${n(w*0.58)}" height="${n(h*0.26)}" rx="2"
          fill="#c8d2d6" opacity=".45" stroke="#9aa8ad" stroke-width="0.7"/>`;
      for(let i=1;i<4;i++)
        s += `<line x1="${n(w*(0.36+0.58*i/4))}" y1="${n(h*0.06)}" x2="${n(w*(0.36+0.58*i/4))}" y2="${n(h*0.32)}"
          stroke="#9aa8ad" stroke-width="0.6" opacity=".8"/>`;
      s += apron(w*0.30, h*0.80, w*0.64, h*0.16, 2);
      s += `<circle cx="${n(w*0.10)}" cy="${n(h*0.90)}" r="2" fill="#7cc24f"/>`;
    }
    return s;
  },

  /* planting: it grows, gets trellised, then gets netted and irrigated */
  grove(w, h, t, seed){
    let s = '';
    if(t >= 1){
      /* mulch rings and a drip line */
      s += `<rect x="${n(w*0.06)}" y="${n(h*0.50)}" width="${n(w*0.88)}" height="1.2" rx="0.6"
        fill="#5b6f8a" opacity=".55"/>`;
      for(let i=0;i<4;i++)
        s += `<circle cx="${n(w*(0.16+i*0.23))}" cy="${n(h*0.50)}" r="1" fill="#8fd0e8" opacity=".8"/>`;
    }
    if(t >= 2){
      /* trellis posts and wires — the mark of a managed block */
      for(let i=0;i<4;i++){
        const px = w*(0.12+i*0.25);
        s += `<circle cx="${n(px+0.6)}" cy="${n(h*0.90+0.6)}" r="1.5" fill="#000" opacity=".2"/>`;
        s += `<circle cx="${n(px)}" cy="${n(h*0.90)}" r="1.3" fill="#8b7c66"/>`;
        s += `<line x1="${n(px)}" y1="${n(h*0.14)}" x2="${n(px)}" y2="${n(h*0.90)}"
          stroke="#8b7c66" stroke-width="0.8" opacity=".75"/>`;
      }
      s += `<rect x="${n(w*0.06)}" y="${n(h*0.20)}" width="${n(w*0.88)}" height="0.8" fill="#9aa8ad" opacity=".7"/>`;
      s += `<rect x="${n(w*0.06)}" y="${n(h*0.62)}" width="${n(w*0.88)}" height="0.8" fill="#9aa8ad" opacity=".7"/>`;
    }
    if(t >= 3){
      /* bird netting stretched over the whole block, plus a picking path */
      /* the netting sheet is a full-footprint alpha layer — the single
         most expensive thing here once farms get big */
      if(ARCH_LOD > 0)
        s += `<rect x="${n(w*0.04)}" y="${n(h*0.06)}" width="${n(w*0.92)}" height="${n(h*0.80)}" rx="3"
          fill="#dfe8ec" opacity=".16" stroke="#cbd6da" stroke-width="0.7"/>`;
      for(let i=1; ARCH_LOD>0 && i<6; i++)
        s += `<line x1="${n(w*(0.04+0.92*i/6))}" y1="${n(h*0.06)}" x2="${n(w*(0.04+0.92*i/6))}" y2="${n(h*0.86)}"
          stroke="#cbd6da" stroke-width="0.4" opacity=".5"/>`;
      s += `<rect x="${n(w*0.06)}" y="${n(h*0.88)}" width="${n(w*0.88)}" height="${n(h*0.08)}" rx="1.5"
        fill="#b7a184" opacity=".7"/>`;
    }
    return s;
  },

  /* water: edges get built, then planted, then usable */
  water(w, h, t, seed){
    let s = '';
    if(t >= 1){
      s += `<ellipse cx="${n(w*0.5)}" cy="${n(h*0.5)}" rx="${n(w*0.44)}" ry="${n(h*0.40)}"
        fill="none" stroke="#8b7c66" stroke-width="1.4" opacity=".7"/>`;
    }
    if(t >= 2){
      /* reed planting and a small jetty */
      for(let i=0;i<10;i++){
        const a = hash(i*4.1+seed)*Math.PI*2;
        const rx = w*0.44*Math.cos(a), ry = h*0.40*Math.sin(a);
        s += `<line x1="${n(w*0.5+rx)}" y1="${n(h*0.5+ry)}" x2="${n(w*0.5+rx*0.92)}" y2="${n(h*0.5+ry*0.92-2.4)}"
          stroke="#6ea63f" stroke-width="0.9" stroke-linecap="round" opacity=".9"/>`;
      }
      s += verandah(w*0.36, h*0.06, w*0.28, h*0.14);
    }
    if(t >= 3){
      s += `<rect x="${n(w*0.30)}" y="${n(h*0.02)}" width="${n(w*0.40)}" height="${n(h*0.06)}" rx="1.5"
        fill="#a98255"/>`;
      s += planter(w*0.06, h*0.86, w*0.34, h*0.08, seed);
      s += planter(w*0.60, h*0.86, w*0.34, h*0.08, seed+2);
      s += `<circle class="pulse" cx="${n(w*0.86)}" cy="${n(h*0.14)}" r="2" fill="#8fd0e8"/>`;
    }
    return s;
  },

  /* infrastructure: it gets bigger, doubled, then hardened and monitored */
  infra(w, h, t, seed){
    let s = '';
    if(t >= 1){
      s += apron(w*0.06, h*0.74, w*0.88, h*0.20, 2);
    }
    if(t >= 2){
      s += `<rect x="${n(w*0.08)}" y="${n(h*0.10)}" width="${n(w*0.84)}" height="${n(h*0.54)}" rx="2"
        fill="none" stroke="#9aa8ad" stroke-width="0.9" stroke-dasharray="4 2" opacity=".8"/>`;
      s += miniTank(w*0.88, h*0.24, Math.min(w,h)*0.10);
    }
    if(t >= 3){
      s += `<rect x="${n(w*0.10)}" y="${n(h*0.12)}" width="${n(w*0.34)}" height="${n(h*0.16)}" rx="1.2"
        fill="url(#gSolar)" stroke="#3a4a55" stroke-width="0.6"/>`;
      s += planter(w*0.06, h*0.92, w*0.40, h*0.06, seed);
      s += `<circle class="pulse" cx="${n(w*0.88)}" cy="${n(h*0.88)}" r="2" fill="#7cc24f"/>`;
    }
    return s;
  },
};

/* ---------- wiring: which object belongs to which family ---------- */
const ARCH_FAMILY = {
  /* working buildings */
  shed:'shed', workshop:'shed', cellar:'shed', packing:'shed', dairy:'shed',
  kitchen:'shed', honey_lab:'shed', gift_shop:'shed', nursery:'shed',
  worker_cottage:'shed', ai_hub:'shed',
  /* light structures */
  tea_kiosk:'pavilion', deck:'pavilion', glamping:'pavilion', dome:'pavilion',
  firepit:'pavilion', playground:'pavilion', bench:'pavilion', parking:'pavilion',
  /* animals */
  duck_pond:'paddock', goat_pen:'paddock', sheep:'paddock', apiary:'paddock',
  rabbit:'paddock', fodder:'paddock',
  /* planting */
  orchard:'grove', berry:'grove', flowers:'grove', herb_spiral:'grove',
  tree_native:'grove', tree_shade:'grove', tree_olive:'grove',
  /* water */
  pond:'water', well:'water',
  /* infrastructure and site works */
  wind:'infra', battery:'infra', sprinkler:'infra', compost:'infra',
  lights:'infra', sign:'infra', gate:'infra', ring:'infra', hedge:'infra', fence:'infra',
};

let ARCH_WRAPPED = 0;

/* wrap each art function so tier 0 is untouched and 1..3 gain structure */
(function applyArchitecture(){
  let wrapped = 0, missing = [];
  Object.keys(ARCH_FAMILY).forEach((name, idx)=>{
    const base = ART[name];
    if(typeof base !== 'function'){ missing.push(name); return; }
    const fam = ARCH[ARCH_FAMILY[name]];
    if(!fam) return;
    ART[name] = function(w, h, ob){
      const out = base(w, h, ob);
      const t = (typeof curTier === 'function') ? curTier(ob) : (ob && ob.tier) || 0;
      if(!t) return out;
      let extra = '';
      ARCH_LOD = archLod();
      const spec = ARCH_SPECIAL[name];
      try { extra = (spec ? spec(w, h, t, idx*7.7, ob) : fam(w, h, t, idx*7.7, ob)) || ''; }
      catch(e){ extra = ''; }
      return out + extra;
    };
    wrapped++;
  });
  if(missing.length) console.warn('[greenhollow] architecture: no art for', missing.join(', '));
  ARCH_WRAPPED = wrapped;
})();

/* =====================================================================
   DEPTH AND LIFE

   Two things make a flat top-down scene read as solid: everything has to
   sit in the same light, and everything has to breathe a little.

   Light first. Individual art functions each drew their own shadow, or
   didn't, so objects sat at inconsistent heights. drawObj is the one
   place every object passes through, so the ground shadow is cast there
   — one direction, one softness, scaled by how tall the thing is.

   Then life. The frame budget here was hard-won: an earlier version ran
   at 15fps because 355 elements were animating and every one carried an
   SVG filter. So this animates with transforms only, never filters, and
   caps how many things can move at once. Objects past the cap are still
   drawn — they just hold still, which nobody notices in a crowd.
   ===================================================================== */

/* how tall each kind of thing stands. Drives shadow length and offset —
   a tank throws a longer shadow than a garden bed because it is taller. */
const HEIGHT = {
  home:2.6, housing:2.4, hub:2.2, process:2.0, shop:1.9, tourism:1.7,
  power:2.1, water:2.2, animal:1.2, bonus:1.4, store:1.9,
  perennial:1.5, plot:0.5, decor:1.0, feed:0.6, rec:1.2,
};
function objHeight(bp){
  if(bp.art === 'path' || bp.art === 'ring' || bp.art === 'parking') return 0;
  if(bp.art === 'pond' || bp.art === 'duck_pond') return 0.2;
  if(/^tree_/.test(bp.art)) return 2.4;
  return HEIGHT[bp.cat] !== undefined ? HEIGHT[bp.cat] : (HEIGHT[bp.kind] || 1.2);
}

/* Ground shadow, cast down-right from the same upper-left sun the art
   already assumes. Two stacked ellipses give a soft edge for far less
   than a Gaussian blur would cost. */
function groundShadow(o, bp){
  const hgt = objHeight(bp);
  if(hgt <= 0) return '';
  const f = footprint(bp, o.rot);
  const w = f.w*T, h = f.h*T;
  const x = o.tx*T, y = o.ty*T;
  /* taller things: longer throw, softer and weaker edge */
  const off = 1.6 + hgt*1.9;
  const grow = 1 + hgt*0.05;
  const op  = Math.min(0.30, 0.13 + hgt*0.055);
  const cx = x + w/2 + off*0.8, cy = y + h*0.93 + off*0.42;
  return `<g class="obshadow" aria-hidden="true">`
    + `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(w*0.54*grow)}" ry="${n(h*0.30*grow)}"
        fill="#16240c" opacity="${(op*0.5).toFixed(3)}"/>`
    + `<ellipse cx="${n(cx-off*0.25)}" cy="${n(cy-off*0.18)}" rx="${n(w*0.45)}" ry="${n(h*0.24)}"
        fill="#16240c" opacity="${(op*0.75).toFixed(3)}"/>`
    + `</g>`;
}

/* which objects are worth animating, and with what */
function idleClass(bp){
  const a = bp.art || '';
  /* Only motion that a real farm actually shows. A turbine mast does not
     rock and a shed does not bob, so neither gets a whole-object
     transform - their life comes from working detail instead. */
  /* Plants sway through the .sway class on their foliage alone, wired to
     the real wind - rotating the whole group moved the bed and soil too. */
  if(/pond|duck_pond|well/.test(a))                                   return 'lf-shimmer';
  if(/lights|sign/.test(a))                                           return 'lf-glow';
  return '';
}

/* Budget: how many objects may animate at once. Measured, not chosen:
   in SVG an animated child repaints its region instead of compositing,
   so cost scales with animated AREA. Twenty movers reads as a living farm.
   Twenty-six cost about 11fps on a busy one and twenty is most of the
   effect for half the price; the far larger figure
   an earlier pass reported was measurement error, taken while the game
   simulation was still running during the sample. */
const IDLE_CAP = 20;

/* ---- hook the single place every object is drawn ---- */
const _drawObjBase = drawObj;
drawObj = function(o){
  const bp = BPMAP[o.bp];
  const inner = _drawObjBase(o);
  if(!bp || MERGE_ROAD[o.bp]) return inner;

  const shadow = (typeof SET !== 'function' || SET('shadows') !== false)
    ? groundShadow(o, bp) : '';

  /* animation is opt-in per object and rationed, so a big farm cannot
     drag the frame rate down the way it used to */
  let cls = '';
  if((typeof SET !== 'function' || SET('motion') !== false) && IDLE_USED < IDLE_CAP){
    cls = idleClass(bp);
    if(cls){
      IDLE_USED++;
      /* stagger so they do not all move on the same beat */
      const d = ((o.id ? String(o.id).length * 7 + o.tx * 13 + o.ty * 29 : 0) % 40) / 10;
      return shadow + `<g class="lifewrap ${cls}" style="animation-delay:-${d}s">${inner}</g>`;
    }
  }
  return shadow + inner;
};

/* reset the ration at the start of every full render */
let IDLE_USED = 0;
const _renderDepth = render;
render = function(){ IDLE_USED = 0; return _renderDepth.apply(this, arguments); };

(function lifeCss(){
  const s = document.createElement('style');
  s.textContent = `
  /* transform/opacity only — these stay on the compositor and never
     trigger layout or an offscreen filter pass */
  .lifewrap{ transform-origin:50% 92%; will-change:transform; }
  .lf-shimmer{ animation: lfShim 5.2s ease-in-out infinite; }
  .lf-glow   { animation: lfGlow 3.8s ease-in-out infinite; }
  .obshadow  { pointer-events:none; }

  @keyframes lfShim {
    0%,100%{ opacity:.95; } 50%{ opacity:1; } }
  @keyframes lfGlow {
    0%,100%{ opacity:.88; } 50%{ opacity:1; } }

  /* the OS-level preference wins over our setting */
  @media (prefers-reduced-motion: reduce){
    .lifewrap{ animation:none !important; } }
  `;
  document.head.appendChild(s);
})();

/* redraw once so existing farms pick the treatment up immediately */
setTimeout(()=>{ if(typeof render === 'function') render(); }, 260);

/* =====================================================================
   WORKING DETAIL

   p28 made objects sit in the light and breathe. This makes them look
   like they are doing something: the jam kitchen smokes, the turbine
   actually turns, water rings spread, solar catches the sun as it
   crosses, the battery blinks while it charges.

   Everything here obeys the same budget as the rest of the art. Detail
   is drawn in the object's own coordinates so it rides along with
   rotation, it animates on transform and opacity only, and the number
   of emitters per render is rationed — a farm of ninety sheds does not
   need ninety smoke plumes to read as busy.
   ===================================================================== */

/* ---------- extra materials ---------- */
/* Injected into the shared <defs> so they are defined once for the whole
   scene rather than per object. */
const _DEFS_BASE = DEFS;
DEFS = function(){
  const base = _DEFS_BASE();
  const extra = `
  <linearGradient id="gMetalSpec" x1="0" y1="0" x2="0.35" y2="1">
    <stop offset="0"    stop-color="#b9c6cd"/>
    <stop offset="0.34" stop-color="#e8f0f4"/>
    <stop offset="0.52" stop-color="#9fadb5"/>
    <stop offset="1"    stop-color="#76838b"/>
  </linearGradient>
  <radialGradient id="gSmoke" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"   stop-color="#ffffff" stop-opacity="0.55"/>
    <stop offset="0.6" stop-color="#dfe6ea" stop-opacity="0.24"/>
    <stop offset="1"   stop-color="#dfe6ea" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="gLamp" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0"   stop-color="#ffe9a8" stop-opacity="0.95"/>
    <stop offset="0.45" stop-color="#f5c95c" stop-opacity="0.45"/>
    <stop offset="1"   stop-color="#f5c95c" stop-opacity="0"/>
  </radialGradient>`;
  return base.replace('</defs>', extra + '</defs>');
};

/* ---------- the details ---------- */

/* a flue with three puffs climbing out of it, staggered so the plume
   is continuous rather than pulsing as one blob */
function detSmoke(w, h, seed){
  const x = w*0.78, y = h*0.30;
  let s = `<rect x="${n(x-2.2)}" y="${n(y-4)}" width="4.4" height="7" rx="1" fill="#8d959a"/>`;
  s += `<rect x="${n(x-2.2)}" y="${n(y-4)}" width="4.4" height="2" rx="1" fill="#aab2b7"/>`;
  for(let i=0;i<3;i++){
    const r = 2.2 + i*0.9;
    s += `<circle class="dt-smoke" cx="${n(x)}" cy="${n(y-5)}" r="${r.toFixed(1)}"
      fill="url(#gSmoke)" style="animation-delay:-${(i*1.25).toFixed(2)}s"/>`;
  }
  return s;
}

/* rings spreading from a point on the water */
function detRipple(w, h, seed){
  const cx = w*(0.40 + hash(seed)*0.22), cy = h*(0.42 + hash(seed*2.3)*0.2);
  let s = '';
  for(let i=0;i<2;i++)
    s += `<circle class="dt-ripple" cx="${n(cx)}" cy="${n(cy)}" r="1"
      fill="none" stroke="#dff1fa" stroke-width="0.8"
      style="animation-delay:-${(i*1.6).toFixed(2)}s"/>`;
  return s;
}


/* charge indicator: a small lamp that breathes */
function detLamp(w, h){
  const x = w*0.86, y = h*0.16;
  return `<circle class="dt-lamp" cx="${n(x)}" cy="${n(y)}" r="${n(Math.min(w,h)*0.10)}"
      fill="url(#gLamp)"/>`
    + `<circle class="dt-lamp" cx="${n(x)}" cy="${n(y)}" r="1.5" fill="#ffe9a8"
      style="animation-delay:-.4s"/>`;
}

/* which objects get which working detail */
const DETAIL = {
  kitchen:detSmoke, dairy:detSmoke, honey_lab:detSmoke,
  packing:detSmoke, workshop:detSmoke, cellar:detSmoke,
  pond:detRipple, duck_pond:detRipple, tank:detRipple, well:detRipple,
  battery:detLamp, ai_hub:detLamp, lights:detLamp,
};

let DETAIL_WIRED = 0;

/* ration: plenty to read as a busy farm, far short of what would cost us */
const DETAIL_CAP = 8;
let DETAIL_USED = 0;

(function applyDetail(){
  let wired = 0;
  Object.keys(DETAIL).forEach((name, idx)=>{
    const base = ART[name];
    if(typeof base !== 'function') return;
    const det = DETAIL[name];
    ART[name] = function(w, h, ob){
      const out = base(w, h, ob);
      /* detail is a live-scene luxury: skip it for palette thumbnails
         (no object) and once the ration for this render is spent */
      if(!ob || DETAIL_USED >= DETAIL_CAP) return out;
      if(typeof SET === 'function' && SET('motion') === false) return out;
      DETAIL_USED++;
      let extra = '';
      try { extra = det(w, h, idx*3.7) || ''; } catch(e){ extra = ''; }
      return out + extra;
    };
    wired++;
  });
  DETAIL_WIRED = wired;
})();

/* reset the ration each full render, alongside the idle-animation one */
const _renderDetail = render;
render = function(){ DETAIL_USED = 0; return _renderDetail.apply(this, arguments); };

(function detailCss(){
  const s = document.createElement('style');
  s.textContent = `
  /* transform-box:fill-box makes these rotate/scale about their own
     centre rather than the SVG root origin */
  .dt-smoke, .dt-ripple, .dt-lamp{
    transform-box:fill-box; transform-origin:center; pointer-events:none; }

  .dt-smoke { animation: dtSmoke 3.75s ease-out infinite; }
  .dt-ripple{ animation: dtRipple 3.2s ease-out infinite; }
  .dt-lamp  { animation: dtLamp 2.4s ease-in-out infinite; }

  @keyframes dtSmoke {
    0%   { opacity:0;   transform: translateY(2px)   scale(.5); }
    25%  { opacity:.5; }
    100% { opacity:0;   transform: translateY(-7px) scale(1.15); } }
  @keyframes dtRipple {
    0%   { opacity:.55; transform: scale(.4); }
    100% { opacity:0;   transform: scale(2.4); } }
  @keyframes dtLamp {
    0%,100%{ opacity:.35; transform: scale(.9); }
    50%    { opacity:1;   transform: scale(1.08); } }

  @media (prefers-reduced-motion: reduce){
    .dt-smoke,.dt-ripple,.dt-lamp{ animation:none !important; }
    .dt-smoke{ opacity:0 !important; } }
  `;
  document.head.appendChild(s);
})();

setTimeout(()=>{ if(typeof render === 'function') render(); }, 300);

/* =====================================================================
   CLOUDS

   The scene had discs of tone scattered across the ground standing in
   for variation, and nothing at all in the sky. That is backwards: the
   ground reads better when its variation is felt rather than seen, and
   the sky is where shapes are supposed to float.

   These sit in the band above the horizon, drift slowly, and take their
   colour from the sun — white and high at midday, gold and low-bellied
   at dawn, bruised grey under a storm. They are built from overlapping
   ellipses with a lit top and a shaded underside, which is the same
   upper-left light every object on the ground obeys.
   ===================================================================== */

function cloudShape(w, h, seed){
  /* a cumulus is a cluster of lobes, not one blob: three or four
     overlapping circles with a flat base */
  const lobes = 3 + Math.round(hash(seed)*2);
  let body = '', lit = '';
  for(let i=0;i<lobes;i++){
    const t  = i/(lobes-1||1);
    const cx = w*(0.16 + t*0.68);
    const r  = h*(0.34 + hash(seed+i*3.1)*0.30) * (1 - Math.abs(t-0.5)*0.5);
    const cy = h*0.62 - r*0.32;
    body += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r)}"/>`;
    lit  += `<circle cx="${n(cx)}" cy="${n(cy - r*0.22)}" r="${n(r*0.78)}"/>`;
  }
  /* flat base, the way cumulus actually sit on their condensation level */
  body += `<rect x="${n(w*0.10)}" y="${n(h*0.44)}" width="${n(w*0.80)}" height="${n(h*0.22)}" rx="${n(h*0.11)}"/>`;
  return `<g class="cl-body">${body}</g><g class="cl-lit">${lit}</g>`;
}

function cloudLayer(){
  const W = WPX;
  let s = '<g id="clouds" aria-hidden="true">';
  /* The visible sky is a narrow band above the ridgeline, so clouds have
     to be small and sit well inside it. Sized against that band, not
     against the world, or one cloud swallows the horizon. */
  for(let i=0;i<11;i++){
    const t   = i/11;
    const cw  = 62 + hash(i*2.7)*94;
    const ch  = 15 + hash(i*4.1)*15;
    /* spread across the full width, jittered so the spacing is not a comb */
    const x   = -W*0.20 + (t + (hash(i*7.3)-0.5)*0.06) * W*1.45;
    const y   = -246 + hash(i*3.3)*128;
    const dur = (170 + hash(i*5.7)*190).toFixed(0);
    /* higher sits fainter: cheap aerial perspective */
    const dep = (0.55 + ((y+246)/128) * 0.35).toFixed(2);
    s += `<g class="cloud" style="animation-duration:${dur}s;animation-delay:-${(hash(i*8.1)*dur).toFixed(0)}s"
      transform="translate(${n(x)},${n(y)})" opacity="${dep}">${cloudShape(cw, ch, i*3.7)}</g>`;
  }
  return s + '</g>';
}

/* the sky band sits behind everything, so clouds belong in the cached
   backdrop rather than the live foreground */
const _terrainSky = terrain;
terrain = function(){
  const out = _terrainSky();
  if(out.indexOf('id="clouds"') >= 0) return out;
  /* drop them in just after the horizon so ridges still overlap them */
  return out + cloudLayer();
};

/* Clouds take their colour from the sun. paintSun already runs on the
   day tick, so tint there rather than starting another timer. */
function tintClouds(){
  const root = document.documentElement;
  let body = '#f4f8fb', lit = '#ffffff', op = 1;
  if(typeof skyNow === 'function'){
    const s = skyNow(), f = s.f;
    const dawn = f > 0.18 && f < 0.30, dusk = f > 0.74 && f < 0.88;
    const night = (typeof isNight === 'function') ? isNight() : false;
    if(night){        body = '#39465c'; lit = '#5b6b86'; op = 0.55; }
    else if(dawn){    body = '#e9b48f'; lit = '#ffe0c0'; op = 0.95; }
    else if(dusk){    body = '#dc9c86'; lit = '#ffd2ac'; op = 0.95; }
  }
  const w = (typeof S !== 'undefined' && S) ? S.weather : 'sun';
  if(w === 'storm'){ body = '#59606b'; lit = '#7d8593'; op = 1; }
  else if(w === 'rain'){ body = '#7c8894'; lit = '#9aa6b1'; op = 1; }
  else if(w === 'cloud'){ body = '#dbe3e9'; lit = '#f2f7fa'; op = 1; }
  root.style.setProperty('--cloud-body', body);
  root.style.setProperty('--cloud-lit', lit);
  root.style.setProperty('--cloud-op', op);
}
const _paintSunClouds = (typeof paintSun === 'function') ? paintSun : null;
if(_paintSunClouds) paintSun = function(){ const r = _paintSunClouds.apply(this, arguments); tintClouds(); return r; };

(function cloudCss(){
  const s = document.createElement('style');
  s.textContent = `
  :root{ --cloud-body:#f4f8fb; --cloud-lit:#ffffff; --cloud-op:1; }
  #clouds{ pointer-events:none; }
  #clouds .cl-body circle, #clouds .cl-body rect{ fill:var(--cloud-body); }
  #clouds .cl-lit  circle{ fill:var(--cloud-lit); opacity:.45; }
  #clouds .cloud{ opacity:var(--cloud-op); animation-name:clDrift;
    animation-timing-function:linear; animation-iteration-count:infinite; }
  @keyframes clDrift{ from{ transform:translateX(-7%);} to{ transform:translateX(7%);} }
  @media (prefers-reduced-motion: reduce){ #clouds .cloud{ animation:none !important; } }
  `;
  document.head.appendChild(s);
})();

setTimeout(()=>{
  tintClouds();
  /* the backdrop is cached, so force one rebuild to pick the clouds up */
  if(typeof terrainCache !== 'undefined') terrainCache = '';
  if(typeof render === 'function') render();
}, 320);

/* =====================================================================
   TAKING SHELTER

   When a storm comes through, a real family is not out weeding. They
   come inside, and the house lights up while the paddocks go dark.

   So: storms pull everyone indoors, the lightning gets genuinely
   dramatic, and because all the interesting behaviour is now hidden
   under a roof, you can lift the roof off and watch it.

   The drama here is all light and timing — no camera shake. Shaking the
   view reads as a bug, not as weather.
   ===================================================================== */

/* ---------- 1. everyone indoors during a storm ---------- */

/* where each person sits inside the house, as a fraction of its footprint */
const INDOOR_SPOTS = [
  {fx:0.24, fy:0.34, act:'at the kitchen table'},
  {fx:0.52, fy:0.30, act:'making tea'},
  {fx:0.74, fy:0.38, act:'watching the rain'},
  {fx:0.30, fy:0.66, act:'reading by the fire'},
  {fx:0.58, fy:0.70, act:'playing cards'},
  {fx:0.80, fy:0.64, act:'drawing at the window'},
  {fx:0.42, fy:0.50, act:'listening to the radio'},
  {fx:0.66, fy:0.52, act:'mending a jumper'},
];

function homeObj(){
  return S.objs.find(o => BPMAP[o.bp] && BPMAP[o.bp].kind === 'home');
}
function stormNow(){ return S.weather === 'storm'; }

/* Each person keeps the same seat for the duration of a storm rather than
   teleporting between chairs every tick. */
function indoorSpot(p, idx){
  const ho = homeObj();
  if(!ho) return null;
  const bp = BPMAP[ho.bp], f = footprint(bp, ho.rot);
  const sp = INDOOR_SPOTS[idx % INDOOR_SPOTS.length];
  return { x:(ho.tx + f.w*sp.fx)*T, y:(ho.ty + f.h*sp.fy)*T, act:sp.act };
}

const _routineStorm = routine;
routine = function(p){
  if(stormNow()){
    const list = S.family.concat(S.workers || []);
    const idx = Math.max(0, list.findIndex(q => q.id === p.id));
    const spot = indoorSpot(p, idx);
    if(spot) return spot;
  }
  return _routineStorm(p);
};

/* ---------- 2. lift the roof and watch ---------- */

/* A cutaway of the house: floorboards, dividing walls, and the furniture
   that makes each room legible from above. */
function interiorArt(w, h){
  let s = `<rect x="1" y="1" width="${n(w-2)}" height="${n(h-2)}" rx="3" fill="#c9a878"/>`;
  /* floorboards running the long way */
  const boards = Math.max(4, Math.round(h/7));
  for(let i=1;i<boards;i++)
    s += `<line x1="1.5" y1="${n(1+(h-2)*i/boards)}" x2="${n(w-1.5)}" y2="${n(1+(h-2)*i/boards)}"
      stroke="#ab8a5f" stroke-width="0.6" opacity=".7"/>`;

  /* interior walls: kitchen/living split, two bedrooms along the top */
  const wall = (x1,y1,x2,y2)=>`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}"
    stroke="#efe6d6" stroke-width="2.4" stroke-linecap="round"/>`;
  s += wall(w*0.46, 2, w*0.46, h*0.46);
  s += wall(2, h*0.46, w*0.92, h*0.46);
  s += wall(w*0.72, h*0.46, w*0.72, h-2);

  /* kitchen: bench, sink, stove */
  s += `<rect x="${n(w*0.06)}" y="${n(h*0.10)}" width="${n(w*0.34)}" height="${n(h*0.10)}" rx="1.6" fill="#8e9aa2"/>`;
  s += `<rect x="${n(w*0.10)}" y="${n(h*0.12)}" width="${n(w*0.07)}" height="${n(h*0.06)}" rx="1" fill="#c8d2d8"/>`;
  s += `<circle cx="${n(w*0.30)}" cy="${n(h*0.15)}" r="${n(h*0.025)}" fill="#3f4a52"/>`;
  s += `<rect x="${n(w*0.10)}" y="${n(h*0.26)}" width="${n(w*0.24)}" height="${n(h*0.12)}" rx="2" fill="#a9764a"/>`;

  /* living: rug, sofa, hearth */
  s += `<ellipse cx="${n(w*0.60)}" cy="${n(h*0.26)}" rx="${n(w*0.13)}" ry="${n(h*0.11)}" fill="#9c5b52" opacity=".85"/>`;
  s += `<rect x="${n(w*0.50)}" y="${n(h*0.07)}" width="${n(w*0.20)}" height="${n(h*0.07)}" rx="2.4" fill="#5f7a6b"/>`;
  s += `<rect x="${n(w*0.86)}" y="${n(h*0.16)}" width="${n(w*0.09)}" height="${n(h*0.14)}" rx="1.4" fill="#7b6f66"/>`;
  s += `<circle class="hearth" cx="${n(w*0.905)}" cy="${n(h*0.23)}" r="${n(h*0.035)}" fill="#f0a24b"/>`;

  /* bedrooms along the bottom */
  s += `<rect x="${n(w*0.06)}" y="${n(h*0.56)}" width="${n(w*0.20)}" height="${n(h*0.16)}" rx="2" fill="#7f8fa6"/>`;
  s += `<rect x="${n(w*0.06)}" y="${n(h*0.56)}" width="${n(w*0.20)}" height="${n(h*0.05)}" rx="2" fill="#c3cede"/>`;
  s += `<rect x="${n(w*0.40)}" y="${n(h*0.56)}" width="${n(w*0.20)}" height="${n(h*0.16)}" rx="2" fill="#7f8fa6"/>`;
  s += `<rect x="${n(w*0.40)}" y="${n(h*0.56)}" width="${n(w*0.20)}" height="${n(h*0.05)}" rx="2" fill="#c3cede"/>`;
  /* bathroom in the corner */
  s += `<rect x="${n(w*0.78)}" y="${n(h*0.56)}" width="${n(w*0.14)}" height="${n(h*0.12)}" rx="2" fill="#cdd9de"/>`;

  /* warm light spilling from the rooms */
  s += `<rect x="1" y="1" width="${n(w-2)}" height="${n(h-2)}" rx="3" fill="#ffd489" opacity=".10"/>`;
  return s;
}

/* Draw the cutaway over the home's footprint when the roof is lifted. */
function roofOffLayer(){

  return `<g id="cutaway" transform="translate(${n(ho.tx*T)},${n(ho.ty*T)})">
    ${interiorArt(w, h)}
    <rect x="0.6" y="0.6" width="${n(w-1.2)}" height="${n(h-1.2)}" rx="3.4"
      fill="none" stroke="#f2e9d8" stroke-width="1.6" opacity=".9"/></g>`;
}

/* the cutaway sits above the house but below the people, so the family
   reads as being inside it */
const _peopleLayerStorm = peopleLayer;

/* ---------- 3. dramatic lightning ---------- */
/* Louder in light, not in motion: a double flash with a dark beat between
   them, the sky dropping out, and the bolt held a fraction longer. */
const _strikeBase = (typeof lightningStrike === 'function') ? lightningStrike : null;
if(_strikeBase){
  lightningStrike = function(){
    const r = _strikeBase.apply(this, arguments);
    const world = document.getElementById('world');

    }
    /* the follow-up stroke real lightning almost always has */
    if(Math.random() < 0.55) setTimeout(()=>{ try{ _strikeBase(); }catch(e){} }, 180 + Math.random()*160);
    return r;
  };
}

/* =====================================================================
   BIRDS

   A farm without birds reads as a diagram. These are deliberately cheap:
   a handful of flock members crossing the sky on a long loop, and a few
   ground birds that hop between trees, beds and the compost — where
   real birds actually go, because that is where the worms are.

   They take cover in a storm like everyone else, and they roost at
   night. Both are behaviour you would notice if it were missing.
   ===================================================================== */

const BIRDS = { sky:[], ground:[], layer:null, nests:[] };
const BIRD_SKY_MAX = 5;
const BIRD_GROUND_MAX = 5;

/* a bird from above is a body and two swept wings */
function birdArt(sc, col){
  sc = sc || 1;
  const c = col || '#3f4a52';
  return `<g class="bd-wings">
      <path d="M0 0 q ${n(-5*sc)} ${n(-3.4*sc)} ${n(-9*sc)} ${n(-1.2*sc)}
               q ${n(4*sc)} ${n(1.4*sc)} ${n(9*sc)} ${n(1.2*sc)} z" fill="${c}"/>
      <path d="M0 0 q ${n(5*sc)} ${n(-3.4*sc)} ${n(9*sc)} ${n(-1.2*sc)}
               q ${n(-4*sc)} ${n(1.4*sc)} ${n(-9*sc)} ${n(1.2*sc)} z" fill="${c}"/>
    </g>
    <ellipse cx="0" cy="0" rx="${n(2.6*sc)}" ry="${n(1.5*sc)}" fill="${c}"/>
    <circle cx="${n(2.4*sc)}" cy="${n(-0.5*sc)}" r="${n(1.1*sc)}" fill="${c}"/>
    <path d="M${n(3.4*sc)} ${n(-0.5*sc)} l ${n(1.6*sc)} ${n(0.5*sc)} l ${n(-1.6*sc)} ${n(0.6*sc)} z" fill="#e0a13c"/>`;
}

/* a nest is a woven cup with eggs, tucked in a tree */
function nestArt(sc){
  sc = sc || 1;
  let s = `<ellipse cx="0" cy="${n(1.6*sc)}" rx="${n(7*sc)}" ry="${n(4*sc)}" fill="#16240c" opacity=".26"/>`;
  s += `<ellipse cx="0" cy="0" rx="${n(7*sc)}" ry="${n(5*sc)}" fill="#7a6242"/>`;
  s += `<ellipse cx="0" cy="${n(-0.5*sc)}" rx="${n(5.2*sc)}" ry="${n(3.4*sc)}" fill="#5d4a31"/>`;
  /* woven twigs around the rim */
  for(let i=0;i<9;i++){
    const a = (i/9)*Math.PI*2;
    s += `<line x1="${n(Math.cos(a)*6.4*sc)}" y1="${n(Math.sin(a)*4.4*sc)}"
      x2="${n(Math.cos(a)*7.8*sc)}" y2="${n(Math.sin(a)*5.4*sc)}"
      stroke="#8b7150" stroke-width="${n(0.8*sc)}" stroke-linecap="round"/>`;
  }
  [[-1.8,-0.4],[0.6,0.6],[2.2,-0.8]].forEach(e=>{
    s += `<ellipse cx="${n(e[0]*sc)}" cy="${n(e[1]*sc)}" rx="${n(1.7*sc)}" ry="${n(2.1*sc)}" fill="#dfe6d4"/>`;
    s += `<ellipse cx="${n((e[0]-0.4)*sc)}" cy="${n((e[1]-0.5)*sc)}" rx="${n(0.7*sc)}" ry="${n(0.9*sc)}" fill="#fff" opacity=".6"/>`;
  });
  return s;
}

/* where a ground bird would actually bother going */
function birdTargets(){
  const good = S.objs.filter(o=>{
    const a = (BPMAP[o.bp]||{}).art || '';
    return /^tree_|compost|bed|orchard|berry|flowers|pond|fodder|coop/.test(a);
  });
  return good.length ? good : S.objs.slice(0, 4);
}

function birdsInit(){
  if(BIRDS.sky.length) return;
  for(let i=0;i<BIRD_SKY_MAX;i++){
    BIRDS.sky.push({ id:'sk'+i,
      x: Math.random()*WPX, y: -200 + Math.random()*150,
      sc: 0.55 + Math.random()*0.4, vx: 26 + Math.random()*26,
      bobT: Math.random()*6 });
  }
  for(let i=0;i<BIRD_GROUND_MAX;i++){
    BIRDS.ground.push({ id:'gd'+i,
      x: (FARM.x + Math.random()*FARM.w)*T, y: (FARM.y + Math.random()*FARM.h)*T,
      sc: 0.5 + Math.random()*0.25, tx:0, ty:0, wait: Math.random()*3, hop:0 });
  }
}

/* nests appear in mature trees — one per tree, up to three */
function nestSites(){
  const trees = S.objs.filter(o=>/^tree_/.test((BPMAP[o.bp]||{}).art||''));
  return trees.slice(0,3).map(o=>{
    const f = footprint(BPMAP[o.bp], o.rot);
    return { x:(o.tx+f.w*0.68)*T, y:(o.ty+f.h*0.30)*T };
  });
}

function birdsLayer(){
  birdsInit();
  const nests = nestSites().map(p=>
    `<g class="bd-nest" transform="translate(${n(p.x)},${n(p.y)})">${nestArt(0.8)}</g>`).join('');
  const sky = BIRDS.sky.map(b=>
    `<g class="bd bd-sky" data-b="${b.id}" transform="translate(${n(b.x)},${n(b.y)})">
      <g transform="scale(${b.sc.toFixed(2)})">${birdArt(1,'#46525c')}</g></g>`).join('');
  const gnd = BIRDS.ground.map(b=>
    `<g class="bd bd-gnd" data-b="${b.id}" transform="translate(${n(b.x)},${n(b.y)})">
      <ellipse cx="1" cy="4" rx="4" ry="1.6" fill="#16240c" opacity=".3"/>
      <g transform="scale(${b.sc.toFixed(2)})">${birdArt(1,'#5a4636')}</g></g>`).join('');
  return `<g id="birds">${nests}${sky}${gnd}</g>`;
}

function tickBirds(dt){
  if(!BIRDS.sky.length) return;
  const hidden = (S.weather === 'storm' || S.weather === 'rain');
  const night  = (typeof isNight === 'function') ? isNight() : false;
  const away   = hidden || night;

  BIRDS.sky.forEach(b=>{
    b.x += b.vx*dt;
    b.bobT += dt;
    if(b.x > WPX + 120){ b.x = -120; b.y = -200 + Math.random()*150; }
    const el = document.querySelector(`[data-b="${b.id}"]`);
    if(el){
      el.setAttribute('transform', `translate(${n(b.x)},${n(b.y + Math.sin(b.bobT*1.6)*4)})`);
      el.style.opacity = away ? 0 : 1;
    }
  });

  BIRDS.ground.forEach(b=>{
    const el = document.querySelector(`[data-b="${b.id}"]`);
    if(away){ if(el) el.style.opacity = 0; return; }
    if(el) el.style.opacity = 1;
    b.wait -= dt;
    if(b.wait <= 0 && !b.hop){
      const targets = birdTargets();
      if(targets.length){
        const o = targets[Math.floor(Math.random()*targets.length)];
        const f = footprint(BPMAP[o.bp], o.rot);
        b.tx = (o.tx + Math.random()*f.w)*T;
        b.ty = (o.ty + Math.random()*f.h)*T;
        b.hop = 1;
      }
    }
    if(b.hop){
      const dx = b.tx-b.x, dy = b.ty-b.y, d = Math.hypot(dx,dy);
      if(d < 3){ b.hop = 0; b.wait = 1.5 + Math.random()*4; }
      else { const spd = 54*dt; b.x += dx/d*Math.min(d,spd); b.y += dy/d*Math.min(d,spd); }
      if(el) el.setAttribute('transform', `translate(${n(b.x)},${n(b.y)})`);
    }
  });
}

/* birds ride along with the people layer so they land in the same stack */
const _peopleLayerBirds = peopleLayer;
peopleLayer = function(){ return _peopleLayerBirds.apply(this, arguments) + birdsLayer(); };

const _tickPeopleBirds = tickPeople;
tickPeople = function(dt){ const r = _tickPeopleBirds.apply(this, arguments); tickBirds(dt); return r; };

(function birdCss(){
  const s = document.createElement('style');
  s.textContent = `
  #birds{ pointer-events:none; }
  #birds .bd{ transition:opacity .8s ease; }
  #birds .bd-wings{ transform-box:fill-box; transform-origin:center;
    animation: bdFlap .34s ease-in-out infinite; }
  #birds .bd-gnd .bd-wings{ animation-duration:1.6s; }
  @keyframes bdFlap{
    0%,100%{ transform: scaleY(1)    translateY(0); }
    50%    { transform: scaleY(.35)  translateY(-1px); } }
  @media (prefers-reduced-motion: reduce){ #birds .bd-wings{ animation:none !important; } }
  `;
  document.head.appendChild(s);
})();

/* =====================================================================
   COMPOST IS A FAMILY JOB

   Turning a heap is the classic shared chore: the partner turns it, the
   kids carry scraps out to it. Both only happen if a compost bay exists,
   and neither happens in a storm, when the shelter routine wins.
   ===================================================================== */
function compostSpot(){
  const c = S.objs.find(o => (BPMAP[o.bp]||{}).art === 'compost');
  if(!c) return null;
  const f = footprint(BPMAP[c.bp], c.rot);
  return { x:(c.tx + f.w*0.5)*T, y:(c.ty + f.h + 0.4)*T };
}

const _routineCompost = routine;
routine = function(p){
  const f = dayFrac();
  const heap = compostSpot();
  if(heap && S.weather !== 'storm'){
    /* partner turns the heap mid-morning */
    if(p.role === 'partner' && f > 0.40 && f < 0.46)
      return { ...heap, act:'turning the compost' };
    /* the kids run the scraps out after breakfast */
    if(p.role === 'child' && f > 0.36 && f < 0.40)
      return { ...heap, act:'taking out the scraps' };
  }
  return _routineCompost(p);
};

/* =====================================================================
   LIFE INDOORS

   homeSpot() returned a point 0.6 tiles below the bottom wall, so
   "going home" put everyone on the grass outside the front door. They
   slept on the lawn every night. This gives the house an actual
   interior with named rooms, sends people to the right room for what
   they are doing, and puts them to bed in an actual bed.

   It also hides people under the roof when the roof is on, because
   seeing the family walk across the roofline is what gave the old
   behaviour away in the first place.
   ===================================================================== */

function houseRect(){
  const ho = S.objs.find(o => BPMAP[o.bp] && BPMAP[o.bp].kind === 'home')
          || S.objs.find(o => o.bp === 'cabin');
  if(!ho) return null;
  const f = footprint(BPMAP[ho.bp], ho.rot);
  return { o:ho, x:ho.tx*T, y:ho.ty*T, w:f.w*T, h:f.h*T };
}

/* Rooms as fractions of the footprint, so the plan holds for any house
   size. Kept to a real cottage plan: service along the top, living in
   the middle, sleeping along the bottom. */
const ROOMS = {
  kitchen: {x:0.03, y:0.05, w:0.40, h:0.34},
  living:  {x:0.46, y:0.05, w:0.51, h:0.34},
  hall:    {x:0.03, y:0.41, w:0.94, h:0.12},
  bedMain: {x:0.03, y:0.56, w:0.34, h:0.40},
  bedKids: {x:0.39, y:0.56, w:0.34, h:0.40},
  bath:    {x:0.75, y:0.56, w:0.22, h:0.40},
};

/* a point inside a room, jittered per person so two people do not stack */
function roomPoint(room, seed){
  const H = houseRect(); if(!H) return null;
  const r = ROOMS[room] || ROOMS.living;
  const jx = (hash(seed*3.7)-0.5) * r.w * 0.44;
  const jy = (hash(seed*5.1)-0.5) * r.h * 0.44;
  return { x: H.x + (r.x + r.w/2 + jx)*H.w,
           y: H.y + (r.y + r.h/2 + jy)*H.h };
}

/* beds are fixed spots, not jittered - you sleep in your own bed */
function bedPoint(p, idx){
  const H = houseRect(); if(!H) return null;
  const kid = p.role === 'child';
  const r = kid ? ROOMS.bedKids : ROOMS.bedMain;
  const slot = kid ? (idx % 3) : (idx % 2);
  const fx = kid ? (0.22 + slot*0.28) : (0.32 + slot*0.36);
  return { x: H.x + (r.x + r.w*fx)*H.w,
           y: H.y + (r.y + r.h*0.42)*H.h };
}

function isIndoors(p){
  const H = houseRect(); if(!H) return false;
  return p.x >= H.x && p.x <= H.x+H.w && p.y >= H.y && p.y <= H.y+H.h;
}

/* ---------- the indoor timetable ---------- */
/* Returns a spot+act when the person should be inside, otherwise null so
   the outdoor routine keeps running. */
function indoorRoutine(p, idx){
  const H = houseRect(); if(!H) return null;
  const f = dayFrac();
  const storm = S.weather === 'storm';

  /* asleep: in bed, in the right room */
  if(f < 0.24 || f > 0.90){
    const b = bedPoint(p, idx);
    return b ? {...b, act:'asleep'} : null;
  }

  /* first thing: breakfast in the kitchen */
  if(f < 0.30){
    return {...roomPoint('kitchen', idx+1), act: p.role==='child' ? 'eating breakfast' : 'making breakfast'};
  }

  /* evening: dinner, washing up, then the children are put to bed */
  if(f > 0.78 && f <= 0.90){
    if(f > 0.86 && p.role === 'child')
      return {...bedPoint(p, idx), act:'being read to'};
    if(f > 0.84)
      return {...roomPoint('living', idx+2), act: p.role==='child' ? 'in pyjamas' : 'sitting by the fire'};
    if(f > 0.81)
      return {...roomPoint('kitchen', idx+3), act: p.role==='partner' ? 'washing up' : 'drying the dishes'};
    return {...roomPoint('living', idx), act:'having dinner'};
  }

  /* a storm keeps everyone in, whatever the hour */
  if(storm){
    const acts = p.role === 'child'
      ? ['drawing at the table','reading by the window','playing cards']
      : ['watching the storm','making tea','mending by the fire'];
    const room = (idx % 2) ? 'kitchen' : 'living';
    return {...roomPoint(room, idx+7), act: acts[idx % acts.length]};
  }

  return null;
}

/* indoor life takes priority over every outdoor routine */
const _routineIndoor = routine;
routine = function(p){
  const list = S.family.concat(S.workers || []);
  const idx = Math.max(0, list.findIndex(q => q.id === p.id));
  /* Farmhands live in their own cottage, not in the family's beds.
     They are not tagged with a role when tickPeople passes them in, so
     identify them by membership rather than by field. */
  const isWorker = (S.workers || []).some(w => w.id === p.id) || p.role === 'worker';
  if(!isWorker){
    const inside = indoorRoutine(p, idx);
    if(inside) return inside;
  }
  return _routineIndoor(p);
};

/* homeSpot itself was the original bug: it pointed at the grass below
   the house. Anything still calling it now lands in the hall. */
homeSpot = function(){
  const H = houseRect();
  if(!H) return {x:(FARM.x+4)*T, y:(FARM.y+4)*T};
  const r = ROOMS.hall;
  return { x: H.x + (r.x + r.w/2)*H.w, y: H.y + (r.y + r.h/2)*H.h };
};

/* ---------- you cannot see through a roof ---------- */
/* When the roof is on, people inside the footprint are hidden and the
   windows glow instead. That is both realistic and the whole reason the
   roof toggle exists. */
const _paintPeopleIndoor = paintPeople;
paintPeople = function(){
  const r = _paintPeopleIndoor.apply(this, arguments);
  const roofOff = SET('roofOff');
  const all = S.family.concat(S.workers || []);
  let hidden = 0;
  all.forEach(p=>{
    const el = document.querySelector(`[data-p="${p.id}"]`);
    if(!el) return;
    const tuckedIn = !roofOff && isIndoors(p);
    el.style.opacity = tuckedIn ? '0' : '';
    el.style.pointerEvents = tuckedIn ? 'none' : '';
    if(tuckedIn) hidden++;
  });
  const badge = document.getElementById('roofbtn');
  if(badge) badge.classList.toggle('has-people', hidden > 0);
  return r;
};

/* ---------- a much better interior ---------- */
function interiorArt(w, h){
  const R = (k)=>({ x:ROOMS[k].x*w, y:ROOMS[k].y*h, w:ROOMS[k].w*w, h:ROOMS[k].h*h });
  let s = '';

  /* floor: boards with staggered end-joints, warmer where the light falls */
  s += `<rect x="0" y="0" width="${n(w)}" height="${n(h)}" rx="3" fill="#c39a6b"/>`;
  const boards = Math.max(6, Math.round(h/9));
  for(let i=0;i<boards;i++){
    const by = h*i/boards;
    s += `<rect x="0" y="${n(by)}" width="${n(w)}" height="${n(h/boards)}"
      fill="${i%2 ? '#c9a273' : '#bd9265'}"/>`;
    s += `<line x1="0" y1="${n(by)}" x2="${n(w)}" y2="${n(by)}" stroke="#a37e52" stroke-width="0.5" opacity=".65"/>`;
    const j = 0.2 + hash(i*2.7)*0.6;
    s += `<line x1="${n(w*j)}" y1="${n(by)}" x2="${n(w*j)}" y2="${n(by + h/boards)}"
      stroke="#a37e52" stroke-width="0.5" opacity=".5"/>`;
  }

  /* walls: a thick shell plus partitions, with door gaps left open */
  const wallC = '#f1e8d9', wallS = '#b9ab95';
  s += `<rect x="0.8" y="0.8" width="${n(w-1.6)}" height="${n(h-1.6)}" rx="3"
    fill="none" stroke="${wallC}" stroke-width="3.2"/>`;
  s += `<rect x="2.6" y="2.6" width="${n(w-5.2)}" height="${n(h-5.2)}" rx="2"
    fill="none" stroke="${wallS}" stroke-width="0.8" opacity=".5"/>`;
  const part = (x1,y1,x2,y2)=>`<line x1="${n(x1)}" y1="${n(y1)}" x2="${n(x2)}" y2="${n(y2)}"
    stroke="${wallC}" stroke-width="2.6" stroke-linecap="round"/>`;
  s += part(w*0.445, 2, w*0.445, h*0.40);        // kitchen | living
  s += part(2, h*0.40, w*0.30, h*0.40);          // hall wall, door gap after
  s += part(w*0.42, h*0.40, w*0.98, h*0.40);
  s += part(2, h*0.545, w*0.28, h*0.545);
  s += part(w*0.40, h*0.545, w*0.98, h*0.545);
  s += part(w*0.375, h*0.56, w*0.375, h-2);      // bedroom divider
  s += part(w*0.735, h*0.56, w*0.735, h-2);      // bath divider

  /* ---- kitchen ---- */
  const K = R('kitchen');
  s += `<rect x="${n(K.x+2)}" y="${n(K.y+2)}" width="${n(K.w-4)}" height="${n(K.h*0.26)}" rx="1.6" fill="#8e9aa2"/>`;
  s += `<rect x="${n(K.x+2)}" y="${n(K.y+2)}" width="${n(K.w-4)}" height="${n(K.h*0.09)}" rx="1.6" fill="#aab6bd"/>`;

/* =====================================================================
   SHAREWARE GATE, OWNER PANEL, AND PLAY ANALYSIS

   Three separate things, kept honest about what each can and cannot do.

   1. A thirty-minute trial on shared copies. This is an honour-system
      nag, not DRM: it lives in localStorage, so devtools, a private
      window or clearing site data resets it. Anyone who wants past it
      gets past it. It is here to prompt people who would happily pay,
      not to stop people who would not.

   2. An owner panel of real play statistics — for THIS browser only.
      A published artifact is sealed: it cannot phone home, so it cannot
      possibly know what other people did with a link you shared. The
      panel says so on its face rather than implying otherwise.

   3. An analysis of that play which reads the actual save and suggests
      what to build next and what is going wrong.
   ===================================================================== */

/* ------------------------------------------------------------------
   PASTE YOUR PAYPAL LINK HERE
   e.g. 'https://paypal.me/yourhandle/5'
   While this is empty the pay button stays disabled, so nobody can
   send money to the wrong account.
   ------------------------------------------------------------------ */
const PAYPAL_LINK = 'https://www.paypal.com/ncp/payment/GL6SLJKVCLHBY';

const TRIAL_MS   = 30 * 60 * 1000;      // thirty minutes of actual play
const GATE_KEY   = 'greenhollow_play';

/* The owner runs the file locally; shared copies are served over http(s).
   So the gate applies to people you share with, not to you. */
function gateApplies(){
  if(location.protocol === 'file:') return false;
  return !PLAY.unlocked;
}

const PLAY = (function loadPlay(){
  let d = {};
  try { d = JSON.parse(localStorage.getItem(GATE_KEY) || '{}'); } catch(e){ d = {}; }
  return {
    ms:        d.ms        || 0,      // cumulative milliseconds played
    sessions:  d.sessions  || 0,
    firstSeen: d.firstSeen || Date.now(),
    lastSeen:  d.lastSeen  || Date.now(),
    unlocked:  !!d.unlocked,
    prompted:  d.prompted  || 0,      // times the gate has been shown
  };
})();

function savePlay(){
  try { localStorage.setItem(GATE_KEY, JSON.stringify(PLAY)); } catch(e){}
}

PLAY.sessions++;
PLAY.lastSeen = Date.now();
savePlay();

/* count only time the tab is actually in front and the sim is running */
let gateLast = performance.now();
function tickGate(){
  const now = performance.now();
  const dt = now - gateLast;
  gateLast = now;
  if(document.hidden) return;
  if(typeof S === 'undefined' || !S) return;
  PLAY.ms += dt;
  PLAY.lastSeen = Date.now();
  if(PLAY.ms % 5000 < 40) savePlay();
  if(gateApplies() && PLAY.ms >= TRIAL_MS) showGate();
}
setInterval(tickGate, 1000);

function fmtDur(ms){
  const m = Math.floor(ms/60000), h = Math.floor(m/60);
  return h ? `${h}h ${m%60}m` : `${m}m`;
}

/* ---------- the lock ---------- */
let gateShown = false;
function showGate(){
  if(gateShown) return;
  gateShown = true;
  if(typeof S !== 'undefined' && S) S.speed = 0;      // stop the world
  PLAY.prompted++; savePlay();

  const paid = PAYPAL_LINK && /^https:\/\//.test(PAYPAL_LINK);
  const el = document.createElement('div');
  el.id = 'gateWrap';
  el.innerHTML = `
    <div class="gateCard">
      <div class="gateMark">🌱</div>
      <h2>You have played 30 minutes of Greenhollow</h2>
      <p>The free trial ends here. If you have enjoyed it, five dollars keeps
      the farm going and unlocks the rest — the seasons, the upgrades, the
      whole homestead.</p>
      ${paid
        ? `<a class="gateBtn pay" href="${PAYPAL_LINK}" target="_blank" rel="noopener noreferrer">
             Continue with PayPal</a>`
        : `<button class="gateBtn pay" disabled title="The owner has not set a PayPal link yet">
             PayPal link not set up yet</button>`}
      <button class="gateBtn ghost" onclick="G.gateUnlock()">I have donated — unlock</button>
      <p class="gateFine">Unlocking is on trust: the game cannot verify a payment on its own.
      Your farm is saved either way.</p>
    </div>`;
  document.body.appendChild(el);
  if(typeof sfx === 'function') sfx('error');
}

G.gateUnlock = function(){
  PLAY.unlocked = true; savePlay();
  const w = document.getElementById('gateWrap'); if(w) w.remove();
  gateShown = false;
  if(typeof S !== 'undefined' && S) S.speed = 1;
  if(typeof toast === 'function') toast('Unlocked — thank you', 'gold');
  if(typeof sfx === 'function') sfx('level');
};

/* ---------- owner panel: real numbers, this browser only ---------- */
function ownerStats(){
  const byCat = {};
  (S.objs || []).forEach(o=>{
    const bp = BPMAP[o.bp]; if(!bp) return;
    const c = bp.cat || bp.kind || 'other';
    byCat[c] = (byCat[c] || 0) + 1;
  });
  const tiers = (S.objs || []).reduce((a,o)=> a + (o.tier||0), 0);
  return {
    played:    PLAY.ms,
    sessions:  PLAY.sessions,
    firstSeen: PLAY.firstSeen,
    prompted:  PLAY.prompted,
    unlocked:  PLAY.unlocked,
    day:       S.day || 0,
    level:     S.level || 1,
    cash:      S.cash || 0,
    earned:    S.totalEarned || 0,
    objects:   (S.objs || []).length,
    upgrades:  tiers,
    family:    (S.family || []).length,
    workers:   (S.workers || []).length,
    byCat,
  };
}

/* ---------- the analysis ---------- */
/* Reads the save and reports what is actually wrong or missing, ordered
   by how much it costs the player. No invented data. */
function playAnalysis(){
  const st = ownerStats();
  const out = [];
  const has = art => (S.objs || []).some(o => (BPMAP[o.bp]||{}).art === art);
  const countKind = k => (S.objs || []).filter(o => (BPMAP[o.bp]||{}).kind === k).length;

  /* survival first */
  if(st.cash < 200)
    out.push({sev:'high', t:'Cash is low',
      d:`${fmt(st.cash)} left. Bills land monthly whether or not the farm earns. Sell stock or take on a job before payday.`});

  /* stat() is the engine's own reckoning - short is the flag the sim uses */
  if(typeof stat === 'function'){
    try { const p = stat(); if(p && p.short)
      out.push({sev:'high', t:'Short of power',
        d:`Generating ${p.power}kW against ${p.use}kW of demand. Greenhouses and workshops drop to 40% until you add solar or a battery.`}); } catch(e){}
  }

  if(!has('lightning_rod') && countKind('animal') > 0)
    out.push({sev:'high', t:'No lightning rod',
      d:`You keep animals and have no rod. A storm strike has a 40% chance of killing one.`});

  /* yield and economy */
  if(!has('compost') && countKind('plot') > 0)
    out.push({sev:'med', t:'No compost',
      d:'Compost lifts bed yield and costs nothing to run. With '+countKind('plot')+' beds it pays for itself quickly.'});

  if(!has('tank') && !has('pond'))
    out.push({sev:'med', t:'No water storage',
      d:'Rain tanks turn wet weather into irrigation. Without them a dry spell stalls every crop.'});

  if(countKind('plot') > 0 && countKind('process') === 0)
    out.push({sev:'med', t:'Selling raw produce',
      d:'A jam kitchen or dairy turns cheap produce into goods worth several times more.'});

  if(st.upgrades === 0 && st.objects > 4)
    out.push({sev:'med', t:'Nothing upgraded yet',
      d:'Every building has four tiers. Mk II is usually the cheapest yield you can buy, and the structure visibly changes.'});

  /* people */
  if(st.family > 0 && !has('playground') && !has('deck'))
    out.push({sev:'low', t:'Nothing for the family to do',
      d:'Recreation keeps the household content and gives the children somewhere to go in the afternoon.'});

  if(st.workers === 0 && st.objects > 12)
    out.push({sev:'low', t:'Working the farm alone',
      d:'A farmhand costs wages but covers jobs while you are busy. Worth it past a dozen buildings.'});

  /* engagement */
  if(st.day > 20 && countKind('tourism') === 0)
    out.push({sev:'low', t:'No visitor income',
      d:'Tourism earns without planting anything. A tea kiosk or glamping tent pays on charm alone.'});

  if(!out.length)
    out.push({sev:'low', t:'Nothing obvious to fix',
      d:'The farm is in good order. Push a building to Mk IV, or expand the land and start a second block.'});

  return out;
}

function ownerPanelHTML(){
  const st = ownerStats();
  const an = playAnalysis();
  const sev = {high:'#e0664f', med:'#f0a24b', low:'#7cc24f'};
  const row = (k,v)=>`<div class="tl"><span>${k}</span><b>${v}</b></div>`;
  const cats = Object.keys(st.byCat).sort((a,b)=>st.byCat[b]-st.byCat[a])
    .map(c=>`<span class="ochip">${c} <b>${st.byCat[c]}</b></span>`).join('');
  return `
  <div class="pcard">
    <h3>This browser</h3>
    <p class="sub">A published page is sealed off — it cannot report back to you.
    These numbers are this browser only, and say nothing about people you shared a link with.
    For real visitor figures use the analytics on the GitHub Pages copy.</p>
    ${row('Time played', fmtDur(st.played))}
    ${row('Sessions', st.sessions)}
    ${row('First opened', new Date(st.firstSeen).toLocaleDateString())}
    ${row('Trial prompt shown', st.prompted + (st.unlocked ? ' · unlocked' : ''))}
  </div>
  <div class="pcard">
    <h3>This farm</h3>
    ${row('Day', st.day)}${row('Level', st.level)}
    ${row('Cash', fmt(st.cash))}${row('Earned all up', fmt(st.earned))}
    ${row('Buildings', st.objects)}${row('Upgrade levels bought', st.upgrades)}
    ${row('Household', st.family + ' family · ' + st.workers + ' hired')}
    <div class="ochips">${cats || '<span class="muted">nothing built yet</span>'}</div>
  </div>
  <div class="pcard">
    <h3>What to improve</h3>
    <p class="sub">Read from your actual save, ordered by what it is costing you.</p>
    ${an.map(a=>`<div class="oadv" style="--sev:${sev[a.sev]}">
      <b>${a.t}</b><span>${a.d}</span></div>`).join('')}
  </div>
  <div class="pcard">
    <button class="btn ghost" onclick="G.exportStats()">Download these stats as CSV</button>
  </div>`;
}

G.exportStats = function(){
  const st = ownerStats();
  const rows = [['metric','value'],
    ['time_played_minutes', Math.round(st.played/60000)],
    ['sessions', st.sessions],
    ['first_seen', new Date(st.firstSeen).toISOString()],
    ['trial_prompted', st.prompted],
    ['unlocked', st.unlocked],
    ['day', st.day], ['level', st.level],
    ['cash', st.cash], ['total_earned', st.earned],
    ['buildings', st.objects], ['upgrade_levels', st.upgrades],
    ['family', st.family], ['workers', st.workers]];
  Object.keys(st.byCat).forEach(c=>rows.push(['built_'+c, st.byCat[c]]));
  const csv = rows.map(r=>r.join(',')).join('\n');
  /* the artifact runtime offers a real save dialog; a blob link elsewhere */
  if(window.claude && window.claude.downloads && window.claude.downloads.save){
    window.claude.downloads.save({filename:'greenhollow-stats.csv', data:csv})
      .then(()=>toast('Stats saved','good'))
      .catch(()=>toast('Save cancelled',''));
    return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], {type:'text/csv'}));
  a.download = 'greenhollow-stats.csv';
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Stats downloaded','good');
};

/* =====================================================================
   THE FARM LOG, THE FAMILY'S VOICES, AND MILESTONE EVENTS

   Everything the family did indoors was invisible: they went to bed,
   ate breakfast, sheltered from a storm, and the log said nothing. Now
   it narrates their day, grouped and filterable so it does not become
   a wall of noise.

   They also talk to each other. When two of them end up in the same
   room or the same corner of a paddock, one of them says something
   suited to the hour, the weather and who they are with.

   And the milestones report to GoatCounter as events — which needs no
   backend at all. It only fires where analytics exists, so the artifact
   and local copies stay silent.
   ===================================================================== */

/* ---------- 1. a log that knows what kind of thing happened ---------- */

const LOG_CATS = {
  farm:   {n:'Farm',   i:'🌱'},
  home:   {n:'Home',   i:'🏠'},
  money:  {n:'Money',  i:'💰'},
  weather:{n:'Weather',i:'🌦'},
  alert:  {n:'Alerts', i:'⚠️'},
};
let logFilter = 'all';

/* classify by wording, so every existing log() call is categorised too */
function logCat(msg, cls){
  const m = String(msg).toLowerCase();
  /* Severity wins over subject matter: "struck by lightning" is something
     going wrong, not a weather report, so this has to be tested first. */
  if(cls === 'bad' || /died|dead|struck|lost|short of|nowhere|crowded|failed|wilted|escaped/.test(m))
    return 'alert';
  if(/bill|payday|sold|salary|paid|wage|cost|\$|earn|bought|price/.test(m))
    return 'money';
  if(/storm|rain|frost|heat|lightning|weather|sunny|cloud|forecast/.test(m))
    return 'weather';
  if(/asleep|turned in|bed|breakfast|dinner|dishes|read to|story|indoors|chores|house|kettle|tea|fire|pyjamas|compost|scraps/.test(m))
    return 'home';
  return 'farm';
}

function renderLog(){
  const el = document.getElementById('log');
  if(!el) return;
  const rows = (S.log || []).filter(l => logFilter === 'all' || (l.k || 'farm') === logFilter);
  const chips = ['all'].concat(Object.keys(LOG_CATS)).map(k=>{
    const on = logFilter === k ? ' on' : '';
    const label = k === 'all' ? 'All' : LOG_CATS[k].i + ' ' + LOG_CATS[k].n;
    const count = k === 'all' ? (S.log||[]).length
      : (S.log||[]).filter(l => (l.k||'farm') === k).length;
    return `<button class="lgchip${on}" onclick="G.logFilter('${k}')">${label}<i>${count}</i></button>`;
  }).join('');
  el.innerHTML = `<div class="lgchips">${chips}</div>` + (rows.length
    ? rows.map(l=>`<div class="lg ${l.c} k-${l.k||'farm'}">
        <time>D${l.d}</time>
        <em>${LOG_CATS[l.k||'farm'].i}</em>
        <span>${l.m}</span></div>`).join('')
    : `<div class="lgempty">Nothing under this filter yet.</div>`);
}

G.logFilter = function(k){ logFilter = k; renderLog(); if(typeof sfx==='function') sfx('click'); };

/* keep the same signature every caller already uses */
log = function(msg, cls, cat){
  S.log.unshift({d:S.day, m:msg, c:cls||'', k:cat || logCat(msg, cls), t:Date.now()});
  if(S.log.length > 90) S.log.pop();
  renderLog();
};

/* ---------- 2. narrate the household ---------- */
/* Log only when someone's activity actually changes, and only for the
   things worth reading. Ticking every frame would bury everything else. */
const ACT_WORDING = {
  'asleep':                 p => `${p.name} turned in for the night.`,
  'making breakfast':       p => `${p.name} put breakfast on.`,
  'eating breakfast':       p => `${p.name} came down for breakfast.`,
  'having dinner':          p => `${p.name} sat down to dinner.`,
  'washing up':             p => `${p.name} started the washing up.`,
  'drying the dishes':      p => `${p.name} dried the dishes.`,
  'sitting by the fire':    p => `${p.name} settled by the fire.`,
  'being read to':          p => `${p.name} was read a story.`,
  'in pyjamas':             p => `${p.name} got into pyjamas.`,
  'watching the storm':     p => `${p.name} watched the storm from the window.`,
  'making tea':             p => `${p.name} put the kettle on.`,
  'mending by the fire':    p => `${p.name} mended something by the fire.`,
  'drawing at the table':   p => `${p.name} drew at the kitchen table.`,
  'reading by the window':  p => `${p.name} read by the window.`,
  'playing cards':          p => `${p.name} dealt out a game of cards.`,
  'turning the compost':    p => `${p.name} turned the compost heap.`,
  'taking out the scraps':  p => `${p.name} carried the scraps out to the compost.`,
  'tending the beds':       p => `${p.name} worked through the beds.`,
  'feeding the animals':    p => `${p.name} fed the animals.`,
  'studying':               p => `${p.name} sat down to schoolwork.`,
  'playing':                p => `${p.name} went off to play.`,
};

function narrateHousehold(){
  (S.family || []).forEach(p=>{
    if(!p.act) return;
    if(p._loggedAct === p.act) return;
    p._loggedAct = p.act;
    const w = ACT_WORDING[p.act];
    if(w) log(w(p), '', 'home');
  });
}

/* ---------- 3. they talk to each other ---------- */
const CHAT = {
  night:   ['Sleep well.', 'Long day tomorrow.', 'Night, love.', 'One more story?'],
  storm:   ['That was close!', 'Hope the roof holds.', 'Count the seconds…', 'Glad we came in.'],
  kitchen: ['Smells good.', 'Pass the salt?', 'Who left the tap on?', 'Seconds?'],
  work:    ['Beds need water.', 'Chooks are out again.', 'Fence wants fixing.', 'Good crop this year.'],
  play:    ['Chase me!', 'Watch this!', 'My turn!', 'Look what I found!'],
  idle:    ['Lovely evening.', 'Kettle on?', 'Did you see the birds?', 'All quiet.'],
};

function chatPool(){
  const f = (typeof dayFrac === 'function') ? dayFrac() : 0.5;
  if(S.weather === 'storm') return CHAT.storm;
  if(f < 0.24 || f > 0.88)  return CHAT.night;
  if(f < 0.30 || (f > 0.78 && f < 0.86)) return CHAT.kitchen;
  return CHAT.idle;
}

const BUBBLES = [];
let chatCool = 0;

function tickChat(dt){
  chatCool -= dt;
  /* age out the bubbles that are showing */
  for(let i=BUBBLES.length-1;i>=0;i--){
    BUBBLES[i].life -= dt;
    if(BUBBLES[i].life <= 0){
      const el = document.getElementById(BUBBLES[i].id);
      if(el) el.remove();
      BUBBLES.splice(i,1);
    }
  }
  if(chatCool > 0 || BUBBLES.length >= 2) return;
  if(typeof SET === 'function' && SET('motion') === false) return;

  /* find two people standing close enough to be talking */
  const all = (S.family || []).concat(S.workers || []);
  if(all.length < 2) return;
  const pairs = [];
  for(let i=0;i<all.length;i++)
    for(let j=i+1;j<all.length;j++){
      const d = Math.hypot(all[i].x-all[j].x, all[i].y-all[j].y);
      if(d < 46) pairs.push([all[i], all[j]]);
    }
  if(!pairs.length){ chatCool = 3; return; }

  const [a, b] = pairs[Math.floor(Math.random()*pairs.length)];
  const kidTalk = a.role === 'child' && b.role === 'child';
  const pool = kidTalk ? CHAT.play : chatPool();
  speak(a, pool[Math.floor(Math.random()*pool.length)]);
  /* the other one answers a beat later */
  setTimeout(()=>{ if(Math.random() < 0.6) speak(b, pool[Math.floor(Math.random()*pool.length)]); }, 1200);
  chatCool = 7 + Math.random()*8;
}

function speak(p, text){
  const layer = document.getElementById('people');
  if(!layer) return;
  const id = 'bub' + Math.random().toString(36).slice(2,7);
  const w = Math.max(38, Math.min(120, text.length*5.4));
  /* Two people talking stand close together, so their bubbles would sit on
     top of each other. Lift this one clear of any bubble already nearby. */
  let lift = 0;
  BUBBLES.forEach(b=>{
    if(Math.abs(b.p.x - p.x) < 90 && Math.abs(b.p.y - p.y) < 40) lift += 20;
  });
  const g = document.createElementNS('http://www.w3.org/2000/svg','g');
  g.setAttribute('id', id);
  g.setAttribute('class', 'bubble');
  g.setAttribute('transform', `translate(${Math.round(p.x)},${Math.round(p.y - 30 - lift)})`);
  g.innerHTML =
    `<rect x="${-w/2}" y="-15" width="${w}" height="18" rx="9" fill="#fdfbf4"
       stroke="#c9c0aa" stroke-width="0.8"/>
     <path d="M-3 3 L0 8 L3 3 Z" fill="#fdfbf4" stroke="#c9c0aa" stroke-width="0.8"/>
     <text x="0" y="-2.5" text-anchor="middle" font-size="9"
       font-family="system-ui,-apple-system,sans-serif" fill="#3d4634">${text}</text>`;
  layer.appendChild(g);
  BUBBLES.push({id, life:3.6, p, lift});
}

/* bubbles follow the speaker while they are up */
function moveBubbles(){
  BUBBLES.forEach(b=>{
    const el = document.getElementById(b.id);
    if(el) el.setAttribute('transform', `translate(${Math.round(b.p.x)},${Math.round(b.p.y - 30 - (b.lift||0))})`);
  });
}

const _tickPeopleChat = tickPeople;
tickPeople = function(dt){
  const r = _tickPeopleChat.apply(this, arguments);
  if(S && S.speed !== 0){ narrateHousehold(); tickChat(dt); }
  moveBubbles();
  return r;
};

/* ---------- 4. milestones as GoatCounter events ---------- */
/* No backend: GoatCounter takes client-side events. It only exists on the
   Pages copy, so this is a silent no-op in the artifact and locally. */
const SENT = (function(){
  try { return JSON.parse(localStorage.getItem('greenhollow_ev') || '{}'); }
  catch(e){ return {}; }
})();

function trackOnce(name){
  if(SENT[name]) return;
  if(!track(name)) return;          // not delivered - try again next sweep
  SENT[name] = 1;
  try { localStorage.setItem('greenhollow_ev', JSON.stringify(SENT)); } catch(e){}
}
/* returns true only if the event was actually handed to GoatCounter */
function track(name){
  if(!window.goatcounter || typeof window.goatcounter.count !== 'function') return false;
  try {
    window.goatcounter.count({path:'ev-' + name, title:'Greenhollow: ' + name, event:true});
    return true;
  } catch(e){ return false; }
}

/* the funnel worth knowing: did they start, keep going, hit the wall, pay */
function trackMilestones(){
  if(typeof S === 'undefined' || !S) return;
  trackOnce('opened');
  if(S.landId)                      trackOnce('land-chosen');
  if(S.settings && S.settings.wfh === false) trackOnce('offgrid-chosen');
  if((S.objs||[]).length >= 8)      trackOnce('built-8');
  if((S.objs||[]).some(o=>o.tier>0))trackOnce('first-upgrade');
  [3,5,10,25,50].forEach(d=>{ if(S.day >= d) trackOnce('day-' + d); });
  if(typeof PLAY !== 'undefined'){
    if(PLAY.ms > 5*60000)  trackOnce('played-5min');
    if(PLAY.ms > 15*60000) trackOnce('played-15min');
    if(PLAY.prompted > 0)  trackOnce('trial-gate-hit');
    if(PLAY.unlocked)      trackOnce('unlocked');
  }
}
setInterval(trackMilestones, 20000);
setTimeout(trackMilestones, 4000);

/* fire the two that matter the moment they happen, not on the next sweep */
if(typeof G.gateUnlock === 'function'){
  const _unlock = G.gateUnlock;
  G.gateUnlock = function(){ trackOnce('unlocked'); return _unlock.apply(this, arguments); };
}
