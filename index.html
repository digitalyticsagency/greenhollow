  chicken:['Bok…? Bok.','…bok.','Bok bok?'],
  duck:   ['Quack…?','…quack.','Quack quack?'],
  sheep:  ['Baa…?','…baa.','Baa? Baa.'],
  goat:   ['Meh…?','…meh.','Meh? Meh.'],
  cow:    ['Moo…?','…moo.','Moo? Moo.'],
  rabbit: ['*sniff*','*ears up*','*still*'],
  bee:    ['bzz…','…bzz'],
};

/* ---------- the panic itself ---------- */
/* Deliberately long: stock stay balled up well after the thunder stops. */
const PANIC_MS = 34000;

function startlePens(){
  const pens = animalPens().filter(o=>(o.animals||0) > 0);
  if(!pens.length) return;
  S.animalPanic = { until: Date.now() + PANIC_MS, phase:'cry', callAt: Date.now() + 5000 };

  pens.forEach((o, i)=>{
    const sp = penSpecies(o);
    const cry = (PANIC_CRY[sp] || ['😨 !'])[Math.floor(Math.random()*(PANIC_CRY[sp]||[1]).length)];
    /* stagger so the yard erupts rather than shouting in unison */
    setTimeout(()=>{
      const c = penCentre(o);
      if(typeof speak === 'function') speak({x:c.x, y:c.y}, cry);
      const v = ANIMAL_VOICE[sp];
      if(v && typeof SND !== 'undefined') SND.play(v.sfx);
    }, 60 + i*170);
  });

  applyPanicClass(true);
  if(typeof log === 'function')
    log('The stock scattered at the thunder, then bunched up in the middle of the pens.', '', 'alert');
}

/* the bunching is one class on each pen's group */
function applyPanicClass(on){
  animalPens().forEach(o=>{
    const el = document.querySelector(`.ob[data-id="${o.id}"]`);
    if(el) el.classList.toggle('panic', !!on);
  });
}

/* while it lasts they call across the yard, one pen at a time */
function tickPanic(){
  const p = S.animalPanic;
  if(!p) return;
  const now = Date.now();
  if(now > p.until){
    S.animalPanic = null;
    applyPanicClass(false);
    if(typeof log === 'function')
      log('The stock have settled and spread back out.', 'good', 'farm');
    return;
  }
  /* nothing but crying for the first few seconds */
  if(now < p.callAt) return;
  p.callAt = now + 2200 + Math.random()*2600;
  const pens = animalPens().filter(o=>(o.animals||0) > 0);
  if(!pens.length) return;
  const o = pens[Math.floor(Math.random()*pens.length)];
  const sp = penSpecies(o);
  const pool = PANIC_CALL[sp];
  if(!pool) return;
  const c = penCentre(o);
  if(typeof speak === 'function') speak({x:c.x, y:c.y}, pool[Math.floor(Math.random()*pool.length)]);
  /* a neighbour answers a beat later - that is the conversation */
  const others = pens.filter(x=>x.id !== o.id);
  if(others.length && Math.random() < 0.7){
    const o2 = others[Math.floor(Math.random()*others.length)];
    const sp2 = penSpecies(o2);
    const pool2 = PANIC_CALL[sp2];
    if(pool2) setTimeout(()=>{
      const c2 = penCentre(o2);
      if(typeof speak === 'function') speak({x:c2.x, y:c2.y}, pool2[Math.floor(Math.random()*pool2.length)]);
    }, 900 + Math.random()*700);
  }
}

/* the pen class has to be reapplied after any redraw */
if(typeof render === 'function'){
  const _renderPanic = render;
  render = function(){
    const r = _renderPanic.apply(this, arguments);
    if(S && S.animalPanic) applyPanicClass(true);
    return r;
  };
}

/* while panicking the stock are too upset to chat normally */
if(typeof tickVoices === 'function'){
  const _tickVoicesPanic = tickVoices;
  tickVoices = function(dt){
    if(S && S.animalPanic) return;
    return _tickVoicesPanic.apply(this, arguments);
  };
}

/* the trigger, alongside the family's own startle */
if(typeof lightningStrike === 'function'){
  const _strikeAnimals = lightningStrike;
  lightningStrike = function(){
    const r = _strikeAnimals.apply(this, arguments);
    /* a follow-up stroke extends the panic rather than restarting it */
    if(S && S.animalPanic){ S.animalPanic.until = Date.now() + PANIC_MS; }
    else startlePens();
    return r;
  };
}

const _tickPeoplePanic = tickPeople;
tickPeople = function(dt){
  const r = _tickPeoplePanic.apply(this, arguments);
  if(S && S.speed !== 0) tickPanic();
  return r;
};

(function panicCss(){
  const s = document.createElement('style');
  s.textContent = `
  /* each animal carries the offset to its own pen centre, so one class
     bunches the whole pen without knowing where anything is */
  .pen-animal{ transform-box:fill-box; transform-origin:center;
    transition: transform 1.1s cubic-bezier(.2,.8,.3,1); }
  .ob.panic .pen-animal{
    transform: translate(var(--hx,0), var(--hy,0)) scale(.92);
    animation: penShiver 0.5s ease-in-out infinite; }
  @keyframes penShiver{

    50%    { translate: 0.4px -0.3px; } }

    .ob.panic .pen-animal{ animation:none !important; } }
  `;

/* so it can be seen without waiting for weather */
G.scareStock = function(){ startlePens(); };

/* =====================================================================
   INTO THE SHED, AND WHAT COMES DOWN AFTER

   After the panic passes the stock do not just spread back out — they
   file into the shed and stay in for a while, and what they get up to
   in there changes the longer they are shut in. Lift the roof and you
   can watch it.

   And then, because a storm this violent should leave something behind:
   sometimes a craft comes down through the cloud, puts a beam on a pen
   and takes an animal. Shoot it down and it drops what it was carrying —
   two head of something that is not quite a cow any more, and which
   turns out to be worth a great deal every month.
   ===================================================================== */

/* ---------- 1. into the shed ---------- */
const SHED_MS = 150000;                 /* they stay in a good while */
const SHED_ACTS = [
  {at:0,     n:'huddled together',  d:'Still pressed into one corner, not moving.'},
  {at:0.18,  n:'settling',          d:'Starting to spread out and sniff around.'},
  {at:0.36,  n:'at the hay',        d:'Pulling at the hay net, calmer now.'},
  {at:0.56,  n:'playing',           d:'The young ones have started shoving each other about.'},
  {at:0.74,  n:'grooming',          d:'Nosing and grooming each other. This is what settled stock do.'},
  {at:0.88,  n:'dozing',            d:'Lying down with their legs tucked under. Fully at ease.'},
];

function shedPhase(){
  const s = S.shed;
  if(!s) return null;
  const t = 1 - (s.until - Date.now())/SHED_MS;
  let cur = SHED_ACTS[0];
  SHED_ACTS.forEach(a=>{ if(t >= a.at) cur = a; });
  return {...cur, t};
}

function startShed(){
  S.shed = { until: Date.now() + SHED_MS, said: 0 };
  applyShedClass(true);
  if(typeof log === 'function')
    log('The stock have taken themselves into the sheds. They will be in a while.', '', 'home');
}

function applyShedClass(on){
  animalPens().forEach(o=>{
    const el = document.querySelector(`.ob[data-id="${o.id}"]`);
    if(el) el.classList.toggle('inshed', !!on);
  });
}

/* the cutaway: bedding, a hay net, a water trough, and the stock */
function shedInteriors(){
  if(!SET('roofOff') || !S.shed) return '';
  let s = '';
  animalPens().filter(o=>(o.animals||0) > 0).forEach(o=>{
    const bp = BPMAP[o.bp], f = footprint(bp, o.rot);
    const w = f.w*T, h = f.h*T, X = o.tx*T, Y = o.ty*T;
    s += `<g class="shedcut" transform="translate(${n(X)},${n(Y)})">`;
    /* straw floor */
    s += `<rect x="${n(w*0.08)}" y="${n(h*0.08)}" width="${n(w*0.84)}" height="${n(h*0.58)}" rx="3" fill="#d8c48b"/>`;
    for(let i=0;i<Math.min(24, Math.round(w*h/120)); i++)
      s += `<line x1="${n(w*0.1 + hash(i*2.7)*w*0.8)}" y1="${n(h*0.1 + hash(i*4.3)*h*0.54)}"
        x2="${n(w*0.1 + hash(i*2.7)*w*0.8 + 3)}" y2="${n(h*0.1 + hash(i*4.3)*h*0.54 - 1.4)}"
        stroke="#bfa96c" stroke-width="0.7"/>`;
    /* hay net and trough along the back */
    s += `<rect x="${n(w*0.12)}" y="${n(h*0.11)}" width="${n(w*0.26)}" height="${n(h*0.11)}" rx="2" fill="#a8913f"/>`;
    s += `<rect x="${n(w*0.58)}" y="${n(h*0.11)}" width="${n(w*0.28)}" height="${n(h*0.09)}" rx="2" fill="#9fb0b8"/>`;
    s += `<rect x="${n(w*0.59)}" y="${n(h*0.12)}" width="${n(w*0.26)}" height="${n(h*0.05)}" rx="1.5" fill="url(#gWater)"/>`;
    /* a lamp, on because it is dim in there */
    s += `<circle class="fx-bulb" cx="${n(w*0.5)}" cy="${n(h*0.14)}" r="${n(h*0.03)}" fill="#ffe9a8"/>`;
    s += `<rect x="${n(w*0.08)}" y="${n(h*0.08)}" width="${n(w*0.84)}" height="${n(h*0.58)}" rx="3"
      fill="none" stroke="#f2e9d8" stroke-width="1.4" opacity=".9"/>`;
    s += `</g>`;
  });
  return s;
}

/* they say what they are doing, and it changes the longer they are in */
function tickShed(){
  if(!S.shed) return;
  if(Date.now() > S.shed.until){
    S.shed = null;
    applyShedClass(false);
    if(typeof log === 'function') log('The stock are back out in the paddocks.', 'good', 'farm');
    if(typeof render === 'function') render();
    return;
  }
  const ph = shedPhase();
  if(!ph) return;
  if(S.shed.lastAct !== ph.n){
    S.shed.lastAct = ph.n;
    if(typeof log === 'function') log(`In the shed: ${ph.d}`, '', 'home');
  }
  S.shed.said -= 1;
  if(S.shed.said > 0) return;
  S.shed.said = 40 + Math.floor(Math.random()*50);
  const pens = animalPens().filter(o=>(o.animals||0) > 0);
  if(!pens.length) return;
  const o = pens[Math.floor(Math.random()*pens.length)];
  const sp = penSpecies(o);
  const lines = {
    'huddled together':['…','*shivering*','*pressed in*'],
    'settling':        ['…?','*sniff*','Baa?'],
    'at the hay':      ['*munch*','*pull*','Mmm'],
    'playing':         ['*shove*','*bounce*','😄','*headbutt!*'],
    'grooming':        ['*nuzzle*','*lick*','😌'],
    'dozing':          ['*yawn*','💤','…zzz'],
  }[ph.n] || ['…'];
  const c = penCentre(o);
  if(typeof speak === 'function') speak({x:c.x, y:c.y}, lines[Math.floor(Math.random()*lines.length)]);
}

/* the shed follows the panic */
if(typeof tickPanic === 'function'){
  const _tickPanicShed = tickPanic;
  tickPanic = function(){
    const was = !!(S && S.animalPanic);
    const r = _tickPanicShed.apply(this, arguments);
    if(was && S && !S.animalPanic) startShed();     /* panic just ended */
    return r;
  };
}

if(typeof peopleLayer === 'function'){
  const _peopleLayerShed = peopleLayer;
  peopleLayer = function(){ return shedInteriors() + _peopleLayerShed.apply(this, arguments); };
}
if(typeof render === 'function'){
  const _renderShed = render;
  render = function(){
    const r = _renderShed.apply(this, arguments);
    if(S && S.shed) applyShedClass(true);
    return r;
  };
}

/* ---------- 2. the craft ---------- */
const UFO_CHANCE = 0.32;               /* per strike */

function ufoArt(w){
  const h = w*0.46;
  let s = `<ellipse class="ufo-glow" cx="0" cy="${n(h*0.30)}" rx="${n(w*0.60)}" ry="${n(h*0.34)}"
    fill="#7cf0c0" opacity=".22"/>`;
  /* dome */
  s += `<ellipse cx="0" cy="${n(-h*0.18)}" rx="${n(w*0.26)}" ry="${n(h*0.42)}" fill="#bfe9ff" opacity=".9"/>`;
  s += `<ellipse cx="${n(-w*0.07)}" cy="${n(-h*0.28)}" rx="${n(w*0.11)}" ry="${n(h*0.18)}" fill="#fff" opacity=".7"/>`;
  /* hull */
  s += `<ellipse cx="0" cy="0" rx="${n(w*0.5)}" ry="${n(h*0.30)}" fill="#7c8794"/>`;
  s += `<ellipse cx="0" cy="${n(-h*0.06)}" rx="${n(w*0.5)}" ry="${n(h*0.22)}" fill="#a4b0bd"/>`;
  s += `<ellipse cx="0" cy="${n(h*0.10)}" rx="${n(w*0.42)}" ry="${n(h*0.16)}" fill="#5d6874"/>`;
  /* running lights */
  for(let i=0;i<7;i++){
    const a = (i/7)*Math.PI*2;
    s += `<circle class="ufo-lamp" cx="${n(Math.cos(a)*w*0.40)}" cy="${n(h*0.06 + Math.sin(a)*h*0.10)}"
      r="${n(w*0.035)}" fill="#7cf0c0" style="animation-delay:-${(i*0.13).toFixed(2)}s"/>`;
  }
  return s;
}

function ufoLayer(){
  const u = S.ufo;
  if(!u) return '';
  const w = 96;
  let s = `<g id="ufo" transform="translate(${n(u.x)},${n(u.y)})">`;
  /* the beam, once it has locked on */
  if(u.phase === 'beam' || u.phase === 'lift'){
    s += `<path class="ufo-beam" d="M${n(-w*0.22)} 0 L${n(w*0.22)} 0
      L${n(w*0.46)} ${n(u.beamLen)} L${n(-w*0.46)} ${n(u.beamLen)} Z"
      fill="#7cf0c0" opacity=".26"/>`;
  }
  s += `<g class="ufo-hull">${ufoArt(w)}</g>`;
  if(u.hp < u.hpMax){
    s += `<rect x="${n(-w*0.4)}" y="${n(-w*0.42)}" width="${n(w*0.8)}" height="4" rx="2" fill="#00000066"/>`;
    s += `<rect x="${n(-w*0.4)}" y="${n(-w*0.42)}" width="${n(w*0.8*(u.hp/u.hpMax))}" height="4" rx="2" fill="#7cf0c0"/>`;
  }
  return s + '</g>';
}

function spawnUfo(){
  if(S.ufo) return;
  const pens = animalPens().filter(o=>(o.animals||0) > 0);
  if(!pens.length) return;
  const target = pens[Math.floor(Math.random()*pens.length)];
  const c = penCentre(target);
  S.ufo = {
    phase:'arrive', x: c.x - 260, y: (FARM.y-1)*T, tx: c.x, ty: c.y - 90,
    target: target.id, beamLen: 0, hp: 6, hpMax: 6, t: 0, took: 0,
  };
  if(typeof log === 'function')
    log('Something came down through the cloud. It is not a plane.', 'bad', 'alert');
  if(typeof toast === 'function') toast('Something is over the paddock', 'bad');
  if(typeof SND !== 'undefined') SND.play('error');
}

function tickUfo(dt){
  const u = S.ufo;
  if(!u) return;
  u.t += dt;

  if(u.phase === 'arrive'){
    const dx = u.tx - u.x, dy = u.ty - u.y, d = Math.hypot(dx,dy);
    if(d < 6){ u.phase = 'beam'; u.t = 0; }
    else { const sp = 120*dt; u.x += dx/d*Math.min(d,sp); u.y += dy/d*Math.min(d,sp); }
  }
  else if(u.phase === 'beam'){
    u.beamLen = Math.min(96, u.beamLen + 90*dt);
    if(u.t > 3.4){ u.phase = 'lift'; u.t = 0;
      /* it takes one head off the pen it was over */
      const pen = (S.objs||[]).find(o=>o.id === u.target);
      if(pen && (pen.animals||0) > 0){
        pen.animals--; u.took++;
        if(typeof log === 'function')
          log(`It took one of the ${(BPMAP[pen.bp]||{name:'stock'}).name.toLowerCase()}. Straight up the beam.`, 'bad', 'alert');
        if(typeof toast === 'function') toast('It took an animal', 'bad');
      }
    }
  }
  else if(u.phase === 'lift'){
    u.beamLen = Math.max(0, u.beamLen - 70*dt);
    if(u.t > 2.2){
      /* line up another pen, or leave */
      const pens = animalPens().filter(o=>(o.animals||0) > 0);
      if(u.took < 3 && pens.length && Math.random() < 0.7){
        const nxt = pens[Math.floor(Math.random()*pens.length)];
        const c = penCentre(nxt);
        u.target = nxt.id; u.tx = c.x; u.ty = c.y - 90; u.phase = 'arrive'; u.t = 0;
      } else { u.phase = 'leave'; u.t = 0; }
    }
  }
  else if(u.phase === 'leave'){
    u.y -= 130*dt; u.x += 60*dt;
    if(u.y < (FARM.y-4)*T){
      S.ufo = null;
      if(typeof log === 'function') log('It went back up through the cloud and was gone.', '', 'alert');
      if(typeof render === 'function') render();
      return;
    }
  }
  paintUfo();
}

function paintUfo(){
  const u = S.ufo;
  let el = document.getElementById('ufo');
  if(!u){ if(el) el.parentElement && el.remove(); return; }
  if(!el){ if(typeof render === 'function') render(); return; }
  el.setAttribute('transform', `translate(${n(u.x)},${n(u.y)})`);
  const beam = el.querySelector('.ufo-beam');
  if(beam){
    beam.setAttribute('d', `M${n(-96*0.22)} 0 L${n(96*0.22)} 0 L${n(96*0.46)} ${n(u.beamLen)} L${n(-96*0.46)} ${n(u.beamLen)} Z`);
    beam.style.display = (u.phase==='beam'||u.phase==='lift') ? '' : 'none';
  }
}

/* ---------- shooting it down ---------- */
G.shootUfo = function(){
  const u = S.ufo;
  if(!u) return;
  u.hp--;
  if(typeof SND !== 'undefined') SND.play('click');
  const el = document.getElementById('ufo');
  if(el){ el.classList.remove('ufo-hit'); void el.offsetWidth; el.classList.add('ufo-hit'); }
  if(u.hp > 0){ if(typeof render === 'function') render(); return; }

  /* down it comes */
  const took = u.took;
  S.ufo = null;
  if(typeof SND !== 'undefined') SND.play('level');
  /* what it was carrying comes back changed */
  S.mutants = (S.mutants || 0) + 2;
  if(typeof log === 'function'){
    log('You brought it down over the top paddock.', 'gold', 'farm');
    log(`Two head walked out of the wreck. They are not quite what went up — they glow, faintly. Whatever they are now, people pay for it.`, 'gold', 'farm');
  }
  if(typeof toast === 'function') toast('Two glowing head recovered', 'gold');
  if(typeof render === 'function') render();
  if(typeof ui === 'function') ui();
  G.save();
};

/* the mutants pay, every month */
if(typeof monthlyReckoning === 'function'){
  const _monthlyMutant = monthlyReckoning;
  monthlyReckoning = function(){
    const r = _monthlyMutant.apply(this, arguments);
    const m = S.mutants || 0;
    if(m > 0){
      const pay = m * 1400;
      S.cash += pay; S.totalEarned += pay;
      log(`The glowing stock brought in ${fmt(pay)} this month. Nobody asks where they came from.`, 'gold', 'money');
    }
    return r;
  };
}

/* A target you can actually hit.

   This has to listen on pointerdown, not click. The world's pan handler
   takes pointer capture on pointerdown, and the browser then never fires
   a click at all - verified by logging the whole event sequence over the
   hull: pointerdown, mousedown, pointerup, mouseup, and no click. A click
   listener here silently never ran. */
setTimeout(()=>{
  document.addEventListener('pointerdown', (e)=>{
    if(!S || !S.ufo) return;
    const el = document.getElementById('ufo');
    if(!el) return;
    const b = el.getBoundingClientRect();
    if(!b.width) return;
    /* generous hit box - this is meant to be a moment, not a test of aim */
    if(e.clientX >= b.left-14 && e.clientX <= b.right+14 &&
       e.clientY >= b.top-14  && e.clientY <= b.bottom+14){
      e.preventDefault(); e.stopPropagation();
      G.shootUfo();
    }
  }, true);
}, 500);

/* it rides above everything */
if(typeof peopleLayer === 'function'){
  const _peopleLayerUfo = peopleLayer;
  peopleLayer = function(){ return _peopleLayerUfo.apply(this, arguments) + ufoLayer(); };
}

const _tickPeopleUfo = tickPeople;
tickPeople = function(dt){
  const r = _tickPeopleUfo.apply(this, arguments);
  if(S && S.speed !== 0){ tickShed(); tickUfo(dt); }
  return r;
};

/* it comes in on the back of a strike, sometimes */
if(typeof lightningStrike === 'function'){
  const _strikeUfo = lightningStrike;
  lightningStrike = function(){
    const r = _strikeUfo.apply(this, arguments);
    if(!S.ufo && Math.random() < UFO_CHANCE) setTimeout(spawnUfo, 2600);
    return r;
  };
}

/* show the glowing stock on the Stats tab */
if(typeof renderRight === 'function'){
  const _renderRightMut = renderRight;
  renderRight = function(){
    const r = _renderRightMut.apply(this, arguments);
    if(rightTab === 'owner' && (S.mutants||0) > 0){
      const b = document.getElementById('rightBody');
      if(b && !b.querySelector('.mutcard')){
        const d = document.createElement('div');
        d.className = 'pcard mutcard';
        d.innerHTML = `<h3>The glowing stock</h3>
          <p class="sub">${S.mutants} head recovered from the wreck. They pay
          <b>${fmt(S.mutants*1400)}</b> a month and eat nothing at all.</p>`;
        b.appendChild(d);
      }
    }
    return r;
  };
}

  `;
  document.head.appendChild(s);
})();

/* so it can be tried without waiting for a storm */
G.callUfo = function(){ spawnUfo(); };

/* =====================================================================
   ANIMAL MINDS

   Up to now the stock were decoration that bunched up when it thundered.
   This gives each animal its own small mind: a position it chose, a thing
   it is currently doing, a mood, and the freedom to change all three.

   Four things happen here.

   1. Bubbles stop flying in from the top-left corner. The old bubPop
      keyframe set a CSS `transform`, which overrides the SVG transform
      *attribute* that positions the bubble - so for the first 0.25s of
      every bubble's life it sat at the layer origin. Measured: three
      bubbles with translate(320,344), translate(340,602) and
      translate(541,270) all reported getScreenCTM() = (395,74).

   2. Sheds became real. The old cutaway was drawn into the people layer,
      which paints over the pen, and "inside" was the same bunching class
      as the panic. Now each pen contains an actual shelter with a roof
      you can lift, and a species-correct interior underneath it.

   3. A day cycle. At dusk most of the stock take themselves in; the
      hardy ones stay out. At first light everyone comes out and gets on
      with the ordinary social business of being an animal.

   4. The one that came back. Shoot the craft down and the animal it
      took comes back changed. It thinks, and a few times a day it walks
      the yard with the whole pen strung out behind it in single file,
      and they pick things up from it.
   ===================================================================== */

/* ---------- 1. the bubble fix ---------- */
/* Redefining the keyframe by name beats the original, which is defined
   earlier in the document. `translate:` and `scale:` are separate
   properties and compose with the transform attribute instead of
   replacing it, which is the whole point. */
(function bubbleFix(){
  const s = document.createElement('style');
  s.textContent = `
  .bubble{ transform-box:fill-box; transform-origin:50% 100%; }
  @keyframes bubPop{
    0%  { opacity:0; translate:0 4px; scale:.9; }
    100%{ opacity:1; translate:0 0;   scale:1;  } }
  @media (prefers-reduced-motion: reduce){
    @keyframes bubPop{ 0%{opacity:0;} 100%{opacity:1;} } }
  `;
  document.head.appendChild(s);
})();

/* ---------- 2. where the shelter sits inside a pen ---------- */
/* One rectangle, upper-left of the yard, big enough to hold the stock.
   Everything else - roof, interior, where an animal walks to when it
   goes in - is derived from this, so they cannot drift apart. */
function shelterBox(w, h){
  const sw = Math.max(46, Math.min(w * 0.46, 120));
  const sh = Math.max(38, Math.min(h * 0.52, 96));
  return { x: w*0.07, y: h*0.07, w: sw, h: sh };
}

/* Most species get the same shelter rectangle; a hive is its own
   shelter, so p54 overrides this for bees. */
function shelterBoxFor(kind, w, h){ return shelterBox(w, h); }

/* the deterministic spot an animal stands when it has no other idea.
   paddock() and the mind model both call this, so the drawn position
   and the simulated position are the same number. */
function baseSpot(i, seed, w, h){
  return { x: 8 + hash(i*2.3 + seed) * Math.max(4, w - 16),
           y: 8 + hash(i*5.7 + seed) * Math.max(4, h - 16) };
}

/* ---------- 3. species-correct interiors ---------- */
/* Drawn as a cutaway: you are looking down into the shelter with the
   roof lifted off, so the fittings read from above. Kept deliberately
   sparse - at this size a nest box is a rounded rect with an egg in it,
   and anything finer is only string length. */
function shedFittings(kind, b){
  const X = n(b.x), Y = n(b.y), W = b.w, H = b.h;

    s += `<rect x="${n(b.x+W*0.06)}" y="${n(b.y+H*0.52)}" width="${n(W*0.52)}" height="${n(H*0.34)}" rx="2" fill="#b9a377"/>`;

    for(let i=0;i<3;i++){
      const bx = b.x + W*0.64, by = b.y + H*0.12 + i*H*0.26;
      s += `<rect x="${n(bx)}" y="${n(by)}" width="${n(W*0.28)}" height="${n(H*0.2)}" rx="2" fill="#a8814f"/>`;
      s += `<rect x="${n(bx+1.5)}" y="${n(by+1.5)}" width="${n(W*0.28-3)}" height="${n(H*0.2-3)}" rx="1.5" fill="#cbb474"/>`;
      if(i < 2) s += `<ellipse cx="${n(bx+W*0.14)}" cy="${n(by+H*0.11)}" rx="2.6" ry="3.2" fill="#fdf6e6"/>`;
    }
    /* feeder cone and a drinker */
    s += `<circle cx="${n(b.x+W*0.2)}" cy="${n(b.y+H*0.2)}" r="${n(Math.min(W,H)*0.09)}" fill="#9fb0b8"/>`;
    s += `<circle cx="${n(b.x+W*0.2)}" cy="${n(b.y+H*0.2)}" r="${n(Math.min(W,H)*0.05)}" fill="#7d8f98"/>`;
    s += `<circle cx="${n(b.x+W*0.42)}" cy="${n(b.y+H*0.2)}" r="${n(Math.min(W,H)*0.07)}" fill="url(#gWater)"/>`;

    if(kind === 'chicken')

    else
      s += `<ellipse cx="${n(b.x+W*0.8)}" cy="${n(b.y+H*0.82)}" rx="${n(W*0.14)}" ry="${n(H*0.1)}" fill="url(#gWater)"/>`;
  }

  else if(kind === 'cow'){
    /* free stalls with divider loops, a feed bunk behind a headlock rail */
    for(let i=0;i<3;i++){
      const sy = b.y + H*0.34 + i*H*0.21;
      s += `<rect x="${n(b.x+W*0.06)}" y="${n(sy)}" width="${n(W*0.56)}" height="${n(H*0.17)}" rx="2" fill="#e0cd97"/>`;
      s += `<path d="M${n(b.x+W*0.62)} ${n(sy)} q6 ${n(H*0.085)} 0 ${n(H*0.17)}" fill="none" stroke="#8f9aa2" stroke-width="1.6"/>`;
    }
    s += `<rect x="${n(b.x+W*0.06)}" y="${n(b.y+H*0.08)}" width="${n(W*0.72)}" height="${n(H*0.14)}" rx="2" fill="#9a8a63"/>`;
    s += `<rect x="${n(b.x+W*0.08)}" y="${n(b.y+H*0.1)}" width="${n(W*0.68)}" height="${n(H*0.1)}" rx="1.5" fill="#7f9b46"/>`;
    for(let i=0;i<5;i++)
      s += `<line x1="${n(b.x+W*0.1+i*W*0.16)}" y1="${n(b.y+H*0.06)}" x2="${n(b.x+W*0.1+i*W*0.16)}" y2="${n(b.y+H*0.24)}" stroke="#aeb8bf" stroke-width="1.3"/>`;
    s += `<rect x="${n(b.x+W*0.82)}" y="${n(b.y+H*0.3)}" width="${n(W*0.13)}" height="${n(H*0.2)}" rx="2" fill="url(#gWater)"/>`;
  }

  else if(kind === 'goat'){
    /* goats climb or they wreck the place - two ledges and a hay rack */
    s += `<rect x="${n(b.x+W*0.08)}" y="${n(b.y+H*0.56)}" width="${n(W*0.4)}" height="${n(H*0.1)}" rx="2" fill="#a8814f"/>`;
    s += `<rect x="${n(b.x+W*0.08)}" y="${n(b.y+H*0.54)}" width="${n(W*0.4)}" height="2.4" rx="1.2" fill="#c69a5f"/>`;
    s += `<rect x="${n(b.x+W*0.3)}" y="${n(b.y+H*0.76)}" width="${n(W*0.34)}" height="${n(H*0.09)}" rx="2" fill="#8f6c40"/>`;
    s += `<rect x="${n(b.x+W*0.3)}" y="${n(b.y+H*0.74)}" width="${n(W*0.34)}" height="2.2" rx="1.1" fill="#b08a52"/>`;
    s += `<rect x="${n(b.x+W*0.6)}" y="${n(b.y+H*0.1)}" width="${n(W*0.3)}" height="${n(H*0.18)}" rx="2" fill="#9a8a63"/>`;
    for(let i=0;i<4;i++)
      s += `<line x1="${n(b.x+W*0.63+i*W*0.07)}" y1="${n(b.y+H*0.1)}" x2="${n(b.x+W*0.63+i*W*0.07)}" y2="${n(b.y+H*0.28)}" stroke="#c9b47e" stroke-width="1.2"/>`;
    s += `<rect x="${n(b.x+W*0.1)}" y="${n(b.y+H*0.12)}" width="${n(W*0.14)}" height="${n(H*0.12)}" rx="2" fill="#d4a3a3"/>`;
  }

  else { /* sheep and anything else: ring feeder, hurdles, mineral bucket */
    s += `<circle cx="${n(b.x+W*0.32)}" cy="${n(b.y+H*0.4)}" r="${n(Math.min(W,H)*0.19)}" fill="none" stroke="#9aa4ab" stroke-width="2"/>`;
    s += `<circle cx="${n(b.x+W*0.32)}" cy="${n(b.y+H*0.4)}" r="${n(Math.min(W,H)*0.14)}" fill="#a8913f"/>`;
    for(let i=0;i<2;i++)
      s += `<rect x="${n(b.x+W*0.62)}" y="${n(b.y+H*0.14+i*H*0.34)}" width="${n(W*0.3)}" height="${n(H*0.24)}" rx="2"
              fill="none" stroke="#8a6a42" stroke-width="1.4"/>`;
    s += `<rect x="${n(b.x+W*0.08)}" y="${n(b.y+H*0.78)}" width="${n(W*0.14)}" height="${n(H*0.12)}" rx="2" fill="#6f8fb0"/>`;
  }

  /* a lamp, because it is dim under a roof */
  s += `<circle class="fx-bulb" cx="${n(b.x+W*0.5)}" cy="${n(b.y+H*0.04)}" r="2.6" fill="#ffe9a8"/>`;

}

/* the roof that hides all of that when the toggle is off */
function shedRoof(b){
  let s = `<g class="shed-roof">`;
  s += `<rect x="${n(b.x-1.5)}" y="${n(b.y-1.5)}" width="${n(b.w+3)}" height="${n(b.h+3)}" rx="3" fill="url(#gRoof)"/>`;
  /* ridge down the long axis, lit from the upper left */
  const horiz = b.w >= b.h;
  if(horiz){
    s += `<rect x="${n(b.x-1.5)}" y="${n(b.y-1.5)}" width="${n(b.w+3)}" height="${n(b.h*0.5)}" rx="3" fill="#ffffff" opacity=".1"/>`;
    s += `<line x1="${n(b.x-1)}" y1="${n(b.y+b.h*0.5)}" x2="${n(b.x+b.w+1)}" y2="${n(b.y+b.h*0.5)}" stroke="#2f3a42" stroke-width="1.2" opacity=".55"/>`;
    for(let i=1;i<Math.round(b.w/9);i++)
      s += `<line x1="${n(b.x+i*9)}" y1="${n(b.y-1)}" x2="${n(b.x+i*9)}" y2="${n(b.y+b.h+1)}" stroke="#000" stroke-width=".5" opacity=".14"/>`;
  } else {
    s += `<rect x="${n(b.x-1.5)}" y="${n(b.y-1.5)}" width="${n(b.w*0.5)}" height="${n(b.h+3)}" rx="3" fill="#ffffff" opacity=".1"/>`;
    s += `<line x1="${n(b.x+b.w*0.5)}" y1="${n(b.y-1)}" x2="${n(b.x+b.w*0.5)}" y2="${n(b.y+b.h+1)}" stroke="#2f3a42" stroke-width="1.2" opacity=".55"/>`;
    for(let i=1;i<Math.round(b.h/9);i++)
      s += `<line x1="${n(b.x-1)}" y1="${n(b.y+i*9)}" x2="${n(b.x+b.w+1)}" y2="${n(b.y+i*9)}" stroke="#000" stroke-width=".5" opacity=".14"/>`;
  }
  /* eave shadow on the ground, down and right */
  s += `<rect x="${n(b.x+1)}" y="${n(b.y+b.h+1.5)}" width="${n(b.w+2)}" height="2.6" rx="1.3" fill="#16240c" opacity=".22"/>`;
  s += `</g>`;
  return s;
}

/* ---------- 4. the pen, rebuilt once more ---------- */
/* p51 rebuilt this to give every animal a handle. It now also carries a
   shelter, and each animal gets an index so the mind model can find it. */
if(typeof paddock === 'function'){
  paddock = function(w, h, kind, cnt, seed, sc){
    const b = shelterBox(w, h);
    let s = patch(w,h,'#84ad57',seed,1);
    s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#00000033" stroke-width="2.6"/>`;
    s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#a8814f" stroke-width="1.3"/>`;
    for(let x=2;x<w-2;x+=11){ s += `<rect x="${n(x-1)}" y="0" width="2" height="4" rx="1" fill="#7d5931"/>`;
                              s += `<rect x="${n(x-1)}" y="${n(h-4)}" width="2" height="4" rx="1" fill="#7d5931"/>`; }
    for(let y=2;y<h-2;y+=11){ s += `<rect x="0" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`;
                              s += `<rect x="${n(w-4)}" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`; }

    /* the interior sits under the animals, inside the same group, which
       is the whole reason the old cutaway looked wrong */
    s += `<g class="shed-in">${shedFittings(kind, b)}</g>`;

    const cx = w/2, cy = h/2;
    for(let i=0;i<cnt;i++){
      const p = baseSpot(i, seed, w, h);
      const dx = (cx - p.x) * 0.82, dy = (cy - p.y) * 0.82;
      /* a3/a3-graze keep the breathing and head-dip from p49 working now
         that every species goes through here */
      s += `<g class="pen-animal a3 a3-graze" data-ai="${i}" style="--hx:${n(dx)}px; --hy:${n(dy)}px;
        animation-delay:-${(hash(i*7.1+seed)*3).toFixed(1)}s">${beast(kind, p.x, p.y, sc||1)}</g>`;
    }
    /* roof last so it covers the stock that went inside */
    s += shedRoof(b);
    return s;
  };
}

/* ---------- 5. the minds ---------- */
/* Runtime only. Persisting a position per animal per frame would bloat
   the save for something nobody would notice being restored. What does
   persist is the part that matters: which animal came back clever, and
   what the pen has learned from it. */
const MINDS = new Map();

const OUT_ACTS = {
  chicken:[['pecking','*peck peck*'],['scratching','*scratch*'],['dust-bathing','*fluff*'],['preening','*preen*']],
  duck:   [['dabbling','*dabble*'],['preening','*preen*'],['paddling','Quack!'],['resting','…']],
  sheep:  [['grazing','*munch*'],['chewing cud','…'],['following','Baa?'],['resting','*flop*']],
  goat:   [['browsing','*nibble*'],['climbing','Meh!'],['head-butting','*bonk*'],['investigating','Meh?']],
  cow:    [['grazing','*munch*'],['chewing cud','…'],['at the water','*slurp*'],['lying up','Moo…']],
  rabbit: [['nibbling','*nibble*'],['binkying','*hop!*'],['washing','*wash*'],['flopped','…']],
  bee:    [['foraging','bzz'],['dancing','bzz bzz']],
};
const IN_ACTS = {
  chicken:[['on the perch','*settling*'],['in the nest box','*bok*'],['at the feeder','*peck*'],['roosting','💤']],
  duck:   [['on the bedding','*shuffle*'],['at the water','*dabble*'],['tucked in','💤']],
  sheep:  [['at the ring feeder','*munch*'],['bedded down','💤'],['chewing cud','…']],
  goat:   [['on the ledge','Meh!'],['at the hay rack','*pull*'],['at the mineral lick','*lick*'],['bedded down','💤']],
  cow:    [['in the stall','*settling*'],['at the feed bunk','*munch*'],['at the trough','*slurp*'],['lying up','💤']],
  rabbit: [['in the hide','…'],['at the hay','*nibble*'],['flopped out','💤']],
  bee:    [['in the hive','bzz']],
};
/* what the clever one says, and what the rest come out with once they
   have been following it around for a while */
const SMART_LINES = [
  '💭 The gate opens inward.','💭 Rain comes from that side.','💭 They feed us at the same hour.',
  '💭 If I stand here, they see me.','💭 The trough fills when the wheel turns.','💭 Follow me.',
  '💭 There is more grass past the fence.','💭 I remember yesterday.',
];
const FOLLOW_LINES = ['*in line*','…where?','*trots after*','*keeping up*','*watching him*','…','*shuffle*','*follows*'];
const LEARNED_LINES = ['…the gate?','*watching*','*copies him*','Oh!','*thinking*','…same hour.'];

/* Which pens the mind model walks, and how many head are in one.
   Both are overridden in p54 so ducks, bees and the charm-only rabbit
   hutch join in without widening animalPens(), which the economy uses
   to decide who eats. */
function stockPens(){ return animalPens().filter(o=>(o.animals||0) > 0); }
function penHeadCount(o){ return o.animals || 0; }

function mindFor(o){
  const bp = BPMAP[o.bp], f = footprint(bp, o.rot);
  const w = f.w*T, h = f.h*T;
  const cnt = penHeadCount(o);
  let m = MINDS.get(o.id);
  if(m && m.cnt === cnt && m.w === w) return m;
  const kind = penSpecies(o);
  m = { id:o.id, cnt, w, h, kind, box:shelterBoxFor(kind, w, h), list:[], trail:[], proc:null, nextProc:0 };
  for(let i=0;i<cnt;i++){
    const p = baseSpot(i, o.id*3.7, w, h);
    m.list.push({ i, bx:p.x, by:p.y, x:p.x, y:p.y, gx:p.x, gy:p.y,
                  act:'', until:0, inside:false, smart:false,
                  bold: hash(i*11.3 + o.id) > 0.72 });   /* the ones that stay out */
  }
  /* restore the clever one after a reload */
  const sm = (S.smartAnimals||[]).find(a=>a.pen === o.id);
  if(sm && m.list[sm.i]) m.list[sm.i].smart = true;
  MINDS.set(o.id, m);
  return m;
}

/* pick somewhere to be, and something to be doing there */
function chooseAct(m, a, night){
  const inShed = !!S.shed;
  const wantIn = inShed || (night && !a.bold);
  a.inside = wantIn;
  const pool = (wantIn ? IN_ACTS : OUT_ACTS)[m.kind] || OUT_ACTS.sheep;
  const pick = pool[Math.floor(Math.random()*pool.length)];
  a.act = pick[0]; a.line = pick[1];
  a.until = Date.now() + 4000 + Math.random()*9000;

  if(wantIn){
    const b = m.box;
    a.gx = b.x + 6 + Math.random()*(b.w - 12);
    a.gy = b.y + 6 + Math.random()*(b.h - 12);
  } else {
    /* social: two thirds of the time head roughly toward somebody else,
       which is what makes a paddock look like a flock rather than a grid */
    const others = m.list.filter(o=>o !== a && !o.inside);
    if(others.length && Math.random() < 0.62){
      const t = others[Math.floor(Math.random()*others.length)];
      a.gx = t.x + (Math.random()-0.5)*26;
      a.gy = t.y + (Math.random()-0.5)*20;
    } else {
      a.gx = a.bx + (Math.random()-0.5)*m.w*0.5;
      a.gy = a.by + (Math.random()-0.5)*m.h*0.5;
    }
  }
  a.gx = Math.max(7, Math.min(m.w-7, a.gx));
  a.gy = Math.max(7, Math.min(m.h-7, a.gy));
}

/* the procession: the clever one walks, everyone strings out behind it */
function startProcession(m){
  const lead = m.list.find(a=>a.smart);
  if(!lead || m.list.length < 2) return;
  m.proc = { until: Date.now() + 22000, leg: 0 };
  m.trail = [];
  lead.inside = false;
  m.list.forEach(a=>{ a.inside = false; });
  const o = S.objs.find(x=>x.id === m.id);
  if(o && typeof speak === 'function'){
    const c = penCentre(o);
    speak({x:c.x, y:c.y}, '💭 Follow me.');
  }
  if(typeof log === 'function')
    log(`${smartName(m.id)} set off across the pen, and the others fell in behind.`, 'gold', 'farm');
}

function smartName(penId){
  const sm = (S.smartAnimals||[]).find(a=>a.pen === penId);
  return sm && sm.name ? sm.name : 'The clever one';
}

function stepProcession(m, dt){
  const lead = m.list.find(a=>a.smart);
  if(!lead){ m.proc = null; return; }
  /* leader walks a slow circuit of the yard */
  const p = m.proc;
  p.leg += dt * 0.22;
  const rx = m.w*0.32, ry = m.h*0.3;
  lead.gx = m.w*0.5 + Math.cos(p.leg)*rx;
  lead.gy = m.h*0.5 + Math.sin(p.leg)*ry;
  lead.act = 'leading'; lead.inside = false; lead.line = '💭 This way.';

  /* record where the leader has been; each follower aims at an older
     point on that trail, which is what puts them in single file */
  m.trail.unshift({x:lead.x, y:lead.y});
  if(m.trail.length > 160) m.trail.length = 160;
  const others = m.list.filter(a=>!a.smart);
  others.forEach((a, k)=>{
    const t = m.trail[Math.min(m.trail.length-1, 10 + k*9)];
    if(t){ a.gx = t.x; a.gy = t.y; }
    a.act = 'following'; a.inside = false;
    a.line = FOLLOW_LINES[a.i % FOLLOW_LINES.length];
  });

  if(Date.now() > p.until){
    m.proc = null; m.trail = [];
    S.penLearned = S.penLearned || {};
    S.penLearned[m.id] = (S.penLearned[m.id] || 0) + 1;
    const lv = S.penLearned[m.id];
    if(typeof log === 'function')
      log(`The pen has now followed ${smartName(m.id)} ${lv} time${lv===1?'':'s'}. They are picking things up.`, 'good', 'farm');
    m.list.forEach(a=>{ a.until = 0; });
  }
}

/* ---------- 6. the tick ---------- */
let MIND_T = 0, MIND_SAY = 0;

function tickMinds(dt){
  if(!S || S.speed === 0) return;
  if(S.animalPanic) return;                 /* panic owns them while it lasts */
  MIND_T += dt;
  if(MIND_T < 0.1) return;
  const step = MIND_T; MIND_T = 0;

  const night = (typeof isNight === 'function') ? isNight() : false;
  const pens = stockPens();
  const now = Date.now();

  pens.forEach(o=>{
    const m = mindFor(o);
    const el = document.querySelector(`.ob[data-id="${o.id}"]`);
    if(!el) return;

    /* the clever one's rounds, a few times a day */
    if(m.list.some(a=>a.smart)){
      if(!m.proc && now > m.nextProc){
        m.nextProc = now + 90000 + Math.random()*90000;
        if(!night) startProcession(m);
      }
      if(m.proc) stepProcession(m, step);
    }

    m.list.forEach(a=>{
      if(!m.proc && now > a.until) chooseAct(m, a, night);
      /* ease toward the goal - slow, because stock amble */
      const sp = (m.proc ? 15 : 7) * step;
      const dx = a.gx - a.x, dy = a.gy - a.y;
      const d = Math.hypot(dx, dy) || 1;
      if(d > 1){ a.x += dx/d * Math.min(sp, d); a.y += dy/d * Math.min(sp, d); }

      const g = el.querySelector(`.pen-animal[data-ai="${a.i}"]`);
      if(!g) return;
      g.style.translate = `${n(a.x - a.bx)}px ${n(a.y - a.by)}px`;
      /* facing */
      const kid = g.firstElementChild;
      if(kid && Math.abs(dx) > 2) g.style.setProperty('--face', dx < 0 ? '-1' : '1');
      g.classList.toggle('a-inside', a.inside);
      g.classList.toggle('a-smart', !!a.smart);
      if(a.smart && typeof markSmart === 'function') markSmart(g);
      g.classList.toggle('a-moving', d > 2);
    });

    /* the roof class is applied in p55, outside the panic guard */
  });

  /* somebody says something every so often */
  MIND_SAY -= step;
  if(MIND_SAY > 0 || !pens.length) return;
  MIND_SAY = 3.5 + Math.random()*5;
  const o = pens[Math.floor(Math.random()*pens.length)];
  const m = mindFor(o);
  const talkers = m.list.filter(a=>a.act);
  if(!talkers.length) return;
  const a = talkers[Math.floor(Math.random()*talkers.length)];
  /* a bubble over the animal itself, not the middle of the pen */
  const f = footprint(BPMAP[o.bp], o.rot);
  const world = { x: o.tx*T + a.x, y: o.ty*T + a.y };
  let line = a.line || '…';
  if(a.smart) line = SMART_LINES[Math.floor(Math.random()*SMART_LINES.length)];
  else if((S.penLearned && S.penLearned[o.id] || 0) > 0 && Math.random() < 0.35)
    line = LEARNED_LINES[Math.floor(Math.random()*LEARNED_LINES.length)];
  if(typeof speak === 'function') speak(world, line);
  if(a.smart && typeof SND !== 'undefined') SND.play('collect');
}

/* the day turning over is worth a line in the log */
let LAST_NIGHT = null;
function tickAnimalDay(){
  if(!S || S.speed === 0) return;
  const night = (typeof isNight === 'function') ? isNight() : false;
  if(LAST_NIGHT === null){ LAST_NIGHT = night; return; }
  if(night === LAST_NIGHT) return;
  LAST_NIGHT = night;
  const pens = stockPens();
  if(!pens.length) return;
  MINDS.forEach(m=>m.list.forEach(a=>{ a.until = 0; }));
  if(typeof log === 'function'){
    if(night) log('The stock have taken themselves in for the night. A few of the hardy ones stayed out.', '', 'farm');
    else      log('First light - everyone is out again.', 'good', 'farm');
  }
}

const _tickPeopleMinds = tickPeople;
tickPeople = function(dt){
  const r = _tickPeopleMinds.apply(this, arguments);
  try{ tickMinds(dt); tickAnimalDay(); }catch(e){}
  return r;
};

/* ---------- 7. the one that came back ---------- */
/* shootUfo already hands back two head. This marks one animal in the pen
   it was taken from as the one that changed, which is what the whole
   procession hangs off. */
const SMART_NAMES = ['Ada','Pilot','Comet','Halo','Nine','Beacon'];
if(typeof G !== 'undefined' && typeof G.shootUfo === 'function'){
  const _shootSmart = G.shootUfo;
  G.shootUfo = function(){
    const u = S.ufo;
    const penId = u && (u.target !== undefined ? u.target : null);
    const hpWas = u ? u.hp : 0;
    const r = _shootSmart.apply(this, arguments);
    if(hpWas <= 1 && penId !== null){         /* that shot was the one that downed it */
      const o = S.objs.find(x=>x.id === penId);
      if(o && (o.animals||0) > 0){
        S.smartAnimals = S.smartAnimals || [];
        if(!S.smartAnimals.some(a=>a.pen === penId)){
          const name = SMART_NAMES[Math.floor(Math.random()*SMART_NAMES.length)];
          S.smartAnimals.push({ pen:penId, i:0, name });
          MINDS.delete(penId);
          if(typeof log === 'function')
            log(`The one it took came back different. ${name} watches the gate now, and works things out. The others have started watching ${name}.`, 'gold', 'farm');
          if(typeof toast === 'function') toast(`${name} came back clever`, 'gold');
        }
      }
    }
    return r;
  };
}

/* Whatever they were in the middle of, a storm ending outranks it -
   otherwise they carry on grazing for up to another ten seconds while
   the shed sits open, which reads as them ignoring it. */
function interruptMinds(){ MINDS.forEach(m=>{ m.proc = null; m.list.forEach(a=>{ a.until = 0; }); }); }
if(typeof startShed === 'function'){
  const _startShedMinds = startShed;
  startShed = function(){ const r = _startShedMinds.apply(this, arguments); interruptMinds(); return r; };
}

/* ---------- 8. the shed window now just forces everyone in ---------- */
/* The old cutaway drew into the people layer over the top of the pen.
   The pen draws its own interior now, so that can go. */
if(typeof shedInteriors === 'function'){
  shedInteriors = function(){ return ''; };
}

/* ---------- 9. styling ---------- */

/* ---------- 10. handles for trying it without waiting ---------- */
G.animalsIn   = function(){ S.shed = { until: Date.now()+150000, said:0 }; interruptMinds(); render(); };
G.animalsOut  = function(){ S.shed = null; interruptMinds(); render(); };
G.makeSmart   = function(penId){
  const pens = animalPens().filter(o=>(o.animals||0)>0);
  const o = penId ? S.objs.find(x=>x.id===penId) : pens[0];
  if(!o) return 'no pen';
  S.smartAnimals = S.smartAnimals || [];
  if(!S.smartAnimals.some(a=>a.pen===o.id))
    S.smartAnimals.push({pen:o.id, i:0, name:SMART_NAMES[Math.floor(Math.random()*SMART_NAMES.length)]});
  MINDS.delete(o.id);
  return smartName(o.id) + ' in pen ' + o.id;
};
G.parade = function(penId){
  const pens = animalPens().filter(o=>(o.animals||0)>0);
  const o = penId ? S.objs.find(x=>x.id===penId) : pens[0];
  if(!o) return 'no pen';
  const m = mindFor(o);
  if(!m.list.some(a=>a.smart)) return 'no clever animal in that pen - call G.makeSmart() first';
  startProcession(m);
  return 'off they go';
};

/* =====================================================================
   DUCKS, BEES, RABBITS - AND THE BUGS THE LAST PASS EXPOSED

   p53 gave the stock minds, but only the species that went through
   paddock(). Ducks swim on a pond, bees live in a box and rabbits are
   filed under 'bonus' rather than 'animal', so all three were left out.

   Wiring them up turned up three genuine faults that had nothing to do
   with minds:

   * A placed rabbit hutch drew NO rabbits. The blueprint is kind:'bonus',
     so place() never initialised o.animals, and ART.rabbit renders
     (ob.animals||0) head - zero. You bought charm and got an empty hutch.

   * penSpecies() returned 'hive' for the apiary, because the blueprint
     says animal:'hive' and bp.animal is checked before the art-name
     fallback that would have said 'bee'. Every per-species lookup in the
     game - voice, panic cry, now activities - missed for bees.

   * tickMinds ran inside a bare try/catch that swallowed everything.
     That is how the undefined speech line in the procession stayed
     invisible. It now reports the first failure and then stays quiet.
   ===================================================================== */

/* ---------- bees are bees ---------- */
if(typeof penSpecies === 'function'){
  const _penSpeciesBee = penSpecies;
  penSpecies = function(o){
    const sp = _penSpeciesBee.apply(this, arguments);
    return sp === 'hive' ? 'bee' : sp;
  };
}

/* ---------- a hutch with rabbits in it ---------- */
/* Fixed at draw time rather than by changing the blueprint to kind
   'animal': that field drives feed, production and the daily reckoning,
   and rabbits are meant to cost nothing and produce nothing. */
const RABBIT_HEAD = 3;
if(typeof ART === 'object' && ART.rabbit){
  ART.rabbit = (w,h,ob)=> paddock(w, h, 'rabbit', (ob && ob.animals) || RABBIT_HEAD, 27, 0.9);
}

/* The pens the mind model is allowed to touch. Deliberately NOT
   animalPens(), which the economy uses - widening that would start
   charging feed for rabbits. */
function mindPens(){
  return (S.objs||[]).filter(o=>{
    const bp = BPMAP[o.bp]; if(!bp) return false;
    if(bp.kind === 'animal') return (o.animals||0) > 0;
    return bp.art === 'rabbit';              /* charm-only, always occupied */
  });
}
function penHead(o){
  const bp = BPMAP[o.bp];
  if(bp.kind === 'animal') return o.animals || 0;
  return RABBIT_HEAD;
}

/* ---------- ducks: a pond with a house on the bank ---------- */
/* Ducks swim by day and are shut in a house at night, which is the whole
   reason a duck house exists - foxes. So the pen is water plus a bank
   strip, and the shelter sits on the bank. */
function pondRect(w, h){
  return { x: w*0.06, y: h*0.42, w: w*0.88, h: h*0.5 };
}

function duckHouseFittings(b){
  const W = b.w, H = b.h;
  let s = '';
  s += `<rect x="${n(b.x)}" y="${n(b.y)}" width="${n(W)}" height="${n(H)}" rx="3" fill="#d8c48b"/>`;
  for(let i=0;i<8;i++){
    const sx = b.x + 3 + hash(i*3.1)*(W-6), sy = b.y + 3 + hash(i*6.7)*(H-6);
    s += `<line x1="${n(sx)}" y1="${n(sy)}" x2="${n(sx+3)}" y2="${n(sy-1.3)}" stroke="#bfa96c" stroke-width=".7"/>`;
  }
  /* ducks nest on the floor, not on shelves - low straw nests in a corner */
  for(let i=0;i<2;i++){
    const nx = b.x + W*0.1, ny = b.y + H*0.5 + i*H*0.24;
    s += `<ellipse cx="${n(nx+W*0.14)}" cy="${n(ny)}" rx="${n(W*0.15)}" ry="${n(H*0.1)}" fill="#c2a862"/>`;
    s += `<ellipse cx="${n(nx+W*0.14)}" cy="${n(ny)}" rx="${n(W*0.09)}" ry="${n(H*0.06)}" fill="#efe3c2"/>`;
    if(i === 0) s += `<ellipse cx="${n(nx+W*0.14)}" cy="${n(ny)}" rx="2.4" ry="3" fill="#f6f1e2"/>`;
  }
  /* a shallow drinker deep enough to clear their nostrils, and grain */
  s += `<rect x="${n(b.x+W*0.56)}" y="${n(b.y+H*0.16)}" width="${n(W*0.3)}" height="${n(H*0.16)}" rx="2" fill="#9fb0b8"/>`;
  s += `<rect x="${n(b.x+W*0.575)}" y="${n(b.y+H*0.185)}" width="${n(W*0.27)}" height="${n(H*0.1)}" rx="1.5" fill="url(#gWater)"/>`;
  s += `<rect x="${n(b.x+W*0.56)}" y="${n(b.y+H*0.56)}" width="${n(W*0.28)}" height="${n(H*0.14)}" rx="2" fill="#a8814f"/>`;
  s += `<circle class="fx-bulb" cx="${n(b.x+W*0.5)}" cy="${n(b.y+H*0.04)}" r="2.4" fill="#ffe9a8"/>`;
  return s;
}

if(typeof ART === 'object' && ART.duck_pond){
  ART.duck_pond = (w,h,ob)=>{
    const cnt = ob ? Math.min(8, ob.animals||0) : 3;
    const p = pondRect(w,h), b = shelterBox(w,h);
    /* grass bank first, then the pond cut into it */
    let s = patch(w,h,'#84ad57',19,1);
    s += `<g transform="translate(${n(p.x)},${n(p.y)})">${water(p.w, p.h, 19)}</g>`;
    /* a muddy margin where they get in and out */
    s += `<ellipse cx="${n(p.x+p.w*0.5)}" cy="${n(p.y)}" rx="${n(p.w*0.34)}" ry="4" fill="#9c8557" opacity=".55"/>`;
    s += `<g class="shed-in">${duckHouseFittings(b)}</g>`;
    const cx = w/2, cy = h/2;
    for(let i=0;i<cnt;i++){
      const sp = baseSpot(i, 19, w, h);
      /* start them on the water, which is where a duck actually is */
      const dx0 = p.x + 6 + hash(i*2.9)*Math.max(4, p.w-12);
      const dy0 = p.y + 5 + hash(i*4.3+1)*Math.max(4, p.h-10);
      const hx = (cx - dx0)*0.82, hy = (cy - dy0)*0.82;
      s += `<g class="pen-animal a3" data-ai="${i}" style="--hx:${n(hx)}px; --hy:${n(hy)}px;
        animation-delay:-${(hash(i*7.1+19)*3).toFixed(1)}s">${beast('duck', dx0, dy0, 0.9)}</g>`;
    }
    s += shedRoof(b);
    if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
    return s;
  };
}

/* ---------- bees: the hive is the shed ---------- */
/* No separate shelter - lift the roof and you are looking down into the
   boxes at the frames, which is exactly what a beekeeper sees. */
if(typeof ART === 'object' && ART.apiary){
  const _apiaryBase = ART.apiary;
  ART.apiary = (w,h,ob)=>{
    let s = _apiaryBase(w,h,ob);
    const cnt = Math.max(2, Math.floor(w/22));
    /* frames and brood, revealed with the roof off */
    let inner = '';
    for(let i=0;i<cnt;i++){
      const x = 3+i*((w-6)/cnt), bw = Math.min(13,(w-6)/cnt-2), y = h/2-7;
      inner += `<rect x="${n(x)}" y="${n(y)}" width="${n(bw)}" height="14" rx="1" fill="#6b4f28"/>`;
      /* frames run front to back; capped honey at the edges, brood centre */
      for(let f=0; f<4; f++){
        const fx = x + 1 + f*((bw-2)/4);
        const edge = (f === 0 || f === 3);
        inner += `<rect x="${n(fx)}" y="${n(y+1.4)}" width="${n((bw-2)/4 - 0.6)}" height="11.2" rx="0.6"
          fill="${edge ? '#e8b64a' : '#c98f4a'}"/>`;
      }
      inner += `<rect x="${n(x)}" y="${n(y)}" width="${n(bw)}" height="14" rx="1" fill="none" stroke="#4a3618" stroke-width=".8"/>`;
    }
    s += `<g class="shed-in">${inner}</g>`;
    /* the lids are the roof */
    let lids = '';
    for(let i=0;i<cnt;i++){
      const x = 3+i*((w-6)/cnt), bw = Math.min(13,(w-6)/cnt-2), y = h/2-7;
      lids += `<rect x="${n(x-0.8)}" y="${n(y-2)}" width="${n(bw+1.6)}" height="3" rx="1" fill="#f4efe1"/>`;
    }
    s += `<g class="shed-roof">${lids}</g>`;
    /* the bees themselves, as agents rather than two decorative dots */
    const head = ob ? Math.min(8, ob.animals || 0) : 3;
    for(let i=0;i<head;i++){
      const bx = 6 + hash(i*2.9+23)*Math.max(4, w-12);
      const by = 5 + hash(i*4.3+23)*Math.max(4, h-10);
      s += `<g class="pen-animal" data-ai="${i}" style="--hx:0px; --hy:0px;
        animation-delay:-${(hash(i*7.1+23)*3).toFixed(1)}s">${beeBody(bx, by, 1)}</g>`;
    }
    return s;
  };
}

/* a hive is its own shed, so the "shelter" for bees is the hive row */
function hiveRow(w, h){ return { x: 3, y: h/2 - 7, w: Math.max(8, w - 6), h: 14 }; }
if(typeof shelterBoxFor === 'function'){
  shelterBoxFor = function(kind, w, h){
    if(kind === 'bee') return hiveRow(w, h);
    return shelterBox(w, h);
  };
}

/* beast() has no bee - at this size one is a striped bead with wings */
function beeBody(x, y, sc){
  sc = sc || 1;
  return `<g>
    <ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(2.2*sc)}" ry="${n(1.5*sc)}" fill="#e8b64a"/>
    <rect x="${n(x-0.9*sc)}" y="${n(y-1.5*sc)}" width="${n(0.8*sc)}" height="${n(3*sc)}" rx="0.3" fill="#3a2c14"/>
    <rect x="${n(x+0.5*sc)}" y="${n(y-1.4*sc)}" width="${n(0.7*sc)}" height="${n(2.8*sc)}" rx="0.3" fill="#3a2c14"/>
    <circle cx="${n(x-2.1*sc)}" cy="${n(y-0.2*sc)}" r="${n(0.9*sc)}" fill="#2b2210"/>
    <ellipse class="beewing" cx="${n(x+0.2*sc)}" cy="${n(y-1.7*sc)}" rx="${n(1.6*sc)}" ry="${n(0.8*sc)}"
      fill="#dceaf2" opacity=".72"/>
  </g>`;
}

/* ---------- where a species wants to be when it is out ---------- */
/* Ducks belong on the water, bees around the hives, everything else on
   the grass. All three are ellipses rather than rectangles because the
   art underneath them is an ellipse - a rectangular region puts animals
   in the bare corners of the footprint, looking like they got out. */
function outdoorEllipse(m){
  if(m.kind === 'duck'){
    const p = pondRect(m.w, m.h);
    return { cx:p.x + p.w/2, cy:p.y + p.h/2, rx:(p.w/2)*0.82, ry:(p.h/2)*0.78 };
  }
  return { cx:m.w/2, cy:m.h/2, rx:(m.w/2)*0.84, ry:(m.h/2)*0.84 };
}
/* a point picked evenly inside that ellipse */
function pointInEllipse(g){
  const t = Math.random()*Math.PI*2, r = Math.sqrt(Math.random());
  return { x: g.cx + Math.cos(t)*g.rx*r, y: g.cy + Math.sin(t)*g.ry*r };
}

/* ---------- rework the mind model to cover all of them ---------- */
if(typeof chooseAct === 'function'){
  chooseAct = function(m, a, night){
    const wantIn = !!S.shed || (night && !a.bold);
    a.inside = wantIn;
    const pool = (wantIn ? IN_ACTS : OUT_ACTS)[m.kind] || OUT_ACTS.sheep;
    const pick = pool[Math.floor(Math.random()*pool.length)];
    a.act = pick[0]; a.line = pick[1];
    a.until = Date.now() + 4000 + Math.random()*9000;

    if(wantIn){
      const b = m.box;
      a.gx = b.x + 6 + Math.random()*Math.max(2, b.w - 12);
      a.gy = b.y + 6 + Math.random()*Math.max(2, b.h - 12);
      return;
    }
    const g = outdoorEllipse(m);
    const others = m.list.filter(o=>o !== a && !o.inside);
    if(others.length && Math.random() < 0.62){
      /* one companion, not two - picking the index twice chose a
         different animal for x than for y and aimed at neither */
      const t = others[Math.floor(Math.random()*others.length)];
      a.gx = t.x + (Math.random()-0.5)*26;
      a.gy = t.y + (Math.random()-0.5)*20;
    } else {
      const p = pointInEllipse(g);
      a.gx = p.x; a.gy = p.y;
    }
    const goal = { x:a.gx, y:a.gy };
    clampToEllipse(goal, g.cx, g.cy, g.rx, g.ry);
    a.gx = goal.x; a.gy = goal.y;
  };
}

/* bees and hives get their own vocabulary rather than borrowing sheep's */
if(typeof OUT_ACTS === 'object'){
  OUT_ACTS.bee = [['foraging','🐝 bzz'],['on the flowers','*bzz bzz*'],['returning heavy','bzz!'],['fanning the entrance','*bzzzz*']];
  IN_ACTS.bee  = [['on the comb','*bzz*'],['capping honey','bzz…'],['clustered','*hum*'],['tending brood','bzz bzz']];
  OUT_ACTS.duck = [['dabbling','*dabble*'],['upending','*splash*'],['preening on the bank','*preen*'],['paddling','Quack!'],['bathing','*splash splash*']];
  IN_ACTS.duck  = [['on the nest','*settling*'],['at the drinker','*dabble*'],['bedded on straw','💤'],['muttering','*quack…*']];
}

/* the mind loop now walks mindPens(), so ducks, bees and the rabbit
   hutch are all in - this is the seam p53 leaves for exactly this */
if(typeof stockPens === 'function'){
  stockPens = function(){ return mindPens(); };
  penHeadCount = function(o){ return penHead(o); };
}

/* ---------- the clever one needs to look clever ---------- */
/* No filters - drop-shadow is a filter and the scene layer cannot afford
   one per animal. A drawn ring costs a single element. */
function markSmart(g){
  if(g.querySelector('.smartmark')) return;
  const c = document.createElementNS('http://www.w3.org/2000/svg','circle');
  c.setAttribute('class','smartmark');
  c.setAttribute('r','7.5'); c.setAttribute('cx','0'); c.setAttribute('cy','0');
  c.setAttribute('fill','none'); c.setAttribute('stroke','#bfe3ff'); c.setAttribute('stroke-width','1.4');
  const kid = g.firstElementChild;
  /* sit the ring on the animal's own origin */
  const bb = kid && kid.getBBox ? (function(){ try{ return kid.getBBox(); }catch(e){ return null; } })() : null;
  if(bb){ c.setAttribute('cx', n(bb.x + bb.width/2)); c.setAttribute('cy', n(bb.y + bb.height*0.62)); }
  g.insertBefore(c, g.firstChild);
}

/* ---------- 4. stop swallowing errors ---------- */
/* The bare catch in p53 is why a missing speech line went unnoticed.
   Report the first one, then go quiet so a per-frame fault cannot flood
   the console. */
let MIND_ERR = 0;
if(typeof tickPeople === 'function'){
  const _tickPeopleGuard = tickPeople;
  tickPeople = function(dt){
    try{ return _tickPeopleGuard.apply(this, arguments); }
    catch(e){
      if(!MIND_ERR++){
        console.error('[greenhollow] animal tick failed:', e);
        if(typeof log === 'function') log('Something went wrong with the stock. Details in the console.', 'bad', 'farm');
      }
      throw e;
    }
  };
}

(function duckBeeCss(){
  const s = document.createElement('style');
  s.textContent = `
  .smartmark{ opacity:.55; animation: smartRing 2.6s ease-in-out infinite; }
  @keyframes smartRing{ 0%,100%{ opacity:.3; } 50%{ opacity:.7; } }
  @media (prefers-reduced-motion: reduce){ .smartmark{ animation:none; } }
  `;
  document.head.appendChild(s);
})();

G.duckCheck = function(){
  const p = (S.objs||[]).find(o=>BPMAP[o.bp] && BPMAP[o.bp].art==='duck_pond');
  if(!p) return 'no duck pond placed';
  const el = document.querySelector(`.ob[data-id="${p.id}"]`);
  return { ducks: el ? el.querySelectorAll('.pen-animal').length : 0,
           house: el ? el.querySelectorAll('.shed-in').length : 0,
           species: penSpecies(p) };
};

/* =====================================================================
   STRAYS - AND A HARD FENCE

   Two things, and they are opposites on purpose.

   First, nothing drifts out by accident any more. Every animal is clamped
   to its own pen at the end of every tick, after the goal-seeking and
   after the procession, so no amount of trail-following or social
   drifting can walk one through a fence.

   Second, because a farm where nothing ever gets out is a dull farm, one
   can now get out deliberately. At most two at a time, farm-wide. A stray
   leaves the pen, wanders the property, and stops earning while it is
   loose. Pick it up and carry it back and it goes straight home.

   The pick-up listens on pointerdown, not click. The world's pan handler
   takes pointer capture on pointerdown and the browser then never fires a
   click at all - the same thing that made the UFO unshootable.
   ===================================================================== */

/* ---------- 1. the hard fence ---------- */
/* Belt and braces: chooseAct already aims inside the pen, but a clamp
   after the fact is the only thing that cannot be defeated by some future
   behaviour that sets a goal without thinking about bounds. */
/* patch() draws the grass as a wobbly ellipse inscribed in the pen's
   footprint, so the four corners of the rectangle are bare ground. A
   rectangular clamp therefore parks animals in those corners, off the
   green, which is exactly what "the animals are outside" looks like on a
   wide paddock. Everything outdoors is held to the ellipse instead.
   0.84 keeps them clear of the wobble, which dips to 0.88 of the radius. */
function clampToEllipse(p, cx, cy, rx, ry){
  rx = Math.max(4, rx); ry = Math.max(4, ry);
  const dx = (p.x - cx)/rx, dy = (p.y - cy)/ry;
  const d = Math.hypot(dx, dy);
  if(d <= 1) return;
  p.x = cx + (dx/d)*rx;
  p.y = cy + (dy/d)*ry;
}
function grassEllipse(m){
  return { cx:m.w/2, cy:m.h/2, rx:(m.w/2)*0.84, ry:(m.h/2)*0.84 };
}
function clampToPen(m, a){
  if(a.inside){
    /* the shed floor really is a rectangle */
    const b = m.box, pad = 5;
    a.x = Math.max(b.x+pad, Math.min(b.x+b.w-pad, a.x));
    a.y = Math.max(b.y+pad, Math.min(b.y+b.h-pad, a.y));
    return;
  }
  const g = (typeof outdoorEllipse === 'function') ? outdoorEllipse(m) : grassEllipse(m);
  clampToEllipse(a, g.cx, g.cy, g.rx, g.ry);
}

/* ---------- 2. who is loose ---------- */
const MAX_STRAYS = 2;
const STRAY_SC = { chicken:0.92, duck:0.9, sheep:0.95, goat:0.95, cow:1.15, rabbit:0.9, bee:1 };
const STRAY_OUT = {
  chicken:['*bok?*','Free!','*struts off*'], duck:['Quack?','*waddles off*'],
  sheep:['Baa…','*wanders*'], goat:['Meh! 😼','*headed for the veg*','Meh meh!'],
  cow:['Moo…','*ambles off*'], rabbit:['*hops away*','*sniff*'], bee:['bzz…'],
};
const STRAY_HOME = ['*trots back in*','😌','Baa!','*settles*','Home.'];

function strayList(){ S.strays = S.strays || []; return S.strays; }

/* an animal gets out. Which one is recorded by pen and index so the pen
   can hide exactly that head rather than just drawing one fewer. */
function releaseStray(o, m, a){
  const st = strayList();
  if(st.length >= MAX_STRAYS) return false;
  if(st.some(s=>s.pen === o.id && s.i === a.i)) return false;
  const wx = o.tx*T + a.x, wy = o.ty*T + a.y;
  st.push({ pen:o.id, i:a.i, kind:m.kind, x:wx, y:wy, gx:wx, gy:wy, until:0 });
  a.away = true;
  const pool = STRAY_OUT[m.kind] || ['…'];
  if(typeof speak === 'function') speak({x:wx, y:wy}, pool[Math.floor(Math.random()*pool.length)]);
  if(typeof log === 'function')
    log(`One of the ${m.kind}s is out. It will not earn a thing until it is back in - pick it up and carry it home.`, 'bad', 'farm');
  if(typeof toast === 'function') toast('An animal is loose', 'bad');
  if(typeof SND !== 'undefined') SND.play('error');
  return true;
}

/* how often one gets out. Neglected stock push at the fence harder, which
   gives the care system one more consequence. */
let STRAY_ROLL = 0;
function tickStrayChance(dt){
  STRAY_ROLL -= dt;
  if(STRAY_ROLL > 0) return;
  STRAY_ROLL = 45 + Math.random()*75;
  if(strayList().length >= MAX_STRAYS) return;
  if(S.shed) return;                                  /* not during a storm shut-in */
  if(typeof isNight === 'function' && isNight()) return;
  const pens = (typeof stockPens === 'function' ? stockPens() : []).filter(o=>{
    const m = MINDS.get(o.id);
    return m && m.list.filter(a=>!a.away).length > 1;  /* never empty a pen */
  });
  if(!pens.length) return;
  const o = pens[Math.floor(Math.random()*pens.length)];
  const m = MINDS.get(o.id);
  let chance = 0.22;
  const care = (typeof careOf === 'function') ? careOf(o) : null;
  if(care && care.dirty) chance += 0.25;
  if(o.hungry > 0) chance += 0.2;
  if(m.kind === 'goat') chance += 0.28;               /* goats are goats */
  if(Math.random() > chance) return;
  const candidates = m.list.filter(a=>!a.away && !a.smart);
  if(!candidates.length) return;
  releaseStray(o, m, candidates[Math.floor(Math.random()*candidates.length)]);
}

/* ---------- 3. a stray wanders the farm ---------- */
function farmBoundsPx(){
  return { x:(FARM.x+0.5)*T, y:(FARM.y+0.5)*T, w:(FARM.w-1)*T, h:(FARM.h-1)*T };
}

function tickStrays(dt){
  const st = strayList();
  if(!st.length) return;
  const b = farmBoundsPx();
  const now = Date.now();
  st.forEach((s, k)=>{
    if(now > s.until){
      s.until = now + 3000 + Math.random()*6000;
      s.gx = b.x + Math.random()*b.w;
      s.gy = b.y + Math.random()*b.h;
    }
    const dx = s.gx - s.x, dy = s.gy - s.y, d = Math.hypot(dx,dy) || 1;
    if(d > 1){ const sp = 11*dt; s.x += dx/d*Math.min(sp,d); s.y += dy/d*Math.min(sp,d); }
    s.x = Math.max(b.x, Math.min(b.x+b.w, s.x));
    s.y = Math.max(b.y, Math.min(b.y+b.h, s.y));
    const el = document.querySelector(`.stray[data-si="${k}"]`);
    if(el) el.setAttribute('transform', `translate(${n(s.x)},${n(s.y)})`);
  });
}

/* strays are drawn in the people layer, above the pens, because that is
   where things that are not part of an object belong */
function strayLayer(){
  const st = strayList();
  if(!st.length) return '';
  let s = '';
  st.forEach((x, k)=>{
    s += `<g class="stray" data-si="${k}" transform="translate(${n(x.x)},${n(x.y)})">`;
    s += `<circle class="strayring" r="9" cx="0" cy="0" fill="none" stroke="#e8b23c" stroke-width="1.6"/>`;
    s += (x.kind === 'bee' && typeof beeBody === 'function')
       ? beeBody(0,0,1) : beast(x.kind, 0, 0, STRAY_SC[x.kind] || 1);
    s += `</g>`;
  });
  return s;
}
if(typeof peopleLayer === 'function'){
  const _peopleLayerStray = peopleLayer;
  peopleLayer = function(){ return _peopleLayerStray.apply(this, arguments) + strayLayer(); };
}

/* ---------- 4. picking one up ---------- */
function carrying(){ return S.carry || null; }

function pickUpStray(k){
  const st = strayList();
  const s = st[k]; if(!s) return;
  st.splice(k, 1);
  S.carry = { pen:s.pen, i:s.i, kind:s.kind };
  if(typeof SND !== 'undefined') SND.play('collect');
  if(typeof toast === 'function') toast(`Carrying the ${s.kind} — click its pen to put it back`, '');
  if(typeof log === 'function') log(`You picked up the ${s.kind}. Click a pen to put it back.`, '', 'farm');
  if(typeof render === 'function') render();
  updateCarryBadge();
}

function dropInto(o){
  const c = carrying(); if(!c) return false;
  const bp = BPMAP[o.bp];
  const sp = (typeof penSpecies === 'function') ? penSpecies(o) : null;
  if(!bp || sp !== c.kind){
    if(typeof toast === 'function') toast(`That is not where a ${c.kind} lives`, 'bad');
    return false;
  }
  /* home again - if it came from this pen, put it back in its own slot */
  const m = MINDS.get(o.id);
  if(m){
    const a = (c.pen === o.id) ? m.list[c.i] : m.list.find(x=>x.away) || m.list[0];
    if(a){ a.away = false; a.until = 0; }
  }
  S.carry = null;
  if(typeof SND !== 'undefined') SND.play('place');
  const cen = (typeof penCentre === 'function') ? penCentre(o) : null;
  if(cen && typeof speak === 'function')
    speak(cen, STRAY_HOME[Math.floor(Math.random()*STRAY_HOME.length)]);
  if(typeof log === 'function') log(`The ${c.kind} is back in its pen.`, 'good', 'farm');
  if(typeof toast === 'function') toast('Back where it belongs', 'good');
  if(typeof render === 'function') render();
  updateCarryBadge();
  return true;
}

/* pointerdown, because the pan handler takes pointer capture and no click
   is ever delivered - verified when the UFO would not shoot */
setTimeout(()=>{
  document.addEventListener('pointerdown', (e)=>{
    if(!S) return;
    /* carrying: the next tap on a matching pen puts it back */
    if(carrying()){
      const ob = e.target.closest ? e.target.closest('.ob[data-id]') : null;
      if(ob){
        const o = (S.objs||[]).find(x=>x.id === +ob.dataset.id);
        if(o && dropInto(o)){ e.preventDefault(); e.stopPropagation(); }
      }
      return;
    }
    const st = strayList();
    if(!st.length) return;
    for(let k=0;k<st.length;k++){
      const el = document.querySelector(`.stray[data-si="${k}"]`);
      if(!el) continue;
      const b = el.getBoundingClientRect();
      if(!b.width) continue;
      if(e.clientX >= b.left-10 && e.clientX <= b.right+10 &&
         e.clientY >= b.top-10  && e.clientY <= b.bottom+10){
        e.preventDefault(); e.stopPropagation();
        pickUpStray(k);
        return;
      }
    }
  }, true);
}, 500);

function updateCarryBadge(){
  let el = document.getElementById('carrybadge');
  const c = carrying();
  if(!c){ if(el) el.remove(); return; }
  if(!el){
    el = document.createElement('div');
    el.id = 'carrybadge';
    document.body.appendChild(el);
  }
  el.textContent = `Carrying a ${c.kind} — click its pen`;
}

/* Minds are runtime-only and rebuilt on load, but S.strays persists. Without
   this the pen redraws the head that is standing out in the yard, so after a
   reload you have the same duck twice. Caught by clearing MINDS and
   rebuilding: away flags came back [false x6] with a stray still in the save. */
if(typeof mindFor === 'function'){
  const _mindForStray = mindFor;
  mindFor = function(o){
    const had = MINDS.has(o.id);
    const m = _mindForStray.apply(this, arguments);
    if(!had && m){
      strayList().forEach(s=>{ if(s.pen === o.id && m.list[s.i]) m.list[s.i].away = true; });
      if(S.carry && S.carry.pen === o.id && m.list[S.carry.i]) m.list[S.carry.i].away = true;
    }
    return m;
  };
}

/* ---------- 5. a loose animal does not earn ---------- */
/* Without this the whole thing is cosmetic. An animal that is out is not
   in the pen being milked. */
if(typeof penHeadCount === 'function'){
  const _penHeadStray = penHeadCount;
  penHeadCount = function(o){ return _penHeadStray.apply(this, arguments); };
}
function strayCountFor(penId){ return strayList().filter(s=>s.pen === penId).length
  + ((S.carry && S.carry.pen === penId) ? 1 : 0); }

/* ---------- 6. the roof must work even mid-storm ---------- */
/* The mind loop returns early while the stock are panicking, and the
   roof-off class was only applied inside it. So for the 34 seconds of a
   panic the roof button did nothing - which is precisely when you would
   want to look in. Applied here instead, where nothing can gate it. */
function applyRoofClass(){
  if(!S) return;
  const off = (typeof SET === 'function') && SET('roofOff');
  document.querySelectorAll('.ob[data-id]').forEach(el=>{
    el.classList.toggle('roof-off', !!off);
  });
}
if(typeof render === 'function'){
  const _renderRoof = render;
  render = function(){ const r = _renderRoof.apply(this, arguments); applyRoofClass(); return r; };
}

/* ---------- 7. wire into the tick ---------- */
if(typeof tickMinds === 'function'){
  const _tickMindsStray = tickMinds;
  tickMinds = function(dt){
    const r = _tickMindsStray.apply(this, arguments);
    applyRoofClass();                       /* runs even when the base bailed */
    if(!S || S.speed === 0) return r;
    /* hide whichever head is not actually in the pen, and hard-clamp the
       rest - this runs last, so nothing downstream can undo it */
    (typeof stockPens === 'function' ? stockPens() : []).forEach(o=>{
      const m = MINDS.get(o.id); if(!m) return;
      const el = document.querySelector(`.ob[data-id="${o.id}"]`);
      m.list.forEach(a=>{
        clampToPen(m, a);
        if(!el) return;
        const g = el.querySelector(`.pen-animal[data-ai="${a.i}"]`);
        if(g) g.classList.toggle('a-away', !!a.away);
      });
    });
    tickStrayChance(dt);
    tickStrays(dt);
    return r;
  };
}

/* a stray left out overnight is a real cost, not just a nag */
if(typeof tickAnimalDay === 'function'){
  const _tickDayStray = tickAnimalDay;
  tickAnimalDay = function(){
    const wasNight = LAST_NIGHT;
    const r = _tickDayStray.apply(this, arguments);
    if(wasNight === false && LAST_NIGHT === true && strayList().length){
      if(typeof log === 'function')
        log(`${strayList().length} animal${strayList().length===1?' is':'s are'} still out after dark. Anything could happen to them.`, 'bad', 'farm');
      if(typeof toast === 'function') toast('Stock still loose after dark', 'bad');
    }
    return r;
  };
}

(function strayCss(){
  const s = document.createElement('style');
  s.textContent = `
  .pen-animal.a-away{ opacity:0 !important; pointer-events:none; }
  .stray{ cursor:grab; }
  .strayring{ opacity:.75; animation: strayPulse 1.5s ease-in-out infinite; }
  @keyframes strayPulse{ 0%,100%{ opacity:.35; r:9; } 50%{ opacity:.85; r:10.5; } }
  #carrybadge{ position:fixed; left:50%; bottom:74px; transform:translateX(-50%);
    background:#e8b23c; color:#2a2410; font:600 13px/1.2 system-ui,-apple-system,sans-serif;
    padding:8px 14px; border-radius:999px; z-index:9000; pointer-events:none;
    box-shadow:0 3px 10px rgba(0,0,0,.35); }
  @media (prefers-reduced-motion: reduce){ .strayring{ animation:none; } }
  `;
  document.head.appendChild(s);
})();

/* ---------- handles ---------- */
G.letOut = function(penId){
  const pens = (typeof stockPens === 'function') ? stockPens() : [];
  const o = penId ? S.objs.find(x=>x.id===penId) : pens[0];
  if(!o) return 'no pen';
  const m = MINDS.get(o.id) || (typeof mindFor === 'function' ? mindFor(o) : null);
  if(!m) return 'no mind';
  const a = m.list.find(x=>!x.away);
  if(!a) return 'all out already';
  const ok = releaseStray(o, m, a);
  if(typeof render === 'function') render();
  return ok ? `a ${m.kind} is loose` : 'already at the stray limit';
};
G.strays = function(){ return strayList().map(s=>({kind:s.kind, pen:s.pen, x:Math.round(s.x), y:Math.round(s.y)})); };
G.roundUp = function(){
  const st = strayList();
  st.forEach(s=>{ const m = MINDS.get(s.pen); if(m && m.list[s.i]) m.list[s.i].away = false; });
  S.strays = []; S.carry = null;
  updateCarryBadge();
  if(typeof render === 'function') render();
  return 'all back in';
};
