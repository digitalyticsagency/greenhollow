/* ---------------------------------------------------------------
   1. HORIZON — layered depth beyond the property, per biome.
      Not true 3D: receding bands with atmospheric haze and parallax,
      which is what reads as distance on a top-down map.
   --------------------------------------------------------------- */
function horizonLayer(){
  const l = LANDMAP[S.landId];
  if(!l) return '';
  const B = l.biome, W = WPX, H = HPX;
  const band = (y,h,fill,op)=>`<rect x="${-W*0.3}" y="${n(y)}" width="${W*1.6}" height="${n(h)}" fill="${fill}" opacity="${op}"/>`;
  /* silhouette ridge: a jagged skyline at depth d (0 far, 1 near) */
  const ridge = (y, amp, fill, seed, op)=>{
    let d = `M${-W} ${n(y+amp)}`;
    for(let x=-W*0.3; x<=W*1.3; x+=64){
      const k = hash(seed + x*0.013);
      d += ` L${n(x)} ${n(y + amp - k*amp*1.9)}`;
    }
    d += ` L${W*1.3} ${n(y+amp*2)} L${-W*0.3} ${n(y+amp*2)} Z`;
    return `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  };
  let far='', mid='', near='';

  if(B==='mount' || B==='plateau'){
    far  = band(-260, 300, '#8fa4bd', .55) + ridge(-140, 120, '#7d92ad', 3, .8) + ridge(-120, 96, '#fbfdff', 3.4, .5);
    mid  = ridge(-40, 80, '#6b8299', .95, 5) ? ridge(-40, 80, '#6b8299', 5, .95) : '';
    near = ridge(20, 50, '#55705f', 7, 1);
  } else if(B==='lake' || B==='pond'){
    far  = band(-200, 240, '#7fa8c4', .6) + ridge(-90, 70, '#6d8f7a', 11, .75);
    mid  = `<rect x="${-W*0.3}" y="${-40}" width="${W*1.6}" height="150" fill="#4f8fb0" opacity=".85"/>` +
           `<rect x="${-W*0.3}" y="${-40}" width="${W*1.6}" height="150" fill="url(#gWater)" opacity=".5"/>`;
    for(let i=0;i<6;i++) mid += `<ellipse class="ripple" cx="${n(hash(i*2.3)*W*2-W*0.4)}" cy="${n(-30+hash(i*5)*130)}"
      rx="${n(14+hash(i)*26)}" ry="2.2" fill="#dff4fb" opacity=".3" style="animation-delay:${(hash(i)*3).toFixed(1)}s"/>`;
    near = ridge(96, 26, '#5d8442', 13, 1);
  } else if(B==='coast'){
    far  = band(-220, 200, '#9fc6da', .7);
    mid  = `<rect x="${-W*0.3}" y="${-30}" width="${W*1.6}" height="170" fill="#3f83a8"/>` +
           `<rect x="${-W*0.3}" y="${-30}" width="${W*1.6}" height="170" fill="url(#gWater)" opacity=".6"/>`;
    for(let i=0;i<4;i++) mid += `<rect class="surf" x="${-W*0.3}" y="${n(20+i*17)}" width="${W*1.6}" height="3"
      fill="#ffffff" opacity=".38" style="animation-delay:${(i*0.5).toFixed(1)}s"/>`;
    near = band(130, 46, '#e0d4ae', 1) + band(130, 10, '#efe6c8', 1);
  } else if(B==='forest'){
    far = band(-200, 240, '#5c7f5a', .5);
    mid = ''; near = '';
    for(let i=0;i<26;i++){
      const x = -W*0.4 + hash(i*1.7)*W*1.9, y = -30 + hash(i*3.9)*150;
      mid += conifer(x, y, 18+hash(i)*16, i);
    }
    near = ridge(120, 22, '#3d6b34', 17, 1);
  } else if(B==='river'){
    far  = band(-200, 220, '#9dbb92', .55) + ridge(-70, 56, '#6d8f6a', 19, .8);
    mid  = `<path d="M${-W} 40 Q ${W*0.3} -60 ${W*0.8} 30 T ${W*2} 10 L ${W*2} 130 Q ${W*0.9} 150 ${W*0.35} 70 T ${-W} 150 Z"
             fill="#4f8fb0" opacity=".9"/>`;
    near = ridge(120, 24, '#5d8442', 23, 1);
  } else if(B==='hill' || B==='valley'){
    far  = band(-220, 250, '#a8bd8e', .5) + ridge(-100, 90, '#8aa876', 29, .75);
    mid  = ridge(-20, 66, '#7a9a63', 31, .9);
    near = ridge(80, 40, '#5f8a48', 37, 1);
  } else if(B==='moor'){
    far  = band(-200, 230, '#b0ad86', .55) + ridge(-70, 46, '#93916f', 41, .7);
    mid  = ridge(10, 32, '#8a8a63', 43, .9);
    near = band(120, 40, '#7d8259', .9);
  } else if(B==='oasis'){
    far  = band(-220, 250, '#e2cf9e', .7) + ridge(-90, 76, '#d4bd85', 47, .8);
    mid  = ridge(-10, 52, '#c4a86d', 53, .9);
    near = ridge(96, 34, '#b09257', 59, 1);
  } else { /* orchard and anything else */
    far = band(-200, 230, '#9dbb7e', .5);
    mid = '';
    for(let i=0;i<20;i++){
      const x = -W*0.3 + hash(i*2.1)*W*1.7, y = -20 + hash(i*4.3)*140;
      mid += canopy(x,y,16+hash(i)*8,'url(#gCanopy)',i,false);
    }
    near = ridge(120, 22, '#5f8a48', 61, 1);
  }
  /* the same treatment mirrored along the bottom edge, flipped and hazier */
  const bottom = `<g transform="translate(0,${H}) scale(1,-1)" opacity=".72">${far}${mid}</g>`;
  return `<g id="horizon">
    <g class="hz-far"  data-par="0.25">${far}</g>
    <g class="hz-mid"  data-par="0.5">${mid}</g>
    <g class="hz-near" data-par="0.78">${near}</g>
    ${bottom}
    <rect x="${-W*0.3}" y="${-300}" width="${W*1.6}" height="${H+600}" fill="url(#gHaze)" pointer-events="none"/>
  </g>`;
}
/* horizon layers drift slower than the camera, which is what sells depth */
function parallax(){
  const g = document.getElementById('horizon');
  if(!g) return;
  ['hz-far','hz-mid','hz-near'].forEach(c=>{
    const el = g.querySelector('.'+c); if(!el) return;
    const p = parseFloat(el.dataset.par);
    el.setAttribute('transform', `translate(${n(-cam.x*(1-p)/cam.z*0.5)},${n(-cam.y*(1-p)/cam.z*0.35)})`);
  });
}

/* ---------------------------------------------------------------
   2. PEOPLE — farmhands you pay, and the family who live here
   --------------------------------------------------------------- */
const FIRST = ['Ama','Rafi','Noor','Ilias','Sana','Tomas','Mira','Josef','Lena','Kaito',
               'Ruth','Dev','Aiko','Bram','Esme','Otis','Priya','Yusuf','Nell','Cato'];

function peopleInit(){
  if(!S.workers) S.workers = [];
  if(!S.family){
    S.family = [
      {id:'f1', role:'partner', name:'Partner', shirt:'#8f6fc4', sc:1.1, hat:null},
      {id:'f2', role:'child',   name:'Eldest',  shirt:'#e8a33d', sc:0.78, hat:null},
      {id:'f3', role:'child',   name:'Youngest',name2:1, shirt:'#5fb0d4', sc:0.68, hat:null},
    ];
  }
  S.family.forEach(f=>{
    if(f.x===undefined){
      f.x = (FARM.x+4+Math.random()*4)*T; f.y = (FARM.y+4+Math.random()*4)*T;
      f.path=[]; f.state='idle'; f.dir=1; f.t=0; f.act='';
    }
  });
  S.workers.forEach(w=>{
    if(w.x===undefined){ w.x=(FARM.x+2)*T; w.y=(FARM.y+2)*T; w.path=[]; w.state='idle'; w.dir=1; w.t=0; }
  });
}
function workerBeds(){
  return S.objs.filter(o=>o.bp==='worker_cottage').reduce((a,o)=>a + 2 + tOf(o), 0);
}
function hireWorker(){
  peopleInit();
  if(S.workers.length >= workerBeds())
    return toast('Nowhere to house them — build a worker cottage','bad'), sfx('error');
  const name = FIRST[Math.floor(Math.random()*FIRST.length)];
  const skill = 1 + Math.floor(Math.random()*3);
  const wage = 900 + skill*280;
  const sign = Math.round(wage*0.5);
  if(S.cash < sign) return toast(`Signing-on fee is ${fmt(sign)}`,'bad'), sfx('error');
  S.cash -= sign;
  S.workers.push({id:'w'+Date.now(), name, skill, wage,
    x:(FARM.x+2)*T, y:(FARM.y+2)*T, path:[], state:'idle', dir:1, t:0, done:0});
  sfx('build');
  toast(`${name} joined the farm`,'good');
  log(`Hired ${name} (skill ${skill}) at ${fmt(wage)}/month.`,'gold');
  render(); ui(); G.save();
}
function fireWorker(id){
  peopleInit();
  const w = S.workers.find(z=>z.id===id); if(!w) return;
  S.workers = S.workers.filter(z=>z.id!==id);
  log(`${w.name} left the farm.`);
  toast(`${w.name} has gone`,''); sfx('remove');
  render(); ui(); G.save();
}
function workerWages(){ peopleInit(); return S.workers.reduce((a,w)=>a+w.wage,0); }

/* farmhands do a daily round of real jobs — cheaper than AI, but they eat wages */
function workersDay(){
  peopleInit();
  if(!S.workers.length) return;
  const housed = Math.min(S.workers.length, workerBeds());
  if(housed < S.workers.length)
    log(`${S.workers.length-housed} farmhand(s) have nowhere to sleep and did not work.`,'bad');
  let watered=0, harvested=0, collected=0, cleaned=0;
  S.workers.slice(0,housed).forEach(w=>{
    let budget = 2 + w.skill;                       // jobs per day
    S.objs.forEach(o=>{
      if(budget<=0) return;
      const bp = BPMAP[o.bp];
      if(bp.kind==='plot' && o.crop && o.water<0.5 && S.water>=8){ S.water-=8; o.water=1; watered++; budget--; }
      else if(bp.kind==='plot' && o.crop && o.stage>=1){
        const cr=CROPS[o.crop];
        const q=Math.max(1,Math.round(cr.yield*E.slots(o)*cropMul(o)*(0.75+w.skill*0.08)));
        give(o.crop,q); o.fert=clamp(o.fert-0.16,0.15,1); o.last=o.crop;
        o.crop=null;o.stage=0;o.weeds=0; harvested+=q; budget--; addXP(1);
      }
      else if(bp.kind==='animal' && o.ready>0){ give(bp.good,o.ready); collected+=o.ready; o.ready=0; budget--; }
      else if(bp.kind==='animal' && (o.care||1)<0.55){ o.care=1; cleaned++; budget--; }
    });
    w.done = (2+w.skill) - budget;
  });
  const bits=[];
  if(watered) bits.push(`watered ${watered}`);
  if(harvested) bits.push(`picked ${harvested}`);
  if(collected) bits.push(`collected ${collected}`);
  if(cleaned) bits.push(`cleaned ${cleaned}`);
  if(bits.length) log(`Farmhands: ${bits.join(', ')}.`,'good');
}

/* ---------------------------------------------------------------
   3. DAILY ROUTINES — the family live to a timetable
   --------------------------------------------------------------- */
function homeSpot(){
  const h = S.objs.find(o=>o.bp==='cabin');
  if(!h) return {x:(FARM.x+4)*T, y:(FARM.y+4)*T};
  const f = footprint(BPMAP[h.bp], h.rot);
  return {x:(h.tx+f.w/2)*T, y:(h.ty+f.h+0.6)*T};
}
function spotNear(bpId, fallback){
  const o = S.objs.find(z=>z.bp===bpId);
  if(!o) return fallback || homeSpot();
  const f = footprint(BPMAP[o.bp], o.rot);
  return {x:(o.tx+f.w/2)*T, y:(o.ty+f.h+0.5)*T};
}
/* returns {x,y,act} for this person at this time of day */
function routine(p){
  const f = dayFrac();
  const home = homeSpot();
  if(f < 0.24 || f > 0.88) return {...home, act:'asleep'};
  if(p.role==='child'){
    if(f < 0.38) return {...home, act:'breakfast'};
    if(f < 0.55) return {...spotNear('cabin'), act:'studying'};
    if(f < 0.74) return {...spotNear('playground', spotNear('flowers')), act:'playing'};
    return {...home, act:'with family'};
  }
  if(p.role==='partner'){
    if(f < 0.34) return {...home, act:'house chores'};
    if(f < 0.52){
      const bed = S.objs.find(o=>BPMAP[o.bp].kind==='plot');
      return bed ? {...spotNear(bed.bp), act:'tending the beds'} : {...home, act:'house chores'};
    }
    if(f < 0.70){
      const pen = S.objs.find(o=>BPMAP[o.bp].kind==='animal');
      return pen ? {...spotNear(pen.bp), act:'feeding the animals'} : {...home, act:'house chores'};
    }
    return {...home, act:'making dinner'};
  }
  /* farmhands drift between whatever they are working on */
  const jobs = S.objs.filter(o=>['plot','animal','perennial'].includes(BPMAP[o.bp].kind));
  if(jobs.length){
    const o = jobs[Math.floor(hash(p.id.length + Math.floor(f*7))*jobs.length)];
    const ft = footprint(BPMAP[o.bp], o.rot);
    return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.5)*T, act:'working'};
  }
  return {...home, act:'idle'};
}

function tickPeople(dt){
  if(!S || S.speed===0) return;
  peopleInit();
  const all = S.family.concat(S.workers.map(w=>({...w, role:'worker', _w:w})));
  S.family.forEach(p=>movePerson(p, dt));
  S.workers.forEach(p=>movePerson(p, dt));
  paintPeople();
}
function movePerson(p, dt){
  const goal = routine(p);
  p.act = goal.act;
  const d0 = Math.hypot(goal.x-p.x, goal.y-p.y);
  if(d0 > T*0.9){
    const spd = 78*dt;
    const dx = goal.x-p.x, dy = goal.y-p.y, d = Math.hypot(dx,dy);
    p.x += dx/d*Math.min(d,spd); p.y += dy/d*Math.min(d,spd);
    if(Math.abs(dx)>0.5) p.dir = dx>0?1:-1;
    p.state = 'walk';
  } else {
    /* potter about on the spot so nobody stands frozen */
    p.t = (p.t||0) + dt;
    if(p.t > 3){ p.t = 0; p.wx = (Math.random()-0.5)*26; p.wy = (Math.random()-0.5)*20; }
    const tx = goal.x + (p.wx||0), ty = goal.y + (p.wy||0);
    const dx = tx-p.x, dy = ty-p.y, d = Math.hypot(dx,dy);
    if(d > 2){ const spd=26*dt; p.x += dx/d*Math.min(d,spd); p.y += dy/d*Math.min(d,spd);
               if(Math.abs(dx)>0.5) p.dir = dx>0?1:-1; p.state='walk'; }
    else p.state = (goal.act==='asleep') ? 'sleep' : 'busy';
  }
}

function paintPeople(){
  const upd = p=>{
    const el = document.querySelector(`[data-p="${p.id}"]`);
    if(!el) return;
    el.setAttribute('transform', `translate(${n(p.x)},${n(p.y)})`);
    el.style.opacity = p.state==='sleep' ? 0 : 1;

/* ---------------------------------------------------------------
   4. IDLE LIFE — when you have nothing queued, you join in
   --------------------------------------------------------------- */
const CHORES = ['stacking firewood','hanging the washing','fixing a fence','sweeping the yard',
                'mending a gate','carrying water','sorting seed trays'];
function tickIdle(dt){
  if(!S.you || S.you.state!=='idle') { S.idleT = 0; return; }
  if(S.settings && S.settings.familyLife === false) return;
  S.idleT = (S.idleT||0) + dt;
  if(S.idleT < 6) return;
  S.idleT = 0;
  peopleInit();
  /* half the time go and be with someone, otherwise do a chore */
  if(Math.random() < 0.55 && S.family.length){
    const f = S.family[Math.floor(Math.random()*S.family.length)];
    if(f.state==='sleep') return;
    S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                          Math.floor(f.x/T), Math.floor(f.y/T));
    S.you.state = 'walk';
    S.you.job = {kind:'family', fn:()=>{
      const acts = f.role==='child'
        ? [`played with ${f.name}`, `helped ${f.name} with homework`, `read to ${f.name}`]
        : [`had a cup of tea with ${f.name}`, `talked over the week with ${f.name}`, `walked the fence with ${f.name}`];
      const msg = acts[Math.floor(Math.random()*acts.length)];
      S.morale = clamp((S.morale||0.6) + 0.06, 0, 1);
      if(S.career) S.career.burnout = clamp(S.career.burnout - 0.05, 0, 0.6);
      log('You ' + msg + '.', 'good');
      floatNum('♥', innerWidth/2, innerHeight/2, '#ff9ec4');
    }};
  } else {
    const home = homeSpot();
    S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                          Math.floor(home.x/T), Math.floor(home.y/T));
    S.you.state = 'walk';
    const chore = CHORES[Math.floor(Math.random()*CHORES.length)];
    S.you.job = {kind:'chore', fn:()=>{
      S.morale = clamp((S.morale||0.6) + 0.03, 0, 1);
      log('You spent a while ' + chore + '.');
    }};
  }
}

   --------------------------------------------------------------- */
/* The goods are already banked by the time this runs — this is the walk home
   with the crate, so nothing is ever lost if the trip is interrupted. */
function carryTo(goodId, qty){
  if(!S.you || S.you.state !== 'idle') return false;
  if(S.settings && S.settings.carry === false) return false;
  if(!GOODS[goodId]) return false;
  S.you.carry = {g:goodId, q:qty};
  const home = homeSpot();
  S.you.path = findPath(Math.floor(S.you.x/T), Math.floor(S.you.y/T),
                        Math.floor(home.x/T), Math.floor(home.y/T));
  S.you.state = 'walk';
  S.you.job = {kind:'store', fn:()=>{
    S.you.carry = null;
    sfx('collect');
    render();
  }};
  return true;
}
function carryArt(){
  if(!S.you || !S.you.carry) return '';
  const g = GOODS[S.you.carry.g];
  const c = g ? g.c : '#8b6640';
  return `<g transform="translate(9,-4)">
    <rect x="-6" y="-5" width="12" height="9" rx="1.5" fill="#8b6640"/>
    <rect x="-6" y="-5" width="12" height="2.6" rx="1" fill="#a8814f"/>
    <circle cx="-2.4" cy="-6" r="2.2" fill="${c}"/><circle cx="1.6" cy="-6.6" r="2.4" fill="${c}"/>
    <circle cx="4" cy="-5.4" r="1.9" fill="${c}"/></g>`;
}

function modal(html){ $('#modalBody').innerHTML = html; $('#modal').classList.add('show'); }
function tileCentre(o){
  const f = footprint(BPMAP[o.bp], o.rot);
  const r = $('#world').getBoundingClientRect();
  return {x: r.left + cam.x + (o.tx+f.w/2)*T*cam.z, y: r.top + cam.y + (o.ty+f.h/2)*T*cam.z};
}

/* =====================================================================
   INPUT
   ===================================================================== */
function bindInput(){
  const vp = $('#viewport'), world = $('#world');
  let dragging=null, moved=0, dragObj=null;

  world.addEventListener('mousedown', e=>{
    if(e.button!==0) return;
    const t = screenToTile(e.clientX, e.clientY);
    moved = 0;
    if(ghost){ dragging={mode:'ghost'}; return; }
    const hit = e.target.closest && e.target.closest('.ob');
    if(hit){
      const o = S.objs.find(z=>z.id===+hit.dataset.id);
      dragObj = o ? {o, sx:e.clientX, sy:e.clientY, ox:o.tx, oy:o.ty} : null;
      dragging = {mode:'obj'};
    } else {
      dragging = {mode:'pan', sx:e.clientX, sy:e.clientY, cx:cam.x, cy:cam.y};
      vp.classList.add('panning');
    }
  });

  window.addEventListener('mousemove', e=>{
    if(ghost){
      const t = screenToTile(e.clientX, e.clientY);
      const f = footprint(ghost.bp, ghost.rot);
      const tx = clamp(t.tx - Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      const ty = clamp(t.ty - Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      if(tx!==ghost.tx || ty!==ghost.ty){ ghost.tx=tx; ghost.ty=ty; render(); }
    }
    if(!dragging) return;
    moved += Math.abs(e.movementX)+Math.abs(e.movementY);
    if(dragging.mode==='pan'){
      cam.x = dragging.cx + (e.clientX-dragging.sx);
      cam.y = dragging.cy + (e.clientY-dragging.sy);
      applyCam();
    } else if(dragging.mode==='obj' && dragObj && moved>6){
      const t = screenToTile(e.clientX, e.clientY);
      const o = dragObj.o, f = footprint(BPMAP[o.bp], o.rot);
      const tx = clamp(t.tx - Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      const ty = clamp(t.ty - Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      if((tx!==o.tx||ty!==o.ty) && !overlaps(tx,ty,f,o.id)){ o.tx=tx; o.ty=ty; render(); }
    }
  });

  window.addEventListener('mouseup', e=>{
    vp.classList.remove('panning');
    if(ghost && dragging && dragging.mode==='ghost' && moved<8){ G.commit(); }
    else if(dragging && dragging.mode==='obj' && dragObj){
      if(moved<8){ sel = dragObj.o.id; rightTab='insp';
        $$('.ptab').forEach((b,i)=>b.classList.toggle('on', i===0));
        render(); ui(); }
      else { G.save(); ui(); }
    }
    else if(dragging && dragging.mode==='pan' && moved<8){ sel=null; render(); ui(); }
    dragging=null; dragObj=null;
  });

  /* touch: pan + tap */
  let tstart=null;
  world.addEventListener('touchstart', e=>{
    const t0=e.touches[0];
    tstart={x:t0.clientX,y:t0.clientY,cx:cam.x,cy:cam.y,moved:0,tg:e.target};
  }, {passive:true});
  world.addEventListener('touchmove', e=>{
    if(!tstart) return;
    const t0=e.touches[0];
    tstart.moved += Math.abs(t0.clientX-tstart.x)+Math.abs(t0.clientY-tstart.y);
    if(ghost){
      const t = screenToTile(t0.clientX, t0.clientY);
      const f = footprint(ghost.bp, ghost.rot);
      ghost.tx = clamp(t.tx-Math.floor(f.w/2), FARM.x, FARM.x+FARM.w-f.w);
      ghost.ty = clamp(t.ty-Math.floor(f.h/2), FARM.y, FARM.y+FARM.h-f.h);
      render();
    } else {
      cam.x = tstart.cx + (t0.clientX-tstart.x); cam.y = tstart.cy + (t0.clientY-tstart.y);
      applyCam();
    }
  }, {passive:true});
  world.addEventListener('touchend', e=>{
    if(!tstart) return;
    if(tstart.moved < 12){
      if(ghost) G.commit();
      else {
        const hit = tstart.tg.closest && tstart.tg.closest('.ob');
        sel = hit ? +hit.dataset.id : null;
        render(); ui();
      }
    }
    tstart=null;
  });

  world.addEventListener('wheel', e=>{
    e.preventDefault();
    const r = world.getBoundingClientRect();
    zoomAt(e.deltaY>0?-0.12:0.12, e.clientX-r.left, e.clientY-r.top);
  }, {passive:false});

  /* tooltips */
  document.addEventListener('mousemove', e=>{
    const el = e.target.closest && e.target.closest('[data-tip]');
    if(el){ if(el!==tipTarget){ tipTarget=el; showTip(el.dataset.tip, e.clientX, e.clientY); }
      else { const t=tip(); const r=t.getBoundingClientRect();
        let tx=e.clientX+16, ty=e.clientY+16;
        if(tx+r.width>innerWidth-8) tx=e.clientX-r.width-14;
        if(ty+r.height>innerHeight-8) ty=e.clientY-r.height-14;
        t.style.left=Math.max(6,tx)+'px'; t.style.top=Math.max(6,ty)+'px'; }
      return;
    }
    const ob = e.target.closest && e.target.closest('.ob');
    if(ob){
      const o = S.objs.find(z=>z.id===+ob.dataset.id);
      if(o){ if(ob!==tipTarget){ tipTarget=ob; showTip(objTip(o), e.clientX, e.clientY); }
        else showTip(objTip(o), e.clientX, e.clientY);
        return; }
    }
    if(tipTarget) hideTip();
  });
  document.addEventListener('mouseleave', hideTip);

  /* keys */
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if(k==='escape'){ if(ghost) G.cancel(); else { sel=null; render(); ui(); } G.closeModal(); }
    else if(k==='r'){ if(ghost) G.rotGhost(); else if(sel) G.rotate(sel); }
    else if(k==='delete'||k==='backspace'){ if(sel){ e.preventDefault(); G.sellObj(sel); } }
    else if(k===' '){ e.preventDefault(); G.setSpeed(S.speed===0?1:0); }
    else if(k==='1'){ G.setSpeed(1); }
    else if(k==='2'){ G.setSpeed(3); }
    else if(k==='w'){ G.waterAll(); }
    else if(k==='h'){ G.openHelp(); }
    else if(k==='u'){ if(sel) upgrade(sel); }
    else if(k==='m'){ G.toggleSound(); }
    else if(k==='f'){ fitView(); }
  });

  $$('.ptab').forEach(b=> b.addEventListener('click', ()=>G.rt(b.dataset.rt, b)));
  $('#modal').addEventListener('click', e=>{ if(e.target.id==='modal') G.closeModal(); });
  window.addEventListener('resize', ()=>{ applyCam(); });
}

/* =====================================================================

   ===================================================================== */
function loop(t){
  if(window.__perfLoop) return;              // superseded by the unified frame
  rafId = requestAnimationFrame(loop);
  if(!lastT) lastT = t;
  const dt = Math.min(250, t-lastT); lastT = t;
  if(S.speed>0){
    if(S.settings && S.settings.dayLen) DAY_MS = S.settings.dayLen*1000;
    acc += dt*S.speed;
    if(acc >= DAY_MS){ acc -= DAY_MS; advanceDay(); }
  }
  const badge = $('#wbadge');
  if(badge && !badge.dataset.h){ }
  /* day progress on the badge border */
  const pct = Math.round(acc/DAY_MS*100);
  badge.style.background = `linear-gradient(90deg, rgba(124,194,79,.28) ${pct}%, rgba(10,16,8,.86) ${pct}%)`;
}

(function boot(){
  const st = document.createElement('style'); st.textContent = SVGCSS; document.head.appendChild(st);
  const fresh = !G.load();
  if(fresh) newState();
  bindInput();
  ['pointerdown','keydown','touchstart'].forEach(ev=>
    window.addEventListener(ev, ()=>{
      SND.setMuted(!!S.muted);      // set BEFORE unlocking so a muted farm stays silent
      SND.unlock();
      const b=$('#sndBtn'); if(b){ b.textContent = S.muted?'🔇':'🔊'; b.classList.toggle('on', !S.muted); }
    }, {once:true}));
  render(); fitView(); ui();
  S.log.length ? (function(){ const el=$('#log');
    el.innerHTML = S.log.map(l=>`<div class="lg ${l.c}"><time>D${l.d}</time><span>${l.m}</span></div>`).join(''); })()
    : log('Welcome to Greenhollow.','good');
  if(fresh) setTimeout(()=>{ if(typeof landChooser==='function') modal(landChooser()); else G.openHelp(); }, 400);
  rafId = requestAnimationFrame(loop);
})();

/* ---------------- YOUR PARTNER PULLS HER WEIGHT ---------------- */
/* A partner on a family farm realistically gives about a third of a working
   day to it — the rest goes to the house and the children. That is roughly
   3 of the 10 daily hours, so she clears about 30% of the outstanding jobs. */
function partnerHelps(){
  if(!SET('familyLife')) return;
  peopleInit();
  const p = S.family.find(f=>f.role==='partner');
  if(!p) return;

  /* everything that needs doing today */
  const chores = [];
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind==='plot' && o.crop && o.water < 0.4) chores.push({o, t:'water'});
    if(bp.kind==='plot' && o.crop && o.stage >= 1)  chores.push({o, t:'harvest'});
    if(bp.kind==='plot' && (o.weeds||0) > 0.5)      chores.push({o, t:'weed'});
    if(bp.kind==='animal' && o.ready > 0)           chores.push({o, t:'collect'});
    if(bp.kind==='animal' && (o.care||1) < 0.5)     chores.push({o, t:'clean'});
    if(bp.kind==='perennial' && o.stage >= 1)       chores.push({o, t:'pick'});
  });
  if(!chores.length){ p.helped = 0; return; }

  /* 30% of the list, capped at what three hours can realistically cover */
  const share = Math.min(4, Math.max(1, Math.round(chores.length * 0.3)));
  let did = 0, picked = 0;
  for(let i=0; i<chores.length && did<share; i++){
    const c = chores[i], o = c.o, bp = BPMAP[o.bp];
    if(c.t==='water' && S.water >= 8){ S.water -= 8; o.water = 1; did++; }
    else if(c.t==='harvest'){
      const cr = CROPS[o.crop];
      const q = Math.max(1, Math.round(cr.yield*E.slots(o)*cropMul(o)));
      give(o.crop, q); picked += q;
      o.fert = clamp(o.fert-0.16, 0.15, 1); o.last = o.crop;
      o.crop = null; o.stage = 0; o.weeds = 0; did++;
    }
    else if(c.t==='pick'){ const q = E.qty(o); give(bp.good, q); picked += q; o.stage = 0; did++; }
    else if(c.t==='collect'){ give(bp.good, o.ready); picked += o.ready; o.ready = 0; did++; }
    else if(c.t==='clean'){ o.care = 1; did++; }
    else if(c.t==='weed'){ o.weeds = 0; did++; }
  }
  p.helped = did;
  if(did){
    S.morale = clamp((S.morale||0.6) + 0.02, 0, 1);
    log(`${p.name} got through ${did} job${did>1?'s':''} around the farm${picked?` and brought in ${picked}`:''}.`, 'good');
  }
}

/* ---------------------------------------------------------------
   BUG 1 — "Fit" framed the whole world canvas instead of your land.
   The canvas is much bigger than the property (it carries the
   horizon), so fitting it left the farm tiny in a sea of margin.
   --------------------------------------------------------------- */
fitView = function(){
  const world = document.getElementById('world');
  if(!world) return;
  const arc = document.getElementById('sunarc');
  const arcH = (arc && arc.style.display !== 'none') ? arc.getBoundingClientRect().height : 0;

  /* The container can report zero height while the grid is still settling
     (or if a layout rule collapses it). Fall back to the window rather than
     dividing by nothing and flinging the camera off-screen. */
  let w = world.clientWidth, h = world.clientHeight;
  if(w < 40){
    const left = document.getElementById('left'), right = document.getElementById('right');
    const sideW = (left ? left.clientWidth : 0) + (right ? right.clientWidth : 0);
    w = Math.max(240, window.innerWidth - sideW);
  }
  if(h < 40 + arcH){
    const top = document.getElementById('top'), tabs = document.getElementById('mobtabs');
    const chrome = (top ? top.offsetHeight : 0) + (tabs ? tabs.offsetHeight : 0);
    h = Math.max(240, window.innerHeight - chrome);
  }
  const availH = Math.max(120, h - arcH);

  const pad = T * 1.2;
  const pw = FARM.w*T + pad*2, ph = FARM.h*T + pad*2;
  cam.z = clamp(Math.min(w/pw, availH/ph), 0.18, 2.6);
  const px = FARM.x*T - pad, py = FARM.y*T - pad;
  cam.x = (w - pw*cam.z)/2 - px*cam.z;
  cam.y = (availH - ph*cam.z)/2 - py*cam.z + arcH;

  /* Post-condition: the property must actually be visible. If anything above
     went wrong, put it somewhere sane rather than leaving a blank screen. */
  const sx = FARM.x*T*cam.z + cam.x, sy = FARM.y*T*cam.z + cam.y;
  const sw = FARM.w*T*cam.z, sh = FARM.h*T*cam.z;
  if(!isFinite(sx) || !isFinite(sy) || sx+sw < 20 || sy+sh < 20 || sx > w-20 || sy > h-20){
    cam.z = clamp(Math.min(w/pw, availH/ph), 0.18, 2.6) || 0.6;
    cam.x = w/2  - (FARM.x + FARM.w/2)*T*cam.z;
    cam.y = arcH + availH/2 - (FARM.y + FARM.h/2)*T*cam.z;
  }
  applyCam();
};

/* ---------------------------------------------------------------
   ROADS — people follow the gravel unless the detour is silly
   --------------------------------------------------------------- */
function isRoadTile(x,y){
  return S.objs.some(o=>{
    if(!MERGE_ROAD[o.bp] && o.bp!=='ring' && o.bp!=='parking') return false;
    const f = footprint(BPMAP[o.bp], o.rot);
    return x>=o.tx && x<o.tx+f.w && y>=o.ty && y<o.ty+f.h;
  });
}
/* weighted A*: a road step costs a third of a step across open ground,
   so a route will happily bend a long way to pick up a path */
function findPathWeighted(sx,sy,gx,gy){
  const key=(x,y)=>x+','+y;
  const H=(x,y)=>(Math.abs(x-gx)+Math.abs(y-gy))*0.34;
  const open=[{x:sx,y:sy,g:0,f:0,p:null}], best={[key(sx,sy)]:0};
  let goal=null, guard=0;
  while(open.length && guard++ < 9000){
    let bi=0; for(let i=1;i<open.length;i++) if(open[i].f<open[bi].f) bi=i;
    const cur = open.splice(bi,1)[0];
    if(Math.abs(cur.x-gx)<=1 && Math.abs(cur.y-gy)<=1){ goal=cur; break; }
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      const nx=cur.x+d[0], ny=cur.y+d[1];
      if(blockedTile(nx,ny)) return;
      const step = isRoadTile(nx,ny) ? 0.34 : 1;
      const g = cur.g + step, k = key(nx,ny);
      if(best[k]!==undefined && best[k]<=g) return;
      best[k]=g;
      open.push({x:nx,y:ny,g,f:g+H(nx,ny),p:cur});
    });
  }
  if(!goal) return null;
  const path=[]; let c=goal;
  while(c){ path.unshift({x:c.x,y:c.y}); c=c.p; }
  return {path:path.slice(1), cost:goal.g};
}
/* Replace the plain router. If following the road would take more than
   ~75% longer in actual steps, the walker judges it not worth it. */
const _findPathPlain = findPath;
findPath = function(sx,sy,gx,gy){
  if(!S.objs.some(o=>MERGE_ROAD[o.bp]||o.bp==='ring'||o.bp==='parking'))
    return _findPathPlain(sx,sy,gx,gy);
  const roadRoute = findPathWeighted(sx,sy,gx,gy);
  const direct = _findPathPlain(sx,sy,gx,gy);
  if(!roadRoute) return direct;
  if(!direct || !direct.length) return roadRoute.path;
  if(roadRoute.path.length > direct.length * 1.75) return direct;   // detour not worth it
  return roadRoute.path;
};

/* recreation lifts morale each day, and the family use it */
function recreationDay(){
  const recs = S.objs.filter(o=>BPMAP[o.bp].kind==='rec');
  if(!recs.length) return;
  const kid = recs.filter(o=>BPMAP[o.bp].who==='child').length;
  const adult = recs.filter(o=>BPMAP[o.bp].who==='adult').length;
  const lift = Math.min(0.09, (kid*0.02 + adult*0.025));
  S.morale = clamp((S.morale||0.6) + lift, 0, 1);
  if(S.career) S.career.burnout = clamp(S.career.burnout - lift*0.5, 0, 0.6);
}

/* ---------------------------------------------------------------
   The family use the recreation and the craft buildings
   --------------------------------------------------------------- */
const _routine = routine;
routine = function(p){
  const f = dayFrac();
  if(f < 0.24 || f > 0.88) return _routine(p);
  const want = p.role==='child' ? 'child' : 'adult';
  const recs = S.objs.filter(o=>BPMAP[o.bp].kind==='rec' && BPMAP[o.bp].who===want);
  /* children play mid-afternoon; adults unwind in the evening */
  const playtime = p.role==='child' ? (f>0.55 && f<0.78) : (f>0.70 && f<0.86);
  if(playtime && recs.length){
    const o = recs[Math.floor(hash(p.id.length*3 + Math.floor(f*9))*recs.length)];
    const ft = footprint(BPMAP[o.bp], o.rot);
    return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.4)*T, act:BPMAP[o.bp].act};
  }
  /* partner does a turn in whichever craft building is running */
  if(p.role==='partner' && f>0.52 && f<0.70){
    const craft = S.objs.filter(o=>BPMAP[o.bp].kind==='process' && o.recipe>=0);
    if(craft.length){
      const o = craft[0], ft = footprint(BPMAP[o.bp], o.rot);
      return {x:(o.tx+ft.w/2)*T, y:(o.ty+ft.h+0.4)*T, act:'working in the '+BPMAP[o.bp].name.toLowerCase()};
    }
  }
  return _routine(p);
};

/* ---------------------------------------------------------------
   EXPANSION — when the land fills up, buy the adjoining paddock
   --------------------------------------------------------------- */
function farmUsage(){
  const used = S.objs.reduce((a,o)=>{
    const f = footprint(BPMAP[o.bp], o.rot); return a + f.w*f.h;
  }, 0);
  return {used, total: FARM.w*FARM.h, pct: used/(FARM.w*FARM.h)};
}
function expandCost(){
  const n0 = S.expansions||0;
  return Math.round(2400 * Math.pow(1.85, n0));
}
function canExpand(){
  /* the world canvas grows to suit in expandFarm(), so the only real
     limit is how many parcels the neighbours will sell */
  return (S.expansions||0) < 4;
}
function expandFarm(){
  if(!canExpand()) return toast('No more adjoining land for sale','bad'), sfx('error');
  const c = expandCost();
  if(S.cash < c) return toast(`The neighbour wants ${fmt(c)} for it`,'bad'), sfx('error');
  S.cash -= c;
  S.expansions = (S.expansions||0) + 1;
  /* grow the fenced area; the world canvas grows with it if needed */
  const addW = 4, addH = 3;
  if(FARM.x + FARM.w + addW > WT-3){ WT += addW+2; WPX = WT*T; }
  if(FARM.y + FARM.h + addH > HT-3){ HT += addH+2; HPX = HT*T; }
  FARM.w += addW; FARM.h += addH;
  terrainCache = '';
  sfx('upgrade');
  toast(`Bought the adjoining paddock — ${FARM.w}×${FARM.h} now`,'gold');
  log(`Bought ${addW}×${addH} tiles of adjoining land for ${fmt(c)}. Rates will rise.`,'gold');
  render(); fitView(); ui(); G.save();
}

/* ---------------------------------------------------------------
   A LIVING HORIZON — the backdrop now tracks the sun and weather
   --------------------------------------------------------------- */
/* Animating a CSS filter over a group this large forced a full repaint every
   frame. Opacity on flat overlay rects composites on the GPU instead. */
function tintHorizon(){
  const g = document.getElementById('horizon');
  if(!g || typeof skyNow!=='function') return;
  const s = skyNow(), wx = S.weather;

  let tint = g.querySelector('.hz-tint');
  let grey = g.querySelector('.hz-grey');
  if(!tint){
    const mk = cls => {
      const r = document.createElementNS('http://www.w3.org/2000/svg','rect');
      r.setAttribute('class', cls);
      r.setAttribute('x', -WPX*0.3); r.setAttribute('y', -400);
      r.setAttribute('width', WPX*1.6); r.setAttribute('height', HPX+800);
      r.style.pointerEvents='none';
      g.appendChild(r); return r;
    };
    tint = mk('hz-tint'); grey = mk('hz-grey');
    grey.setAttribute('fill', '#6b7a80');
  }
  /* time of day: warm at the edges of the day, deep blue at night */
  tint.setAttribute('fill', s.hz);
  tint.setAttribute('opacity', (0.08 + s.l*0.55).toFixed(3));
  /* weather: a flat grey veil stands in for desaturation */
  const veil = wx==='storm' ? 0.42 : wx==='rain' ? 0.26 : wx==='cloud' ? 0.13 : 0;
  grey.setAttribute('opacity', veil.toFixed(3));
  g.style.filter = '';
}

/* =====================================================================
   HOUSEHOLD — add and remove the people who live with you
   ===================================================================== */

const FAM_LIMITS = {partner:1, adult:2, child:5};
const FAM_COST   = {partner:380, adult:340, child:240};   // per month, per head
const FAM_NAMES  = {
  partner:['Rina','Sofia','Amara','Noor','Elin','Maya','Tara','Iris'],
  adult  :['Dad','Mum','Uncle Ray','Aunt Bea','Nana','Grandad','Kaya','Milo'],
  child  :['Arjun','Lila','Sam','Zara','Theo','Anya','Rafi','Nina','Ivo','Suri'],
};
const FAM_SHIRT = {
  partner:'#8f6fc4', adult:'#4f8a9c',
  child:['#e8a33d','#5fb0d4','#dd6f9c','#7cc24f','#e2705c'],
};

function famCount(role){ peopleInit(); return S.family.filter(f=>f.role===role).length; }
function canAdd(role){ return famCount(role) < FAM_LIMITS[role]; }
function householdCost(){
  peopleInit();
  return S.family.reduce((a,f)=> a + (FAM_COST[f.role]||0), 0);
}

function addFamily(role){
  peopleInit();
  if(!canAdd(role)){
    const limit = FAM_LIMITS[role];
    return toast(`Room for ${limit} ${role}${limit>1?'s':''} at most`,'bad'), sfx('error');
  }
  const used = S.family.map(f=>f.name);
  const pool = FAM_NAMES[role].filter(n=>!used.includes(n));
  const name = pool.length ? pool[Math.floor(Math.random()*pool.length)]
                           : role.charAt(0).toUpperCase()+role.slice(1)+' '+(famCount(role)+1);
  const kids = famCount('child');
  const f = {
    id:'f'+Date.now()+Math.floor(Math.random()*999),
    role, name,
    shirt: role==='child' ? FAM_SHIRT.child[kids % FAM_SHIRT.child.length] : FAM_SHIRT[role],
    sc: role==='child' ? (0.66 + Math.random()*0.16) : (1.02 + Math.random()*0.1),
    x:(FARM.x+4)*T, y:(FARM.y+4)*T, path:[], state:'idle', dir:1, t:0, act:'', helped:0
  };
  S.family.push(f);
  sfx('collect');
  toast(`${name} joined the household`,'good');
  log(`${name} moved in. Household costs are now ${fmt(householdCost())}/month.`,'gold');
  render(); ui(); G.save();
}

function removeFamily(id){
  peopleInit();
  const f = S.family.find(z=>z.id===id);
  if(!f) return;
  if(SET('confirmSell') && !confirm(`${f.name} moves away from the farm?`)) return;
  S.family = S.family.filter(z=>z.id!==id);
  S.morale = clamp((S.morale||0.6) - 0.08, 0, 1);
  sfx('remove');
  toast(`${f.name} has moved away`,'');
  log(`${f.name} moved away.`);
  render(); ui(); G.save();
}

/* household costs join the monthly ledger */
if(typeof outgoings === 'function'){
  const _out18 = outgoings;
  outgoings = function(){
    const o = _out18();
    if(!o.total && !SET('billsOn')) return o;
    o.household = householdCost();
    o.total += o.household;
    return o;
  };
}

/* every adult in the house pitches in; the partner most of all */
if(typeof partnerHelps === 'function'){
  partnerHelps = function(){
    if(!SET('familyLife')) return;
    peopleInit();
    const helpers = S.family.filter(f=>f.role==='partner' || f.role==='adult');
    if(!helpers.length) return;

    const chores = [];
    S.objs.forEach(o=>{
      const bp = BPMAP[o.bp];
      if(bp.kind==='plot' && o.crop && o.water < 0.4) chores.push({o, t:'water'});
      if(bp.kind==='plot' && o.crop && o.stage >= 1)  chores.push({o, t:'harvest'});
      if(bp.kind==='plot' && (o.weeds||0) > 0.5)      chores.push({o, t:'weed'});
      if(bp.kind==='animal' && o.ready > 0)           chores.push({o, t:'collect'});
      if(bp.kind==='animal' && (o.care||1) < 0.5)     chores.push({o, t:'clean'});
      if(bp.kind==='perennial' && o.stage >= 1)       chores.push({o, t:'pick'});
    });
    if(!chores.length){ helpers.forEach(h=>h.helped=0); return; }

    let idx = 0, picked = 0;
    helpers.forEach(p=>{
      /* a partner gives about a third of the list; another adult about half that */
      const rate = p.role==='partner' ? 0.30 : 0.15;
      const cap  = p.role==='partner' ? 4 : 2;
      const share = Math.min(cap, Math.max(1, Math.round(chores.length * rate)));
      let did = 0;
      while(idx < chores.length && did < share){
        const c = chores[idx++], o = c.o, bp = BPMAP[o.bp];
        if(c.t==='water' && S.water >= 8){ S.water -= 8; o.water = 1; did++; }
        else if(c.t==='harvest'){
          const cr = CROPS[o.crop];
          const q = Math.max(1, Math.round(cr.yield*E.slots(o)*cropMul(o)));
          give(o.crop, q); picked += q;
          o.fert = clamp(o.fert-0.16, 0.15, 1); o.last = o.crop;
          o.crop = null; o.stage = 0; o.weeds = 0; did++;
        }
        else if(c.t==='pick'){ const q=E.qty(o); give(bp.good,q); picked+=q; o.stage=0; did++; }
        else if(c.t==='collect'){ give(bp.good,o.ready); picked+=o.ready; o.ready=0; did++; }
        else if(c.t==='clean'){ o.care = 1; did++; }
        else if(c.t==='weed'){ o.weeds = 0; did++; }
      }
      p.helped = did;
    });
    const total = helpers.reduce((a,h)=>a+(h.helped||0),0);
    if(total){
      S.morale = clamp((S.morale||0.6) + 0.02, 0, 1);
      const who = helpers.filter(h=>h.helped).map(h=>h.name).join(' and ');
      log(`${who} got through ${total} job${total>1?'s':''} around the farm${picked?` and brought in ${picked}`:''}.`, 'good');
    }
  };
}

/* children need somewhere to sleep — too many for the house costs morale */
function housingStrain(){
  peopleInit();
  const home = HOMEMAP[S.homeId];
  const beds = home ? (home.size==='One bedroom' ? 2 : home.size==='Three bedroom' ? 4 : 6) : 4;
  return Math.max(0, S.family.length + 1 - beds);
}
if(typeof recreationDay === 'function'){
  const _rec = recreationDay;
  recreationDay = function(){
    _rec();
    const over = housingStrain();
    if(over > 0){
      S.morale = clamp((S.morale||0.6) - 0.03*over, 0, 1);
      if(Math.random() < 0.15)
        log(`The house is crowded — ${over} more ${over>1?'people':'person'} than it sleeps. A bigger home would help.`,'bad');
    }
  };
}

/* =====================================================================
   UPGRADES YOU CAN SEE — each Mark rebuilds the structure, it does not
   just decorate it. Mk I is a shed; Mk IV is a plant.

/* The art functions are called without a tier argument all over the place,
   so we park it here for the duration of one draw. */
let ART_TIER = 0;
if(typeof drawObj === 'function'){
  const _drawObj = drawObj;
  drawObj = function(o){
    ART_TIER = (typeof tOf==='function') ? tOf(o) : 0;
    const out = _drawObj(o);
    ART_TIER = 0;
    return out;
  };
}
function curTier(o){
  if(o && typeof o.tier === 'number') return o.tier;
  return ART_TIER;
}

/* ---------------------------------------------------------------
   The building primitive, rebuilt per Mark.
   I — a plain gable shed
   II — a longer building with a lean-to wing and a clerestory
   III — a two-block works with a parapet, loading canopy and vents
   IV — a clad plant: glass atrium, full solar skin, gantry and mast
   --------------------------------------------------------------- */
const _buildingBase = building;
building = function(w, h, o){
  o = o || {};
  const tier = (o.tier !== undefined) ? o.tier : ART_TIER;
  if(!tier) return _buildingBase(w, h, o);

  const roof = o.roof || 'url(#gRoof)';
  let s = '';

  /* one shadow for the whole complex */
  s += `<rect x="${n(w*0.05)}" y="${n(h*0.09)}" width="${n(w*0.96)}" height="${n(h*0.94)}" rx="3"
    fill="#16240c" opacity=".34"/>`;

  if(tier === 1){
    /* main range plus a lean-to along the sunny side */
    s += `<g>${_buildingBase(w*0.74, h*0.9, {...o, tier:0, solar:1})}</g>`;
    s += `<g transform="translate(${n(w*0.70)},${n(h*0.28)})">
      ${_buildingBase(w*0.30, h*0.62, {...o, tier:0, roof:'#8d979d', skirt:3})}</g>`;
    /* clerestory ridge lights */
    for(let i=0;i<3;i++)
      s += `<rect x="${n(w*(0.16+i*0.18))}" y="${n(h*0.40)}" width="${n(w*0.11)}" height="${n(h*0.07)}"
        rx="1" fill="url(#gGlass)" stroke="#6e7d85" stroke-width="0.6"/>`;
    /* concrete apron */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.90)}" width="${n(w*0.66)}" height="${n(h*0.08)}" rx="1.5" fill="#b3ab9c"/>`;
  }

  if(tier === 2){
    /* two blocks joined by a glazed link, with a loading canopy */
    s += `<g>${_buildingBase(w*0.52, h*0.62, {...o, tier:0, solar:1, solar2:1})}</g>`;
    s += `<g transform="translate(${n(w*0.46)},${n(h*0.34)})">
      ${_buildingBase(w*0.54, h*0.66, {...o, tier:0, solar:1, solar2:1})}</g>`;
    s += `<rect x="${n(w*0.40)}" y="${n(h*0.44)}" width="${n(w*0.16)}" height="${n(h*0.22)}" rx="1.5"
      fill="url(#gGlass)" stroke="#7e929a" stroke-width="0.9"/>`;
    /* parapet band across the front */
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.62)}" width="${n(w*0.50)}" height="${n(h*0.05)}" rx="1" fill="#c3ccd2"/>`;
    /* loading canopy on steel posts */
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.70)}" width="${n(w*0.34)}" height="${n(h*0.14)}" rx="1.5" fill="#8d979d"/>`;
    s += `<rect x="${n(w*0.06)}" y="${n(h*0.70)}" width="${n(w*0.34)}" height="${n(h*0.05)}" rx="1.5" fill="#a9b3b9"/>`;
    [0.09,0.22,0.35].forEach(t=> s += `<rect x="${n(w*t)}" y="${n(h*0.84)}" width="2" height="${n(h*0.12)}" fill="#6e7d85"/>`);
    /* roof plant: vents and a silo */
    for(let i=0;i<4;i++)
      s += `<circle cx="${n(w*(0.60+i*0.09))}" cy="${n(h*0.42)}" r="${n(Math.min(w,h)*0.028)}" fill="#b6bfc4" stroke="#78848b" stroke-width="0.6"/>`;
    s += `<circle cx="${n(w*0.90)}" cy="${n(h*0.20)}" r="${n(Math.min(w,h)*0.09)}" fill="#cdd5d9" stroke="#87949b" stroke-width="1"/>`;
  }

  if(tier >= 3){
    /* a proper plant: podium, glass atrium, full solar skin, gantry */
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.10)}" width="${n(w*0.96)}" height="${n(h*0.84)}" rx="3" fill="#5f6a70"/>`;
    s += `<rect x="${n(w*0.02)}" y="${n(h*0.10)}" width="${n(w*0.96)}" height="${n(h*0.30)}" rx="3" fill="#78848b"/>`;
    /* solar skin over the whole roof */
    s += panels(w*0.05, h*0.14, w*0.90, h*0.34, Math.max(5, Math.round(w/12)), 3);
    /* glazed atrium down the middle */
    s += `<rect x="${n(w*0.30)}" y="${n(h*0.50)}" width="${n(w*0.40)}" height="${n(h*0.36)}" rx="2"
      fill="url(#gGlass)" stroke="#8fa8b0" stroke-width="1"/>`;
    for(let i=1;i<4;i++)
      s += `<line x1="${n(w*(0.30+i*0.10))}" y1="${n(h*0.50)}" x2="${n(w*(0.30+i*0.10))}" y2="${n(h*0.86)}"
        stroke="#8fa8b0" stroke-width="0.8"/>`;
    /* service wings either side */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.52)}" width="${n(w*0.22)}" height="${n(h*0.34)}" rx="2" fill="#6e7a81"/>`;
    s += `<rect x="${n(w*0.73)}" y="${n(h*0.52)}" width="${n(w*0.22)}" height="${n(h*0.34)}" rx="2" fill="#6e7a81"/>`;
    /* gantry running the length of the roof */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.455)}" width="${n(w*0.90)}" height="2.4" rx="1.2" fill="#c3ccd2"/>`;
    for(let i=0;i<5;i++)
      s += `<rect x="${n(w*(0.10+i*0.19))}" y="${n(h*0.42)}" width="2" height="${n(h*0.05)}" fill="#9aa5ab"/>`;
    /* status strip */
    s += `<rect x="${n(w*0.32)}" y="${n(h*0.88)}" width="${n(w*0.36)}" height="${n(h*0.06)}" rx="1.5" fill="#0e1c26"/>`;
    for(let i=0;i<5;i++)
      s += `<rect class="twinkle" style="animation-delay:${(i*0.28).toFixed(2)}s"
        x="${n(w*(0.34+i*0.065))}" y="${n(h*0.895)}" width="${n(w*0.04)}" height="${n(h*0.03)}" fill="#7cc24f"/>`;
    /* stacks */
    [0.12,0.86].forEach(t=>{
      s += `<rect x="${n(w*t)}" y="${n(h*0.02)}" width="${n(w*0.045)}" height="${n(h*0.16)}" rx="1" fill="#aab4ba"/>`;
      s += `<rect x="${n(w*t)}" y="${n(h*0.02)}" width="${n(w*0.045)}" height="${n(h*0.04)}" rx="1" fill="#cdd5d9"/>`;
    });
    /* standing-seam cladding across the podium */
    for(let i=0;i<Math.max(6, Math.round(w/9)); i++){
      const x = w*0.03 + i*(w*0.94/Math.max(6, Math.round(w/9)));
      s += `<line x1="${n(x)}" y1="${n(h*0.50)}" x2="${n(x)}" y2="${n(h*0.92)}" stroke="#fff" stroke-opacity=".07" stroke-width="0.8"/>`;
      s += `<line x1="${n(x+1.2)}" y1="${n(h*0.50)}" x2="${n(x+1.2)}" y2="${n(h*0.92)}" stroke="#000" stroke-opacity=".12" stroke-width="0.8"/>`;
    }
    /* rooftop plant: chillers, ducting and a walkway */
    for(let i=0;i<3;i++)
      s += `<rect x="${n(w*(0.14+i*0.13))}" y="${n(h*0.155)}" width="${n(w*0.09)}" height="${n(h*0.10)}" rx="1.5"
        fill="#9aa5ab" stroke="#6e7d85" stroke-width="0.7"/>`;
    s += `<rect x="${n(w*0.60)}" y="${n(h*0.16)}" width="${n(w*0.28)}" height="${n(h*0.07)}" rx="3" fill="#b6bfc4"/>`;
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.115)}" width="${n(w*0.90)}" height="1.6" fill="#c3ccd2" opacity=".7"/>`;
    /* access ladder and handrail */
    s += `<rect x="${n(w*0.955)}" y="${n(h*0.14)}" width="1.6" height="${n(h*0.34)}" fill="#9aa5ab"/>`;
    for(let i=0;i<5;i++)
      s += `<rect x="${n(w*0.945)}" y="${n(h*(0.17+i*0.06))}" width="3.6" height="1" fill="#9aa5ab"/>`;
    /* lit atrium glow at night */
    s += `<rect x="${n(w*0.30)}" y="${n(h*0.50)}" width="${n(w*0.40)}" height="${n(h*0.36)}" rx="2"
      fill="#ffe9b0" opacity=".16"/>`;
    /* company sign band */
    s += `<rect x="${n(w*0.05)}" y="${n(h*0.44)}" width="${n(w*0.90)}" height="${n(h*0.045)}" rx="1" fill="#2c3a42"/>`;
    s += `<rect x="${n(w*0.07)}" y="${n(h*0.452)}" width="${n(w*0.24)}" height="${n(h*0.022)}" rx="1" fill="#7cc24f" opacity=".85"/>`;
  }
  s += grain(0,0,w,h,0.08);
  return s;
};

/* ---------------------------------------------------------------
   The non-building structures grow too

/* rain tanks: two, then four, then a bank with a pump house */
const _artTank = ART.tank;
ART.tank = (w,h,ob)=>{
  const t = curTier(ob);

    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad-1.2)}" fill="url(#gTank)"/>`;
    for(let j=0;j<12;j++){ const a=(j/12)*Math.PI*2;
      s += `<line x1="${n(cx)}" y1="${n(cy)}" x2="${n(cx+Math.cos(a)*(rad-2))}" y2="${n(cy+Math.sin(a)*(rad-2))}" stroke="#3e6a3e" stroke-width="0.7" opacity=".7"/>`; }
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad*0.26)}" fill="#5f8a5c"/>`;
    s += `<path d="M${n(cx-rad*0.58)} ${n(cy-rad*0.5)} a ${n(rad*0.8)} ${n(rad*0.8)} 0 0 1 ${n(rad*0.9)} ${n(-rad*0.14)}" stroke="#fff" stroke-width="1.2" fill="none" opacity=".38"/>`;

    s += `<rect x="${n((w/cnt)*(i+0.5)-1)}" y="${n(h*0.78)}" width="2" height="${n(h*0.12)}" fill="#8b949a"/>`;

    s += `<rect x="${n(w*0.04)}" y="${n(h*0.04)}" width="${n(w*0.2)}" height="${n(h*0.22)}" rx="2" fill="#5f6a70"/>`;
    s += `<circle class="pulse" cx="${n(w*0.14)}" cy="${n(h*0.15)}" r="2" fill="#6fb6d8"/>`;

  if(ob){

function tieredBed(base, rows){

/* ---------------------------------------------------------------

function tierPreview(o, tier){

  return `<svg viewBox="0 0 ${w} ${h}" width="${n(w*sc)}" height="${n(h*sc)}">${DEFS()}${art}</svg>`;
}

/* =====================================================================
   PERFORMANCE — the scene was rebuilt whole on every change: terrain,
   horizon, every tuft of grass, re-serialised and re-parsed each time.
   Now the static backdrop is built once and only the moving parts are
   redrawn, and every ticker shares one animation frame.
   ===================================================================== */

/* ---------- 1. split the scene: a static backdrop, a live foreground ---------- */
let bgToken = '';
function sceneSize(){ return {w:WPX, h:HPX}; }

function ensureBackdrop(){
  const scene = document.getElementById('scene');
  if(!scene) return null;
  const token = `${WPX}x${HPX}:${S.landId}:${S.expansions||0}`;
  let bg = document.getElementById('bg');
  if(bg && bgToken === token) return bg;
  /* the backdrop only changes when the land itself does */
  const bgSvg = `<svg id="bg" width="${WPX}" height="${HPX}" viewBox="0 0 ${WPX} ${HPX}"
      xmlns="http://www.w3.org/2000/svg">${DEFS()}${terrain()}</svg>`;
  const fgSvg = `<svg id="fg" width="${WPX}" height="${HPX}" viewBox="0 0 ${WPX} ${HPX}"
      xmlns="http://www.w3.org/2000/svg">${DEFS()}</svg>`;
  scene.innerHTML = bgSvg + fgSvg;
  bgToken = token;
  return document.getElementById('bg');
}

/* the whole render, rebuilt to touch only the foreground */
render = function(){
  if(!S) return;
  ensureBackdrop();
  const fg = document.getElementById('fg');
  if(!fg) return;

  const order = {access:0, water:1, garden:2, trees:3, animals:4, energy:5, build:6, tourism:7, people:8, markers:9};
  const objs = S.objs.slice().sort((a,b)=>{
    const A=BPMAP[a.bp], B=BPMAP[b.bp];
    const ra = A.cat==='land'&&(A.art==='path'||A.art==='ring'||A.art==='parking') ? 0 : 1;
    const rb = B.cat==='land'&&(B.art==='path'||B.art==='ring'||B.art==='parking') ? 0 : 1;
    if(ra!==rb) return ra-rb;
    return (a.ty+BPMAP[a.bp].h) - (b.ty+BPMAP[b.bp].h);
  });

  let ghostSvg = '';
  if(ghost){
    const f = footprint(ghost.bp, ghost.rot);
    if((typeof SET!=='function') || SET('grid')){
      ghostSvg += `<g class="gridlay">`;
      for(let x=FARM.x;x<=FARM.x+FARM.w;x++)
        ghostSvg += `<line x1="${x*T}" y1="${FARM.y*T}" x2="${x*T}" y2="${(FARM.y+FARM.h)*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
      for(let y=FARM.y;y<=FARM.y+FARM.h;y++)
        ghostSvg += `<line x1="${FARM.x*T}" y1="${y*T}" x2="${(FARM.x+FARM.w)*T}" y2="${y*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
      ghostSvg += `</g>`;
    }
    const bad = overlaps(ghost.tx, ghost.ty, f, ghost.moving) || S.cash < (ghost.moving?0:ghost.bp.cost);
    const fake = {id:-1, bp:ghost.bp.id, tx:ghost.tx, ty:ghost.ty, rot:ghost.rot, tier:0,
      crop:null, stage:0.6, water:.6, animals:2, ready:0, store:(ghost.bp.cap||0)*0.6, cap:ghost.bp.cap};
    ghostSvg += `<g opacity=".72">${drawObj(fake)}</g>`;
    ghostSvg += `<rect x="${ghost.tx*T}" y="${ghost.ty*T}" width="${f.w*T}" height="${f.h*T}" rx="4"
      fill="${bad?'#e2705c':'#7cc24f'}" fill-opacity=".2" stroke="${bad?'#e2705c':'#7cc24f'}" stroke-width="2.5"/>`;
  }

  let selRing = '';
  if(sel){
    const o = S.objs.find(z=>z.id===sel);
    if(o){ const f = footprint(BPMAP[o.bp], o.rot);
      selRing = `<rect x="${o.tx*T-2}" y="${o.ty*T-2}" width="${f.w*T+4}" height="${f.h*T+4}" rx="5"
        fill="none" stroke="#f0c14b" stroke-width="2.5" stroke-dasharray="7 5" class="selring"/>`; }
  }

  fg.innerHTML = DEFS()
    + (typeof roadLayer==='function' ? roadLayer() : '')
    + `<g id="obs">${objs.map(drawObj).join('')}</g>`
    + (typeof herdLayer==='function' ? herdLayer() : '')
    + (typeof peopleLayer==='function' ? peopleLayer() : '')
    + (typeof youLayer==='function' ? youLayer() : '')
    + selRing + ghostSvg
    + (typeof weatherLayer==='function' ? weatherLayer() : '');

  nodeCache.clear();
  renderLabels();
  if(typeof applyWind==='function') applyWind();
  const cnt = document.getElementById('layoutCount');
  if(cnt) cnt.textContent = S.objs.length + ' pieces';
};

/* ---------- 2. stop querying the DOM for every creature every tick ---------- */
const nodeCache = new Map();
function node(sel2){
  let el = nodeCache.get(sel2);
  if(el && el.isConnected) return el;
  el = document.querySelector(sel2);
  if(el) nodeCache.set(sel2, el);
  return el;
}
if(typeof paintHerd === 'function'){
  paintHerd = function(){
    S.objs.forEach(o=>{
      if(!o.herd) return;
      o.herd.forEach((a,i)=>{
        const el = node(`[data-b="${o.id}_${i}"]`);
        if(!el) return;
        el.setAttribute('transform', `translate(${n(a.x)},${n(a.y)})`);
        const inner = el.firstElementChild;
        if(inner){
          const want = 'bwalk' + (a.moving ? (a.run ? ' running' : ' walking') : '');
          if(inner.getAttribute('class') !== want) inner.setAttribute('class', want);
          const flip = inner.firstElementChild;
          if(flip && a.dir !== a._d){ flip.setAttribute('transform', `scale(${a.dir},1)`); a._d = a.dir; }
        }
      });
    });
  };
}
if(typeof paintPeople === 'function'){
  paintPeople = function(){
    const upd = p=>{
      const el = node(`[data-p="${p.id}"]`);
      if(!el) return;
      el.setAttribute('transform', `translate(${n(p.x)},${n(p.y)})`);
      const op = p.state==='sleep' ? '0' : '1';
      if(el.style.opacity !== op) el.style.opacity = op;
      const bob = el.firstElementChild;
      if(bob){
        const want = 'youbob' + (p.state==='walk'?' walking':p.state==='busy'?' working':'');
        if(bob.getAttribute('class') !== want) bob.setAttribute('class', want);
        const fl = bob.firstElementChild;
        if(fl && p.dir !== p._d){ fl.setAttribute('transform',`scale(${p.dir},1)`); p._d = p.dir; }
      }
    };
    S.family.forEach(upd); S.workers.forEach(upd);
  };
}
if(typeof paintYou === 'function'){
  paintYou = function(){
    const el = node('#you');
    if(!el) return;

/* ---------- 3. one animation frame drives everything ---------- */
window.__perfLoop = true;
(function unifyTickers(){
  /* the old per-system timers are removed at source; this frame drives them all */
  let last = performance.now(), sunAcc = 0, uiAcc = 0, saveAcc = 0, collectAcc = 0;
  function frame(now){
    requestAnimationFrame(frame);
    const dtms = Math.min(120, now - last);
    last = now;
    if(!S) return;
    const dt = dtms/1000;

    /* the world clock */
    if(S.speed > 0){
      if(S.settings && S.settings.dayLen) DAY_MS = S.settings.dayLen*1000;
      acc += dtms*S.speed;
      if(acc >= DAY_MS){ acc -= DAY_MS; advanceDay(); }
      if(typeof tickLife==='function')   tickLife(dt);
      if(typeof tickPeople==='function') tickPeople(dt);
    }
    if(typeof tickYou==='function')  tickYou(dt);
    if(typeof tickIdle==='function') tickIdle(dt);

    /* the day badge fill */
    const badge = document.getElementById('wbadge');
    if(badge){
      const pct = Math.round(acc/DAY_MS*100);
      badge.style.background = `linear-gradient(90deg, rgba(124,194,79,.28) ${pct}%, rgba(10,16,8,.86) ${pct}%)`;
    }

    sunAcc += dtms; uiAcc += dtms; saveAcc += dtms; collectAcc += dtms;
    if(sunAcc > 500){ sunAcc = 0;
      if(typeof paintSun==='function' && (!S.settings || S.settings.sunarc !== false)) paintSun(); }
    if(uiAcc > 3000){ uiAcc = 0;
      if(S.speed>0){ renderStats(); const b=document.getElementById('wbadge'); if(b) b.innerHTML = hint(); } }
    if(collectAcc > 1500){ collectAcc = 0;
      if(typeof syncWeatherFx==='function') syncWeatherFx();
      if(typeof syncCollectAll==='function') syncCollectAll(); }
    if(saveAcc > 20000){ saveAcc = 0;
      if(typeof SET!=='function' || SET('autoSave')) G.save(); }

    /* edge panning, only while it is switched on */
    if(typeof SET==='function' && SET('edgePan') && edge.on && !ghost){
      let dx=0, dy=0; const m=48, sp=520*dt;
      if(edge.x < m) dx = sp; else if(edge.x > edge.w-m) dx = -sp;
      if(edge.y < m) dy = sp; else if(edge.y > edge.h-m) dy = -sp;
      if(dx||dy){ cam.x += dx; cam.y += dy; applyCam(); }
    }
  }
  requestAnimationFrame(frame);
  if(typeof syncWeatherFx==='function') setTimeout(syncWeatherFx, 300);

  /* pointer position for edge panning, tracked passively */
  const edge = {on:false, x:0, y:0, w:0, h:0};
  const world = document.getElementById('world');
  if(world){
    world.addEventListener('mousemove', e=>{
      const r = world.getBoundingClientRect();
      edge.x = e.clientX-r.left; edge.y = e.clientY-r.top;
      edge.w = r.width; edge.h = r.height; edge.on = true;
    }, {passive:true});
    world.addEventListener('mouseleave', ()=>{ edge.on = false; }, {passive:true});
  }
})();

   3. Idle rules — the farm does not run itself for free
   --------------------------------------------------------------- */
function idleInit(){ if(S.idleSecs===undefined) S.idleSecs = 0; }
function noteActivity(){ idleInit(); S.idleSecs = 0; if(S.idlePaused){ S.idlePaused=false; S.speed = S._preIdle||1; ui(); } }
['pointerdown','keydown','wheel','touchstart'].forEach(ev=>
  window.addEventListener(ev, ()=>{ if(S) noteActivity(); }, {passive:true}));

function tickIdleRules(dt){
  idleInit();
  if(!SET('idleRules')) return;
  if(S.speed === 0 && !S.idlePaused) return;      // deliberately paused, leave alone
  S.idleSecs += dt;
  const limit = (SET('idleMins')||10) * 60;
  if(!S.idlePaused && S.idleSecs > limit){
    S.idlePaused = true; S._preIdle = S.speed || 1; S.speed = 0;
    /* neglect costs exactly a tenth, rounded up, so it is always felt */
    let lostCrops = 0, lostStock = 0;
    const planted = S.objs.filter(o=>BPMAP[o.bp].kind==='plot' && o.crop);
    for(let i=planted.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [planted[i],planted[j]]=[planted[j],planted[i]]; }
    planted.slice(0, Math.ceil(planted.length*0.10)).forEach(o=>{
      o.crop=null; o.stage=0; o.weeds=0; lostCrops++;
    });
    const herd = S.objs.filter(o=>BPMAP[o.bp].kind==='animal' && o.animals>0);
    let toLose = Math.ceil(herd.reduce((a,o)=>a+o.animals,0) * 0.10);
    while(toLose > 0){
      const pen = herd.filter(o=>o.animals>0);
      if(!pen.length) break;
      const o = pen[Math.floor(Math.random()*pen.length)];
      o.animals--; syncHerd(o); lostStock++; toLose--;
    }
    S.morale = clamp((S.morale||0.6) - 0.1, 0, 1);
    const bits = [];
    if(lostCrops) bits.push(`${lostCrops} bed${lostCrops>1?'s':''} of crops failed`);
    if(lostStock) bits.push(`${lostStock} animal${lostStock>1?'s':''} lost`);
    log(`Left unattended for ${SET('idleMins')} minutes — ${bits.length?bits.join(' and '):'no losses this time'}. Clock paused.`, 'bad');
    toast(bits.length ? `Neglect: ${bits.join(', ')}` : 'Farm paused — you were away', 'bad');
    sfx('error');
    render(); ui();
  }
}

function buildMinimap(){
  const world = document.getElementById('world');
  if(!world || document.getElementById('minimap')) return;
  const d = document.createElement('div');
  d.id = 'minimap';
  d.innerHTML = `<canvas id="mmCanvas" width="150" height="110"></canvas><div id="mmView"></div>`;
  world.appendChild(d);
  const canvas = d.querySelector('canvas');
  const jump = e=>{
    const r = canvas.getBoundingClientRect();
    const fx = (e.clientX - r.left)/r.width, fy = (e.clientY - r.top)/r.height;
    const wx = (FARM.x + fx*FARM.w)*T, wy = (FARM.y + fy*FARM.h)*T;
    const vw = world.clientWidth, vh = world.clientHeight;
    cam.x = vw/2 - wx*cam.z; cam.y = vh/2 - wy*cam.z;
    applyCam(); noteActivity();
  };
  let down=false;
  canvas.addEventListener('pointerdown', e=>{ down=true; jump(e); });
  window.addEventListener('pointermove', e=>{ if(down) jump(e); });
  window.addEventListener('pointerup', ()=> down=false);
}
function paintMinimap(){
  const c = document.getElementById('mmCanvas');
  if(!c || !SET('minimap')) return;
  const g = c.getContext('2d');
  const sx = c.width/(FARM.w*T), sy = c.height/(FARM.h*T);
  g.clearRect(0,0,c.width,c.height);
  g.fillStyle = '#6f9f45'; g.fillRect(0,0,c.width,c.height);
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp], f = footprint(bp, o.rot);
    const col = {plot:'#8a6a4a', perennial:'#4f8a35', animal:'#c9a06a', water:'#4f93b5',
      power:'#26365c', process:'#a98fd6', shop:'#e2603a', tourism:'#dd6f9c', rec:'#efb43c',
      housing:'#c8583f', home:'#c3ccd2', hub:'#6fb6d8'}[bp.kind] || '#9aa88a';
    g.fillStyle = col;
    g.fillRect((o.tx-FARM.x)*T*sx, (o.ty-FARM.y)*T*sy, f.w*T*sx, f.h*T*sy);
  });
  /* where the camera is looking */
  const world = document.getElementById('world');
  const vx = (-cam.x/cam.z - FARM.x*T)*sx, vy = (-cam.y/cam.z - FARM.y*T)*sy;
  const vw = (world.clientWidth/cam.z)*sx, vh = (world.clientHeight/cam.z)*sy;
  g.strokeStyle = '#fff'; g.lineWidth = 1.5;
  g.strokeRect(Math.max(0,vx), Math.max(0,vy), Math.min(vw,c.width), Math.min(vh,c.height));
}

(function navigation(){
  const keys = {};
  window.addEventListener('keydown', e=>{
    if(e.target.tagName==='INPUT') return;
    const k = e.key.toLowerCase();
    if(['arrowup','arrowdown','arrowleft','arrowright'].includes(k)){ keys[k]=1; e.preventDefault(); }
  });
  window.addEventListener('keyup', e=> keys[e.key.toLowerCase()]=0);
  setInterval(()=>{
    if(!S) return;
    const sp = 26;
    let dx=0, dy=0;
    if(keys['arrowleft']) dx += sp;
    if(keys['arrowright']) dx -= sp;
    if(keys['arrowup']) dy += sp;
    if(keys['arrowdown']) dy -= sp;
    if(dx||dy){ cam.x += dx; cam.y += dy; applyCam(); noteActivity(); }
  }, 16);
})();

/* =====================================================================
   LAND RULES — grounded in real published guidance rather than invented
   numbers. Every figure below carries its source, shown in the Rules tab.
   Simplified for a game; not planning or legal advice.
   ===================================================================== */

/* One tile is a tenth of a hectare, so a 21x14 starter block is ~29 ha —
   about the size of a small working farm. */
const HA_PER_TILE = 0.1;
function farmHa(){ return +(FARM.w * FARM.h * HA_PER_TILE).toFixed(1); }
function farmAcres(){ return +(farmHa() * 2.4711).toFixed(1); }

/* ---------------------------------------------------------------
   Dry Sheep Equivalent — the standard Australian unit for comparing
   the feed demand of different stock.
   1 DSE = the feed a 2-year-old ~50 kg Merino wether needs to hold
   weight (7.60 MJ/day).
   Sources: MLA, Wikipedia (see SOURCES below).
   --------------------------------------------------------------- */
const DSE = {
  chicken:0.05,   // poultry are negligible against grazing stock
  duck:0.05,
  rabbit:0.06,
  sheep:1.0,      // the reference animal
  goat:1.0,       // a 50 kg dry goat ~ 1 DSE (MLA goat factsheet)
  hive:0,         // bees do not graze
  pig:2.5,
  horse:8,
  cow:8,          // a yearling steer ~ 8 DSE; a lactating cow up to 25
};
function dseOf(animal){ return DSE[animal] !== undefined ? DSE[animal] : 1; }
function farmDSE(){
  return +S.objs.reduce((a,o)=>{
    const bp = BPMAP[o.bp];
    return a + (bp.animal ? dseOf(bp.animal) * (o.animals||0) : 0);
  }, 0).toFixed(1);
}

/* Carrying capacity in DSE per hectare, by biome.
   Published NSW figures: 1.8–4.7 DSE/ha on natural pasture in the
   Northern Tablelands; 3–6 DSE/ha typical across the Hunter, and about
   8 DSE/ha on beef country under professional pasture management.
   The biome values below sit inside that published range. */
const DSE_PER_HA = {
  valley:6.0, orchard:5.5, river:6.0, lake:5.0, pond:5.0, forest:3.5,
  hill:4.0, coast:4.5, plateau:3.0, moor:2.0, mount:1.8, oasis:1.5,
};
function carryingCapacity(){
  const l = LANDMAP[S.landId];
  const base = (l && DSE_PER_HA[l.biome]) || 4;
  const c = country();
  /* pasture improvement from compost and fodder lifts what the land carries */
  const improved = 1
    + (S.objs.some(o=>o.bp==='compost') ? 0.25 : 0)
    + Math.min(0.4, S.objs.filter(o=>o.bp==='fodder').length * 0.2);
  return Math.round(farmHa() * base * improved * (c.pasture||1));
}
function stockPressure(){
  const cap = carryingCapacity();
  return cap > 0 ? farmDSE()/cap : 0;
}

/* ---------------------------------------------------------------
   Harvestable rights — in NSW's coastal and central inland-draining
   catchments a landholder may capture 10% of the average annual
   rainfall run-off from their land without a water access licence.
   --------------------------------------------------------------- */
const HARVEST_PCT = 0.10;
/* The game's litres are an abstraction — a tank holds 220 of them and
   watering a bed costs 8. So the right is expressed in those same units,
   sized so that three or four tanks is roughly your entitlement. The real
   figure depends on your catchment; the Rules tab links to the calculator
   rather than inventing a number. */
function harvestableRight(){
  const l = LANDMAP[S.landId] || {};
  return Math.round(farmHa() * 25 * (1 + (l.rain||0)) * (country().water||1));
}
function licensedStorage(){
  return S.objs.filter(o=>BPMAP[o.bp].kind==='water')
               .reduce((a,o)=>a + E.wcap(o), 0);
}

/* ---------------------------------------------------------------
   Stocking is now judged in DSE against carrying capacity, not a
   flat head count.
   --------------------------------------------------------------- */
stockLimit = function(){ return carryingCapacity(); };
if(typeof G.buyAnimal === 'function'){
  const _buy22 = G.buyAnimal;
  G.buyAnimal = function(id){
    const o = S.objs.find(z=>z.id===id); if(!o) return;
    const bp = BPMAP[o.bp];
    const addl = dseOf(bp.animal);
    if(farmDSE() + addl > carryingCapacity()){
      toast(`Over carrying capacity — ${farmDSE()} of ${carryingCapacity()} DSE`,'bad');
      sfx('error');
      log(`The land carries ${carryingCapacity()} DSE. Buy more land, or add compost and fodder to improve the pasture.`,'bad');
      return;
    }
    _buy22.call(G, id);
  };
}
/* overstocking degrades the pasture and the animals */
if(typeof advanceDay === 'function'){
  const _adv22 = advanceDay;
  advanceDay = function(){
    _adv22();
    const p = stockPressure();
    if(p > 1){
      S.objs.forEach(o=>{
        if(BPMAP[o.bp].kind!=='animal' || !o.herd) return;
        o.herd.forEach(a=>{ a.health = clamp(a.health - (p-1)*0.12, 0, 1); });
      });
      if(Math.random() < 0.3)
        log(`Overstocked at ${farmDSE()} DSE against ${carryingCapacity()} — condition is slipping.`,'bad');
    }
  };
}

/* =====================================================================
   SAVE INTEGRITY — the original save swallowed every error, so a failed
   write (quota, private browsing, a bad value) lost the farm silently.
   It now verifies the write and says so when it cannot.
   ===================================================================== */
(function hardenSave(){
  let lastGoodSave = 0, warned = false;

  G.save = function(loud){
    if(!S) return false;
    let json;
    try { json = JSON.stringify(S); }
    catch(e){
      warnSave('The farm could not be packaged for saving', e.message);
      return false;
    }
    try {
      localStorage.setItem('greenhollow', json);
      /* read it straight back — a write that cannot be re-read is not a save */
      const back = localStorage.getItem('greenhollow');
      if(!back || back.length !== json.length) throw new Error('written data did not read back');
      JSON.parse(back);
      lastGoodSave = Date.now(); warned = false;
      if(loud) toast('Saved','good');
      return true;
    } catch(e){
      /* out of room: drop the log, which is the only expendable part */
      if(String(e.name).includes('Quota') || String(e.message).toLowerCase().includes('quota')){
        try {
          const trimmed = {...S, log: S.log.slice(0,10)};
          localStorage.setItem('greenhollow', JSON.stringify(trimmed));
          lastGoodSave = Date.now();
          if(loud) toast('Saved (log trimmed to fit)','good');
          return true;
        } catch(e2){ /* fall through to the warning */ }
      }
      warnSave('Could not save', e.message);
      return false;
    }
  };

  function warnSave(what, detail){
    console.error('[greenhollow] ' + what + ': ' + detail);
    if(warned) return;
    warned = true;
    const mins = lastGoodSave ? Math.round((Date.now()-lastGoodSave)/60000) : null;
    toast(what + ' — your progress is at risk','bad');
    log(`${what}: ${detail}. ${mins!==null?`Last good save was ${mins} minute${mins===1?'':'s'} ago.`:'Nothing has been saved this session.'} Try Export below.`,'bad');
    sfx('error');
  }

  /* a way out if storage is unavailable: take the save with you */
  G.exportSave = function(){
    try{
      const blob = new Blob([JSON.stringify(S,null,1)], {type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `greenhollow-day${S.day}.json`;
      a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
      toast('Save exported','good');
    }catch(e){ toast('Could not export','bad'); }
  };
  G.importSave = function(){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='application/json';
    inp.onchange = ()=>{
      const f = inp.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        try{
          const d = JSON.parse(r.result);
          if(!d || d.v !== 5) return toast('That file is from a different version','bad');
          S = d;
          settingsInit(); careerInit(); youInit(); peopleInit();
          if(S.landId && LANDMAP[S.landId]) resizeLand(LANDMAP[S.landId]);
          S.objs.forEach(o=>{ if(o.tier===undefined) o.tier=0; initCare(o);
            if(BPMAP[o.bp].kind==='animal'){ if(!o.herd) o.herd=[]; syncHerd(o); } });
          bgToken=''; applyTheme(); render(); fitView(); ui();
          toast('Farm loaded','good');
        }catch(e){ toast('That file could not be read','bad'); }
      };
      r.readAsText(f);
    };
    inp.click();
  };

  /* offer them in Settings */
  const _sh = settingsHTML;
  settingsHTML = function(){
    return _sh() + `<div class="card">
      <div class="eyebrow">Your save</div>
      <div class="muted">Kept in this browser. Export a copy before clearing site data,
      or to move the farm to another machine.</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="chip" onclick="G.exportSave()">Export to file</button>
        <button class="chip" onclick="G.importSave()">Import a file</button>
        <button class="chip" onclick="G.save(1)">Save now</button>
      </div></div>`;
  };
})();

function hasRod(){ return S.objs.some(o=>o.bp==='lightning_rod'); }

function lightningStrike(){
  const world = document.getElementById('world');
  if(!world) return;
  let flash = document.getElementById('wxflash');
  if(!flash){ flash = document.createElement('div'); flash.id='wxflash'; world.appendChild(flash); }
  let bolt = document.getElementById('wxbolt');
  if(!bolt){ bolt = document.createElement('div'); bolt.id='wxbolt'; world.appendChild(bolt); }
  /* draw a jagged bolt somewhere across the sky */
  const W = world.clientWidth, H = world.clientHeight;
  let x = 60 + Math.random()*(W-120), y = 0, d = `M${x} 0`;
  while(y < H*0.62){ y += 18 + Math.random()*26; x += (Math.random()-0.5)*54; d += ` L${x.toFixed(0)} ${y.toFixed(0)}`; }
  bolt.innerHTML = `<svg width="100%" height="100%" style="display:block">
    <path d="${d}" stroke="#eaf3ff" stroke-width="3" fill="none" stroke-linejoin="round"
      style="filter:drop-shadow(0 0 8px #9fd0ff)"/>
    <path d="${d}" stroke="#fff" stroke-width="1.2" fill="none" stroke-linejoin="round"/></svg>`;
  flash.classList.remove('strike'); bolt.classList.remove('strike');
  void flash.offsetWidth;
  flash.classList.add('strike'); bolt.classList.add('strike');
  if(typeof SND!=='undefined') SND.play('thunder');
  setTimeout(()=>{ bolt.innerHTML=''; }, 1200);
}

function stormLightning(){
  if(S.weather !== 'storm') return;
  if(S.settings && S.settings.particles === false) return;
  lightningStrike();
  /* an unprotected farm can lose an animal — 40% of strikes that find stock */
  if(hasRod()){
    if(Math.random() < 0.3) log('Lightning struck the rod. Everything is fine.','good');
    return;
  }
  const pens = S.objs.filter(o=>BPMAP[o.bp].kind==='animal' && o.animals>0 && BPMAP[o.bp].animal!=='hive');
  if(!pens.length) return;
  if(Math.random() < 0.40){
    const pen = pens[Math.floor(Math.random()*pens.length)];
    pen.animals--; syncHerd(pen);
    S.morale = clamp((S.morale||0.6)-0.06, 0, 1);
    log(`Lightning struck the ${BPMAP[pen.bp].name} — one ${BPMAP[pen.bp].animal} killed. A lightning rod would have stopped it.`,'bad');
    toast(`A ${BPMAP[pen.bp].animal} was killed by lightning`,'bad');
    render(); ui();
  } else {
    log('Lightning came down close to the stock. No losses this time.','bad');
  }
}

/* ---------------------------------------------------------------
   3. THE JITTER — parallax ran on every camera move, writing SVG
      transforms mid-pan. It now rides the animation frame instead.
   --------------------------------------------------------------- */
(function steadyCamera(){
  let pending = false, lastPx = 0, lastPy = 0;
  const realParallax = (typeof parallax==='function') ? parallax : null;
  parallax = function(){
    if(!realParallax || pending) return;
    pending = true;
    requestAnimationFrame(()=>{
      pending = false;
      /* only move the backdrop when the camera has actually moved a bit */
      if(Math.abs(cam.x-lastPx) < 2 && Math.abs(cam.y-lastPy) < 2) return;
      lastPx = cam.x; lastPy = cam.y;
      realParallax();
    });
  };
  /* snap camera values so sub-pixel transforms stop shimmering */
  const _applyCam = applyCam;
  applyCam = function(){
    cam.x = Math.round(cam.x*2)/2;
    cam.y = Math.round(cam.y*2)/2;
    _applyCam();
  };
})();

   --------------------------------------------------------------- */
const BRUSH = {on:false, painting:false, laid:0, last:null};
G.pathBrush = function(){
  BRUSH.on = !BRUSH.on;
  if(BRUSH.on) G.cancel();
  document.body.classList.toggle('brushing', BRUSH.on);
  const b = document.getElementById('brushBtn');
  if(b) b.classList.toggle('on', BRUSH.on);
  toast(BRUSH.on ? 'Path brush on — drag to lay gravel' : 'Path brush off', BRUSH.on?'good':'');
  sfx('click');
  ui();
};
let brushRenderQueued = false;
function queueBrushRender(){
  if(brushRenderQueued) return;
  brushRenderQueued = true;
  requestAnimationFrame(()=>{ brushRenderQueued = false; render(); });
}
function layTile(tx, ty){
  const bp = BPMAP.path1;
  if(!bp) return false;
  if(tx<FARM.x || ty<FARM.y || tx>=FARM.x+FARM.w || ty>=FARM.y+FARM.h) return false;
  if(overlaps(tx, ty, {w:1,h:1}, 0)) return false;
  if(S.cash < bp.cost){
    if(BRUSH.painting){ BRUSH.painting = false; toast('Out of cash for gravel','bad'); sfx('error'); }
    return false;
  }
  place('path1', tx, ty, 0);
  BRUSH.laid++;
  return true;
}
/* Walk every tile between the last point and this one, so a fast drag
   leaves an unbroken path instead of dots. */
function paintPathAt(clientX, clientY){
  const t = screenToTile(clientX, clientY);
  const from = BRUSH.last;
  let painted = false;
  if(from && (from.tx !== t.tx || from.ty !== t.ty)){
    const dx = t.tx-from.tx, dy = t.ty-from.ty;
    const steps = Math.max(Math.abs(dx), Math.abs(dy));
    for(let i=1; i<=steps; i++){
      const x = Math.round(from.tx + dx*i/steps);
      const y = Math.round(from.ty + dy*i/steps);
      if(layTile(x, y)) painted = true;
    }
  } else if(!from){
    if(layTile(t.tx, t.ty)) painted = true;
  }
  BRUSH.last = {tx:t.tx, ty:t.ty};
  if(painted) queueBrushRender();
}

(function brushInput(){
  const world = document.getElementById('world');
  if(!world) return;
  world.addEventListener('pointerdown', e=>{
    if(!BRUSH.on || e.button!==0) return;
    e.stopPropagation();
    BRUSH.painting = true; BRUSH.laid = 0; BRUSH.last = null;
    paintPathAt(e.clientX, e.clientY);
  }, true);
  window.addEventListener('pointermove', e=>{
    if(!BRUSH.on || !BRUSH.painting) return;
    paintPathAt(e.clientX, e.clientY);
  });
  window.addEventListener('pointerup', ()=>{
    if(!BRUSH.painting) return;

    if(e.target.tagName==='INPUT') return;
    if(e.key.toLowerCase()==='b') G.pathBrush();
    if(e.key==='Escape' && BRUSH.on) G.pathBrush();

  if(z && !document.getElementById('brushBtn')){

})();
