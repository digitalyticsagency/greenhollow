<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Greenhollow — Homestead Land Planner</title>
<style>
/* ============================ BASE ============================ */
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#12180f; --bg2:#1a2215; --panel:#1e2718; --panel2:#26311d;
  --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.16);
  --ink:#e9efe0; --ink2:#a7b79a; --ink3:#75886a;
  --gold:#f0c14b; --green:#7cc24f; --green2:#4d8f3c;
  --blue:#6fb6d8; --red:#e2705c; --amber:#e8a33d; --violet:#a98fd6;
  --r:10px; --shadow:0 10px 34px rgba(0,0,0,.45);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif;
}
html,body{height:100%;}
body{
  font-family:var(--font); background:var(--bg); color:var(--ink);
  font-size:13px; line-height:1.45; overflow:hidden;
  -webkit-font-smoothing:antialiased; user-select:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:rgba(0,0,0,.25);}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);border-radius:5px;}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.26);}

/* ============================ SHELL ============================ */
#app{display:grid;grid-template-rows:auto 1fr;height:100%;}
#stage{display:grid;grid-template-columns:250px 1fr 288px;min-height:0;}

/* ---------- top bar ---------- */
#top{
  display:flex;align-items:center;gap:10px;padding:8px 12px;
  background:linear-gradient(180deg,#232d1b,#18200f);
  border-bottom:1px solid var(--line2);box-shadow:0 4px 18px rgba(0,0,0,.4);z-index:60;
}
.brand{display:flex;align-items:center;gap:9px;padding-right:12px;border-right:1px solid var(--line);}
.brand .mk{width:30px;height:30px;flex:none;}
.brand h1{font-size:14.5px;font-weight:700;letter-spacing:.2px;line-height:1.1;}
.brand span{display:block;font-size:10px;color:var(--ink3);font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
.stats{display:flex;gap:6px;flex-wrap:wrap;flex:1;min-width:0;}
.stat{
  display:flex;align-items:center;gap:6px;padding:4px 9px;border-radius:8px;
  background:rgba(255,255,255,.055);border:1px solid var(--line);cursor:help;white-space:nowrap;
  transition:background .15s,border-color .15s;
}
.stat:hover{background:rgba(255,255,255,.1);border-color:var(--line2);}
.stat .ic{width:15px;height:15px;flex:none;}
.stat b{font-size:12.5px;font-variant-numeric:tabular-nums;}
.stat small{color:var(--ink3);font-size:10px;}
.stat.warn{border-color:rgba(226,112,92,.55);background:rgba(226,112,92,.12);}
.xpwrap{width:74px;height:4px;border-radius:3px;background:rgba(0,0,0,.45);overflow:hidden;}
.xpwrap i{display:block;height:100%;width:100%;transform-origin:left center;
  background:linear-gradient(90deg,var(--green2),var(--green));transition:transform .35s cubic-bezier(.16,1,.3,1);}
.tools{display:flex;gap:5px;align-items:center;}
.tbtn{
  padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  font-size:11.5px;font-weight:600;transition:.15s;display:flex;align-items:center;gap:5px;
}
.tbtn:hover{background:rgba(255,255,255,.12);border-color:var(--line2);}
.tbtn.on{background:linear-gradient(180deg,#4d8f3c,#3a6f2c);border-color:#5fae48;color:#fff;}
.tbtn.danger:hover{background:rgba(226,112,92,.2);border-color:rgba(226,112,92,.6);}

/* ---------- panels ---------- */
.panel{background:var(--panel);display:flex;flex-direction:column;min-height:0;}
#left{border-right:1px solid var(--line2);}
#right{border-left:1px solid var(--line2);}
.ph{
  padding:8px 11px;font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink3);border-bottom:1px solid var(--line);background:rgba(0,0,0,.22);
  display:flex;align-items:center;justify-content:space-between;gap:6px;flex:none;
}
.pb{overflow-y:auto;flex:1;min-height:0;}

/* build categories */
.cats{display:flex;flex-wrap:wrap;gap:3px;padding:7px 8px;border-bottom:1px solid var(--line);flex:none;}
.cat{
  padding:3.5px 7px;border-radius:6px;font-size:10.5px;font-weight:600;color:var(--ink2);
  border:1px solid transparent;transition:.14s;
}
.cat:hover{background:rgba(255,255,255,.08);color:var(--ink);}
.cat.on{background:rgba(124,194,79,.18);border-color:rgba(124,194,79,.5);color:#cdeeb0;}

/* build items */
.bitem{
  display:flex;gap:8px;align-items:center;padding:7px 9px;border-bottom:1px solid rgba(255,255,255,.05);
  cursor:pointer;transition:background .14s;position:relative;
}
.bitem:hover{background:rgba(255,255,255,.07);}
.bitem.sel{background:rgba(124,194,79,.16);box-shadow:inset 2px 0 0 var(--green);}
.bitem.locked{opacity:.42;cursor:not-allowed;}
.bitem.poor .cost{color:var(--red);}
.bth{width:46px;height:36px;flex:none;display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,.3);border-radius:7px;border:1px solid var(--line);overflow:hidden;}
.bth svg{display:block;filter:drop-shadow(1px 2px 2px rgba(0,0,0,.5));}
.bmeta{flex:1;min-width:0;}
.bmeta b{display:block;font-size:11.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.bmeta .sub{font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cost{font-size:11px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;flex:none;}
.lockb{font-size:9px;color:var(--ink3);flex:none;}

/* ---------- world ---------- */
#world{position:relative;overflow:hidden;background:#0d1209;min-width:0;}
#viewport{position:absolute;inset:0;cursor:grab;}
#viewport.panning{cursor:grabbing;}
#viewport.placing{cursor:crosshair;}
#scene{position:absolute;left:0;top:0;transform-origin:0 0;}
#scene svg{display:block;}
.wbadge{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:30;
  padding:6px 14px;border-radius:20px;background:rgba(10,16,8,.86);border:1px solid var(--line2);
  font-size:11.5px;font-weight:600;backdrop-filter:blur(8px);pointer-events:none;
  display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);
}
.wbadge kbd{
  background:rgba(255,255,255,.14);border-radius:4px;padding:1px 5px;font-size:10px;
  font-family:var(--font);border:1px solid var(--line2);
}
#zoomctl{position:absolute;right:12px;bottom:12px;z-index:30;display:flex;flex-direction:column;gap:5px;}
#zoomctl button{
  width:32px;height:32px;border-radius:9px;background:rgba(10,16,8,.86);border:1px solid var(--line2);
  font-size:15px;font-weight:700;backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;
  transition:.15s;
}
#zoomctl button:hover{background:rgba(124,194,79,.3);}
#daynight{position:absolute;inset:0;pointer-events:none;z-index:20;transition:background 2s linear, opacity 2s;}

/* floating world labels */
.wlabels{position:absolute;left:0;top:0;pointer-events:none;z-index:15;}
.wlab{
  position:absolute;white-space:nowrap;font-size:9.5px;font-weight:700;padding:1.5px 6px;border-radius:6px;
  background:rgba(12,18,9,.82);color:#e9efe0;border:1px solid rgba(255,255,255,.2);
  box-shadow:0 2px 6px rgba(0,0,0,.4);transform:translateX(-50%);
}
.wlab.alert{background:rgba(226,112,92,.9);border-color:#ffb3a3;color:#fff;}
.wlab.ready{background:rgba(124,194,79,.92);border-color:#d5f5b8;color:#12180f;}

/* ---------- inspector ---------- */
.insp{padding:10px 11px;}
.insp .title{display:flex;gap:9px;align-items:center;margin-bottom:9px;}
.insp .title .th{width:52px;height:42px;flex:none;background:rgba(0,0,0,.3);border-radius:8px;
  border:1px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.insp h3{font-size:14px;font-weight:700;line-height:1.15;}
.insp .tsub{font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;}
.insp p.desc{font-size:11px;color:var(--ink2);margin-bottom:9px;}
.rows{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;
  padding:4px 7px;border-radius:6px;background:rgba(255,255,255,.045);}
.row span{color:var(--ink3);}
.row b{font-variant-numeric:tabular-nums;}
.bar{height:6px;border-radius:4px;background:rgba(0,0,0,.5);overflow:hidden;margin-top:3px;}
.bar i{display:block;height:100%;width:100%;transform-origin:left center;
  transition:transform .3s cubic-bezier(.16,1,.3,1);}
.acts{display:flex;flex-wrap:wrap;gap:5px;}
.act{
  flex:1 1 calc(50% - 3px);padding:7px 8px;border-radius:8px;font-size:11.5px;font-weight:600;
  border:1px solid var(--line2);background:rgba(255,255,255,.07);transition:.15s;text-align:center;
}
.act:hover:not(:disabled){background:rgba(124,194,79,.24);border-color:var(--green);}
.act:disabled{opacity:.38;cursor:not-allowed;}
.act.primary{background:linear-gradient(180deg,#4d8f3c,#39702c);border-color:#5fae48;}
.act.primary:hover:not(:disabled){background:linear-gradient(180deg,#5fae48,#468638);}
.act.danger{background:rgba(226,112,92,.14);border-color:rgba(226,112,92,.45);}
.act.danger:hover:not(:disabled){background:rgba(226,112,92,.3);}
.act.full{flex:1 1 100%;}
.empty{padding:22px 14px;text-align:center;color:var(--ink3);font-size:11.5px;}
.empty svg{opacity:.35;margin-bottom:8px;}

/* seed chooser */
.seeds{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.seed{
  padding:6px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  text-align:left;transition:.14s;
}
.seed:hover:not(:disabled){background:rgba(124,194,79,.2);border-color:var(--green);}
.seed:disabled{opacity:.35;cursor:not-allowed;}
.seed b{display:block;font-size:11px;}
.seed small{color:var(--ink3);font-size:9.5px;display:block;line-height:1.3;}

/* market / storage */
.mrow{display:flex;align-items:center;gap:7px;padding:5px 10px;border-bottom:1px solid rgba(255,255,255,.05);font-size:11.5px;}
.mrow .gi{width:20px;height:20px;flex:none;}
.mrow .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow .qt{font-weight:700;font-variant-numeric:tabular-nums;min-width:26px;text-align:right;}
.mrow .pr{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;min-width:40px;text-align:right;font-size:11px;}
.mrow .trend{font-size:9px;font-weight:700;min-width:16px;}
.up{color:var(--green);} .down{color:var(--red);}
.sellb{padding:3px 8px;border-radius:6px;background:rgba(240,193,75,.16);border:1px solid rgba(240,193,75,.42);
  font-size:10.5px;font-weight:700;color:var(--gold);transition:.14s;}
.sellb:hover{background:rgba(240,193,75,.3);}

/* contracts */
.ctr{padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.06);}
.ctr .ch{display:flex;justify-content:space-between;gap:6px;align-items:baseline;margin-bottom:3px;}
.ctr .cn{font-size:11.5px;font-weight:600;}
.ctr .cr{font-size:11.5px;font-weight:700;color:var(--gold);}
.ctr .cd{font-size:10px;color:var(--ink3);margin-bottom:4px;}
.ctr .cf{display:flex;gap:6px;align-items:center;}
.ctr .cf .bar{flex:1;margin:0;}
.ctr.done{background:rgba(124,194,79,.1);}

/* log */
#log{max-height:150px;overflow-y:auto;}
.lg{padding:4px 10px;font-size:10.5px;color:var(--ink2);border-bottom:1px solid rgba(255,255,255,.04);
  display:flex;gap:6px;}
.lg time{color:var(--ink3);flex:none;font-variant-numeric:tabular-nums;}
.lg.good{color:#b9e69a;} .lg.bad{color:#f0a898;} .lg.gold{color:#f3d68a;}

/* tabs inside a panel */
.ptabs{display:flex;border-bottom:1px solid var(--line);flex:none;background:rgba(0,0,0,.2);}
.ptab{flex:1;padding:7px 4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
  color:var(--ink3);border-bottom:2px solid transparent;transition:.14s;}
.ptab:hover{color:var(--ink);}
.ptab.on{color:var(--green);border-bottom-color:var(--green);background:rgba(124,194,79,.08);}

/* tier badge */
.tierbadge{display:inline-block;padding:0 5px;border:1px solid;border-radius:5px;font-size:9px;
  font-weight:800;letter-spacing:.05em;margin-right:5px;vertical-align:1px;}
/* automation module cards */
.aumod{padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;gap:9px;align-items:flex-start;}
.aumod .ai{font-size:19px;line-height:1;flex:none;width:24px;text-align:center;}
.aumod .am{flex:1;min-width:0;}
.aumod .am b{font-size:12px;display:block;}
.aumod .am small{font-size:10px;color:var(--ink3);display:block;line-height:1.35;}
.aumod.off{opacity:.5;}
.aumod.lock{opacity:.4;}
.sw{width:38px;height:21px;border-radius:11px;background:rgba(255,255,255,.14);position:relative;flex:none;
  transition:background .18s;border:1px solid var(--line2);cursor:pointer;}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;
  background:#cfd8c6;transition:transform .18s cubic-bezier(.16,1,.3,1);}
.sw.on{background:linear-gradient(90deg,#3f7f34,#5fae48);border-color:#5fae48;}
.sw.on::after{transform:translateX(17px);background:#fff;}
.sw:disabled{cursor:not-allowed;}
.aurow{display:flex;justify-content:space-between;font-size:11px;padding:5px 10px;
  border-bottom:1px solid rgba(255,255,255,.05);}
.aurow b{font-variant-numeric:tabular-nums;}
input[type=range]{width:100%;accent-color:#7cc24f;}

/* ---------- tooltip ---------- */
#tip{
  position:fixed;z-index:9999;max-width:260px;padding:8px 10px;border-radius:9px;pointer-events:none;
  background:rgba(9,14,7,.96);border:1px solid var(--line2);box-shadow:0 12px 34px rgba(0,0,0,.6);
  font-size:11.5px;line-height:1.42;opacity:0;transform:translateY(4px);transition:opacity .12s,transform .12s;
  backdrop-filter:blur(10px);
}
#tip.show{opacity:1;transform:translateY(0);}
#tip b{color:#fff;font-size:12.5px;display:block;margin-bottom:2px;}
#tip .tk{color:var(--gold);font-weight:700;}
#tip .tg{color:var(--ink3);font-size:10.5px;}
#tip hr{border:0;border-top:1px solid var(--line);margin:5px 0;}
#tip .tl{display:flex;justify-content:space-between;gap:10px;}
#tip .warn{color:#f0a898;}

/* ---------- toasts ---------- */
#toasts{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:9000;
  display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;}
.toast{
  padding:8px 15px;border-radius:22px;background:rgba(12,18,9,.94);border:1px solid var(--line2);
  font-size:12px;font-weight:600;box-shadow:var(--shadow);animation:tin .34s cubic-bezier(.16,1,.3,1);
  display:flex;gap:8px;align-items:center;backdrop-filter:blur(8px);
}
.toast.good{border-color:rgba(124,194,79,.6);color:#cdeeb0;}
.toast.bad{border-color:rgba(226,112,92,.6);color:#f3b3a5;}
.toast.gold{border-color:rgba(240,193,75,.6);color:#f5dc9d;}
@keyframes tin{from{opacity:0;transform:translateY(14px) scale(.94)}to{opacity:1;transform:none}}
.floatnum{
  position:fixed;z-index:9500;pointer-events:none;font-weight:800;font-size:14px;
  text-shadow:0 2px 6px rgba(0,0,0,.8);animation:fnum 1.15s ease-out forwards;
}
@keyframes fnum{0%{opacity:0;transform:translateY(0) scale(.7)}
  18%{opacity:1;transform:translateY(-8px) scale(1.1)}100%{opacity:0;transform:translateY(-40px) scale(1)}}

/* ---------- modal ---------- */
.mback{position:fixed;inset:0;background:rgba(6,10,5,.78);z-index:9800;display:none;
  align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(6px);}
.mback.show{display:flex;}
.modal{
  width:min(680px,100%);max-height:86vh;overflow-y:auto;background:linear-gradient(180deg,#212b19,#18200f);
  border:1px solid var(--line2);border-radius:16px;padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.7);
}
.modal h2{font-size:20px;margin-bottom:5px;}
.modal .sub{color:var(--ink3);font-size:12px;margin-bottom:16px;}
.modal h4{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--green);margin:14px 0 6px;}
.modal p,.modal li{font-size:12.5px;color:var(--ink2);margin-bottom:5px;}
.modal ul{padding-left:18px;}
.modal kbd{background:rgba(255,255,255,.12);border:1px solid var(--line2);border-radius:4px;
  padding:1px 6px;font-size:11px;font-family:var(--font);color:var(--ink);}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:9px;margin-top:8px;}
.mcard{padding:10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line);}
.mcard b{display:block;font-size:12.5px;margin-bottom:3px;}
.mcard small{font-size:10.5px;color:var(--ink3);}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;}
.mbtn{padding:9px 20px;border-radius:10px;font-weight:700;font-size:13px;
  background:linear-gradient(180deg,#4d8f3c,#39702c);border:1px solid #5fae48;transition:.15s;}
.mbtn:hover{background:linear-gradient(180deg,#5fae48,#468638);}
.mbtn.ghost{background:rgba(255,255,255,.07);border-color:var(--line2);}
.mbtn.ghost:hover{background:rgba(255,255,255,.14);}

/* ---------- mobile ---------- */
#mobtabs{display:none;}
@media(max-width:980px){
  #stage{grid-template-columns:1fr;grid-template-rows:1fr auto;}
  #left,#right{position:absolute;left:0;right:0;bottom:38px;top:auto;max-height:52vh;z-index:70;
    border:0;border-top:1px solid var(--line2);display:none;box-shadow:0 -12px 40px rgba(0,0,0,.6);}
  #left.open,#right.open{display:flex;}
  #world{grid-row:1;}
  #mobtabs{display:flex;grid-row:2;background:var(--panel2);border-top:1px solid var(--line2);z-index:80;}
  #mobtabs button{flex:1;padding:9px 4px;font-size:11px;font-weight:700;color:var(--ink3);}
  #mobtabs button.on{color:var(--green);background:rgba(124,194,79,.12);}
  .stats{overflow-x:auto;flex-wrap:nowrap;}
  .brand h1{display:none;} .brand span{display:none;}
}
</style>
</head>
<body>

<div id="app">

  <!-- ======================= TOP BAR ======================= -->
  <header id="top">
    <div class="brand">
      <svg class="mk" viewBox="0 0 40 40"><circle cx="20" cy="20" r="19" fill="#2f5d24" stroke="#7cc24f" stroke-width="2"/>
        <path d="M20 30c0-7 0-11 0-11" stroke="#cdeeb0" stroke-width="2" stroke-linecap="round"/>
        <path d="M20 21c-6 0-9-4-9-9 6 0 9 3 9 9z" fill="#7cc24f"/>
        <path d="M20 24c5 0 8-3 8-8-5 0-8 3-8 8z" fill="#a5d97e"/></svg>
      <div><h1>Greenhollow</h1><span>Homestead Planner</span></div>
    </div>

    <div class="stats" id="stats"></div>

    <div class="tools">
      <button class="tbtn" id="spd1" onclick="G.setSpeed(0)" data-tip="<b>Pause</b>Freeze the clock while you plan.<span class='tg'>Key: Space</span>">❚❚</button>
      <button class="tbtn on" id="spd2" onclick="G.setSpeed(1)" data-tip="<b>Normal speed</b>One farm day every 45 seconds.<span class='tg'>Key: 1</span>">▶</button>
      <button class="tbtn" id="spd3" onclick="G.setSpeed(3)" data-tip="<b>Fast forward</b>Three times faster — good while crops grow.<span class='tg'>Key: 2</span>">▶▶</button>
      <button class="tbtn on" id="sndBtn" onclick="G.toggleSound()" data-tip="<b>Sound</b>Farm ambience, weather, music and action sounds.<span class='tg'>Key: M</span>">🔊</button>
      <button class="tbtn" onclick="G.openHelp()" data-tip="<b>How to play</b>Controls, goals and the money loop.<span class='tg'>Key: H</span>">?</button>
      <button class="tbtn" onclick="G.save(1)" data-tip="<b>Save now</b>Your farm also autosaves every 20 seconds.">💾</button>
      <button class="tbtn danger" onclick="G.confirmReset()" data-tip="<b>New farm</b>Wipes this farm and starts fresh.">⟲</button>
    </div>
  </header>

  <div id="stage">

    <!-- ======================= LEFT: BUILD ======================= -->
    <aside class="panel" id="left">
      <div class="ph"><span>Build &amp; Place</span><span id="buildHint" style="color:var(--green)"></span></div>
      <div class="cats" id="cats"></div>
      <div class="pb" id="buildList"></div>
    </aside>

    <!-- ======================= CENTER: WORLD ======================= -->
    <main id="world">
      <div id="viewport">
        <div id="scene"></div>
        <div class="wlabels" id="wlabels"></div>
      </div>
      <div id="daynight"></div>
      <div class="wbadge" id="wbadge"></div>
      <div id="zoomctl">
        <button onclick="G.zoom(.2)" data-tip="Zoom in">+</button>
        <button onclick="G.zoom(-.2)" data-tip="Zoom out">−</button>
        <button onclick="G.fit()" data-tip="Fit the whole property on screen">⤢</button>
      </div>
    </main>

    <!-- ======================= RIGHT: INSPECTOR ======================= -->
    <aside class="panel" id="right">
      <div class="ptabs">
        <button class="ptab on" data-rt="insp" data-tip="<b>Inspector</b>Details and actions for whatever you select on the land.">Selected</button>
        <button class="ptab" data-rt="market" data-tip="<b>Barn &amp; market</b>Everything you've harvested, and what it sells for today.">Market</button>
        <button class="ptab" data-rt="jobs" data-tip="<b>Contracts</b>Standing orders from the village. Fill them before they expire.">Orders</button>
        <button class="ptab" data-rt="auto" data-tip="<b>Automation</b>The AI modules your control hub runs each morning.">AI</button>
      </div>
      <div class="pb" id="rightBody"></div>
      <div class="ph" style="border-top:1px solid var(--line)">Farm log</div>
      <div id="log"></div>
    </aside>

  </div>

  <div id="mobtabs">
    <button class="on" onclick="G.mobTab('world',this)">Land</button>
    <button onclick="G.mobTab('left',this)">Build</button>
    <button onclick="G.mobTab('right',this)">Manage</button>
  </div>
</div>

<div id="tip"></div>
<div id="toasts"></div>
<div class="mback" id="modal"><div class="modal" id="modalBody"></div></div>

<script>

/* =====================================================================
   ART — shared material defs + drawn components
   Sun is fixed at upper-left: highlights on top/left edges, cast shadows
   down/right. Every component draws in local space (0,0 → w,h) so the
   engine can rotate it freely.
   ===================================================================== */
const ART = {};
const T = 40;                       // pixels per land tile

function n(v){ return Math.round(v*10)/10; }
function hash(i){ const x = Math.sin(i*127.1)*43758.5453; return x - Math.floor(x); }

/* ---------------- shared <defs> ---------------- */
function DEFS(){
  return `<defs>
  <filter id="fGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
  </filter>
  <filter id="fRough" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="4" seed="3" result="t"/>
    <feDisplacementMap in="SourceGraphic" in2="t" scale="3" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
  <filter id="fDrop" x="-40%" y="-40%" width="200%" height="220%">
    <feDropShadow dx="2.5" dy="4" stdDeviation="2.2" flood-color="#0d1607" flood-opacity="0.45"/>
  </filter>
  <filter id="fSoft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="3"/>
  </filter>
  <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>

  <linearGradient id="gLawn" x1="0.1" y1="0" x2="0.65" y2="1">
    <stop offset="0" stop-color="#88b25c"/><stop offset="0.45" stop-color="#74a04b"/><stop offset="1" stop-color="#5d8a3c"/></linearGradient>
  <linearGradient id="gMeadow" x1="0" y1="0" x2="0.5" y2="1">
    <stop offset="0" stop-color="#c3b982"/><stop offset="1" stop-color="#a49b69"/></linearGradient>
  <linearGradient id="gSoil" x1="0.2" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#7a5a3f"/><stop offset="0.5" stop-color="#63482f"/><stop offset="1" stop-color="#4c3624"/></linearGradient>
  <linearGradient id="gSoilWet" x1="0.2" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#5b4028"/><stop offset="1" stop-color="#3a2818"/></linearGradient>
  <linearGradient id="gRoof" x1="0.05" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#a3aeb4"/><stop offset="0.4" stop-color="#8a959b"/><stop offset="1" stop-color="#6a747a"/></linearGradient>
  <linearGradient id="gRoofRed" x1="0.05" y1="0" x2="0.55" y2="1">
    <stop offset="0" stop-color="#bd6455"/><stop offset="0.5" stop-color="#a1503f"/><stop offset="1" stop-color="#7e3b2e"/></linearGradient>
  <linearGradient id="gTimber" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#bb8b57"/><stop offset="0.55" stop-color="#a1743f"/><stop offset="1" stop-color="#7d5931"/></linearGradient>
  <linearGradient id="gSolar" x1="0.1" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#38507f"/><stop offset="0.35" stop-color="#22304f"/><stop offset="1" stop-color="#161f36"/></linearGradient>
  <linearGradient id="gGravel" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#d3c7a8"/><stop offset="1" stop-color="#b6a988"/></linearGradient>
  <linearGradient id="gGlass" x1="0.05" y1="0" x2="0.6" y2="1">
    <stop offset="0" stop-color="#e6f6fa"/><stop offset="0.45" stop-color="#c2e0e9"/><stop offset="1" stop-color="#9dc2ce"/></linearGradient>
  <linearGradient id="gStone" x1="0" y1="0" x2="0.4" y2="1">
    <stop offset="0" stop-color="#adа59a"/><stop offset="1" stop-color="#857e73"/></linearGradient>
  <radialGradient id="gWater" cx="0.36" cy="0.3" r="0.78">
    <stop offset="0" stop-color="#8fd0e8"/><stop offset="0.4" stop-color="#4f93b5"/>
    <stop offset="0.85" stop-color="#2f6d90"/><stop offset="1" stop-color="#255madjust"/></radialGradient>
  <radialGradient id="gCanopy" cx="0.34" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#79b356"/><stop offset="0.45" stop-color="#4f8c38"/>
    <stop offset="0.85" stop-color="#356523"/><stop offset="1" stop-color="#274c19"/></radialGradient>
  <radialGradient id="gCanopyD" cx="0.34" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#5f9c48"/><stop offset="0.5" stop-color="#3c7530"/><stop offset="1" stop-color="#21451a"/></radialGradient>
  <radialGradient id="gCanopyO" cx="0.34" cy="0.28" r="0.8">
    <stop offset="0" stop-color="#9ab86a"/><stop offset="0.5" stop-color="#6f9448"/><stop offset="1" stop-color="#456029"/></radialGradient>
  <linearGradient id="gHedge" x1="0" y1="0" x2="0.3" y2="1">
    <stop offset="0" stop-color="#5b9440"/><stop offset="0.5" stop-color="#3f6f2c"/><stop offset="1" stop-color="#27491c"/></linearGradient>
  <linearGradient id="gTank" x1="0" y1="0" x2="0.7" y2="1">
    <stop offset="0" stop-color="#6d9a67"/><stop offset="0.5" stop-color="#4e7a4c"/><stop offset="1" stop-color="#365a36"/></linearGradient>
  <linearGradient id="gHaze" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfe0ea" stop-opacity="0.45"/>
    <stop offset="0.22" stop-color="#cfe0ea" stop-opacity="0.10"/>
    <stop offset="0.5" stop-color="#cfe0ea" stop-opacity="0"/>
    <stop offset="0.8" stop-color="#cfe0ea" stop-opacity="0.10"/>
    <stop offset="1" stop-color="#cfe0ea" stop-opacity="0.4"/></linearGradient>
  <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.5"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  </defs>`.replace('#adа59a','#ada59a').replace('#255madjust','#255d7c');
}

/* ---------------- primitives ---------------- */

/* ambient-occlusion contact shadow under an object */
function ao(x,y,w,h,o){
  return `<ellipse cx="${n(x+w/2+w*0.06)}" cy="${n(y+h*0.94)}" rx="${n(w*0.52)}" ry="${n(h*0.2)}"
    fill="#16240c" opacity="${o||0.34}" filter="url(#fSoft)"/>`;
}
/* grain overlay clipped to a shape via a rect (cheap texture) */
function grain(x,y,w,h,o){
  return `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" filter="url(#fGrain)"
    opacity="${o||0.13}" style="mix-blend-mode:overlay" pointer-events="none"/>`;
}
/* organic ground patch */
function patch(w,h,fill,seed,inset){
  inset = inset||1;
  const pts=[], N=16;
  for(let i=0;i<N;i++){
    const a=(i/N)*Math.PI*2, wob=0.88+hash(seed*5+i)*0.14;
    pts.push([n(w/2+Math.cos(a)*(w/2-inset)*wob), n(h/2+Math.sin(a)*(h/2-inset)*wob)]);
  }
  let d=`M${pts[0][0]} ${pts[0][1]}`;
  for(let i=1;i<=N;i++){
    const p=pts[i%N], q=pts[(i+1)%N];
    d+=` Q${p[0]} ${p[1]} ${n((p[0]+q[0])/2)} ${n((p[1]+q[1])/2)}`;
  }
  return `<path d="${d}Z" fill="${fill}"/>`;
}

/* pitched-roof building, lit from upper left.
   Reads as a building at small sizes: eave overhang shadow, two roof planes
   meeting at a lit ridge, gable-end shading, gutter, wall band with a door. */
function building(w,h,o){
  o=o||{};
  const roof=o.roof||'url(#gRoof)', wall=o.wall||'url(#gTimber)';
  const skirt = o.skirt===0 ? 0 : Math.max(4, Math.min(7, h*0.13));
  const m = 1.2;
  const bh = h - skirt;               // roof block
  const ridge = m + (bh-m)*0.47;
  const tier = o.tier||0;
  /* long soft cast shadow, sun from upper left */
  let s = `<rect x="${n(m+w*0.055)}" y="${n(m+h*0.09)}" width="${n(w-2*m)}" height="${n(h-m)}" rx="3"
    fill="#16240c" opacity=".34" filter="url(#fSoft)"/>`;

  /* wall band under the eave, with a door and windows */
  if(skirt>0){
    s += `<rect x="${n(m+1.5)}" y="${n(bh-2)}" width="${n(w-2*m-3)}" height="${n(skirt+2)}" rx="1.5" fill="${wall}"/>`;
    s += `<rect x="${n(m+1.5)}" y="${n(bh-2)}" width="${n(w-2*m-3)}" height="2" fill="#000" opacity=".3"/>`;
    const dw = Math.min(9, w*0.12);
    s += `<rect x="${n(w*0.5-dw/2)}" y="${n(bh+0.4)}" width="${n(dw)}" height="${n(skirt-0.8)}" rx="0.8" fill="#4b3520"/>`;
    for(let k=0;k<2;k++){
      const wx = w*(0.2+k*0.55), ww = Math.min(8,w*0.1), wh = skirt-2.4;
      s += `<rect x="${n(wx)}" y="${n(bh+1)}" width="${n(ww)}" height="${n(wh)}" rx="0.6" fill="#4a6470"/>`;
      s += `<rect x="${n(wx)}" y="${n(bh+1)}" width="${n(ww)}" height="${n(wh)}" rx="0.6" fill="url(#gGlass)" opacity=".8"/>`;
      /* diagonal reflection streak across the glass */
      s += `<polygon points="${n(wx)},${n(bh+1+wh)} ${n(wx+ww*0.55)},${n(bh+1)} ${n(wx+ww*0.85)},${n(bh+1)} ${n(wx+ww*0.3)},${n(bh+1+wh)}"
        fill="#fff" opacity=".45"/>`;
      s += `<rect x="${n(wx)}" y="${n(bh+1)}" width="${n(ww)}" height="${n(wh)}" rx="0.6" fill="none" stroke="#3d4f57" stroke-width="0.5"/>`;
    }
    s += `<rect x="${n(m+1.5)}" y="${n(bh+skirt-1.2)}" width="${n(w-2*m-3)}" height="1.2" fill="#000" opacity=".4"/>`;
  }

  /* eave overhang: dark plate slightly larger than the roof */
  s += `<rect x="${n(m-0.8)}" y="${n(m-0.8)}" width="${n(w-2*m+1.6)}" height="${n(bh-m+1.6)}" rx="2" fill="#2a3238" opacity=".85"/>`;

  /* the two roof planes */
  s += `<rect x="${m}" y="${m}" width="${n(w-2*m)}" height="${n(ridge-m)}" rx="1.4" fill="${roof}"/>`;
  s += `<rect x="${m}" y="${n(ridge)}" width="${n(w-2*m)}" height="${n(bh-ridge)}" rx="1.4" fill="${roof}"/>`;
  s += `<rect x="${m}" y="${m}" width="${n(w-2*m)}" height="${n(ridge-m)}" fill="#fff" opacity=".16"/>`;
  s += `<rect x="${m}" y="${n(ridge)}" width="${n(w-2*m)}" height="${n(bh-ridge)}" fill="#000" opacity=".2"/>`;

  /* corrugation running down the pitch */
  for(let i=m+3.5;i<w-m;i+=4){
    s += `<line x1="${n(i)}" y1="${n(m+0.5)}" x2="${n(i)}" y2="${n(bh-0.5)}" stroke="#fff" stroke-opacity=".11" stroke-width="0.6"/>`;
    s += `<line x1="${n(i+1.6)}" y1="${n(m+0.5)}" x2="${n(i+1.6)}" y2="${n(bh-0.5)}" stroke="#000" stroke-opacity=".1" stroke-width="0.6"/>`;
  }

  /* solar arrays, inset so roof still shows around them */
  const ins = Math.max(3.5, Math.min(w,h)*0.1), cols = o.cols || Math.max(3, Math.round(w/16));
  if(o.solar)  s += panels(m+ins, m+ins*0.8, w-2*(m+ins), ridge-m-ins*1.1, cols, 2);
  if(o.solar2) s += panels(m+ins, ridge+1.4, w-2*(m+ins), bh-ridge-ins-1.4, cols, 2);

  /* gable ends darkened so the roof reads as pitched */
  s += `<rect x="${m}" y="${m}" width="2.4" height="${n(bh-m)}" fill="#000" opacity=".2"/>`;
  s += `<rect x="${n(w-m-2.4)}" y="${m}" width="2.4" height="${n(bh-m)}" fill="#000" opacity=".26"/>`;

  /* gutter + lit ridge cap */
  s += `<rect x="${m}" y="${n(bh-2)}" width="${n(w-2*m)}" height="2" fill="#000" opacity=".28"/>`;
  s += `<rect x="${m}" y="${n(ridge-1.3)}" width="${n(w-2*m)}" height="1.5" fill="#e2e9ec" opacity=".9"/>`;
  s += `<rect x="${m}" y="${n(ridge+0.3)}" width="${n(w-2*m)}" height="1" fill="#000" opacity=".35"/>`;

  /* raking light plus a broad sheen band across the pitch */
  s += `<polygon points="${n(m)},${n(bh)} ${n(w*0.34)},${m} ${n(w*0.46)},${m} ${n(w*0.1)},${n(bh)}" fill="#fff" opacity=".1"/>`;
  s += `<rect x="${m}" y="${n(m+(ridge-m)*0.18)}" width="${n(w-2*m)}" height="${n((ridge-m)*0.3)}" fill="url(#gSky)" opacity=".3"/>`;
  /* weathering: rust/dirt streaks down the shaded pitch and worn eave corners */
  for(let i=0;i<Math.max(2,Math.round(w/22));i++){
    const sx = m+3+hash(i*7.3+w)*(w-2*m-6);
    s += `<rect x="${n(sx)}" y="${n(ridge+1)}" width="${(0.8+hash(i)*1.4).toFixed(1)}" height="${n(bh-ridge-1)}"
      fill="#3f4448" opacity="${(0.06+hash(i*3)*0.09).toFixed(2)}"/>`;
  }
  s += `<circle cx="${n(m+2)}" cy="${n(bh-2)}" r="2.4" fill="#000" opacity=".12"/>`;
  s += `<circle cx="${n(w-m-2)}" cy="${n(bh-2)}" r="2.8" fill="#000" opacity=".14"/>`;

  if(o.chimney){
    s += `<rect x="${n(w*0.76)}" y="${n(ridge-7)}" width="4.4" height="7.5" rx="0.8" fill="#7b6f66"/>`;
    s += `<rect x="${n(w*0.76)}" y="${n(ridge-7)}" width="4.4" height="2" rx="0.8" fill="#9d918a"/>`;
    s += `<rect x="${n(w*0.76-0.8)}" y="${n(ridge-7.8)}" width="6" height="1.4" rx="0.7" fill="#5d544d"/>`;
  }
  if(o.skylight){
    s += `<rect x="${n(w*0.3)}" y="${n(m+ (ridge-m)*0.3)}" width="${n(w*0.18)}" height="${n((ridge-m)*0.42)}" rx="0.8"
      fill="url(#gGlass)" stroke="#5f6b72" stroke-width="0.7"/>`;
  }
  s += grain(0,0,w,h,0.09);
  return s;
}

/* photovoltaic array */
function panels(x,y,w,h,cols,rows){
  if(w<3||h<3) return '';
  let s = `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="0.8" fill="url(#gSolar)"/>`;
  const cw=w/cols, ch=h/rows;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    s += `<rect x="${n(x+i*cw+0.5)}" y="${n(y+j*ch+0.5)}" width="${n(cw-1)}" height="${n(ch-1)}"
      fill="#31456e" opacity="${(0.35+0.4*hash(i*4+j)).toFixed(2)}"/>`;
  }
  s += `<polygon points="${n(x)},${n(y+h)} ${n(x+w*0.4)},${n(y)} ${n(x+w*0.56)},${n(y)} ${n(x+w*0.08)},${n(y+h)}" fill="#bcd8f0" opacity="0.18"/>`;
  s += `<rect x="${n(x)}" y="${n(y)}" width="${n(w)}" height="${n(h)}" rx="0.8" fill="none" stroke="#0b1220" stroke-opacity=".55" stroke-width="0.7"/>`;
  return s;
}

/* leafy canopy with lit crown and cast shadow */
function canopy(cx,cy,r,grad,seed,sway){
  let s = `<ellipse cx="${n(cx+r*0.34)}" cy="${n(cy+r*0.46)}" rx="${n(r*0.95)}" ry="${n(r*0.58)}"
    fill="#16240c" opacity="0.4" filter="url(#fSoft)"/>`;
  s += `<g${sway?' class="sway"':''} style="transform-origin:${n(cx)}px ${n(cy+r*0.7)}px">`;
  /* dark underside mass */
  s += `<circle cx="${n(cx+r*0.1)}" cy="${n(cy+r*0.14)}" r="${n(r*0.86)}" fill="#2b5418"/>`;
  /* mid lobes with real size variance */
  for(let i=0;i<9;i++){
    const a=(i/9)*Math.PI*2+hash(seed+i)*0.8, d=r*(0.3+hash(seed*3+i)*0.28);
    s += `<circle cx="${n(cx+Math.cos(a)*d)}" cy="${n(cy+Math.sin(a)*d*0.82)}"
      r="${n(r*(0.34+hash(seed*7+i)*0.3))}" fill="${grad}"/>`;
  }
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.6)}" fill="${grad}"/>`;
  /* sun-side crown */
  for(let i=0;i<6;i++){
    const b=-1.5+i*0.34, d=r*(0.2+hash(seed*11+i)*0.24);
    s += `<circle cx="${n(cx-r*0.2+Math.cos(b)*d)}" cy="${n(cy-r*0.22+Math.sin(b)*d)}"
      r="${n(r*(0.13+hash(seed*13+i)*0.12))}" fill="#a9d47c" opacity="${(0.3+hash(seed+i)*0.35).toFixed(2)}"/>`;
  }
  /* rim light on the top-left edge */
  s += `<path d="M${n(cx-r*0.78)} ${n(cy-r*0.2)} a ${n(r*0.82)} ${n(r*0.82)} 0 0 1 ${n(r*0.9)} ${n(-r*0.52)}"
    stroke="#c2e39a" stroke-width="${n(r*0.1)}" fill="none" opacity=".35" stroke-linecap="round"/>`;
  s += `</g>`;
  return s;
}

/* pointed native tree */
function conifer(cx,cy,r,seed){
  let s = `<ellipse cx="${n(cx+r*0.32)}" cy="${n(cy+r*0.44)}" rx="${n(r*0.8)}" ry="${n(r*0.46)}" fill="#16240c" opacity=".36" filter="url(#fSoft)"/>`;
  s += `<g class="sway" style="transform-origin:${n(cx)}px ${n(cy+r*0.7)}px">`;
  s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(r*0.88)}" fill="url(#gCanopyD)"/>`;
  s += `<circle cx="${n(cx-r*0.12)}" cy="${n(cy-r*0.12)}" r="${n(r*0.55)}" fill="#417a2f"/>`;
  s += `<circle cx="${n(cx-r*0.2)}" cy="${n(cy-r*0.2)}" r="${n(r*0.26)}" fill="#5d9c40" opacity=".8"/>`;
  s += `</g>`;
  return s;
}

/* clipped hedge run */
function hedge(w,h){
  const vert = h>w, thick = vert?w:h;
  let s = `<rect x="0.5" y="1.5" width="${n(w-1)}" height="${n(h-1.5)}" rx="${n(thick*0.42)}" fill="#1f3c15" opacity=".55"/>`;
  s += `<rect x="0.5" y="0.5" width="${n(w-1)}" height="${n(h-2)}" rx="${n(thick*0.42)}" fill="url(#gHedge)"/>`;
  const cnt = Math.max(3, Math.floor((vert?h:w)/7));
  for(let i=0;i<cnt;i++){
    const t=(i+0.5)/cnt;
    const cx = vert? w*0.46 : 1.5+t*(w-3);
    const cy = vert? 1.5+t*(h-3) : h*0.42;
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(thick*0.3)}" fill="#5f9a42" opacity="${(0.35+0.4*hash(i*3)).toFixed(2)}"/>`;
  }
  s += `<rect x="0.5" y="0.5" width="${n(w-1)}" height="${n(thick*0.24)}" rx="${n(thick*0.2)}" fill="#7cb257" opacity=".3"/>`;
  s += grain(0,0,w,h,0.16);
  return s;
}

/* pond / dam */
function water(w,h,seed){
  let s = patch(w,h,'#5d7a3a',seed||4,0.5);
  s += `<g transform="translate(${n(w*0.5)},${n(h*0.5)}) scale(0.9) translate(${n(-w*0.5)},${n(-h*0.5)})">${patch(w,h,'#8a9c5c',seed||4,0.5)}</g>`;
  s += `<g transform="translate(${n(w*0.5)},${n(h*0.5)}) scale(0.82) translate(${n(-w*0.5)},${n(-h*0.5)})">${patch(w,h,'url(#gWater)',seed||4,0.5)}</g>`;
  for(let i=0;i<3;i++){
    s += `<ellipse class="ripple" cx="${n(w*(0.34+i*0.16))}" cy="${n(h*(0.4+i*0.13))}" rx="${n(w*0.13)}" ry="${n(h*0.045)}"
      fill="none" stroke="#dff4fb" stroke-width="0.9" opacity=".4" style="animation-delay:${(i*1.1).toFixed(1)}s"/>`;
  }
  s += `<ellipse cx="${n(w*0.32)}" cy="${n(h*0.28)}" rx="${n(w*0.17)}" ry="${n(h*0.07)}" fill="#fff" opacity=".26"/>`;
  for(let i=0;i<9;i++){
    const a=(i/9)*Math.PI*2;
    s += `<path d="M${n(w/2+Math.cos(a)*(w/2-4))} ${n(h/2+Math.sin(a)*(h/2-4))} q 1.6 -4 0 -7" stroke="#4e8433" stroke-width="1.2" fill="none"/>`;
  }
  return s;
}

/* gravel surface: graded aggregate, compacted darker centre, ragged edge */
function gravel(w,h,shape,rx){
  let s;
  if(shape==='ellipse'||shape==='ring'){
    s = `<ellipse cx="${n(w/2)}" cy="${n(h/2)}" rx="${n(w/2-0.5)}" ry="${n(h/2-0.5)}" fill="#8f8468"/>`;
    s += `<ellipse cx="${n(w/2)}" cy="${n(h/2-0.8)}" rx="${n(w/2-1.5)}" ry="${n(h/2-1.5)}" fill="url(#gGravel)"/>`;
    s += `<ellipse cx="${n(w/2)}" cy="${n(h/2)}" rx="${n(w/2-5)}" ry="${n(h/2-5)}" fill="#b8ac8c" opacity=".45"/>`;
    if(shape==='ring'){
      s += `<ellipse cx="${n(w/2)}" cy="${n(h/2)}" rx="${n(w/2-11)}" ry="${n(h/2-11)}" fill="url(#gLawn)"/>`;
      s += `<ellipse cx="${n(w/2)}" cy="${n(h/2)}" rx="${n(w/2-11)}" ry="${n(h/2-11)}" fill="none" stroke="#6f8f48" stroke-width="3" opacity=".55"/>`;
    }
  } else {
    s = `<rect x="0" y="0.8" width="${n(w)}" height="${n(h-0.8)}" rx="${rx===undefined?2.5:rx}" fill="#8f8468"/>`;
    s += `<rect x="0" y="0" width="${n(w)}" height="${n(h-1.4)}" rx="${rx===undefined?2.5:rx}" fill="url(#gGravel)"/>`;
    s += `<rect x="${n(w*0.1)}" y="${n(h*0.22)}" width="${n(w*0.8)}" height="${n(h*0.56)}" rx="2" fill="#b8ac8c" opacity=".4"/>`;
  }
  /* graded stone: a few big, many small */
  for(let i=0;i<Math.floor(w*h/16);i++){
    const big = i%11===0;
    const r = big ? 1.4+hash(i)*1.6 : 0.4+hash(i+9)*0.8;
    const c = i%4===0 ? '#e2d8bf' : i%3===0 ? '#7f7660' : '#a3987c';
    s += `<circle cx="${n(hash(i*1.7)*w)}" cy="${n(hash(i*3.1+5)*h)}" r="${n(r)}" fill="${c}" opacity="${big?0.75:0.55}"/>`;
  }
  /* ragged edge: stones spilling onto the grass instead of a hard cut line */
  for(let i=0;i<Math.floor(w/5);i++){
    s += `<circle cx="${n(hash(i*2.3)*w)}" cy="${n(h-1+hash(i*4.1)*3)}" r="${n(0.6+hash(i)*1)}" fill="#b6a988" opacity=".7"/>`;
    s += `<circle cx="${n(hash(i*5.3+1)*w)}" cy="${n(1-hash(i*2.9)*3)}" r="${n(0.6+hash(i+3)*1)}" fill="#b6a988" opacity=".7"/>`;
  }
  s += grain(0,0,w,h,0.26);
  return s;
}

/* post-and-rail fence run */
function fence(w,h){
  const y=h/2;
  let s = `<line x1="0.5" y1="${n(y+1.2)}" x2="${n(w-0.5)}" y2="${n(y+1.2)}" stroke="#000" stroke-opacity=".3" stroke-width="2"/>`;
  s += `<line x1="0.5" y1="${n(y-1.8)}" x2="${n(w-0.5)}" y2="${n(y-1.8)}" stroke="#a8814f" stroke-width="1.3"/>`;
  s += `<line x1="0.5" y1="${n(y+1)}" x2="${n(w-0.5)}" y2="${n(y+1)}" stroke="#8e6b3e" stroke-width="1.3"/>`;
  for(let i=1.5;i<w-1;i+=9){
    s += `<rect x="${n(i)}" y="${n(y-4.5)}" width="2.2" height="9" rx="1" fill="#7d5931"/>`;
    s += `<rect x="${n(i)}" y="${n(y-4.5)}" width="1" height="9" fill="#a8814f"/>`;
  }
  return s;
}

/* livestock, drawn small and top-down */
function beast(kind,x,y,sc,idle){

  let b='';
  if(kind==='chicken') b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(3.7*sc)}" ry="${n(2.8*sc)}" fill="#f6efdf"/>
     <ellipse cx="${n(x-1.2*sc)}" cy="${n(y+0.3*sc)}" rx="${n(2.4*sc)}" ry="${n(1.9*sc)}" fill="#e3d8c1"/>
     <circle cx="${n(x+3.1*sc)}" cy="${n(y-2.2*sc)}" r="${n(1.8*sc)}" fill="#fffbf0"/>
     <circle cx="${n(x+3.1*sc)}" cy="${n(y-3.8*sc)}" r="${n(0.9*sc)}" fill="#cf4433"/>
     <path d="M${n(x+4.7*sc)} ${n(y-2*sc)} l ${n(1.9*sc)} ${n(0.6*sc)} l ${n(-1.9*sc)} ${n(0.9*sc)} z" fill="#e8a22e"/>`;
  else if(kind==='goat') b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(5.6*sc)}" ry="${n(3*sc)}" fill="#e6ded0"/>
     <ellipse cx="${n(x-2*sc)}" cy="${n(y)}" rx="${n(3.4*sc)}" ry="${n(2.4*sc)}" fill="#cfc5b3"/>
     <circle cx="${n(x+5.6*sc)}" cy="${n(y-1.8*sc)}" r="${n(2.1*sc)}" fill="#f0eade"/>
     <path d="M${n(x+4.8*sc)} ${n(y-3.6*sc)} q ${n(1*sc)} ${n(-2.8*sc)} ${n(2.8*sc)} ${n(-1.8*sc)}" stroke="#8b7a5f" stroke-width="${n(0.9*sc)}" fill="none"/>
     <rect x="${n(x-3.6*sc)}" y="${n(y+2*sc)}" width="${n(1.2*sc)}" height="${n(2.8*sc)}" fill="#b0a695"/>
     <rect x="${n(x+2.6*sc)}" y="${n(y+2*sc)}" width="${n(1.2*sc)}" height="${n(2.8*sc)}" fill="#b0a695"/>`;
  else if(kind==='sheep') b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(5.4*sc)}" ry="${n(3.8*sc)}" fill="#f7f3e9"/>
     <circle cx="${n(x-2.8*sc)}" cy="${n(y-2.2*sc)}" r="${n(2.3*sc)}" fill="#fffdf6"/>
     <circle cx="${n(x+0.8*sc)}" cy="${n(y-3*sc)}" r="${n(2.5*sc)}" fill="#fffdf6"/>
     <circle cx="${n(x+2.6*sc)}" cy="${n(y+1.6*sc)}" r="${n(2.3*sc)}" fill="#f2ede0"/>
     <circle cx="${n(x+5.6*sc)}" cy="${n(y-0.8*sc)}" r="${n(2*sc)}" fill="#4f4740"/>`;
  else if(kind==='duck') b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(4.2*sc)}" ry="${n(2.6*sc)}" fill="#fdfaf0"/>
     <circle cx="${n(x+3.4*sc)}" cy="${n(y-2.2*sc)}" r="${n(1.7*sc)}" fill="#fff"/>
     <path d="M${n(x+4.8*sc)} ${n(y-2*sc)} l ${n(2.2*sc)} ${n(0.7*sc)} l ${n(-2.2*sc)} ${n(0.8*sc)} z" fill="#e8a22e"/>`;
  else if(kind==='pig') b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(5.6*sc)}" ry="${n(3.2*sc)}" fill="#e2a3a5"/>
     <circle cx="${n(x+5.4*sc)}" cy="${n(y-0.8*sc)}" r="${n(2.3*sc)}" fill="#ecb6b7"/>
     <circle cx="${n(x+6.8*sc)}" cy="${n(y-0.4*sc)}" r="${n(1*sc)}" fill="#c98b8d"/>`;
  else b =
    `<ellipse cx="${n(x)}" cy="${n(y)}" rx="${n(3.2*sc)}" ry="${n(2.3*sc)}" fill="#e7dcc6"/>
     <circle cx="${n(x+2.6*sc)}" cy="${n(y-1.7*sc)}" r="${n(1.4*sc)}" fill="#f2e9d6"/>`;
  return `<g class="${idle===false?'':'peck'}" style="animation-delay:${(hash(x*y)*2).toFixed(1)}s">${sh}${b}</g>`;
}

/* human figure for scale */
function person(x,y,sc,shirt,hat){
  sc=sc||1;
  let s = `<ellipse cx="${n(x+1.6*sc)}" cy="${n(y+9*sc)}" rx="${n(4.4*sc)}" ry="${n(1.8*sc)}" fill="#16240c" opacity=".32"/>`;
  s += `<rect x="${n(x-2.2*sc)}" y="${n(y+2.6*sc)}" width="${n(1.8*sc)}" height="${n(6*sc)}" rx="${n(0.9*sc)}" fill="#3f4a5a"/>`;
  s += `<rect x="${n(x+0.4*sc)}" y="${n(y+2.6*sc)}" width="${n(1.8*sc)}" height="${n(6*sc)}" rx="${n(0.9*sc)}" fill="#3f4a5a"/>`;
  s += `<rect x="${n(x-3*sc)}" y="${n(y-2.4*sc)}" width="${n(6*sc)}" height="${n(5.6*sc)}" rx="${n(2.2*sc)}" fill="${shirt||'#c8583f'}"/>`;
  s += `<rect x="${n(x-4.8*sc)}" y="${n(y-1.8*sc)}" width="${n(1.9*sc)}" height="${n(4.4*sc)}" rx="${n(0.9*sc)}" fill="${shirt||'#c8583f'}"/>`;
  s += `<rect x="${n(x+2.9*sc)}" y="${n(y-1.8*sc)}" width="${n(1.9*sc)}" height="${n(4.4*sc)}" rx="${n(0.9*sc)}" fill="${shirt||'#c8583f'}"/>`;
  s += `<circle cx="${n(x)}" cy="${n(y-4.6*sc)}" r="${n(2.9*sc)}" fill="#e2b98f"/>`;
  s += `<path d="M${n(x-2.9*sc)} ${n(y-4.9*sc)} a ${n(2.9*sc)} ${n(2.9*sc)} 0 0 1 ${n(5.8*sc)} 0 z" fill="#4a3a2c"/>`;

                 <circle cx="${n(x)}" cy="${n(y-6*sc)}" r="${n(2.3*sc)}" fill="${hat}"/>`; }

/* =====================================================================
   COMPONENTS — every placeable thing, drawn to its footprint.
   Signature: (w, h, ob) where `ob` is the live object (or null for a
   catalogue thumbnail), so buildings can show their real state.
   ===================================================================== */

/* ---- growing beds: soil, furrows and the crop actually in them ---- */
function bedArt(w,h,ob,rows){
  rows = rows || Math.max(1, Math.round(h/16));
  const wet = ob && ob.water > 0.45;
  let s = `<rect x="0.5" y="1.5" width="${n(w-1)}" height="${n(h-1.5)}" rx="2" fill="#2a1e14" opacity=".5"/>`;
  s += `<rect x="0.5" y="0.5" width="${n(w-1)}" height="${n(h-2)}" rx="2" fill="${wet?'url(#gSoilWet)':'url(#gSoil)'}"/>`;
  /* timber edging */
  s += `<rect x="0.5" y="0.5" width="${n(w-1)}" height="${n(h-2)}" rx="2" fill="none" stroke="#8b6640" stroke-width="1.6"/>`;
  s += `<rect x="1.2" y="1.2" width="${n(w-2.4)}" height="${n(h-3.4)}" rx="1.6" fill="none" stroke="#000" stroke-opacity=".25" stroke-width="0.8"/>`;
  const rh = (h-5)/rows;
  for(let r0=0;r0<rows;r0++){
    const y = 2.5 + r0*rh + rh/2;
    s += `<line x1="3" y1="${n(y)}" x2="${n(w-3)}" y2="${n(y)}" stroke="#000" stroke-opacity=".2" stroke-width="${n(rh*0.5)}"/>`;
    s += `<line x1="3" y1="${n(y-rh*0.2)}" x2="${n(w-3)}" y2="${n(y-rh*0.2)}" stroke="#fff" stroke-opacity=".06" stroke-width="1"/>`;
  }
  if(ob && ob.crop){
    const cr = CROPS[ob.crop];
    const st = ob.stage;                          // 0..1 growth
    const per = Math.max(3, Math.floor((w-8)/9));
    for(let r0=0;r0<rows;r0++){
      const y = 2.5 + r0*rh + rh/2;
      for(let i=0;i<per;i++){
        const x = 5 + (i+0.5)*((w-10)/per);
        s += plant(cr, x, y, st, r0*per+i, ob.pest);
      }
    }
    if(ob.stage >= 1){
      s += `<circle class="pulse" cx="${n(w-5)}" cy="5" r="3" fill="#f0c14b" opacity=".9"/>`;
    }
  } else {
    for(let i=0;i<Math.floor(w*h/70);i++){
      s += `<circle cx="${n(3+hash(i*2.3)*(w-6))}" cy="${n(3+hash(i*4.1+2)*(h-6))}" r="${n(0.5+hash(i)*0.6)}" fill="#8a6a4a" opacity=".5"/>`;
    }
  }
  s += grain(0,0,w,h,0.14);
  return s;
}

/* a single plant at a growth stage */
function plant(cr,x,y,st,seed,pest){
  const sc = 0.35 + st*0.85;
  const leaf = cr.leaf || '#4f9c39';
  let s = '';
  if(st < 0.12){
    return `<circle cx="${n(x)}" cy="${n(y)}" r="0.9" fill="#6fb04a"/>`;
  }
  const R = 3.1*sc;
  s += '<g class="cropsway">';
  for(let i=0;i<5;i++){
    const a = (i/5)*Math.PI*2 + hash(seed+i);
    s += `<ellipse cx="${n(x+Math.cos(a)*R*0.45)}" cy="${n(y+Math.sin(a)*R*0.4)}" rx="${n(R*0.55)}" ry="${n(R*0.42)}"
      fill="${leaf}" opacity="${(0.72+hash(seed*3+i)*0.28).toFixed(2)}" transform="rotate(${n(a*57)} ${n(x)} ${n(y)})"/>`;
  }
  s += `<circle cx="${n(x-R*0.2)}" cy="${n(y-R*0.24)}" r="${n(R*0.3)}" fill="#8fca63" opacity=".55"/>`;
  s += '</g>';
  if(st > 0.72 && cr.fruit){
    const fn = cr.fruitN || 2;
    for(let i=0;i<fn;i++){
      const a = i*2.1 + seed;
      s += `<circle cx="${n(x+Math.cos(a)*R*0.5)}" cy="${n(y+Math.sin(a)*R*0.45)}" r="${n(1.2*sc)}" fill="${cr.fruit}"/>`;
      s += `<circle cx="${n(x+Math.cos(a)*R*0.5-0.4)}" cy="${n(y+Math.sin(a)*R*0.45-0.4)}" r="${n(0.4*sc)}" fill="#fff" opacity=".5"/>`;
    }
  }
  if(pest && hash(seed*7)>0.6){
    s += `<circle cx="${n(x+1.6)}" cy="${n(y-1.6)}" r="0.9" fill="#c8583f"/>`;
  }
  return s;
}

  s += `<g transform="translate(${n(w*0.42)},${n(h*0.26)})">${building(w*0.56,h*0.58,{solar:1,skylight:1})}</g>`;

  s += `<circle cx="${n(w*0.09)}" cy="${n(h*0.78)}" r="3.4" fill="#4f8a35"/><circle cx="${n(w*0.44)}" cy="${n(h*0.78)}" r="3" fill="#5f9c3d"/>`;

ART.shed      = (w,h)=> building(w,h,{solar:1,chimney:0});
ART.workshop  = (w,h)=> building(w,h,{roof:'url(#gRoofRed)',solar:1});
ART.cellar    = (w,h)=>{

  return s;
};

/* — energy — */
ART.solar_ground = (w,h)=>{
  let s = patch(w,h,'#87ad5c',12,1);
  const rows = Math.max(2, Math.round(h/14));
  for(let i=0;i<rows;i++){
    const y = 3 + i*((h-6)/rows);
    s += `<rect x="4" y="${n(y+3)}" width="${n(w-8)}" height="3" fill="#16240c" opacity=".3"/>`;
    s += panels(3, y, w-6, (h-8)/rows, Math.max(3,Math.round(w/12)), 1);
  }
  return s;
};
ART.wind = (w,h)=>{
  const cx=w/2, hy=h*0.3;
  let s = `<ellipse cx="${n(cx+5)}" cy="${n(h-5)}" rx="9" ry="3" fill="#16240c" opacity=".34" filter="url(#fSoft)"/>`;
  s += `<rect x="${n(cx-1.6)}" y="${n(hy)}" width="3.2" height="${n(h-hy-3)}" rx="1.6" fill="#d6dad4"/>`;
  s += `<rect x="${n(cx-1.6)}" y="${n(hy)}" width="1.3" height="${n(h-hy-3)}" fill="#fff" opacity=".5"/>`;
  s += `<g class="spin" style="transform-origin:${n(cx)}px ${n(hy)}px">`;
  for(let i=0;i<3;i++) s += `<path d="M${n(cx)} ${n(hy)} l -1.4 -${n(hy*0.9)} q 1.4 -3 2.8 0 z" fill="#f3f4f0" transform="rotate(${i*120} ${n(cx)} ${n(hy)})"/>`;
  s += `</g><circle cx="${n(cx)}" cy="${n(hy)}" r="2.2" fill="#b3b7b0"/>`;

ART.battery = (w,h)=>{

  s += `<rect x="${n(w*0.14)}" y="${n(h*0.16)}" width="${n(w*0.72)}" height="${n(h*0.3)}" rx="2" fill="#69747e"/>`;
  s += `<rect x="${n(w*0.26)}" y="${n(h*0.52)}" width="${n(w*0.48)}" height="3.4" rx="1.7" fill="#0e1a10"/>`;
  s += `<rect x="${n(w*0.27)}" y="${n(h*0.53)}" width="${n(w*0.34)}" height="2.4" rx="1.2" fill="#7cc24f"/>`;

};

/* — water — */
ART.tank = (w,h,ob)=>{
  const cnt = 2, rad = Math.min(h, w/cnt)/2 - 1.5;
  let s='';
  for(let i=0;i<cnt;i++){
    const cx=(w/cnt)*(i+0.5), cy=h/2;
    s += `<ellipse cx="${n(cx+2)}" cy="${n(cy+2.5)}" rx="${n(rad)}" ry="${n(rad*0.9)}" fill="#16240c" opacity=".34" filter="url(#fSoft)"/>`;
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad)}" fill="#2f4f2f"/>`;
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad-1.2)}" fill="url(#gTank)"/>`;
    for(let j=0;j<12;j++){
      const a=(j/12)*Math.PI*2;
      s += `<line x1="${n(cx)}" y1="${n(cy)}" x2="${n(cx+Math.cos(a)*(rad-2))}" y2="${n(cy+Math.sin(a)*(rad-2))}" stroke="#3e6a3e" stroke-width="0.8" opacity=".7"/>`;
    }
    s += `<circle cx="${n(cx)}" cy="${n(cy)}" r="${n(rad*0.26)}" fill="#5f8a5c"/>`;
    s += `<path d="M${n(cx-rad*0.58)} ${n(cy-rad*0.5)} a ${n(rad*0.8)} ${n(rad*0.8)} 0 0 1 ${n(rad*0.9)} ${n(-rad*0.14)}" stroke="#fff" stroke-width="1.3" fill="none" opacity=".38"/>`;
  }
  if(ob){
    const lv = Math.max(0, Math.min(1, ob.store/(ob.cap||100)));
    s += `<rect x="${n(w*0.16)}" y="${n(h-3.4)}" width="${n(w*0.68)}" height="2.6" rx="1.3" fill="#0e1a10" opacity=".8"/>`;

ART.sprinkler = (w,h)=>{

/* — growing — */
ART.bed        = (w,h,ob)=> bedArt(w,h,ob,2);
ART.bed_large  = (w,h,ob)=> bedArt(w,h,ob,4);
ART.greenhouse = (w,h,ob)=>{
  let s = `<rect x="2.5" y="3" width="${n(w-3)}" height="${n(h-3)}" rx="2" fill="#16240c" opacity=".34" filter="url(#fSoft)"/>`;
  s += `<rect x="0.5" y="0.5" width="${n(w-1)}" height="${n(h-2)}" rx="2" fill="#8ea4ab"/>`;
  s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-4)}" rx="1.5" fill="url(#gGlass)"/>`;
  if(ob && ob.crop){
    const cr = CROPS[ob.crop];
    for(let r0=0;r0<2;r0++) for(let i=0;i<Math.max(3,Math.floor(w/12));i++){
      const x = 6+(i+0.5)*((w-12)/Math.max(3,Math.floor(w/12)));
      s += `<g opacity=".85">${plant(cr, x, h*(0.32+r0*0.36), ob.stage, r0*7+i, ob.pest)}</g>`;
    }
  } else {
    s += `<rect x="4" y="${n(h*0.26)}" width="${n(w-8)}" height="${n(h*0.16)}" rx="1" fill="#6fae4c" opacity=".45"/>`;
    s += `<rect x="4" y="${n(h*0.6)}" width="${n(w-8)}" height="${n(h*0.16)}" rx="1" fill="#6fae4c" opacity=".45"/>`;
  }
  for(let i=6;i<w-2;i+=7) s += `<line x1="${n(i)}" y1="1.5" x2="${n(i)}" y2="${n(h-2.5)}" stroke="#7d949c" stroke-width="0.9"/>`;
  s += `<line x1="1.5" y1="${n(h/2-0.8)}" x2="${n(w-1.5)}" y2="${n(h/2-0.8)}" stroke="#f0f6f8" stroke-width="1.6"/>`;
  s += `<line x1="1.5" y1="${n(h/2+0.7)}" x2="${n(w-1.5)}" y2="${n(h/2+0.7)}" stroke="#000" stroke-opacity=".2" stroke-width="0.8"/>`;
  s += `<polygon points="2,${n(h-3)} ${n(w*0.42)},2 ${n(w*0.56)},2 ${n(w*0.14)},${n(h-3)}" fill="#fff" opacity=".26"/>`;
  if(ob && ob.stage>=1) s += `<circle class="pulse" cx="${n(w-5)}" cy="5" r="3" fill="#f0c14b"/>`;
  return s;
};
ART.herb_spiral = (w,h,ob)=>{
  const cx=w/2, cy=h/2, R=Math.min(w,h)/2-1.5;
  let s = `<ellipse cx="${n(cx+2)}" cy="${n(cy+2)}" rx="${n(R*0.95)}" ry="${n(R*0.85)}" fill="#16240c" opacity=".3" filter="url(#fSoft)"/>`;
  s += `<ellipse cx="${n(cx)}" cy="${n(cy)}" rx="${n(R)}" ry="${n(R*0.94)}" fill="#8fb45f"/>`;
  let d='';
  for(let t=0;t<=Math.PI*3.4;t+=0.15){
    const rr = R*0.9*(1-t/(Math.PI*3.9));
    d += (t===0?'M':'L') + n(cx+Math.cos(t)*rr) + ' ' + n(cy+Math.sin(t)*rr*0.92) + ' ';
  }
  s += `<path d="${d}" stroke="#6b5238" stroke-width="${n(Math.max(3,R*0.3))}" fill="none" stroke-linecap="round"/>`;
  s += `<path d="${d}" stroke="url(#gSoil)" stroke-width="${n(Math.max(2,R*0.22))}" fill="none" stroke-linecap="round"/>`;
  const cols=['#4f8a35','#6fb04a','#8fc95d','#dd6f9c','#efb43c','#9b6fc4','#5fb0d4'];
  for(let i=0;i<15;i++){
    const a=i*0.95, rr=Math.max(R*0.16, R*0.86*(1-(i*0.95)/(Math.PI*4.2)));
    s += `<circle cx="${n(cx+Math.cos(a)*rr)}" cy="${n(cy+Math.sin(a)*rr*0.92)}" r="${n(Math.max(1.3,R*0.1))}" fill="${cols[i%7]}"/>`;
  }
  if(ob && ob.stage>=1) s += `<circle class="pulse" cx="${n(w-5)}" cy="5" r="3" fill="#f0c14b"/>`;
  return s;
};
ART.orchard = (w,h,ob)=>{
  let s = patch(w,h,'#82ac57',21,1);
  const cols=Math.max(2,Math.round(w/26)), rows=Math.max(2,Math.round(h/26));
  const ripe = ob && ob.stage>=1;
  for(let i=0;i<cols;i++) for(let j=0;j<rows;j++){
    const cx = (w/cols)*(i+0.5), cy = (h/rows)*(j+0.5);
    s += canopy(cx, cy, Math.min(w/cols,h/rows)*0.42, 'url(#gCanopy)', i*3+j, true);
    if(ripe) for(let k=0;k<3;k++){
      const a=k*2.2+i;
      s += `<circle cx="${n(cx+Math.cos(a)*6)}" cy="${n(cy+Math.sin(a)*5)}" r="1.7" fill="#e2603a"/>`;
    }
  }
  if(ripe) s += `<circle class="pulse" cx="${n(w-5)}" cy="5" r="3" fill="#f0c14b"/>`;
  return s;
};
ART.berry = (w,h,ob)=>{
  let s = bedArt(w,h,null,2);
  const ripe = ob && ob.stage>=1;
  for(let i=0;i<14;i++){
    const x=4+hash(i*1.9)*(w-8), y=4+hash(i*3.1+2)*(h-8);
    s += `<circle cx="${n(x)}" cy="${n(y)}" r="${n(2.4+hash(i)*1.2)}" fill="#3f7a32"/>`;
    if(ripe) s += `<circle cx="${n(x+1)}" cy="${n(y-1)}" r="1.1" fill="#5a4a9c"/>`;
  }
  if(ripe) s += `<circle class="pulse" cx="${n(w-5)}" cy="5" r="3" fill="#f0c14b"/>`;
  return s;
};
ART.flowers = (w,h)=>{
  let s = patch(w,h,'#8cb35f',33,1);

};
ART.compost = (w,h)=>{

    s += `<rect x="${n(x+1)}" y="3.5" width="${n((w-3)/3-3.5)}" height="${n(h-7)}" rx="1" fill="${['#4b3520','#6b4f38','#4f7a35'][i]}"/>`;
    s += `<rect x="${n(x)}" y="2.5" width="${n((w-3)/3-1.5)}" height="1.6" rx="0.8" fill="#a1743f"/>`;

ART.nursery = (w,h)=>{
  let s = ART.greenhouse(w,h,null);

/* — animals — */
function paddock(w,h,kind,cnt,seed,sc){
  let s = patch(w,h,'#84ad57',seed,1);
  s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#00000033" stroke-width="2.6"/>`;
  s += `<rect x="1.5" y="1.5" width="${n(w-3)}" height="${n(h-3)}" rx="2.5" fill="none" stroke="#a8814f" stroke-width="1.3"/>`;
  for(let x=2;x<w-2;x+=11){ s += `<rect x="${n(x-1)}" y="0" width="2" height="4" rx="1" fill="#7d5931"/>`;
                            s += `<rect x="${n(x-1)}" y="${n(h-4)}" width="2" height="4" rx="1" fill="#7d5931"/>`; }
  for(let y=2;y<h-2;y+=11){ s += `<rect x="0" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`;
                            s += `<rect x="${n(w-4)}" y="${n(y-1)}" width="4" height="2" rx="1" fill="#7d5931"/>`; }
  for(let i=0;i<cnt;i++){
    s += beast(kind, 8+hash(i*2.3+seed)*Math.max(4,w-16), 8+hash(i*5.7+seed)*Math.max(4,h-16), sc||1);
  }
  return s;
}

  const cnt = ob ? Math.min(8, ob.animals||0) : 3;

  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};
ART.goat_pen = (w,h,ob)=>{
  const cnt = ob ? Math.min(6, ob.animals||0) : 2;
  let s = paddock(w,h,'goat',cnt,11,0.95);
  s += `<g transform="translate(${n(w*0.04)},${n(h*0.06)})">${building(w*0.36,h*0.42,{})}</g>`;
  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};
ART.sheep = (w,h,ob)=>{
  const cnt = ob ? Math.min(8, ob.animals||0) : 4;
  let s = paddock(w,h,'sheep',cnt,15,0.95);
  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};
ART.duck_pond = (w,h,ob)=>{
  const cnt = ob ? Math.min(8, ob.animals||0) : 3;
  let s = water(w,h,19);
  for(let i=0;i<cnt;i++) s += beast('duck', 8+hash(i*2.9)*Math.max(4,w-16), 8+hash(i*4.3+1)*Math.max(4,h-16), 0.9);
  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};
ART.apiary = (w,h,ob)=>{
  const cnt = Math.max(2, Math.floor(w/22));
  let s = patch(w,h,'#8cb35f',23,1);
  const cols=['#e8c05a','#e2ded2','#9fc0d8','#e29a72','#b9d38e','#d8a8c4'];
  for(let i=0;i<cnt;i++){
    const x = 3+i*((w-6)/cnt), bw = Math.min(13,(w-6)/cnt-2), y = h/2-7;
    s += `<rect x="${n(x+1.5)}" y="${n(y+2)}" width="${n(bw)}" height="14" rx="1" fill="#16240c" opacity=".32"/>`;
    s += `<rect x="${n(x)}" y="${n(y)}" width="${n(bw)}" height="14" rx="1" fill="${cols[i%6]}"/>`;
    s += `<rect x="${n(x)}" y="${n(y)}" width="${n(bw)}" height="4.6" rx="1" fill="#fff" opacity=".22"/>`;
    s += `<rect x="${n(x-0.8)}" y="${n(y-2)}" width="${n(bw+1.6)}" height="3" rx="1" fill="#f4efe1"/>`;
    s += `<line x1="${n(x)}" y1="${n(y+5.5)}" x2="${n(x+bw)}" y2="${n(y+5.5)}" stroke="#00000033" stroke-width="0.8"/>`;
    s += `<line x1="${n(x)}" y1="${n(y+10)}" x2="${n(x+bw)}" y2="${n(y+10)}" stroke="#00000033" stroke-width="0.8"/>`;
  }
  s += `<circle class="bee" cx="${n(w*0.7)}" cy="${n(h*0.24)}" r="1.4" fill="#f0c14b"/>`;
  s += `<circle class="bee" cx="${n(w*0.3)}" cy="${n(h*0.7)}" r="1.2" fill="#f0c14b" style="animation-delay:1.4s"/>`;
  if(ob && ob.ready>0) s += `<circle class="pulse" cx="${n(w-6)}" cy="6" r="3.4" fill="#f0c14b"/>`;
  return s;
};
ART.rabbit = (w,h,ob)=> paddock(w,h,'rabbit', ob?Math.min(6,ob.animals||0):2, 27, 0.9);
ART.fodder = (w,h)=>{
  let s = patch(w,h,'#b5bd68',31,1);

  }
  return s;
};

ART.ai_hub = (w,h,ob)=>{
  const t = ob ? (ob.tier||0) : 0;
  let s = building(w,h,{roof:'url(#gRoof)',solar:1,skylight:1});
  s += `<rect x="${n(w*0.2)}" y="${n(h*0.56)}" width="${n(w*0.6)}" height="${n(h*0.16)}" rx="1.5" fill="#0e1c26"/>`;
  for(let i=0;i<5;i++)
    s += `<rect class="twinkle" style="animation-delay:${(i*0.3).toFixed(2)}s" x="${n(w*0.23+i*w*0.115)}" y="${n(h*0.59)}"
      width="${n(w*0.07)}" height="${n(h*0.09)}" fill="${i<=t?'#7cc24f':'#31465a'}"/>`;
  s += `<rect x="${n(w*0.48)}" y="${n(-h*0.2)}" width="1.8" height="${n(h*0.34)}" fill="#b9c2c7"/>`;
  s += `<circle class="pulse" cx="${n(w*0.49)}" cy="${n(-h*0.2)}" r="2.4" fill="#6fb6d8"/>`;
  for(let i=1;i<=3;i++)
    s += `<path d="M${n(w*0.49-5*i)} ${n(-h*0.15+2*i)} a ${5*i} ${5*i} 0 0 1 ${10*i} 0"
      stroke="#6fb6d8" stroke-width="0.8" fill="none" opacity="${(0.6-i*0.14).toFixed(2)}"/>`;
  return s;
};

  s += `<circle cx="${n(w*0.2)}" cy="${n(h*0.8)}" r="3.2" fill="#4f8a35"/>`;
  s += `<circle cx="${n(w*0.8)}" cy="${n(h*0.8)}" r="2.8" fill="#5f9c3d"/>`;

  s += `<path d="M${n(w*0.1)} ${n(h*0.76)} Q ${n(w*0.5)} ${n(h*0.84)} ${n(w*0.9)} ${n(h*0.76)}" stroke="#8a7f6a" stroke-width="0.8" fill="none"/>`;

/* =====================================================================
   AUDIO — everything synthesised in-browser so the file stays standalone.
   Action SFX + ambient farm bed + weather layer + slow generative music.
   ===================================================================== */
const SND = (function(){
  let ac=null, master=null, sfxG=null, ambG=null, wxG=null, musG=null;
  let started=false, muted=false, noiseBuf=null;
  let wind=null, rain=null, rainF=null, birdTimer=0, musTimer=0, musStep=0, muteHold=0;
  const vol = {master:0.75, sfx:0.9, amb:0.35, wx:0.4, mus:0.22};

  function ctx(){
    if(ac) return ac;
    const AC = window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    ac = new AC();
    master = ac.createGain(); master.gain.value = vol.master; master.connect(ac.destination);
    sfxG = ac.createGain(); sfxG.gain.value = vol.sfx; sfxG.connect(master);
    ambG = ac.createGain(); ambG.gain.value = 0;        ambG.connect(master);
    wxG  = ac.createGain(); wxG.gain.value  = 0;        wxG.connect(master);
    musG = ac.createGain(); musG.gain.value = 0;        musG.connect(master);
    /* one shared noise buffer */
    const len = ac.sampleRate*2;
    noiseBuf = ac.createBuffer(1, len, ac.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for(let i=0;i<len;i++) d[i] = Math.random()*2-1;
    return ac;
  }
  function noiseSrc(){ const s=ctx().createBufferSource(); s.buffer=noiseBuf; s.loop=true; return s; }

  /* --- primitive voices --- */
  function tone(freq, dur, type, gain, dest, slideTo){
    const c=ctx(); if(!c) return;
    const o=c.createOscillator(), g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(freq, c.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20,slideTo), c.currentTime+dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(gain||0.2, c.currentTime+0.012);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime+dur);
    o.connect(g); g.connect(dest||sfxG); o.start(); o.stop(c.currentTime+dur+0.05);
  }
  function noiseHit(dur, f0, f1, gain, q, dest){
    const c=ctx(); if(!c) return;
    const s=noiseSrc(), f=c.createBiquadFilter(), g=c.createGain();
    f.type='bandpass'; f.Q.value=q||1.2;
    f.frequency.setValueAtTime(f0, c.currentTime);
    f.frequency.exponentialRampToValueAtTime(Math.max(40,f1||f0), c.currentTime+dur);
    g.gain.setValueAtTime(0, c.currentTime);
    g.gain.linearRampToValueAtTime(gain||0.2, c.currentTime+0.01);
    g.gain.exponentialRampToValueAtTime(0.0008, c.currentTime+dur);
    s.connect(f); f.connect(g); g.connect(dest||sfxG); s.start(); s.stop(c.currentTime+dur+0.05);
  }

  /* --- the sound set --- */
  const FX = {
    place(){ noiseHit(0.13, 420, 130, 0.34, 0.9); tone(150, 0.16, 'triangle', 0.2, null, 84); },
    build(){ noiseHit(0.2, 700, 180, 0.28, 0.8); tone(196, 0.3, 'triangle', 0.16, null, 147);
             setTimeout(()=>tone(294, 0.26, 'sine', 0.12), 90); },
    plant(){ noiseHit(0.22, 2600, 900, 0.14, 0.7); tone(520, 0.1, 'sine', 0.06, null, 700); },
    water(){ const c=ctx(); if(!c) return;
             noiseHit(0.5, 1500, 400, 0.2, 0.5);
             for(let i=0;i<4;i++) setTimeout(()=>tone(680+Math.random()*500, 0.1, 'sine', 0.05, null, 300), i*70); },
    harvest(){ tone(660, 0.14, 'triangle', 0.2, null, 880); noiseHit(0.16, 3200, 1200, 0.12, 0.8);
               setTimeout(()=>tone(990, 0.16, 'sine', 0.13), 70); },
    collect(){ tone(740, 0.11, 'sine', 0.16, null, 900); setTimeout(()=>tone(1100, 0.13, 'sine', 0.11), 60); },
    coin(){ [1046,1318,1568].forEach((f,i)=> setTimeout(()=>tone(f, 0.2, 'triangle', 0.15), i*55)); },
    sell(){ [784,988,1174,1568].forEach((f,i)=> setTimeout(()=>tone(f, 0.24, 'sine', 0.13), i*60)); },
    level(){ [523,659,784,1046,1318].forEach((f,i)=> setTimeout(()=>tone(f, 0.42, 'triangle', 0.17), i*95)); },
    error(){ tone(196, 0.2, 'square', 0.11, null, 130); },
    click(){ noiseHit(0.05, 2400, 1400, 0.1, 1.6); },
    rotate(){ noiseHit(0.09, 1100, 2200, 0.13, 1.2); },
    remove(){ noiseHit(0.26, 300, 90, 0.26, 0.7); },
    upgrade(){ [392,523,659,880].forEach((f,i)=> setTimeout(()=>tone(f, 0.36, 'triangle', 0.16), i*80));
               setTimeout(()=>noiseHit(0.4, 4000, 1200, 0.1, 0.6), 240); },
    cluck(){ const b=430+Math.random()*120;
             tone(b, 0.07, 'square', 0.05, null, b*1.5);
             setTimeout(()=>tone(b*0.8, 0.09, 'square', 0.04, null, b*0.6), 80); },
    bleat(){ tone(320, 0.3, 'sawtooth', 0.045, null, 250); },
    bee(){ tone(220, 0.5, 'sawtooth', 0.02, null, 210); },
    thunder(){ const c=ctx(); if(!c) return;
      const s=noiseSrc(), f=c.createBiquadFilter(), g=c.createGain();
      f.type='lowpass'; f.frequency.setValueAtTime(300, c.currentTime);
      f.frequency.exponentialRampToValueAtTime(60, c.currentTime+1.8);
      g.gain.setValueAtTime(0, c.currentTime);
      g.gain.linearRampToValueAtTime(0.5, c.currentTime+0.06);
      g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+2.2);
      s.connect(f); f.connect(g); g.connect(wxG); s.start(); s.stop(c.currentTime+2.4); },
  };

  /* --- ambient wind bed + birds --- */
  function startAmbient(){
    const c=ctx(); if(!c || wind) return;
    const s=noiseSrc(), f=c.createBiquadFilter(), g=c.createGain(), lfo=c.createOscillator(), lg=c.createGain();
    f.type='lowpass'; f.frequency.value=420; f.Q.value=0.5;
    g.gain.value=0.5;
    lfo.frequency.value=0.07; lg.gain.value=180;
    lfo.connect(lg); lg.connect(f.frequency); lfo.start();
    s.connect(f); f.connect(g); g.connect(ambG); s.start();
    wind = {s,f,g};
    scheduleBird();
  }
  function scheduleBird(){
    clearTimeout(birdTimer);
    birdTimer = setTimeout(()=>{
      if(!muted && ac && ac.state==='running' && ambG && ambG.gain.value>0.01){
        const base = 1800+Math.random()*1400, n = 2+Math.floor(Math.random()*3);
        for(let i=0;i<n;i++)
          setTimeout(()=> tone(base*(1+Math.random()*0.3), 0.07, 'sine', 0.035, ambG, base*1.6), i*90);
      }
      scheduleBird();
    }, 5000+Math.random()*11000);
  }

  /* --- weather layer --- */
  function setWeather(kind){
    const c=ctx(); if(!c) return;
    const wet = kind==='rain'||kind==='storm';
    if(wet && !rain){
      const s=noiseSrc(), f=c.createBiquadFilter(), g=c.createGain();
      f.type='bandpass'; f.frequency.value = kind==='storm'?900:1500; f.Q.value=0.4;
      g.gain.value=0.6;
      s.connect(f); f.connect(g); g.connect(wxG); s.start();
      rain={s,g}; rainF=f;
    }
    if(rainF) rainF.frequency.setTargetAtTime(kind==='storm'?800:1600, c.currentTime, 1.2);
    const target = muted ? 0 : (kind==='storm'?vol.wx:kind==='rain'?vol.wx*0.65:0);
    wxG.gain.setTargetAtTime(target, c.currentTime, 1.6);
    if(kind==='storm'){
      const boom=()=>{ if(S && S.weather==='storm' && !muted){ FX.thunder();
        setTimeout(boom, 9000+Math.random()*16000); } };
      setTimeout(boom, 2500+Math.random()*6000);
    }
  }

  /* --- slow generative music: pentatonic pad, one note every couple of seconds --- */
  const SCALE = [0,2,4,7,9,12,14,16,19,21];
  function startMusic(){
    if(musTimer) return;
    const step = ()=>{
      const c=ctx();
      if(c && !muted && ac.state==='running' && musG.gain.value>0.005){
        const root = 174.61;                       // F3
        const deg = SCALE[Math.floor(Math.random()*SCALE.length)];
        const f = root*Math.pow(2, deg/12);
        const o=c.createOscillator(), g=c.createGain(), lp=c.createBiquadFilter();
        o.type = musStep%4===0 ? 'triangle' : 'sine';
        o.frequency.value = f;
        lp.type='lowpass'; lp.frequency.value=1400;
        g.gain.setValueAtTime(0, c.currentTime);
        g.gain.linearRampToValueAtTime(0.22, c.currentTime+0.5);
        g.gain.exponentialRampToValueAtTime(0.001, c.currentTime+3.2);
        o.connect(lp); lp.connect(g); g.connect(musG);
        o.start(); o.stop(c.currentTime+3.4);
        if(musStep%4===0){                          // soft bass root
          const b=c.createOscillator(), bg=c.createGain();
          b.type='sine'; b.frequency.value=root/2;
          bg.gain.setValueAtTime(0, c.currentTime);
          bg.gain.linearRampToValueAtTime(0.16, c.currentTime+0.7);
          bg.gain.exponentialRampToValueAtTime(0.001, c.currentTime+4);
          b.connect(bg); bg.connect(musG); b.start(); b.stop(c.currentTime+4.2);
        }
        musStep++;
      }
      musTimer = setTimeout(step, 1900+Math.random()*1500);
    };
    musTimer = setTimeout(step, 1200);
  }

  function unlock(){
    if(started) return;
    const c=ctx(); if(!c) return;
    if(c.state==='suspended') c.resume();
    started=true;
    startAmbient(); startMusic();
    applyMix();
  }
  function applyMix(){
    const c=ctx(); if(!c) return;
    if(muted){
      /* setTargetAtTime only ever approaches zero, so a continuous noise bed
         stays faintly audible. Ramp to a true zero, then stop the clock. */
      [master, ambG, wxG, musG, sfxG].forEach(g=>{
        g.gain.cancelScheduledValues(c.currentTime);
        g.gain.setValueAtTime(g.gain.value, c.currentTime);
        g.gain.linearRampToValueAtTime(0, c.currentTime+0.12);
        g.gain.setValueAtTime(0, c.currentTime+0.13);
      });
      clearTimeout(birdTimer);
      if(muteHold) clearTimeout(muteHold);
      muteHold = setTimeout(()=>{ if(muted && ac && ac.state==='running') ac.suspend(); }, 220);
      return;
    }
    if(muteHold){ clearTimeout(muteHold); muteHold=0; }
    if(ac.state==='suspended') ac.resume();
    [master, sfxG].forEach(g=> g.gain.cancelScheduledValues(c.currentTime));
    master.gain.setTargetAtTime(vol.master, c.currentTime, 0.2);
    sfxG.gain.setTargetAtTime(vol.sfx, c.currentTime, 0.1);
    ambG.gain.cancelScheduledValues(c.currentTime);
    musG.gain.cancelScheduledValues(c.currentTime);
    ambG.gain.setTargetAtTime(S&&S.snd&&S.snd.amb===false?0:vol.amb, c.currentTime, 0.8);
    musG.gain.setTargetAtTime(S&&S.snd&&S.snd.mus===false?0:vol.mus, c.currentTime, 1.2);
    scheduleBird();
    if(S) setWeather(S.weather);
  }

  return {
    unlock, applyMix,
    play(name){ if(muted||!started) return; const f=FX[name]; if(f) try{ f(); }catch(e){} },
    weather(k){ if(started) setWeather(k); },
    setMuted(m){ muted=m; applyMix(); },
    isMuted(){ return muted; },
    debug(){ return ac ? {state:ac.state, master:+master.gain.value.toFixed(4),
      amb:+ambG.gain.value.toFixed(4), wx:+wxG.gain.value.toFixed(4),
      mus:+musG.gain.value.toFixed(4), muted} : {state:'none', muted}; },
    toggleLayer(k,on){ if(!S.snd) S.snd={}; S.snd[k]=on; applyMix(); },
    seasonTint(){ /* birds thin out in winter */
      if(!ambG) return;
      const c=ctx(); if(!c) return;
      const s = S ? S.season : 0;
      ambG.gain.setTargetAtTime(muted?0:(S.snd&&S.snd.amb===false?0:vol.amb*(s===2?0.5:1)), c.currentTime, 2);
    }
  };
})();
function sfx(n){ SND.play(n); }

/* ---------------------------------------------------------------
   1. UPGRADE TIERS  — every building has 4 marks, so the catalogue
      of 44 buildings becomes 176 distinct, visibly different variants.
   --------------------------------------------------------------- */
const TIERS = [
  {n:'Mk I',   sub:'basic',      col:'#a7b79a'},
  {n:'Mk II',  sub:'improved',   col:'#7cc24f'},
  {n:'Mk III', sub:'commercial', col:'#6fb6d8'},
  {n:'Mk IV',  sub:'automated',  col:'#f0c14b'},
];
const MAXTIER = 3;

function tOf(o){ return o.tier||0; }
function upCost(o){ const bp=BPMAP[o.bp]; return Math.round((bp.cost||60)*(0.9+tOf(o)*0.85)+40); }
function canUpgrade(o){ return tOf(o) < MAXTIER && BPMAP[o.bp].kind!=='home'; }

/* effective stats, tier-scaled */
const E = {
  slots:  o=> (BPMAP[o.bp].slots||1) + tOf(o),
  speed:  o=> (BPMAP[o.bp].speed||1) * (1 + tOf(o)*0.16),
  qty:    o=> Math.round((BPMAP[o.bp].qty||0) * (1 + tOf(o)*0.42)),
  cycle:  o=> Math.max(1, +(BPMAP[o.bp].cycle / (1 + tOf(o)*0.2)).toFixed(2)),
  cap:    o=> Math.round((BPMAP[o.bp].cap||0) * (1 + tOf(o)*0.5)),
  per:    o=> +((BPMAP[o.bp].per||0) * (1 + tOf(o)*0.32)).toFixed(2),
  income: o=> Math.round((BPMAP[o.bp].income||0) * (1 + tOf(o)*0.5)),
  rate:   o=> +((BPMAP[o.bp].rate||0) * (1 + tOf(o)*0.45)).toFixed(2),
  gen:    o=> +((BPMAP[o.bp].power>0?BPMAP[o.bp].power:0) * (1 + tOf(o)*0.5)).toFixed(1),
  wcap:   o=> Math.round((BPMAP[o.bp].cap||0) * (1 + tOf(o)*0.6)),
  gain:   o=> Math.round((BPMAP[o.bp].gain||0) * (1 + tOf(o)*0.5)),
  charm:  o=> Math.round((BPMAP[o.bp].charm||0) * (1 + tOf(o)*0.35)),
  feed:   o=> +((BPMAP[o.bp].feed||0) * (1 + tOf(o)*0.5)).toFixed(1),
};

function upgrade(id){
  const o = S.objs.find(z=>z.id===id); if(!o) return;
  if(!canUpgrade(o)) return toast('Already at Mk IV','bad'), sfx('error');
  const c = upCost(o);
  if(S.cash < c) return toast(`Need ${fmt(c-S.cash)} more`,'bad'), sfx('error');
  S.cash -= c; o.tier = tOf(o)+1;
  addXP(Math.round(c/12)+6);
  sfx('upgrade');
  toast(`${BPMAP[o.bp].name} → ${TIERS[o.tier].n}`,'gold');
  log(`Upgraded ${BPMAP[o.bp].name} to ${TIERS[o.tier].n} for ${fmt(c)}.`,'gold');
  render(); ui(); G.save();
}
