/* ---------------------------------------------------------------
   2. LIVING ANIMALS — each beast has a position and wanders or runs
      around its pen, updated on its own light timer.
   --------------------------------------------------------------- */
const SPECIES = {
  chicken:{sc:0.95, walk:5.5, run:17, restless:0.9, sound:'cluck'},
  duck   :{sc:0.95, walk:4.5, run:12, restless:0.7, sound:'cluck'},
  goat   :{sc:1.0,  walk:4.0, run:13, restless:0.6, sound:'bleat'},
  sheep  :{sc:1.0,  walk:3.0, run:10, restless:0.4, sound:'bleat'},
  rabbit :{sc:0.85, walk:6.0, run:20, restless:1.0, sound:'cluck'},
  hive   :{sc:0.6,  walk:0,   run:0,  restless:0,   sound:'bee'},
};

function penBounds(o){
  const f = footprint(BPMAP[o.bp], o.rot);
  return {x0:o.tx*T+10, y0:o.ty*T+10, x1:(o.tx+f.w)*T-10, y1:(o.ty+f.h)*T-10};
}
function syncHerd(o){
  const bp = BPMAP[o.bp];
  if(bp.kind!=='animal' || bp.animal==='hive') return;
  if(!o.herd) o.herd = [];
  const b = penBounds(o);
  while(o.herd.length < o.animals){
    o.herd.push({
      x: b.x0 + Math.random()*(b.x1-b.x0), y: b.y0 + Math.random()*(b.y1-b.y0),
      tx:0, ty:0, dir:1, run:0, wait:Math.random()*3,
      age:0, health:1, happy:0.8
    });
    const a = o.herd[o.herd.length-1]; a.tx=a.x; a.ty=a.y;
  }
  while(o.herd.length > o.animals) o.herd.pop();
}
function tickLife(dt){
  if(!S || S.speed===0) return;
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind!=='animal' || bp.animal==='hive' || !o.herd) return;
    const sp = SPECIES[bp.animal] || SPECIES.chicken;
    const b = penBounds(o);
    const crowd = o.animals / Math.max(1, E.cap(o));
    o.herd.forEach(a=>{
      a.wait -= dt;
      if(a.wait <= 0){
        /* pick somewhere new; sometimes bolt for it */
        a.tx = b.x0 + Math.random()*Math.max(1,(b.x1-b.x0));
        a.ty = b.y0 + Math.random()*Math.max(1,(b.y1-b.y0));
        a.run = Math.random() < (0.18 + sp.restless*0.12 + crowd*0.1) ? 1 : 0;
        a.wait = a.run ? 0.7+Math.random()*1.2 : 1.6+Math.random()*3.4;
        if(Math.random()<0.02 && !SND.isMuted()) sfx(sp.sound);
      }
      const dx = a.tx-a.x, dy = a.ty-a.y, d = Math.hypot(dx,dy);
      if(d > 1.5){
        const v = (a.run ? sp.run : sp.walk) * (0.6+a.health*0.4) * dt;
        a.x += dx/d*v; a.y += dy/d*v;
        if(Math.abs(dx) > 0.4) a.dir = dx > 0 ? 1 : -1;
        a.moving = 1;
      } else a.moving = 0;
      a.x = clamp(a.x, b.x0, b.x1); a.y = clamp(a.y, b.y0, b.y1);
    });
  });
  paintHerd();
}
/* the herd lives in its own SVG layer so movement never re-renders the scene */
function herdLayer(){
  let s = '';
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind!=='animal' || bp.animal==='hive') return;
    syncHerd(o);
    (o.herd||[]).forEach((a,i)=>{
      const sp = SPECIES[bp.animal] || SPECIES.chicken;
      s += `<g class="beast" data-b="${o.id}_${i}" transform="translate(${n(a.x)},${n(a.y)})">
        <g class="bwalk"><g transform="scale(${a.dir},1)">${beast(bp.animal, 0, 0, sp.sc, false)}</g></g></g>`;
    });
  });
  return `<g id="herd">${s}</g>`;
}
function paintHerd(){
  S.objs.forEach(o=>{
    if(!o.herd) return;
    o.herd.forEach((a,i)=>{
      const el = document.querySelector(`[data-b="${o.id}_${i}"]`);
      if(!el) return;
      el.setAttribute('transform', `translate(${n(a.x)},${n(a.y)})`);
      const inner = el.firstElementChild;
      if(inner){
        inner.setAttribute('class', 'bwalk' + (a.moving ? (a.run ? ' running' : ' walking') : ''));
        const flip = inner.firstElementChild;
        if(flip) flip.setAttribute('transform', `scale(${a.dir},1)`);
      }
    });
  });
}

/* ---------------------------------------------------------------
   3. HUSBANDRY & SOIL — cleanliness, health, breeding, fertility, weeds
   --------------------------------------------------------------- */
function initCare(o){
  const bp = BPMAP[o.bp];
  if(bp.kind==='animal'){ if(o.care===undefined) o.care=1; if(o.sick===undefined) o.sick=0; }
  if(bp.kind==='plot'){ if(o.fert===undefined) o.fert=1; if(o.weeds===undefined) o.weeds=0; if(o.last===undefined) o.last=null; }
}
function herdHealth(o){
  if(!o.herd||!o.herd.length) return 1;
  return o.herd.reduce((a,b)=>a+b.health,0)/o.herd.length;
}
function herdHappy(o){
  if(!o.herd||!o.herd.length) return 1;
  return o.herd.reduce((a,b)=>a+b.happy,0)/o.herd.length;
}
/* how productive this pen is right now, 0..1.4 */
function yieldMul(o){
  const bp = BPMAP[o.bp];
  if(bp.animal==='hive') return 1 + tOf(o)*0.1;
  const crowd = o.animals / Math.max(1, E.cap(o));
  const space = crowd > 0.85 ? 0.78 : crowd > 0.6 ? 0.92 : 1.05;
  return clamp((0.35 + herdHealth(o)*0.45 + herdHappy(o)*0.3) * space * (o.sick?0.5:1), 0.15, 1.45);
}
function dailyHusbandry(o){
  const bp = BPMAP[o.bp];
  if(bp.kind!=='animal' || !o.animals) return;
  initCare(o);
  const crowd = o.animals / Math.max(1, E.cap(o));
  /* bedding gets dirty faster when the pen is full */
  o.care = clamp(o.care - (0.1 + crowd*0.16), 0, 1);
  const fed = !o.hungry;
  const watered = S.water > 5;
  if(watered) S.water -= Math.min(S.water, o.animals*0.6);
  (o.herd||[]).forEach(a=>{
    a.age += 1;
    const good = (fed?0.5:-0.5) + (o.care>0.45?0.3:-0.4) + (watered?0.2:-0.3) + (crowd>0.85?-0.2:0.1);
    a.happy  = clamp(a.happy  + good*0.22, 0, 1);
    a.health = clamp(a.health + (good>0 ? 0.1 : -0.16) - (o.sick?0.12:0), 0, 1);
  });
  /* disease risk climbs with filth and crowding */
  if(!o.sick && Math.random() < (1-o.care)*0.14 + crowd*0.05){
    o.sick = 1; log(`Illness in the ${bp.name}. Treat it before it spreads.`,'bad');
  }
  /* healthy, happy, uncrowded stock breeds */
  if(!o.sick && o.animals < E.cap(o) && herdHappy(o) > 0.7 && o.care > 0.55 && Math.random() < 0.1){
    o.animals++; syncHerd(o);
    log(`A ${bp.animal} was born in the ${bp.name}.`,'good');
    toast(`New ${bp.animal} born!`,'good');
  }
}
function dailySoil(o){
  const bp = BPMAP[o.bp];
  if(bp.kind!=='plot') return;
  initCare(o);
  if(o.crop){
    o.weeds = clamp(o.weeds + 0.13, 0, 1);
    if(o.weeds > 0.55) o.stage = Math.max(0, o.stage - 0.02);
  }
}
function cropMul(o){
  initCare(o);
  const rot = (o.crop && o.last && o.last !== o.crop) ? 1.15 : 1;
  return clamp((0.45 + o.fert*0.55) * rot * (1 - o.weeds*0.3), 0.3, 1.6);
}

/* ---------------------------------------------------------------
   4. AUTOMATION — modules run from the control hub. Each costs power
      and a daily service fee, and only works if the hub can carry it.
   --------------------------------------------------------------- */
const AUTOS = [
  {id:'irrigation', n:'Irrigation controller', hub:0, power:2, fee:6,  ic:'💧',
   d:'Waters any bed whose moisture drops below your threshold, every morning.',
   tip:'Ends hand-watering. Needs water in storage to actually do anything.'},
  {id:'harvest',    n:'Harvest drone',         hub:1, power:3, fee:14, ic:'🚁',
   d:'Picks every bed and orchard the moment it is ripe and stores the crop.',
   tip:'Nothing sits ripe and rotting while you are looking elsewhere.'},
  {id:'livestock',  n:'Livestock robot',       hub:1, power:3, fee:12, ic:'🤖',
   d:'Collects eggs, milk and honey, and mucks out every pen daily.',
   tip:'Cleanliness is what keeps animals healthy and breeding.'},
  {id:'agronomy',   n:'Agronomy AI',           hub:2, power:2, fee:16, ic:'🌱',
   d:'Replants every empty bed with the most profitable crop for the season.',
   tip:'It reads season, price and growth time, then picks the best margin.'},
  {id:'logistics',  n:'Logistics AI',          hub:2, power:3, fee:18, ic:'📦',
   d:'Fills any order it can, then sells surplus above your reserve.',
   tip:'Orders are always paid first — they beat market price.'},
  {id:'agrivoltaic',n:'Grid optimiser',        hub:3, power:0, fee:10, ic:'⚡',
   d:'Balances generation and storage. Adds 25% to everything you generate.',
   tip:'Worth it once greenhouses and processing are eating your power.'},
];
const AUTOMAP = {}; AUTOS.forEach(a=>AUTOMAP[a.id]=a);

function hub(){ return S.objs.find(o=>o.bp==='ai_hub'); }
function hubTier(){ const h = hub(); return h ? tOf(h) : -1; }
function autoOn(id){
  const h = hub();
  return !!(h && S.auto && S.auto[id] && hubTier() >= AUTOMAP[id].hub);
}
function autoList(){ return AUTOS.filter(a=>autoOn(a.id)); }
function autoPower(){ return autoList().reduce((a,b)=>a+b.power,0); }
function autoFees(){ return autoList().reduce((a,b)=>a+b.fee,0); }

function bestCropFor(o){
  const bp = BPMAP[o.bp];
  let best=null, bestScore=-1;
  Object.keys(CROPS).forEach(k=>{
    const cr = CROPS[k];
    const inS = cr.seasons.includes(S.season) || bp.shelter;
    const days = cr.days / (E.speed(o));
    const cost = Math.round(cr.seed*E.slots(o)*(1-stat().seedoff));
    const worth = cr.yield*E.slots(o)*sellPrice(k);
    const score = (worth - cost) / Math.max(0.6, days) * (inS?1:0.45);
    if(score > bestScore && S.cash > cost*2){ bestScore=score; best=k; }
  });
  return best;
}

function runAutomation(){
  if(!hub()) return;
  const acts = [];
  const st = stat();
  const powered = st.power >= st.use;
  S.autoPowered = powered;
  if(!powered && autoList().some(a=>a.power>0)){
    log('AI modules throttled — not enough power. Add solar or a turbine.','bad');
  }

  if(autoOn('irrigation')){
    const th = (S.autoCfg && S.autoCfg.moist) || 0.5;
    let cnt=0;
    S.objs.forEach(o=>{
      if(BPMAP[o.bp].kind==='plot' && o.crop && o.water < th && S.water >= 8){ S.water-=8; o.water=1; cnt++; }
    });
    if(cnt) acts.push(`watered ${cnt} bed${cnt>1?'s':''}`);
  }
  if(autoOn('harvest') && powered){
    let cnt=0, gained=0;
    S.objs.forEach(o=>{
      const bp = BPMAP[o.bp];
      if(bp.kind==='plot' && o.crop && o.stage>=1){
        const cr=CROPS[o.crop];
        const q = Math.max(1, Math.round(cr.yield*E.slots(o)*(1+st.workbonus)*cropMul(o)));
        give(o.crop,q); o.fert=clamp(o.fert-0.16,0.15,1); o.last=o.crop;
        o.crop=null; o.stage=0; o.weeds=0; cnt++; gained+=q; addXP(2);
      } else if(bp.kind==='perennial' && o.stage>=1){
        give(bp.good, E.qty(o)); o.stage=0; cnt++; gained+=E.qty(o); addXP(2);
      }
    });
    if(cnt) acts.push(`harvested ${cnt} plot${cnt>1?'s':''} (${gained} units)`);
  }
  if(autoOn('livestock') && powered){
    let col=0, cleaned=0;
    S.objs.forEach(o=>{
      const bp = BPMAP[o.bp];
      if(bp.kind!=='animal') return;
      if(o.ready>0){ give(bp.good, o.ready); col+=o.ready; o.ready=0; addXP(1); }
      if(o.care!==undefined && o.care<0.9){ o.care=1; cleaned++; }
    });
    if(col) acts.push(`collected ${col} product${col>1?'s':''}`);
    if(cleaned) acts.push(`cleaned ${cleaned} pen${cleaned>1?'s':''}`);
  }
  if(autoOn('agronomy') && powered){
    let cnt=0;
    S.objs.forEach(o=>{
      if(BPMAP[o.bp].kind!=='plot' || o.crop) return;
      const k = bestCropFor(o); if(!k) return;
      const cost = Math.round(CROPS[k].seed*E.slots(o)*(1-st.seedoff));
      if(S.cash < cost) return;
      S.cash-=cost; o.crop=k; o.stage=0; o.pest=0; o.weeds=0; o.water=Math.max(o.water,0.7); cnt++;
    });
    if(cnt) acts.push(`sowed ${cnt} bed${cnt>1?'s':''}`);
  }
  if(autoOn('logistics')){
    let filled=0, sold=0, made=0;
    S.contracts.slice().forEach(c=>{
      if((S.store[c.gid]||0) >= c.qty){
        S.store[c.gid]-=c.qty; if(S.store[c.gid]<=0) delete S.store[c.gid];
        S.cash+=c.pay; S.totalEarned+=c.pay; made+=c.pay; addXP(Math.round(c.pay/14));
        S.contracts = S.contracts.filter(z=>z.id!==c.id); filled++;
      }
    });
    const reserve = (S.autoCfg && S.autoCfg.reserve) || 10;
    Object.keys(S.store).forEach(k=>{
      const over = S.store[k] - reserve;
      if(over > 0){
        const v = over*sellPrice(k);
        S.store[k] = reserve; S.cash += v; S.totalEarned += v; made += v; sold += over;
      }
    });
    if(filled) acts.push(`filled ${filled} order${filled>1?'s':''}`);
    if(sold) acts.push(`sold ${sold} surplus for ${fmt(made)}`);
  }

  const fee = autoFees();
  if(fee){ S.cash -= fee; }
  S.autoLog = acts;
  if(acts.length){
    log(`AI: ${acts.join(', ')}. Service ${fmt(fee)}.`, 'good');
  } else if(fee){
    S.autoLog = [powered ? 'nothing needed doing' : 'throttled — not enough power'];
    log(`AI on standby, nothing to do. Service ${fmt(fee)}.`);
  }
}

/* ---------------------------------------------------------------
   1. WIND — one number the whole world leans to
   --------------------------------------------------------------- */
function windNow(){
  const w = WEATHERS[S.weather];
  const base = {sun:0.25, cloud:0.5, rain:0.7, storm:1.55, frost:0.35, heat:0.4}[S.weather] || 0.4;
  const land = LANDMAP[S.landId] || {};
  return clamp(base * (1 + (land.wind||0)), 0.1, 2.2);
}
function applyWind(){
  if(S.settings && S.settings.motion === false){
    document.documentElement.style.setProperty('--wind-a','0deg');
    document.documentElement.style.setProperty('--wind-t','0s');
    return;
  }
  const w = windNow();
  document.documentElement.style.setProperty('--wind-a', (w*3.4).toFixed(2)+'deg');
  document.documentElement.style.setProperty('--wind-t', (5.6/Math.max(0.25,w)).toFixed(2)+'s');
  document.documentElement.style.setProperty('--wind-s', (1+w*0.02).toFixed(3));
  const world = document.getElementById('world');
  if(world) world.dataset.wx = S.weather;
}

/* weather particles: rain streaks, sand haze, snow */
function weatherLayer(){
  const w = S.weather;
  if(S.settings && S.settings.particles === false) return '';
  const land = LANDMAP[S.landId] || {};
  const dusty = land.dust;
  let s = '';
  if(w==='rain' || w==='storm'){
    const n0 = w==='storm' ? 150 : 80;
    for(let i=0;i<n0;i++){
      const x = hash(i*1.7)*WPX, y = hash(i*3.3)*HPX, len = w==='storm'?16:11;
      s += `<line class="rainline" x1="${n(x)}" y1="${n(y)}" x2="${n(x-4)}" y2="${n(y+len)}"
        stroke="#cfe6f5" stroke-width="1" opacity=".5" style="animation-delay:${(hash(i)*1.2).toFixed(2)}s"/>`;
    }
  }
  if(w==='frost'){
    for(let i=0;i<70;i++)
      s += `<circle class="snowflake" cx="${n(hash(i*2.1)*WPX)}" cy="${n(hash(i*4.4)*HPX)}" r="${(1+hash(i)*1.4).toFixed(1)}"
        fill="#fff" opacity=".7" style="animation-delay:${(hash(i*3)*3).toFixed(2)}s"/>`;
  }
  if(dusty && (w==='sun'||w==='heat')){
    for(let i=0;i<26;i++)
      s += `<ellipse class="dust" cx="${n(hash(i*5.1)*WPX)}" cy="${n(hash(i*2.7)*HPX)}"
        rx="${n(30+hash(i)*70)}" ry="${n(8+hash(i+2)*14)}" fill="#d8c9a0" opacity=".13"
        style="animation-delay:${(hash(i)*6).toFixed(2)}s"/>`;
  }
  return s ? `<g id="wxlayer" pointer-events="none">${s}</g>` : '';
}

/* biome bends the weather table */
function landWeatherTable(){
  const l = LANDMAP[S.landId];
  const base = [
    ['sun','sun','sun','heat','cloud','rain'],
    ['sun','cloud','cloud','rain','rain','storm'],
    ['cloud','rain','rain','frost','frost','storm'],
    ['sun','sun','cloud','rain','cloud','rain'],
  ][S.season].slice();
  if(!l) return base;
  if(l.rain > 0.2) base.push('rain');
  if(l.rain < -0.2){ for(let i=base.length-1;i>=0;i--) if(base[i]==='rain') base.splice(i,1); base.push('sun','heat'); }
  if(l.wind > 0.5) base.push('storm');
  if(l.warm < -0.2) base.push('frost');
  if(l.warm > 0.2) base.push('heat');
  if(l.sun > 0.2) base.push('sun');
  return base;
}

function coachTips(){
  const st = stat(), tips = [];
  const beds = S.objs.filter(o=>BPMAP[o.bp].kind==='plot');
  const empty = beds.filter(b=>!b.crop);
  const dry = beds.filter(b=>b.crop && b.water<0.25);
  const ripe = S.objs.filter(o=>['plot','perennial'].includes(BPMAP[o.bp].kind) && o.stage>=1);
  const pens = S.objs.filter(o=>BPMAP[o.bp].kind==='animal');
  const barn = Object.keys(S.store).reduce((a,k)=>a+S.store[k]*sellPrice(k),0);
  const out = typeof outgoings==='function' ? outgoings() : {total:0};

  if(dry.length) tips.push({p:1, t:`${dry.length} bed${dry.length>1?'s are':' is'} too dry to grow`,
    w:'A bed below 16% moisture makes no progress at all — you are paying rates on idle land.'});
  if(ripe.length) tips.push({p:1, t:`${ripe.length} crop${ripe.length>1?'s are':' is'} ready`,
    w:'Ripe crops sit there earning nothing. Harvest, then replant the same day.'});
  if(!S.objs.some(o=>BPMAP[o.bp].kind==='water')) tips.push({p:1, t:'You have no water storage',
    w:'Without a tank, rain runs straight off your land and your beds stall in the first dry spell.'});
  if(empty.length > 2) tips.push({p:2, t:`${empty.length} beds are empty`,
    w:'Idle beds still cost rates. Sow anything — even lettuce turns a profit in two days.'});
  if(st.short) tips.push({p:1, t:'You are short of power',
    w:'Greenhouses, pumps and AI modules all run at reduced output until you add generation.'});
  if(S.feed < 6 && pens.some(p=>p.animals>0)) tips.push({p:1, t:'Feed is nearly out',
    w:'Hungry animals stop producing entirely. A fodder patch grows feed free, forever.'});
  const dirty = pens.filter(p=>(p.care||1) < 0.4);
  if(dirty.length) tips.push({p:2, t:`${dirty.length} pen${dirty.length>1?'s need':' needs'} mucking out`,
    w:'Filthy bedding causes illness, which halves output and stops breeding.'});
  if(barn > 400) tips.push({p:2, t:`${fmt(barn)} sitting in the barn`,
    w:'Produce does not appreciate. Sell it, or hold only what your recipes and orders need.'});
  if(st.charm < 40 && S.objs.some(o=>BPMAP[o.bp].kind==='tourism')) tips.push({p:2,
    t:'Your tourism buildings are underperforming', w:'Charm multiplies every visitor dollar. Flowers and a pond are the cheapest charm you can buy.'});
  if(S.career && S.career.loan > 0) tips.push({p:2, t:`${fmt(S.career.loan)} of debt at 4.5% a month`,
    w:'Interest compounds against you every payday. Clear it before you expand again.'});
  if(out.total > 0 && S.cash < out.total) tips.push({p:1, t:'You cannot cover this month’s bills',
    w:`Bills come to ${fmt(out.total)}. Take client work or sell stock before payday.`});
  if(!S.objs.some(o=>o.bp==='compost')) tips.push({p:3, t:'No compost bays yet',
    w:'A flat 18% growth bonus on every crop, forever, for $110. It pays back in days.'});
  if(!S.objs.some(o=>o.bp==='ai_hub') && S.lvl>=5) tips.push({p:3, t:'Consider a control hub',
    w:'Automation removes the daily chores so you can play the economy instead of the checklist.'});
  if(!tips.length) tips.push({p:3, t:'The farm is in good order',
    w:'Nothing urgent. Good time to expand, upgrade a building, or take on client work.'});
  return tips.sort((a,b)=>a.p-b.p).slice(0,5);
}

function salary(){
  const p = prof(), c = S.career;
  return Math.round(p.pay * (0.55 + c.skill*0.16) * (1 - c.burnout*0.3));
}
function skillNext(){ return Math.round(120*Math.pow(S.career.skill,1.5)); }

/* --- monthly outgoings: this is what keeps the game honest --- */
function outgoings(){
  careerInit();
  const built = S.objs.filter(o=>BPMAP[o.bp].kind!=='decor').length;
  const tiers = S.objs.reduce((a,o)=>a+tOf(o),0);
  const rates   = Math.round(120 + built*26 + tiers*34);            // council rates on what you own
  const upkeep  = Math.round(S.objs.reduce((a,o)=>a+(BPMAP[o.bp].cost||0)*0.012,0));
  const wages   = (typeof workerWages==='function' ? workerWages() : 0);
  const interest= Math.round(S.career.loan * S.career.rate);
  const ai      = (typeof autoFees==='function' ? autoFees()*30 : 0);
  return {rates, upkeep, wages, interest, ai, total: rates+upkeep+wages+interest+ai};
}

/* --- client work: spend hours today, get paid now --- */
function rollJobs(){
  careerInit();
  const p = prof();
  const kinds = [
    ['Quick audit', 0.6, 0.5], ['Campaign sprint', 1.6, 1.5], ['Retainer block', 3.2, 3.0],
    ['Rush job', 1.0, 0.8], ['Strategy session', 1.2, 1.0], ['Full project', 5.0, 4.5]
  ];
  const clients = ['Halcyon Co','Nordvik','Bright & Vane','Merrow Labs','Pike Street','Ashgrove',
                   'Tenby Group','Kestrel Media','Lumen Works','Orchid Digital'];
  while(S.career.jobs.length < 4){
    const k = kinds[Math.floor(Math.random()*kinds.length)];
    const hrs = +(k[1]*(0.75+Math.random()*0.6)).toFixed(1);
    const rate = (p.pay/160) * (1 + S.career.skill*0.13) * (0.9+Math.random()*0.5);
    S.career.jobs.push({
      id:'j'+Date.now()+Math.random().toString(36).slice(2,6),
      who: clients[Math.floor(Math.random()*clients.length)],
      kind: k[0], hrs, pay: Math.round(rate*hrs*8), left: 2+Math.floor(Math.random()*4)
    });
  }
}
function takeJob(id){
  careerInit();
  const j = S.career.jobs.find(z=>z.id===id); if(!j) return;
  if(S.career.hours < j.hrs) return toast(`Only ${S.career.hours.toFixed(1)}h left today`,'bad'), sfx('error');
  S.career.hours -= j.hrs; S.career.worked += j.hrs;
  S.cash += j.pay; S.totalEarned += j.pay;
  S.career.cxp += Math.round(j.hrs*9);
  while(S.career.cxp >= skillNext() && S.career.skill < prof().ceil){
    S.career.cxp -= skillNext(); S.career.skill++;
    toast(`${prof().name} — skill level ${S.career.skill}`,'gold'); sfx('level');
  }
  S.career.jobs = S.career.jobs.filter(z=>z.id!==id);
  rollJobs();
  sfx('coin');
  log(`${j.kind} for ${j.who}: ${j.hrs}h → ${fmt(j.pay)}.`,'gold');
  ui(); G.save();
}
/* farm work also draws down the same clock */
function spendHours(kind){
  careerInit();
  const h = TASK_HOURS[kind] || 0.3;
  S.career.hours = Math.max(0, S.career.hours - h);
  return h;
}
function hoursLeft(){ careerInit(); return S.career.hours; }

/* --- payday and bills, once a month --- */
function monthlyReckoning(){
  careerInit();
  const c = S.career;
  const pay = salary();
  const out = outgoings();
  S.cash += pay;  S.totalEarned += pay;
  S.cash -= out.total;
  if(c.loan > 0){
    const repay = Math.min(c.loan, Math.round(c.loan*0.08));
    if(S.cash > repay){ S.cash -= repay; c.loan -= repay; }
  }
  log(`Payday: ${fmt(pay)} salary. Bills: ${fmt(out.total)}.`, pay>out.total?'gold':'bad');
  toast(`Payday ${fmt(pay)} · bills ${fmt(out.total)}`, pay>out.total?'gold':'bad');
  sfx(pay>out.total?'sell':'error');
  /* overwork burns you out and cuts your pay until you rest */
  const avgWorked = c.worked/30;
  c.burnout = clamp(avgWorked > 6 ? c.burnout+0.15 : c.burnout-0.2, 0, 0.6);
  if(c.burnout > 0.35) log('You are overworked — your pay is suffering. Farm more, bill less.','bad');
  c.worked = 0;
  if(S.cash < 0){
    const need = Math.ceil(-S.cash/500)*500;
    c.loan += need; S.cash += need;
    log(`Overdrawn — the bank extended ${fmt(need)} of credit at 4.5%/mo.`,'bad');
    toast('You went into debt','bad');
  }
}
function borrow(amt){
  careerInit();
  const limit = 6000 + S.lvl*1500;
  if(S.career.loan + amt > limit) return toast(`Credit limit is ${fmt(limit)}`,'bad'), sfx('error');
  S.career.loan += amt; S.cash += amt; sfx('coin');
  log(`Borrowed ${fmt(amt)} at 4.5% a month.`,'gold'); ui(); G.save();
}
function repay(amt){
  careerInit();
  amt = Math.min(amt, S.career.loan, S.cash);
  if(amt <= 0) return sfx('error');
  S.career.loan -= amt; S.cash -= amt; sfx('coin');
  log(`Repaid ${fmt(amt)} of debt.`); ui(); G.save();
}
function switchProf(id){
  careerInit();
  const p = PROFS.find(z=>z.id===id); if(!p) return;
  const cost = Math.round(p.pay*0.6);
  if(S.cash < cost) return toast(`Retraining costs ${fmt(cost)}`,'bad'), sfx('error');
  S.cash -= cost;
  S.career.profId = id;
  S.career.skill = Math.max(1, Math.floor(S.career.skill*0.6));
  S.career.cxp = 0; S.career.jobs = []; rollJobs();
  sfx('upgrade'); toast(`Now working as: ${p.name}`,'gold');
  log(`Retrained as ${p.name} for ${fmt(cost)}.`,'gold');
  ui(); G.save();
}

/* called once per game day */
function careerDay(){
  careerInit();
  const c = S.career;
  c.hours = HOURS_PER_DAY * (1 - c.burnout*0.25);
  c.jobs.forEach(j=>j.left--);
  c.jobs = c.jobs.filter(j=>j.left>0);
  rollJobs();
  if(S.day % c.salaryDay === 0) monthlyReckoning();
}

/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);

function fmt(v){ return '$'+Math.round(v).toLocaleString(); }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function footprint(bp, rot){ return (rot===90||rot===270) ? {w:bp.h,h:bp.w} : {w:bp.w,h:bp.h}; }
function obAt(tx,ty){
  return S.objs.find(o=>{
    const f = footprint(BPMAP[o.bp], o.rot);
    return tx>=o.tx && tx<o.tx+f.w && ty>=o.ty && ty<o.ty+f.h;
  });
}
function overlaps(tx,ty,f,skipId){
  if(tx<FARM.x||ty<FARM.y||tx+f.w>FARM.x+FARM.w||ty+f.h>FARM.y+FARM.h) return true;
  return S.objs.some(o=>{
    if(o.id===skipId) return false;
    const g = footprint(BPMAP[o.bp], o.rot);
    return !(tx+f.w<=o.tx || tx>=o.tx+g.w || ty+f.h<=o.ty || ty>=o.ty+g.h);
  });
}

function place(bpId, tx, ty, rot, free){

/* ---------------- derived farm-wide numbers ---------------- */
function stat(){
  let power=0, use=0, charm=0, feedGain=0, waterCap=0, waterGain=0, tour=0,
      fert=0, seedoff=0, pricebonus=0, workbonus=0, craftspeed=0, tourmul=1,
      autowater=0, pollinate=0, shelter=0, ducks=0, buffer=0;
  S.objs.forEach(o=>{
    const b = BPMAP[o.bp];
    if(b.power>0) power += E.gen(o); else if(b.power<0) use += -b.power;
    charm += E.charm(o);
    if(b.kind==='feed') feedGain += E.feed(o);
    if(b.kind==='water'){ waterCap += E.wcap(o); waterGain += E.gain(o); }
    if(b.kind==='tourism') tour += E.income(o);
    fert += b.fert||0; seedoff += b.seedoff||0; pricebonus += b.price||0;
    workbonus += b.speedwork||0; craftspeed += b.craftspeed||0;
    tourmul += b.tour||0; autowater += b.autowater||0; shelter += b.shelter||0;
    if(b.pollinate) pollinate += o.animals||0;
    if(b.animal==='duck') ducks += o.animals||0;
    if(b.buffer) buffer += 1;
  });
  const w = WEATHERS[S.weather];
  const gen = power * (BPMAP.wind && S.objs.some(o=>o.bp==='wind') ? 1 : 1) * w.power;
  const genAdj = S.objs.reduce((a,o)=>{
    const b=BPMAP[o.bp];
    if(b.kind!=='power'||!b.power) return a;
    return a + E.gen(o)*(b.storm ? (1.6 - w.power*0.4) : w.power);
  }, 0) * (typeof autoOn==='function' && autoOn('agrivoltaic') ? 1.25 : 1)
    + (S.objs.some(o=>o.bp==='cabin') ? 8*w.power : 0);
  use += (typeof autoPower==='function' ? autoPower() : 0);
  return {power:Math.round(genAdj), use, charm, feedGain, waterCap, waterGain, tour,
    fert, seedoff:Math.min(0.6,seedoff), pricebonus, workbonus, craftspeed, tourmul,
    autowater, pollinate, shelter, ducks, buffer,
    short: genAdj + buffer*3 < use};
}
function charmMul(){ const c = stat().charm; return 1 + Math.min(2.2, c/90); }
function sellPrice(gid){
  const g = GOODS[gid];
  return Math.max(1, Math.round(g.p * (S.prices[gid]||1) * (1+stat().pricebonus)));
}

  }
  [[40,50],[130,36],[300,30],[640,28],[980,40],[1150,150],[1180,520],[70,700],[420,790],[820,800],[1130,700],[26,340]]
    .forEach((p,k)=>{ s += canopy(p[0],p[1],16+hash(k)*9,'url(#gCanopyD)',k+20,true); });
  /* road along the right edge */
  s += `<path d="M${WPX-52} -20 L${WPX-14} ${HPX+20} L${WPX+40} ${HPX+20} L${WPX+40} -20 Z" fill="#a89f88"/>`;
  s += `<path d="M${WPX-34} -20 L${WPX+4} ${HPX+20}" stroke="#8b8371" stroke-width="2" opacity=".6"/>`;
  /* the property */

  s += `<rect x="${px}" y="${py}" width="${pw}" height="${ph}" rx="6" fill="url(#gLawn)"/>`;
  for(let i=0;i<Math.floor(pw/48);i++)
    s += `<rect x="${n(px+i*48)}" y="${py}" width="24" height="${ph}" fill="#fff" opacity=".035"/>`;
  s += grain(px,py,pw,ph,0.16);
  /* scattered grass tufts and clover so the lawn is not flat colour */
  for(let i=0;i<520;i++){
    const gx = px+2+hash(i*1.31)*(pw-4), gy = py+2+hash(i*2.77+9)*(ph-4);
    const len = 2.4+hash(i*3.7)*3.4, lean = (hash(i*5.1)-0.5)*2.6;
    const c = i%9===0 ? '#9dc46a' : i%5===0 ? '#5b8438' : '#79a44e';
    s += `<path d="M${n(gx)} ${n(gy)} q ${n(lean)} ${n(-len*0.6)} ${n(lean*1.7)} ${n(-len)}"
      stroke="${c}" stroke-width="${(0.6+hash(i)*0.5).toFixed(1)}" fill="none" stroke-linecap="round" opacity=".75"/>`;
  }

    const gx = px+hash(i*4.3)*pw, gy = py+hash(i*6.1+3)*ph;
    s += `<ellipse cx="${n(gx)}" cy="${n(gy)}" rx="${n(14+hash(i)*26)}" ry="${n(9+hash(i+5)*16)}"
      fill="${i%3?'#6d9445':'#87ad5b'}" opacity=".3"/>`;
  }
  /* boundary hedge */
  const hb=15;
  s += `<g transform="translate(${px-hb/2},${py-hb/2})">${hedge(pw+hb,hb)}</g>`;
  s += `<g transform="translate(${px-hb/2},${py+ph-hb/2})">${hedge(pw+hb,hb)}</g>`;
  s += `<g transform="translate(${px-hb/2},${py-hb/2})">${hedge(hb,ph+hb)}</g>`;
  s += `<g transform="translate(${px+pw-hb/2},${py-hb/2})">${hedge(hb,ph+hb)}</g>`;
  /* driveway from the road */
  const dy = py+ph*0.32;
  s += `<path d="M${WPX-40} ${n(dy+16)} C ${WPX-150} ${n(dy)}, ${n(px+pw-60)} ${n(dy)}, ${n(px+pw-4)} ${n(dy)}" stroke="#9d9276" stroke-width="30" fill="none" stroke-linecap="round"/>`;
  s += `<path d="M${WPX-40} ${n(dy+16)} C ${WPX-150} ${n(dy)}, ${n(px+pw-60)} ${n(dy)}, ${n(px+pw-4)} ${n(dy)}" stroke="url(#gGravel)" stroke-width="25" fill="none" stroke-linecap="round"/>`;
  terrainCache = s;
  return s;
}


/* =====================================================================
   ROAD NETWORK — path tiles are merged into one continuous surface so
   neighbouring pieces join instead of stacking as separate pills.
   ===================================================================== */
const MERGE_ROAD = {path:1};
function roadTiles(){
  const set = new Set();
  S.objs.forEach(o=>{
    if(!MERGE_ROAD[o.bp]) return;
    const f = footprint(BPMAP[o.bp], o.rot);
    for(let x=0;x<f.w;x++) for(let y=0;y<f.h;y++) set.add((o.tx+x)+','+(o.ty+y));
  });
  return set;
}
function roadLayer(){
  const set = roadTiles();
  if(!set.size) return '';
  const has = (x,y)=> set.has(x+','+y);
  let base='', edge='', rut='', stones='';
  set.forEach(k=>{
    const [x,y] = k.split(',').map(Number);
    const px=x*T, py=y*T;
    /* base tile, overlapping by 1px so joins are seamless */
    base += `<rect x="${px-0.5}" y="${py-0.5}" width="${T+1}" height="${T+1}" fill="url(#gGravel)"/>`;
    const L=has(x-1,y), R=has(x+1,y), U=has(x,y-1), D=has(x,y+1);
    /* round only genuinely outer corners, by cutting the corner back to grass */
    const cut = (cx,cy,sx,sy)=>{
      const r=9;
      edge += `<path d="M${cx} ${cy+sy*r} L${cx} ${cy} L${cx+sx*r} ${cy}
        A${r} ${r} 0 0 ${sx*sy>0?0:1} ${cx} ${cy+sy*r} Z" fill="url(#gLawn)"/>`;
    };
    if(!L&&!U) cut(px,py, 1, 1);
    if(!R&&!U) cut(px+T,py, -1, 1);
    if(!L&&!D) cut(px,py+T, 1, -1);
    if(!R&&!D) cut(px+T,py+T, -1, -1);
    /* worn, darker grass margin where the surface meets lawn */
    if(!U) edge += `<rect x="${px}" y="${py-2}" width="${T}" height="4" fill="#6f8f48" opacity=".5"/>`;
    if(!D) edge += `<rect x="${px}" y="${py+T-2}" width="${T}" height="4" fill="#6f8f48" opacity=".5"/>`;
    if(!L) edge += `<rect x="${px-2}" y="${py}" width="4" height="${T}" fill="#6f8f48" opacity=".5"/>`;
    if(!R) edge += `<rect x="${px+T-2}" y="${py}" width="4" height="${T}" fill="#6f8f48" opacity=".5"/>`;
    /* wheel ruts follow whichever way the run travels */
    if(L||R){
      rut += `<rect x="${px-1}" y="${py+T*0.28}" width="${T+2}" height="3.2" fill="#8f8468" opacity=".5"/>`;
      rut += `<rect x="${px-1}" y="${py+T*0.62}" width="${T+2}" height="3.2" fill="#8f8468" opacity=".5"/>`;
    }
    if(U||D){
      rut += `<rect x="${px+T*0.28}" y="${py-1}" width="3.2" height="${T+2}" fill="#8f8468" opacity=".45"/>`;
      rut += `<rect x="${px+T*0.62}" y="${py-1}" width="3.2" height="${T+2}" fill="#8f8468" opacity=".45"/>`;
    }
    /* size-varied aggregate */
    for(let i=0;i<11;i++){
      const sx = px+2+hash(x*31+y*17+i)*(T-4), sy = py+2+hash(x*13+y*29+i*3)*(T-4);
      const rr = 0.5+hash(i+x+y)*1.5;
      stones += `<circle cx="${n(sx)}" cy="${n(sy)}" r="${n(rr)}" fill="${i%3?'#8f8468':'#e0d6bd'}" opacity=".6"/>`;
    }
    /* spill of loose stones onto the grass at the edges */
    if(!D) for(let i=0;i<4;i++)
      stones += `<circle cx="${n(px+4+hash(i*7+x)*(T-8))}" cy="${n(py+T+1+hash(i*11+y)*4)}" r="${n(0.6+hash(i)*0.9)}" fill="#b6a988" opacity=".7"/>`;
    if(!U) for(let i=0;i<4;i++)
      stones += `<circle cx="${n(px+4+hash(i*5+y)*(T-8))}" cy="${n(py-1-hash(i*9+x)*4)}" r="${n(0.6+hash(i+2)*0.9)}" fill="#b6a988" opacity=".7"/>`;
  });
  return `<g class="roadlay">${base}${edge}${rut}${stones}
    <g opacity=".22">${Array.from(set).map(k=>{const[x,y]=k.split(',').map(Number);
      return `<rect x="${x*T}" y="${y*T}" width="${T}" height="${T}" filter="url(#fGrain)" style="mix-blend-mode:overlay"/>`;}).join('')}</g></g>`;
}

function objTransform(o, bp){
  const f = footprint(bp, o.rot);
  const ox = o.tx*T, oy = o.ty*T;
  return `translate(${n(ox + f.w*T/2)},${n(oy + f.h*T/2)}) rotate(${o.rot}) translate(${n(-bp.w*T/2)},${n(-bp.h*T/2)})`;
}

function drawObj(o){
  const bp = BPMAP[o.bp];
  if(MERGE_ROAD[o.bp]){
    /* surface is drawn once by roadLayer(); this is just the hit area */
    const f = footprint(bp, o.rot);
    return `<g class="ob road-hit" data-id="${o.id}">
      <rect x="${o.tx*T}" y="${o.ty*T}" width="${f.w*T}" height="${f.h*T}" fill="transparent"/></g>`;
  }
  const fn = ART[bp.art] || ART.shed;
  const art = fn(bp.w*T, bp.h*T, o) + tierSkin(bp.w*T, bp.h*T, tOf(o), bp);
  return `<g class="ob${sel===o.id?' selob':''}" data-id="${o.id}" transform="${objTransform(o,bp)}">${art}</g>`;
}

function render(){
  const objs = S.objs.slice().sort((a,b)=>{
    const A=BPMAP[a.bp], B=BPMAP[b.bp];
    const ra = A.cat==='land'&&(A.art==='path'||A.art==='ring'||A.art==='parking') ? 0 : 1;
    const rb = B.cat==='land'&&(B.art==='path'||B.art==='ring'||B.art==='parking') ? 0 : 1;
    if(ra!==rb) return ra-rb;
    return (a.ty+BPMAP[a.bp].h) - (b.ty+BPMAP[b.bp].h);
  });
  let g = '';
  if(ghost){
    const f = footprint(ghost.bp, ghost.rot);
    for(let x=FARM.x;x<FARM.x+FARM.w;x++) for(let y=FARM.y;y<FARM.y+FARM.h;y++){}
    g += `<g class="gridlay">`;
    for(let x=FARM.x;x<=FARM.x+FARM.w;x++) g += `<line x1="${x*T}" y1="${FARM.y*T}" x2="${x*T}" y2="${(FARM.y+FARM.h)*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
    for(let y=FARM.y;y<=FARM.y+FARM.h;y++) g += `<line x1="${FARM.x*T}" y1="${y*T}" x2="${(FARM.x+FARM.w)*T}" y2="${y*T}" stroke="#fff" stroke-opacity=".13" stroke-width="1"/>`;
    g += `</g>`;
    const bad = overlaps(ghost.tx, ghost.ty, f, ghost.moving) || S.cash < (ghost.moving?0:ghost.bp.cost);
    const fake = {id:-1, bp:ghost.bp.id, tx:ghost.tx, ty:ghost.ty, rot:ghost.rot,
      crop:null, stage:0.6, water:.6, animals:2, ready:0, store:(ghost.bp.cap||0)*0.6, cap:ghost.bp.cap};
    g += `<g opacity=".72">${drawObj(fake)}</g>`;
    g += `<rect x="${ghost.tx*T}" y="${ghost.ty*T}" width="${f.w*T}" height="${f.h*T}" rx="4"
      fill="${bad?'#e2705c':'#7cc24f'}" fill-opacity=".2" stroke="${bad?'#e2705c':'#7cc24f'}" stroke-width="2.5"/>`;
  }
  let selRing = '';
  if(sel){
    const o = S.objs.find(z=>z.id===sel);
    if(o){ const f = footprint(BPMAP[o.bp], o.rot);
      selRing = `<rect x="${o.tx*T-2}" y="${o.ty*T-2}" width="${f.w*T+4}" height="${f.h*T+4}" rx="5"
        fill="none" stroke="#f0c14b" stroke-width="2.5" stroke-dasharray="7 5" class="selring"/>`; }
  }
  $('#scene').innerHTML =
    `<svg width="${WPX}" height="${HPX}" viewBox="0 0 ${WPX} ${HPX}" xmlns="http://www.w3.org/2000/svg">
      ${DEFS()}${terrain()}
      ${roadLayer()}
      <g id="obs">${objs.map(drawObj).join('')}</g>
      ${herdLayer()}
      ${typeof peopleLayer==='function' ? peopleLayer() : ''}
      ${selRing}${g}
    </svg>`;
  renderLabels();
}

function renderLabels(){
  const L = $('#wlabels');
  let h = '';
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    const f = footprint(bp, o.rot);
    if(f.w < 3 && f.h < 3) return;
    if(bp.kind==='decor') return;          // paths, hedges, fences, trees stay quiet
    const cx = (o.tx + f.w/2)*T, by = (o.ty + f.h)*T;
    let txt = bp.name, cls = '';
    const st = objState(o);
    if(st.alert){ txt = st.alert; cls = ' alert'; }
    else if(st.ready){ txt = st.ready; cls = ' ready'; }
    h += `<div class="wlab${cls}" style="left:${n(cx)}px;top:${n(by+3)}px">${txt}</div>`;
  });
  L.innerHTML = h;
  L.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  L.style.transformOrigin = '0 0';
}

/* short status used by labels + inspector */
function objState(o){
  const bp = BPMAP[o.bp];
  const r = {alert:'', ready:''};
  if(bp.kind==='plot'){
    if(!o.crop) r.alert = 'Empty — plant';
    else if(o.stage>=1) r.ready = 'Harvest ' + CROPS[o.crop].name;
    else if(o.water<0.18) r.alert = 'Thirsty!';
    else if(o.pest) r.alert = 'Pests!';
  } else if(bp.kind==='perennial'){
    if(o.stage>=1) r.ready = 'Pick ' + GOODS[bp.good].n;
  } else if(bp.kind==='animal'){
    if(!o.animals) r.alert = 'Buy ' + bp.animal + 's';
    else if(o.ready>0) r.ready = 'Collect ' + o.ready;
    else if(o.hungry) r.alert = 'Hungry!';
  } else if(bp.kind==='process'){
    if(o.ready>0) r.ready = 'Collect batch';
    else if(o.recipe<0) r.alert = 'Idle — set a recipe';
  } else if(bp.kind==='shop'){
    if(!Object.keys(S.store).length) r.alert = 'Nothing to sell';
  }
  return r;
}

/* ---------------- camera ---------------- */
function applyCam(){
  $('#scene').style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  const L=$('#wlabels');
  L.style.transform = `translate(${cam.x}px,${cam.y}px) scale(${cam.z})`;
  if(typeof parallax==='function') parallax();
}
function fitView(){
  const w = $('#world').clientWidth, h = $('#world').clientHeight;
  cam.z = clamp(Math.min(w/WPX, h/HPX)*0.98, 0.3, 2);
  cam.x = (w - WPX*cam.z)/2; cam.y = (h - HPX*cam.z)/2;
  applyCam();
}
function zoomAt(delta, px, py){
  const z0 = cam.z, z1 = clamp(cam.z*(1+delta), 0.32, 2.6);
  if(z1===z0) return;
  const wx = (px - cam.x)/z0, wy = (py - cam.y)/z0;
  cam.z = z1; cam.x = px - wx*z1; cam.y = py - wy*z1;
  applyCam();
}
function screenToTile(cx,cy){
  const r = $('#world').getBoundingClientRect();
  const wx = (cx - r.left - cam.x)/cam.z, wy = (cy - r.top - cam.y)/cam.z;
  return {tx:Math.floor(wx/T), ty:Math.floor(wy/T), wx, wy};
}

/* ---------------- simulation ---------------- */
function rollWeather(){
  const se = S.season;
  const tbl = [
    ['sun','sun','sun','heat','cloud','rain'],            // summer
    ['sun','cloud','cloud','rain','rain','storm'],        // autumn
    ['cloud','rain','rain','frost','frost','storm'],      // winter
    ['sun','sun','cloud','rain','cloud','rain'],          // spring
  ][se];
  S.weather = tbl[Math.floor(Math.random()*tbl.length)];
}

function advanceDay(){
  S.day++;
  if((S.day-1) % 28 === 0) { S.season = (S.season+1)%4; log(`${SEASONS[S.season].n} begins.`,'gold'); }
  rollWeather();
  const se = SEASONS[S.season], we = WEATHERS[S.weather], st = stat();

  /* --- water --- */
  const rain = we.rain * (1 + se.rain);
  S.water = clamp(S.water + rain + st.waterGain, 0, Math.max(1,st.waterCap));
  /* --- power --- */
  S.powerBal = st.power - st.use;
  const powerOK = !st.short;

  /* --- feed --- */
  S.feed += st.feedGain;

  /* --- crops --- */
  let thirsty=0, grew=0;
  S.objs.forEach(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind==='plot' && o.crop){
      const cr = CROPS[o.crop];
      const evap = 0.16 * we.evap * se.evap * cr.thirst * (bp.shelter?0.7:1);
      if(st.autowater && powerOK && S.water>3){ o.water = 1; S.water -= 3; }
      o.water = clamp(o.water - evap, 0, 1);
      if(o.water < 0.16){ thirsty++; }
      else {
        let g = (1/cr.days) * se.growth * we.growth * (1 + st.fert) * (1 + Math.min(0.35, st.pollinate*0.05));
        g *= E.speed(o) * cropMul(o);
        if(bp.shelter) g *= 1; else if(S.weather==='storm') g *= 0.7;
        if(!bp.shelter && !cr.seasons.includes(S.season)) g *= 0.5;
        if(o.pest) g *= 0.45;
        if(bp.power<0 && !powerOK) g *= 0.5;
        o.stage = clamp(o.stage + g, 0, 1);
        grew++;
      }
      /* pests */
      if(!o.pest && Math.random() < 0.05*(1 - Math.min(0.8, st.ducks*0.12))) o.pest = 1;
    }
    if(bp.kind==='plot') dailySoil(o);
    if(bp.kind==='perennial'){
      let g = (1/E.cycle(o)) * se.growth * we.growth * (1 + st.fert) * (1 + Math.min(0.35, st.pollinate*0.05));
      o.stage = clamp(o.stage + g, 0, 1);
    }
    if(bp.kind==='animal' && o.animals>0){
      const need = bp.feed * o.animals;
      if(S.feed >= need){ S.feed -= need; o.hungry = 0; o.prog += 1/E.cycle(o); }
      else { o.hungry = 1; }
      dailyHusbandry(o);
      if(o.prog >= 1){
        o.prog = 0;
        o.ready += Math.max(1, Math.round(E.per(o) * o.animals * yieldMul(o)));
      }
    }
    if(bp.kind==='process' && o.recipe>=0 && o.ready===0){
      const rc = bp.recipes[o.recipe];
      if(o.prog>0 || canCraft(rc)){
        if(o.prog===0) takeCraft(rc);
        o.prog += (1/rc.days) * (1 + st.craftspeed) * (powerOK?1:0.4);
        if(o.prog>=1){ o.prog=0; Object.keys(rc.out).forEach(k=> o.ready += rc.out[k]); o.outKeep = rc.out; }
      }
    }
    if(bp.kind==='shop'){
      const rate = E.rate(o) * (1 + Math.min(1.6, st.charm/110));
      let n0 = Math.floor(rate + (Math.random()<(rate%1)?1:0));
      while(n0-- > 0){
        const keys = Object.keys(S.store).filter(k=>S.store[k]>0);
        if(!keys.length) break;
        const pick = bp.markup ? (keys.find(k=>GOODS[k].craft) || keys[0]) : keys[Math.floor(Math.random()*keys.length)];
        S.store[pick]--; if(S.store[pick]<=0) delete S.store[pick];
        earn(sellPrice(pick) * (bp.markup||1) * 0.92, 0);
      }
    }
  });

  /* --- tourism --- */
  if(st.tour>0){
    const inc = st.tour * charmMul() * se.tour * we.tour * st.tourmul;
    if(inc>0.5) earn(inc, 0);
  }

  /* --- market drift --- */
  Object.keys(S.prices).forEach(k=>{
    S.prices[k] = clamp(S.prices[k] + (Math.random()-0.5)*0.13, 0.72, 1.5);
  });

  /* --- contracts --- */
  S.contracts.forEach(c=>{ c.left--; });
  const gone = S.contracts.filter(c=>c.left<=0 && !c.done);
  if(gone.length) log(`${gone.length} order expired.`,'bad');
  S.contracts = S.contracts.filter(c=>c.left>0 && !c.done);
  if(S.contracts.length < 3 && Math.random()<0.6) rollContracts(1);

  /* --- the AI does its rounds --- */
  if(typeof runAutomation==='function') runAutomation();

  /* --- messages --- */
  if(thirsty) log(`${thirsty} bed${thirsty>1?'s are':' is'} too dry to grow.`,'bad');
  if(st.short) log('Not enough power — production is slowed.','bad');
  if(S.feed <= 0 && S.objs.some(o=>BPMAP[o.bp].kind==='animal' && o.animals>0))
    log('Out of feed! Animals stopped producing.','bad');
  if(S.weather==='storm' && Math.random()<0.35 && st.shelter<2){
    const beds = S.objs.filter(o=>BPMAP[o.bp].kind==='plot' && o.crop && o.stage>0.2 && !BPMAP[o.bp].shelter);
    if(beds.length){ const b = beds[Math.floor(Math.random()*beds.length)];
      b.stage = Math.max(0, b.stage-0.3); log('Storm damage in an unsheltered bed. Plant hedges!','bad'); }
  }
  if(typeof SND!=='undefined'){ SND.weather(S.weather); SND.seasonTint(); }
  render(); ui();
}

function canCraft(rc){ return Object.keys(rc.in).every(k => (S.store[k]||0) >= rc.in[k]); }
function takeCraft(rc){ Object.keys(rc.in).forEach(k=>{ S.store[k]-=rc.in[k]; if(S.store[k]<=0) delete S.store[k]; }); }

/* ---------------- economy ---------------- */
function earn(v, xp, at){
  v = Math.round(v);
  S.cash += v; S.totalEarned += v;
  if(xp) addXP(xp);
  if(at) floatNum('+'+fmt(v), at.x, at.y, '#f0c14b');
}
function addXP(v){
  S.xp += v;
  while(S.xp >= xpFor(S.lvl)){
    S.xp -= xpFor(S.lvl); S.lvl++;
    const un = BP.filter(b=>b.lvl===S.lvl);
    toast(`Level ${S.lvl}! ${un.length?un.length+' new buildings unlocked':''}`,'gold');
    log(`Reached level ${S.lvl}.`,'gold');
    if(un.length) log('Unlocked: '+un.map(b=>b.name).join(', '),'good');
  }
}
function give(gid, qty){ S.store[gid] = (S.store[gid]||0) + qty; }

function rollContracts(count){
  count = count || 3;
  const pool = Object.keys(GOODS);
  for(let i=0;i<count;i++){
    const owned = new Set();
    S.objs.forEach(o=>{ const b=BPMAP[o.bp];
      if(b.good) owned.add(b.good);
      if(b.kind==='plot') Object.keys(CROPS).forEach(c=>owned.add(c));
      if(b.recipes) b.recipes.forEach(r=>Object.keys(r.out).forEach(k=>owned.add(k)));
    });
    const list = owned.size ? Array.from(owned) : ['lettuce','carrot'];
    const gid = list[Math.floor(Math.random()*list.length)];
    const base = GOODS[gid].p;
    const qty = Math.max(3, Math.round((GOODS[gid].craft?3:9) * (0.7+Math.random()*0.9)));
    const days = Math.max(4, Math.round(qty/2 + 4));
    const pay = Math.round(base*qty*(1.5+Math.random()*0.5));
    const names = ['Village grocer','Farmers market','The Bakehouse','Riverside cafe','Wholesale co-op','Hotel kitchen'];
    S.contracts.push({id:'c'+Date.now()+i, who:names[Math.floor(Math.random()*names.length)],
      gid, qty, left:days, pay, done:false});
  }
}

/* =====================================================================
   YOU, ON THE LAND — a character who walks to whatever you clicked and
   does the job there — plus the sun's arc from dawn to dusk.
   ===================================================================== */

/* ---------- pathfinding: A* across walkable tiles ---------- */
function blockedTile(x,y){
  if(x<FARM.x||y<FARM.y||x>=FARM.x+FARM.w||y>=FARM.y+FARM.h) return true;
  return S.objs.some(o=>{
    const bp = BPMAP[o.bp];
    if(bp.kind==='decor' && (bp.art==='path'||bp.art==='fence'||bp.art==='hedge')) return false;
    if(bp.kind==='decor' && bp.w<=2 && bp.h<=2) return false;   // step around small trees only
    const f = footprint(bp, o.rot);
    return x>=o.tx && x<o.tx+f.w && y>=o.ty && y<o.ty+f.h;
  });
}
function findPath(sx,sy,gx,gy){
  const key=(x,y)=>x+','+y;
  const open=[{x:sx,y:sy,g:0,f:0,p:null}], seen={[key(sx,sy)]:0};
  const H=(x,y)=>Math.abs(x-gx)+Math.abs(y-gy);
  let best=null, guard=0;
  while(open.length && guard++ < 4000){
    open.sort((a,b)=>a.f-b.f);
    const cur = open.shift();
    if(Math.abs(cur.x-gx)<=1 && Math.abs(cur.y-gy)<=1){ best=cur; break; }
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d=>{
      const nx=cur.x+d[0], ny=cur.y+d[1];
      if(blockedTile(nx,ny)) return;
      const g=cur.g+1, k=key(nx,ny);
      if(seen[k]!==undefined && seen[k]<=g) return;
      seen[k]=g;
      open.push({x:nx,y:ny,g,f:g+H(nx,ny),p:cur});
    });
  }
  if(!best){                       // no route — walk straight and accept it
    return [{x:gx,y:gy}];
  }
  const path=[]; let c=best;
  while(c){ path.unshift({x:c.x,y:c.y}); c=c.p; }
  return path.slice(1);
}

/* ---------- the character ---------- */
function youInit(){
  if(S.you) return;
  S.you = {x:(FARM.x+3)*T, y:(FARM.y+3)*T, path:[], state:'idle', dir:1, t:0, job:null};
}
function youAt(){ youInit(); return {tx:Math.floor(S.you.x/T), ty:Math.floor(S.you.y/T)}; }

/* queue a job: walk there first, then run it on arrival */
function goDo(obj, kind, fn){
  youInit();
  if(S.settings && S.settings.instant){ fn(); return; }
  const f = footprint(BPMAP[obj.bp], obj.rot);
  const gx = obj.tx + Math.floor(f.w/2), gy = obj.ty + f.h;   // stand at the near edge
  const me = youAt();
  S.you.path = findPath(me.tx, me.ty, gx, gy);
  S.you.state = 'walk';
  S.you.job = {kind, fn, ox:obj.tx, oy:obj.ty};
  S.you.t = 0;
}
function tickYou(dt){
  youInit();
  const y = S.you;
  if(y.state==='walk'){
    const spd = (S.settings&&S.settings.walkFast ? 260 : 165) * dt;
    while(spd>0 && y.path.length){
      const n0 = y.path[0];
      const tx = n0.x*T + T/2, ty = n0.y*T + T/2;
      const dx = tx-y.x, dy = ty-y.y, d = Math.hypot(dx,dy);
      if(d < 2){ y.path.shift(); continue; }
      const step = Math.min(d, spd);
      y.x += dx/d*step; y.y += dy/d*step;
      if(Math.abs(dx)>0.5) y.dir = dx>0?1:-1;
      break;
    }
    if(!y.path.length){
      y.state = 'work'; y.t = 0;
      if(SND && !SND.isMuted()) sfx('click');
    }
  } else if(y.state==='work'){
    y.t += dt;
    if(y.t > 0.75){
      const job = y.job; y.job=null; y.state='idle'; y.t=0;
      if(job && job.fn) job.fn();
    }
  }
  paintYou();
}
function youLayer(){
  youInit();
  const y = S.you;
  return `<g id="you" transform="translate(${n(y.x)},${n(y.y)})">
    <g class="youbob"><g transform="scale(${y.dir},1)">${person(0,0,1.15,'#c8583f','#e0c07a')}${typeof carryArt==='function'?carryArt():''}</g></g></g>`;
}
function paintYou(){
  const el = document.getElementById('you');
  if(!el) return;
  const y = S.you;
  el.setAttribute('transform', `translate(${n(y.x)},${n(y.y)})`);
  const bob = el.firstElementChild;
  if(bob){
    bob.setAttribute('class', 'youbob' + (y.state==='walk'?' walking':y.state==='work'?' working':''));
    const flip = bob.firstElementChild;
    if(flip) flip.setAttribute('transform', `scale(${y.dir},1)`);
  }
}

/* ---------- sun & sky ---------- */
/* 0 = midnight, 0.5 = noon */
function dayFrac(){
  const base = (typeof acc==='number' && typeof DAY_MS==='number') ? acc/DAY_MS : 0.5;
  return (base + 0.25) % 1;                    // days start at dawn, not midnight
}
const SKY = [
  {t:0.00, top:'#0b1220', hz:'#16233a', sun:'#5b6a86', l:0.42},   // night
  {t:0.20, top:'#243a52', hz:'#7c5a58', sun:'#e8905c', l:0.24},   // dawn
  {t:0.28, top:'#5d8fb5', hz:'#e6b07c', sun:'#ffc46b', l:0.10},   // sunrise
  {t:0.50, top:'#8fc4e6', hz:'#cfe6f2', sun:'#fff3c4', l:0.00},   // noon
  {t:0.74, top:'#6fa3c8', hz:'#f0b078', sun:'#ffb04f', l:0.10},   // golden
  {t:0.82, top:'#3c4d70', hz:'#c0705e', sun:'#e8734a', l:0.26},   // sunset
  {t:1.00, top:'#0b1220', hz:'#16233a', sun:'#5b6a86', l:0.42},
];
function lerpHex(a,b,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const A=p(a), B=p(b);
  return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('');
}
function skyNow(){
  const f = dayFrac();
  let i=0; while(i<SKY.length-2 && SKY[i+1].t < f) i++;
  const a=SKY[i], b=SKY[i+1];
  const t = (f-a.t)/Math.max(0.0001,(b.t-a.t));
  return {top:lerpHex(a.top,b.top,t), hz:lerpHex(a.hz,b.hz,t),
          sun:lerpHex(a.sun,b.sun,t), l:a.l+(b.l-a.l)*t, f};
}
function isNight(){ const f=dayFrac(); return f<0.22 || f>0.84; }

/* the arc strip across the top of the land */
function paintSun(){
  const el = document.getElementById('sunarc');
  if(!el) return;
  const s = skyNow(), f = s.f;
  const w = el.clientWidth || 600, h = 46;
  /* sun travels dawn(0.22) → dusk(0.84); the moon takes the rest */
  const up = f>=0.22 && f<=0.84;
  const p = up ? (f-0.22)/0.62 : ((f<0.22? f+0.16 : f-0.84)/0.38);
  const cx = 10 + p*(w-20);
  const cy = h - 6 - Math.sin(p*Math.PI)*(h-18);
  const body = up
    ? `<circle cx="${n(cx)}" cy="${n(cy)}" r="8" fill="${s.sun}"/>
       <circle cx="${n(cx)}" cy="${n(cy)}" r="13" fill="${s.sun}" opacity=".28"/>
       <circle cx="${n(cx)}" cy="${n(cy)}" r="19" fill="${s.sun}" opacity=".12"/>`
    : `<circle cx="${n(cx)}" cy="${n(cy)}" r="7" fill="#dfe7f2"/>
       <circle cx="${n(cx+2.6)}" cy="${n(cy-1.6)}" r="6" fill="${s.top}"/>
       <circle cx="${n(cx)}" cy="${n(cy)}" r="12" fill="#dfe7f2" opacity=".16"/>`;
  let stars = '';
  if(!up) for(let i=0;i<16;i++)
    stars += `<circle cx="${n(hash(i*3.1)*w)}" cy="${n(4+hash(i*7.7)*(h-18))}" r="${(0.6+hash(i)*0.8).toFixed(1)}"
      fill="#fff" opacity="${(0.25+hash(i*2)*0.5).toFixed(2)}"/>`;
  el.innerHTML =
    `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${s.top}"/><stop offset="1" stop-color="${s.hz}"/></linearGradient></defs>
      <rect width="${w}" height="${h}" fill="url(#skyg)"/>
      ${stars}
      <path d="M10 ${h-6} Q ${w/2} ${-h*0.5} ${w-10} ${h-6}" stroke="#ffffff" stroke-opacity=".16"
        stroke-width="1" fill="none" stroke-dasharray="3 5"/>
      ${body}
      <rect y="${h-3}" width="${w}" height="3" fill="#000" opacity=".25"/>
    </svg>
    <span class="clock">${clockLabel()}</span>`;
  /* the land itself picks up the light */
  const dn = document.getElementById('daynight');
  if(dn && (!S.settings || S.settings.daynight !== false)){
    const tint = isNight() ? 'rgba(16,26,52,' : f<0.32||f>0.7 ? 'rgba(90,50,30,' : 'rgba(255,240,200,';
    dn.style.background = `linear-gradient(${180+Math.round((f-0.5)*90)}deg, ${tint}${s.l.toFixed(2)}), ${tint}${(s.l*0.7).toFixed(2)}))`;
  }
  /* shadows lengthen and swing with the sun */
  const ang = up ? (p-0.5)*120 : 0;
  const len = up ? 1 + (1-Math.sin(p*Math.PI))*2.2 : 1;
  document.documentElement.style.setProperty('--sun-x', (Math.sin(ang*Math.PI/180)*len*2.2).toFixed(2)+'px');
  document.documentElement.style.setProperty('--sun-y', (len*2).toFixed(2)+'px');
}
function clockLabel(){
  const f = dayFrac(), mins = Math.round(f*1440);
  const hh = Math.floor(mins/60), mm = mins%60;
  const ampm = hh<12?'am':'pm';
  const h12 = hh%12===0?12:hh%12;
  return `${h12}:${String(mm).padStart(2,'0')}${ampm}`;
}

   UI — panels, tooltips, input, loop

let curCat = 'grow', rightTab = 'insp';

/* ---------------- toast / float / log ---------------- */
function toast(msg, cls){
  const d = document.createElement('div');
  d.className = 'toast '+(cls||'');
  d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.transition='opacity .4s'; d.style.opacity=0; setTimeout(()=>d.remove(),400); }, 2400);
}
function floatNum(txt, x, y, col){
  const d = document.createElement('div');
  d.className = 'floatnum'; d.textContent = txt;
  d.style.left = x+'px'; d.style.top = y+'px'; d.style.color = col||'#7cc24f';
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), 1200);
}
function log(msg, cls){
  S.log.unshift({d:S.day, m:msg, c:cls||''});
  if(S.log.length>60) S.log.pop();
  const el = $('#log');
  if(el) el.innerHTML = S.log.map(l=>`<div class="lg ${l.c}"><time>D${l.d}</time><span>${l.m}</span></div>`).join('');
}

/* ---------------- tooltips ---------------- */
const tip = () => $('#tip');
let tipTarget = null;
function showTip(html, x, y){
  const t = tip();
  t.innerHTML = html; t.classList.add('show');
  const r = t.getBoundingClientRect();
  let tx = x+16, ty = y+16;
  if(tx + r.width > innerWidth-8) tx = x - r.width - 14;
  if(ty + r.height > innerHeight-8) ty = y - r.height - 14;
  t.style.left = Math.max(6,tx)+'px'; t.style.top = Math.max(6,ty)+'px';
}
function hideTip(){ tip().classList.remove('show'); tipTarget=null; }

function objTip(o){
  const bp = BPMAP[o.bp], st = stat();
  let h = `<b>${bp.name}</b><span class="tg">${bp.desc}</span><hr>`;
  if(bp.kind==='plot'){
    if(o.crop){
      const cr = CROPS[o.crop];
      const pct = Math.round(o.stage*100);
      h += `<div class="tl"><span>Crop</span><b>${cr.name}</b></div>`;
      h += `<div class="tl"><span>Growth</span><b>${pct}%</b></div>`;
      h += `<div class="tl"><span>Soil moisture</span><b class="${o.water<0.2?'warn':''}">${Math.round(o.water*100)}%</b></div>`;
      h += `<div class="tl"><span>Harvest value</span><span class="tk">${fmt(cr.yield*(bp.slots||1)*sellPrice(o.crop))}</span></div>`;
      if(o.pest) h += `<div class="warn">Pest damage — growth cut by half.</div>`;
      if(!bp.shelter && !cr.seasons.includes(S.season)) h += `<div class="warn">Out of season here — growing at half speed.</div>`;
    } else h += `<div class="tg">Empty. Select it and choose a seed.</div>`;
  } else if(bp.kind==='perennial'){
    h += `<div class="tl"><span>Ripeness</span><b>${Math.round(o.stage*100)}%</b></div>`;
    h += `<div class="tl"><span>Yields</span><b>${bp.qty} ${GOODS[bp.good].n}</b></div>`;
  } else if(bp.kind==='animal'){
    h += `<div class="tl"><span>${bp.animal}s</span><b>${o.animals}/${bp.cap}</b></div>`;
    h += `<div class="tl"><span>Waiting</span><b>${o.ready} ${GOODS[bp.good].n}</b></div>`;
    h += `<div class="tl"><span>Eats</span><b>${(bp.feed*o.animals).toFixed(1)} feed/day</b></div>`;
    if(o.hungry) h += `<div class="warn">Hungry — no feed left, production stopped.</div>`;
  } else if(bp.kind==='process'){
    h += o.recipe>=0
      ? `<div class="tl"><span>Batch</span><b>${Math.round(o.prog*100)}%</b></div>`
      : `<div class="tg">No recipe set.</div>`;
    if(o.ready) h += `<div class="tl"><span>Ready</span><b>${o.ready} crafted</b></div>`;
  } else if(bp.kind==='water'){
    h += `<div class="tl"><span>Capacity</span><b>${bp.cap} L</b></div>`;
    if(bp.gain) h += `<div class="tl"><span>Refills</span><b>+${bp.gain} L/day</b></div>`;
  } else if(bp.kind==='power'){
    h += `<div class="tl"><span>Output</span><b>${bp.power} kW</b></div>`;
  } else if(bp.kind==='tourism'){
    h += `<div class="tl"><span>Base income</span><span class="tk">${fmt(bp.income)}/day</span></div>`;
    h += `<div class="tl"><span>With your charm</span><span class="tk">${fmt(bp.income*charmMul()*st.tourmul)}/day</span></div>`;
  } else if(bp.kind==='shop'){
    h += `<div class="tl"><span>Sells</span><b>~${(bp.rate*(1+Math.min(1.6,st.charm/110))).toFixed(1)} items/day</b></div>`;
  }
  if(bp.charm) h += `<div class="tl"><span>Charm</span><b>+${bp.charm}</b></div>`;
  h += `<hr><span class="tg">Click to select · drag to move</span>`;
  return h;
}

function coin(){ return `<svg class="ic" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.6" fill="#f0c14b"/><circle cx="8" cy="8" r="4.6" fill="#d9a72e"/><path d="M8 4.6v6.8M6.2 6.2h3.2a1.4 1.4 0 010 2.8H6.6a1.4 1.4 0 000 2.8h3.2" stroke="#8a6410" stroke-width="1" fill="none"/></svg>`; }
function esc(s){ return String(s).replace(/"/g,'&quot;'); }

/* ---------------- build panel ---------------- */
function renderBuild(){
  $('#cats').innerHTML = CATS.map(c=>
    `<button class="cat${curCat===c.id?' on':''}" onclick="G.cat('${c.id}')" data-tip="${esc('<b>'+c.n+'</b>'+c.tip)}">${c.n}</button>`).join('');
  const list = BP.filter(b=>b.cat===curCat && b.id!=='cabin');
  $('#buildList').innerHTML = list.map(b=>{
    const locked = S.lvl < b.lvl, poor = S.cash < b.cost;
    const tipHtml = `<b>${b.name}</b><span class="tg">${b.desc}</span><hr>`+
      `<div class="tl"><span>Cost</span><span class="tk">${fmt(b.cost)}</span></div>`+
      `<div class="tl"><span>Footprint</span><b>${b.w}×${b.h} tiles</b></div>`+
      (b.charm?`<div class="tl"><span>Charm</span><b>+${b.charm}</b></div>`:'')+
      (b.power?`<div class="tl"><span>Power</span><b>${b.power>0?'+':''}${b.power} kW</b></div>`:'')+
      (locked?`<hr><span class="warn">Unlocks at level ${b.lvl}</span>`:
        poor?`<hr><span class="warn">You need ${fmt(b.cost-S.cash)} more</span>`:
        `<hr><span class="tg">${b.tip}</span>`);
    return `<div class="bitem${locked?' locked':''}${poor&&!locked?' poor':''}${ghost&&ghost.bp.id===b.id?' sel':''}"
      ${locked?'':`onclick="G.pick('${b.id}')"`} data-tip="${esc(tipHtml)}">
      <span class="bth">${thumb(b)}</span>
      <span class="bmeta"><b>${b.name}</b><span class="sub">${b.w}×${b.h} · ${kindLabel(b)}</span></span>
      ${locked?`<span class="lockb">Lv ${b.lvl}</span>`:`<span class="cost">${fmt(b.cost)}</span>`}
    </div>`;
  }).join('') || '<div class="empty">Nothing here yet.</div>';
}
function kindLabel(b){
  return {plot:'plantable', perennial:'auto-yield', animal:'livestock', process:'crafting',
    shop:'sells stock', tourism:'visitor income', water:'water', power:'power',
    feed:'animal feed', bonus:'farm upgrade', decor:'decoration', home:'home'}[b.kind] || b.kind;
}
function thumb(b){
  const fn = ART[b.art] || ART.shed;
  const w = b.w*T, h = b.h*T;
  const sc = Math.min(44/w, 34/h, 1.5);
  return `<svg viewBox="0 0 ${w} ${h}" width="${n(w*sc)}" height="${n(h*sc)}">${DEFS()}${fn(w,h,null)}</svg>`;
}

/* ---------------- right panel ---------------- */
function renderRight(){
  const b = $('#rightBody');
  if(rightTab==='market') return void(b.innerHTML = marketHTML());
  if(rightTab==='jobs')   return void(b.innerHTML = jobsHTML());
  if(rightTab==='auto')   return void(b.innerHTML = autoHTML());
  b.innerHTML = inspHTML();
}

function inspHTML(){
  const o = S.objs.find(z=>z.id===sel);
  if(!o) return `<div class="empty">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#7cc24f" stroke-width="1.4">
      <path d="M3 20h18M6 20V10l6-5 6 5v10"/><path d="M10 20v-5h4v5"/></svg>
    <div><b>Nothing selected</b></div>
    <div style="margin-top:6px">Click anything on your land to see how it is doing and what you can do with it.</div>
    <div style="margin-top:10px;color:var(--green)">Or pick something from Build on the left.</div></div>`;
  const bp = BPMAP[o.bp], st = stat();
  let h = `<div class="insp">
    <div class="title"><span class="th">${thumb(bp)}</span>
      <div><h3>${bp.name}</h3><div class="tsub">
        <span class="tierbadge" style="color:${TIERS[tOf(o)].col};border-color:${TIERS[tOf(o)].col}">${TIERS[tOf(o)].n}</span>
        ${kindLabel(bp)} · ${bp.w}×${bp.h}</div></div></div>
    <p class="desc">${bp.desc}</p><div class="rows">`;

  /* --- state rows --- */
  if(bp.kind==='plot'){
    if(o.crop){
      const cr = CROPS[o.crop];
      h += row('Crop', cr.name);
      h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Growth</span><b>${Math.round(o.stage*100)}%</b></div>
        <div class="bar"><i style="transform:scaleX(${(o.stage).toFixed(3)});background:linear-gradient(90deg,#4d8f3c,#7cc24f)"></i></div></div>`;
      h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Soil moisture</span><b>${Math.round(o.water*100)}%</b></div>
        <div class="bar"><i style="transform:scaleX(${(o.water).toFixed(3)});background:${o.water<0.2?'#e2705c':'linear-gradient(90deg,#3f7f9c,#6fb6d8)'}"></i></div></div>`;
      h += row('Harvest', `${cr.yield*(bp.slots||1)} × ${cr.name}`);
      h += row('Worth today', fmt(cr.yield*(bp.slots||1)*sellPrice(o.crop)));
      if(o.pest) h += `<div class="row" style="color:#f0a898"><span>Pests</span><b>growth halved</b></div>`;
      if(!bp.shelter && !cr.seasons.includes(S.season))
        h += `<div class="row" style="color:#f0a898"><span>Season</span><b>wrong — half speed</b></div>`;
    } else h += `<div class="row"><span>Status</span><b>Empty bed</b></div>`;
    h += meter('Soil fertility', o.fert===undefined?1:o.fert, (o.fert||1)<0.4?'#e2705c':'linear-gradient(90deg,#6b5238,#c9a06a)');
    if(o.crop) h += meter('Weeds', o.weeds||0, (o.weeds||0)>0.5?'#e2705c':'#8a9a5a');
    h += row('Yield modifier', Math.round(cropMul(o)*100)+'%');
    if(o.last) h += row('Last crop', CROPS[o.last]?CROPS[o.last].name:'—');
  }
  if(bp.kind==='perennial'){
    h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Ripeness</span><b>${Math.round(o.stage*100)}%</b></div>
      <div class="bar"><i style="transform:scaleX(${(o.stage).toFixed(3)});background:linear-gradient(90deg,#a1503f,#e2603a)"></i></div></div>`;
    h += row('Each pick', `${bp.qty} × ${GOODS[bp.good].n}`);
    h += row('Worth today', fmt(bp.qty*sellPrice(bp.good)));
  }
  if(bp.kind==='animal'){
    h += row(bp.animal+'s', `${o.animals} / ${E.cap(o)}`);
    if(bp.animal!=='hive'){
      h += meter('Herd health', herdHealth(o), herdHealth(o)<0.45?'#e2705c':'linear-gradient(90deg,#4d8f3c,#7cc24f)');
      h += meter('Contentment', herdHappy(o), 'linear-gradient(90deg,#a98fd6,#d0b8f0)');
      h += meter('Pen cleanliness', o.care===undefined?1:o.care, (o.care||1)<0.4?'#e2705c':'linear-gradient(90deg,#8a6a4a,#c9a06a)');
      h += row('Output', Math.round(yieldMul(o)*100)+'% of normal');
      if(o.sick) h += `<div class="row" style="color:#f0a898"><span>Illness</span><b>halving output</b></div>`;
    }
    h += row('Waiting to collect', `${o.ready} ${GOODS[bp.good].n}`);
    h += row('Eats per day', (bp.feed*o.animals).toFixed(1)+' feed');
    if(o.hungry) h += `<div class="row" style="color:#f0a898"><span>Hungry</span><b>not producing</b></div>`;
  }
  if(bp.kind==='process'){
    if(o.recipe>=0){
      const rc = bp.recipes[o.recipe];
      h += row('Making', Object.keys(rc.out).map(k=>rc.out[k]+' '+GOODS[k].n).join(', '));
      h += `<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Batch</span><b>${Math.round(o.prog*100)}%</b></div>
        <div class="bar"><i style="transform:scaleX(${(o.prog).toFixed(3)});background:linear-gradient(90deg,#a98fd6,#d0b8f0)"></i></div></div>`;
    }
    if(o.ready) h += row('Ready', o.ready+' crafted');
  }
  if(bp.kind==='water'){ h += row('Capacity', bp.cap+' L'); if(bp.gain) h += row('Refill', '+'+bp.gain+' L/day'); }
  if(bp.kind==='power'){ h += row('Output now', Math.round(bp.power*WEATHERS[S.weather].power)+' kW'); }
  if(bp.kind==='tourism'){
    h += row('Base', fmt(bp.income)+'/day');
    h += row('You earn', fmt(bp.income*charmMul()*st.tourmul)+'/day');
  }
  if(bp.kind==='shop'){ h += row('Sells', (bp.rate*(1+Math.min(1.6,st.charm/110))).toFixed(1)+' items/day'); }
  if(bp.charm) h += row('Charm', '+'+bp.charm);
  h += `</div>`;

  /* --- actions --- */
  h += `<div class="acts">`;
  if(bp.kind==='plot'){
    if(!o.crop){
      h += `</div><div class="ph" style="margin:4px -11px 8px;padding-left:0">Choose a seed</div><div class="seeds">`;
      Object.keys(CROPS).forEach(k=>{
        const cr = CROPS[k];
        const cost = Math.round(cr.seed*(bp.slots||1)*(1-stat().seedoff));
        const inSeason = cr.seasons.includes(S.season) || bp.shelter;
        const days = (cr.days/((bp.speed||1))).toFixed(1);
        const worth = cr.yield*(bp.slots||1)*sellPrice(k);
        h += `<button class="seed" ${S.cash<cost?'disabled':''} onclick="G.plant(${o.id},'${k}')"
          data-tip="${esc(`<b>${cr.name}</b><div class="tl"><span>Seed cost</span><span class="tk">${fmt(cost)}</span></div><div class="tl"><span>Ready in</span><b>~${days} days</b></div><div class="tl"><span>Harvest worth</span><span class="tk">${fmt(worth)}</span></div><div class="tl"><span>Profit</span><span class="tk">${fmt(worth-cost)}</span></div>${inSeason?'':'<hr><span class="warn">Out of season — grows at half speed outdoors.</span>'}`)}">
          <b>${cr.name} ${inSeason?'':'<span style="color:#e2705c">✱</span>'}</b>
          <small>${fmt(cost)} → ${fmt(worth)} · ${days}d</small></button>`;
      });
      h += `</div><div class="acts" style="margin-top:8px">`;
    } else {
      const ready = o.stage>=1;
      h += `<button class="act primary full" ${ready?'':'disabled'} onclick="G.harvest(${o.id})"
        data-tip="${esc(ready?`<b>Harvest</b>Adds ${CROPS[o.crop].yield*(bp.slots||1)} ${CROPS[o.crop].name} to your barn and gives XP.`:'<b>Not ready</b>Keep it watered and wait.')}">
        ${ready?'Harvest now':'Growing — '+Math.round(o.stage*100)+'%'}</button>`;
      h += `<button class="act" onclick="G.water(${o.id})" ${o.water>0.9||S.water<8?'disabled':''}
        data-tip="${esc('<b>Water this bed</b>Uses 8 L from storage. Dry beds stop growing completely.')}">Water (8L)</button>`;
      if(o.pest) h += `<button class="act" onclick="G.treat(${o.id})" ${S.cash<18?'disabled':''}
        data-tip="${esc('<b>Treat pests</b>$18. Removes the pest and restores full growth speed.')}">Treat pests $18</button>`;
      else h += `<button class="act" onclick="G.clearCrop(${o.id})" data-tip="${esc('<b>Pull the crop</b>Frees the bed immediately. You lose what is growing.')}">Clear bed</button>`;
      if((o.weeds||0) > 0.1) h += `<button class="act" onclick="G.weed(${o.id})"
        data-tip="${esc('<b>Weed the bed</b>Free. Weeds choke growth and cut your harvest.')}">Pull weeds</button>`;
    }
    if(o.crop || !o.crop){
      h += `<button class="act" ${S.cash<30||(o.fert||1)>0.95?'disabled':''} onclick="G.manure(${o.id})"
        data-tip="${esc('<b>Spread compost</b>$30. Restores soil fertility, which sets how big your harvest is.')}">Compost $30</button>`;
    }
  }
  if(bp.kind==='perennial'){
    const ready = o.stage>=1;
    h += `<button class="act primary full" ${ready?'':'disabled'} onclick="G.pick(${o.id},1)"
      data-tip="${esc(ready?`<b>Pick</b>${bp.qty} × ${GOODS[bp.good].n} into the barn.`:'<b>Still ripening</b>It regrows on its own — nothing to do.')}"
      >${ready?'Pick '+GOODS[bp.good].n:'Ripening — '+Math.round(o.stage*100)+'%'}</button>`;
  }
  if(bp.kind==='animal'){
    const cost = bp.buy;
    h += `<button class="act primary" ${o.animals>=bp.cap||S.cash<cost?'disabled':''} onclick="G.buyAnimal(${o.id})"
      data-tip="${esc(`<b>Buy a ${bp.animal}</b><div class="tl"><span>Cost</span><span class="tk">${fmt(cost)}</span></div><div class="tl"><span>Produces</span><b>${bp.per} ${GOODS[bp.good].n} every ${bp.cycle}d</b></div><div class="tl"><span>Pays back in</span><b>~${Math.ceil(cost/(bp.per*GOODS[bp.good].p/bp.cycle))} days</b></div>`)}">
      Buy ${bp.animal} ${fmt(cost)}</button>`;
    h += `<button class="act" ${o.ready<=0?'disabled':''} onclick="G.collect(${o.id})"

/* ---------------- world badge / hints ---------------- */
function hint(){
  const st = stat();
  const empty = S.objs.filter(o=>BPMAP[o.bp].kind==='plot' && !o.crop).length;
  const ready = S.objs.filter(o=>{ const b=BPMAP[o.bp];
    return (b.kind==='plot'||b.kind==='perennial') && o.stage>=1; }).length;
  const coll  = S.objs.filter(o=>o.ready>0).length;
  const dry   = S.objs.filter(o=>BPMAP[o.bp].kind==='plot'&&o.crop&&o.water<0.25).length;
  if(ghost) return `Placing <b>${ghost.bp.name}</b> <kbd>R</kbd> rotate <kbd>Esc</kbd> cancel`;
  if(dry)   return `<span style="color:#f0a898">${dry} bed${dry>1?'s are':' is'} dry</span> — select and water`;
  if(ready) return `<span style="color:#cdeeb0">${ready} ready to harvest</span> — click the glowing markers`;
  if(coll)  return `<span style="color:#cdeeb0">${coll} building${coll>1?'s have':' has'} something to collect</span>`;
  if(empty) return `${empty} empty bed${empty>1?'s':''} — select one and pick a seed`;
  if(st.charm<30) return `Add flowers, trees and paths to raise charm — it multiplies visitor income`;
  return `Day ${S.day} · ${SEASONS[S.season].n} · ${WEATHERS[S.weather].n}`;
}

/* ---------------------------------------------------------------
   1. HORIZON — layered depth beyond the property, per biome.
      Not true 3D: receding bands with atmospheric haze and parallax,
      which is what reads as distance on a top-down map.
   --------------------------------------------------------------- */
function horizonLayer(){
  const l = LANDMAP[S.landId];
  if(!l) return '';
  const B = l.biome, W = WPX, H = HPX;
  const band = (y,h,fill,op)=>`<rect x="${-W}" y="${n(y)}" width="${W*3}" height="${n(h)}" fill="${fill}" opacity="${op}"/>`;
  /* silhouette ridge: a jagged skyline at depth d (0 far, 1 near) */
  const ridge = (y, amp, fill, seed, op)=>{
    let d = `M${-W} ${n(y+amp)}`;
    for(let x=-W; x<=W*2; x+=48){
      const k = hash(seed + x*0.013);
      d += ` L${n(x)} ${n(y + amp - k*amp*1.9)}`;
    }
    d += ` L${W*2} ${n(y+amp*2)} L${-W} ${n(y+amp*2)} Z`;
    return `<path d="${d}" fill="${fill}" opacity="${op}"/>`;
  };
  let far='', mid='', near='';

  if(B==='mount' || B==='plateau'){
    far  = band(-260, 300, '#8fa4bd', .55) + ridge(-140, 120, '#7d92ad', 3, .8) + ridge(-120, 96, '#fbfdff', 3.4, .5);
    mid  = ridge(-40, 80, '#6b8299', .95, 5) ? ridge(-40, 80, '#6b8299', 5, .95) : '';
    near = ridge(20, 50, '#55705f', 7, 1);
  } else if(B==='lake' || B==='pond'){
    far  = band(-200, 240, '#7fa8c4', .6) + ridge(-90, 70, '#6d8f7a', 11, .75);
    mid  = `<rect x="${-W}" y="${-40}" width="${W*3}" height="150" fill="#4f8fb0" opacity=".85"/>` +
           `<rect x="${-W}" y="${-40}" width="${W*3}" height="150" fill="url(#gWater)" opacity=".5"/>`;
    for(let i=0;i<40;i++) mid += `<ellipse class="ripple" cx="${n(hash(i*2.3)*W*2-W*0.4)}" cy="${n(-30+hash(i*5)*130)}"
      rx="${n(14+hash(i)*26)}" ry="2.2" fill="#dff4fb" opacity=".3" style="animation-delay:${(hash(i)*3).toFixed(1)}s"/>`;
    near = ridge(96, 26, '#5d8442', 13, 1);
  } else if(B==='coast'){
    far  = band(-220, 200, '#9fc6da', .7);
    mid  = `<rect x="${-W}" y="${-30}" width="${W*3}" height="170" fill="#3f83a8"/>` +
           `<rect x="${-W}" y="${-30}" width="${W*3}" height="170" fill="url(#gWater)" opacity=".6"/>`;
    for(let i=0;i<7;i++) mid += `<rect class="surf" x="${-W}" y="${n(20+i*17)}" width="${W*3}" height="3"
      fill="#ffffff" opacity=".38" style="animation-delay:${(i*0.5).toFixed(1)}s"/>`;
    near = band(130, 46, '#e0d4ae', 1) + band(130, 10, '#efe6c8', 1);
  } else if(B==='forest'){
    far = band(-200, 240, '#5c7f5a', .5);
    mid = ''; near = '';
    for(let i=0;i<70;i++){
      const x = -W*0.4 + hash(i*1.7)*W*1.9, y = -30 + hash(i*3.9)*150;
      mid += `<g class="sway" style="transform-origin:${n(x)}px ${n(y+18)}px">
        ${conifer(x, y, 18+hash(i)*16, i)}</g>`;
    }
    near = ridge(120, 22, '#3d6b34', 17, 1);
  } else if(B==='river'){
    far  = band(-200, 220, '#9dbb92', .55) + ridge(-70, 56, '#6d8f6a', 19, .8);
    mid  = `<path d="M${-W} 40 Q ${W*0.3} -60 ${W*0.8} 30 T ${W*2} 10 L ${W*2} 130 Q ${W*0.9} 150 ${W*0.35} 70 T ${-W} 150 Z"
             fill="#4f8fb0" opacity=".9"/>`;
    near = ridge(120, 24, '#5d8442', 23, 1);
  } else if(B==='hill' || B==='valley'){
    far  = band(-220, 250, '#a8bd8e', .5) + ridge(-100, 90, '#8aa876', 29, .75);
    mid  = ridge(-20, 66, '#7a9a63', 31, .9);
    near = ridge(80, 40, '#5f8a48', 37, 1);
  } else if(B==='moor'){
    far  = band(-200, 230, '#b0ad86', .55) + ridge(-70, 46, '#93916f', 41, .7);
    mid  = ridge(10, 32, '#8a8a63', 43, .9);
    near = band(120, 40, '#7d8259', .9);
  } else if(B==='oasis'){
    far  = band(-220, 250, '#e2cf9e', .7) + ridge(-90, 76, '#d4bd85', 47, .8);
    mid  = ridge(-10, 52, '#c4a86d', 53, .9);
    near = ridge(96, 34, '#b09257', 59, 1);
  } else { /* orchard and anything else */
    far = band(-200, 230, '#9dbb7e', .5);
    mid = '';
    for(let i=0;i<44;i++){
      const x = -W*0.3 + hash(i*2.1)*W*1.7, y = -20 + hash(i*4.3)*140;
      mid += `<g class="sway" style="transform-origin:${n(x)}px ${n(y+14)}px">${canopy(x,y,16+hash(i)*8,'url(#gCanopy)',i,false)}</g>`;
    }
    near = ridge(120, 22, '#5f8a48', 61, 1);
  }
  /* the same treatment mirrored along the bottom edge, flipped and hazier */
  const bottom = `<g transform="translate(0,${H}) scale(1,-1)" opacity=".72">${far}${mid}</g>`;
  return `<g id="horizon">
    <g class="hz-far"  data-par="0.25">${far}</g>
    <g class="hz-mid"  data-par="0.5">${mid}</g>
    <g class="hz-near" data-par="0.78">${near}</g>
    ${bottom}
    <rect x="${-W}" y="${-300}" width="${W*3}" height="${H+600}" fill="url(#gHaze)" pointer-events="none"/>
  </g>`;
}
/* horizon layers drift slower than the camera, which is what sells depth */
function parallax(){
  const g = document.getElementById('horizon');
  if(!g) return;
  ['hz-far','hz-mid','hz-near'].forEach(c=>{
    const el = g.querySelector('.'+c); if(!el) return;
    const p = parseFloat(el.dataset.par);
    el.setAttribute('transform', `translate(${n(-cam.x*(1-p)/cam.z*0.5)},${n(-cam.y*(1-p)/cam.z*0.35)})`);
  });
}

/* ---------------------------------------------------------------
   2. PEOPLE — farmhands you pay, and the family who live here
